version: 2

project_name: jsonize

before:
  hooks:
    - go mod tidy

builds:
  - id: jz
    main: ./cmd/jz
    binary: jz
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/nao1215/jsonize/internal/buildinfo.Version=v{{ .Version }}
  # Windows is built with the garbage collector configuration its CI
  # jobs test: GOEXPERIMENT=nogreenteagc. See the comment in
  # .github/workflows/unit_test.yml for why, and release_smoke.yml for
  # the check that runs these binaries on Windows.
  - id: jz-windows
    main: ./cmd/jz
    binary: jz
    env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=nogreenteagc
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/nao1215/jsonize/internal/buildinfo.Version=v{{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

# The official registry ships inside the binary: a release is the unit
# that carries both the code and the parser definitions, and jz never
# fetches anything at runtime.
checksum:
  name_template: checksums.txt
  algorithm: sha256

# An SPDX software bill of materials for every archive, generated by
# Syft, which the release job installs.
sboms:
  - artifacts: archive
    documents:
      - "${artifact}.sbom.json"

# checksums.txt is signed with cosign's keyless flow, using the OIDC
# identity of the release workflow. Its digests cover every published
# file, so the one signature covers them all.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

nfpms:
  - id: packages
    package_name: jsonize
    vendor: Naohiro CHIKAMATSU
    homepage: https://github.com/nao1215/jsonize
    maintainer: Naohiro CHIKAMATSU <n.chika156@gmail.com>
    description: Make JSON from command output, files and arguments for the next command.
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin

# A cask in nao1215/homebrew-tap, which installs the macOS and Linux
# archives. Writing to that repository takes TAP_GITHUB_TOKEN; the
# release workflow stops before publishing when the secret is missing.
homebrew_casks:
  - name: jsonize
    binaries: [jz]
    repository:
      owner: nao1215
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/nao1215/jsonize
    description: Make JSON from command output, files and arguments for the next command
    license: MIT
    # The binary is not signed or notarized for macOS, so the quarantine
    # attribute is removed on install; otherwise Gatekeeper refuses to
    # run it.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/jz"]
          end

# The release notes are the CHANGELOG.md section of the tag, passed with
# --release-notes by .github/workflows/release.yml, so no changelog is
# generated from commit messages.

snapshot:
  version_template: "{{ incpatch .Version }}-next"
