version: 2

project_name: jsonize

before:
  hooks:
    - go mod tidy

builds:
  - id: jz
    main: ./cmd/jz
    binary: jz
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/nao1215/jsonize/internal/buildinfo.Version=v{{ .Version }}
  # Windows is built with the garbage collector configuration its CI
  # jobs test: GOEXPERIMENT=nogreenteagc. See the comment in
  # .github/workflows/unit_test.yml for why, and release_smoke.yml for
  # the check that runs these binaries on Windows.
  - id: jz-windows
    main: ./cmd/jz
    binary: jz
    env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=nogreenteagc
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/nao1215/jsonize/internal/buildinfo.Version=v{{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

# The official registry ships inside the binary: a release is the unit
# that carries both the code and the parser definitions, and jz never
# fetches anything at runtime.
checksum:
  name_template: checksums.txt
  algorithm: sha256

nfpms:
  - id: packages
    package_name: jsonize
    vendor: Naohiro CHIKAMATSU
    homepage: https://github.com/nao1215/jsonize
    maintainer: Naohiro CHIKAMATSU <n.chika156@gmail.com>
    description: Turn command output into JSON.
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin

# The release notes are the CHANGELOG.md section of the tag, passed with
# --release-notes by .github/workflows/release.yml, so no changelog is
# generated from commit messages.

snapshot:
  version_template: "{{ incpatch .Version }}-next"
