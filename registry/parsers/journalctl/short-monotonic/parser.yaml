# `journalctl -o short-monotonic` prints the seconds since boot in
# brackets instead of a date. It is already a number of seconds, so it
# needs no conversion; there is no year to assume and no zone to resolve
# either, which is what makes this format easier to read than the
# default one.
format: 1
command: journalctl
variant: short-monotonic
description: journalctl -o short-monotonic, entries timed from the boot
metadata:
  tags: [linux, systemd, log]
  compatible: [systemd]
  references:
    - https://www.freedesktop.org/software/systemd/man/journalctl.html
detect:
  os: [linux]
  args:
    all: ["short-monotonic"]
  signature:
    all:
      - '\A\[[ \t]*[0-9]+\.[0-9]{6}\] \S+ \S'
      # dmesg prints the same seconds since boot in the same brackets, and
      # its lines are "usb 1-1: message", a word and a word before a
      # colon, as a host and an identifier are here. What dmesg never
      # prints is the host in front of an identifier: the kernel's own
      # entries are "host kernel:", and an entry from a process carries
      # its pid in brackets. A journal with neither is refused rather than
      # read as dmesg would be.
      - '^\[[ \t]*[0-9]+\.[0-9]{6}\] \S+ (?:kernel|[^\s\[:]+\[[0-9]+\]):'
input:
  # A message of several lines and the line between two boots, which
  # journalctl/short explains.
  fold: '^[ \t]+\S'
  ignore: ['^-- Boot [0-9a-f]{32} --$']
parse:
  type: regex
  pattern: '^\[[ \t]*(?P<monotonic>[0-9]+\.[0-9]{6})\] (?P<hostname>\S+) (?P<identifier>[^\s\[:]+)(?:\[(?P<pid>[0-9]+)\])?: ?(?P<message>.*)$'
fields:
  monotonic: {type: float, required: true}
  hostname: {required: true}
  identifier: {required: true}
  pid: {type: int, when_missing: omit}
