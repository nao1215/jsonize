# `journalctl -o short-precise` is the default short output with
# microseconds appended to the clock. The fraction is what separates the
# two: the short pattern expects a space straight after the seconds, so
# neither definition can read the other's output.
#
# Like the short variant, the shape belongs to any log that prints a
# timestamp, a host and a tag, so the definition is never chosen
# automatically.
format: 1
command: journalctl
variant: short-precise
description: journalctl short-precise output, one journal entry per line
metadata:
  tags: [linux, log, systemd]
  compatible: [systemd]
  references:
    - https://man7.org/linux/man-pages/man1/journalctl.1.html
detect:
  os: [linux]
  auto_detect: false
  signature:
    all:
      - '^[A-Z][a-z]{2} [ 0-9][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{6} \S+ [^\s\[:]+(?:\[[0-9]+\])?: '
parse:
  type: regex
  pattern: '^(?P<timestamp>[A-Z][a-z]{2} [ 0-9][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{6}) (?P<hostname>\S+) (?P<identifier>[^\s\[:]+)(?:\[(?P<pid>[0-9]+)\])?: ?(?P<message>.*)$'
fields:
  timestamp: {required: true}
  hostname: {required: true}
  identifier: {required: true}
  pid: {type: int}
