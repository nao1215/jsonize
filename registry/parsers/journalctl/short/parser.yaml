# journalctl's default "short" output is one entry per line: timestamp,
# host, syslog identifier with an optional pid, then the message. That
# shape is shared with plain syslog files and with anything else that
# prints a date and a colon, so the definition is never chosen
# automatically.
format: 1
command: journalctl
variant: short
description: journalctl short output, one journal entry per line
metadata:
  tags: [linux, log, systemd]
  compatible: [systemd]
  references:
    - https://man7.org/linux/man-pages/man1/journalctl.1.html
detect:
  os: [linux]
  auto_detect: false
  signature:
    all:
      # The journal opens with an entry. `systemctl status` ends each
      # unit block with entries in this very format, but it opens with
      # the unit, so a journal of its own is what starts with one rather
      # than what merely contains one.
      - '\A[A-Z][a-z]{2} [ 0-9][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2} \S+ [^\s\[:]+(?:\[[0-9]+\])?: '
parse:
  type: regex
  pattern: '^(?P<timestamp>[A-Z][a-z]{2} [ 0-9][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2}) (?P<hostname>\S+) (?P<identifier>[^\s\[:]+)(?:\[(?P<pid>[0-9]+)\])?: ?(?P<message>.*)$'
fields:
  # The short format prints no year. The value stays the string it was
  # printed as until --assume-year says which year to read it in.
  timestamp: {type: time, layout: "Jan _2 15:04:05", year: assumed, required: true}
  hostname: {required: true}
  identifier: {required: true}
  pid: {type: int}
