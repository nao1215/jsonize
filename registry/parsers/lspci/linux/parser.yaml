# The default line is "slot class: vendor and device (rev nn)". The
# revision is split out because it is not part of the device name.
format: 1
command: lspci
variant: linux
description: lspci default listing
metadata:
  tags: [linux, hardware, pciutils]
  compatible: [pciutils]
  references:
    - https://man7.org/linux/man-pages/man8/lspci.8.html
detect:
  os: [linux]
  signature:
    all:
      # No bracket before the colon, which is what tells the plain listing
      # apart from -nn, where the class carries its number in brackets.
      - '\A(?:[0-9a-f]{4}:)?[0-9a-f]{2}:[0-9a-f]{2}\.[0-9a-f] [^:\[]+: '
    none:
      # The other listings that start with a slot: -n numbers the class,
      # -mm quotes the names, and -k and -v indent extra lines under each
      # device. All four would be read wrongly or stop at the first line
      # this definition cannot parse.
      - '\A(?:[0-9a-f]{4}:)?[0-9a-f]{2}:[0-9a-f]{2}\.[0-9a-f] [0-9a-f]{4}: [0-9a-f]{4}:[0-9a-f]{4}'
      - '^\t\S'
parse:
  type: regex
  pattern: '^(?P<slot>(?:[0-9a-f]{4}:)?[0-9a-f]{2}:[0-9a-f]{2}\.[0-9a-f]) (?P<class>[^:]+): (?P<device>.+?)(?: \(rev (?P<revision>[0-9a-f]+)\))?$'
fields:
  slot: {required: true}
  class: {required: true}
  device: {required: true}
  revision: {when_missing: omit}
