# The default line is "slot class: vendor and device (rev nn)". The
# revision is split out because it is not part of the device name.
format: 1
command: lspci
variant: linux
description: lspci default listing
metadata:
  tags: [linux, hardware, pciutils]
  compatible: [pciutils]
  references:
    - https://man7.org/linux/man-pages/man8/lspci.8.html
detect:
  os: [linux]
  signature:
    all:
      - '\A[0-9a-f]{2}:[0-9a-f]{2}\.[0-9a-f] [^:]+: '
parse:
  type: regex
  pattern: '^(?P<slot>[0-9a-f]{2}:[0-9a-f]{2}\.[0-9a-f]) (?P<class>[^:]+): (?P<device>.+?)(?: \(rev (?P<revision>[0-9a-f]+)\))?$'
fields:
  slot: {required: true}
  class: {required: true}
  device: {required: true}
  revision: {when_missing: omit}
