# `lspci -v` and `lspci -vv` are a tree, and the depth is a property of
# the machine rather than of the format: a device has capabilities, a
# capability has flags, and how far that goes depends on what is plugged
# in. Every line is a node, its depth is how many tabs open it, and its
# children are the lines under it.
#
# The device line and the lines under it have different shapes, so the
# node is read by three expressions in order: the device line, a
# "Key: value" line, and anything else, which is the continuation of a
# flag list that lspci wraps onto its own line.
format: 1
command: lspci
variant: verbose
description: lspci -v and -vv devices as a tree of their attributes
metadata:
  tags: [linux, hardware, pci, pciutils]
  compatible: [pciutils]
  references:
    - https://man7.org/linux/man-pages/man8/lspci.8.html
detect:
  os: [linux]
  args:
    any: ["-v", "-vv", "-vvv"]
  signature:
    all:
      - '\A(?:[0-9a-f]{4}:)?[0-9a-f]{2}:[0-9a-f]{2}\.[0-9a-f] [^:\[]+: '
      # -v prints a Flags line for every device and -vv the Control and
      # Status register dumps in its place. lspci -k prints neither.
      - '^\t(?:Flags: |Control: I/O)'
parse:
  type: tree
  indent: "\t"
  # A top-level line is a device, the slot in front of it. A line of
  # any other shape at the top, the end of another command's output
  # piped in behind this one, is refused rather than read as a device
  # by the expression that takes any text.
  root: '^(?:[0-9a-f]{4}:)?[0-9a-f]{2}:[0-9a-f]{2}\.[0-9a-f] '
  node:
    parse:
      type: regex
      patterns:
        - '^(?P<slot>(?:[0-9a-f]{4}:)?[0-9a-f]{2}:[0-9a-f]{2}\.[0-9a-f]) (?P<class>[^:]+): (?P<device>.+?)(?: \(rev (?P<revision>[0-9a-f]+)\))?(?: \(prog-if (?P<prog_if>[0-9a-f]+)(?: \[(?P<prog_if_name>[^]]*)\])?\))?[ \t]*$'
        - '^(?P<key>[^:]+): ?(?P<value>.*)$'
        - '^(?P<text>.+)$'
    fields:
      revision: {when_missing: omit}
      prog_if: {when_missing: omit}
      # pci.ids does not name every programming interface, and one
      # without a name is printed as the number alone.
      prog_if_name: {when_missing: omit}
