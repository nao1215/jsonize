# `readelf -h` prints the ELF header as a label and a value per line
# under a banner. The labels carry spaces and slashes, so the values
# cannot be typed and the keys are reported as printed.
#
# The values are not one kind of thing: a class is a word, an entry point
# is hexadecimal, a count is a decimal number and several carry their
# unit in brackets ("64 (bytes)"). Reading them as strings is what keeps
# the definition from claiming a meaning the line does not carry.
#
# The labels are a list rather than an object because Version appears
# twice, once for the file version and once for the ELF version. An
# object would keep the second and drop the first without saying so.
format: 1
command: readelf
variant: header
description: readelf -h ELF header fields
metadata:
  tags: [linux, binary, elf]
  compatible: [GNU binutils]
  references:
    - https://sourceware.org/binutils/docs/binutils/readelf.html
detect:
  args:
    # Each of these adds a report of its own before or after this one,
    # which no part here reads.
    none: ["-a", "--all", "-l", "--program-headers", "--segments", "-S", "--section-headers", "--sections", "-g", "--section-groups", "-t", "--section-details", "-e", "--headers", "-s", "--syms", "--symbols", "--dyn-syms", "--lto-syms", "-n", "--notes", "-r", "--relocs", "-u", "--unwind", "-d", "--dynamic", "-V", "--version-info", "-A", "--arch-specific", "-c", "--archive-index", "-x", "--hex-dump=", "-p", "--string-dump=", "-R", "--relocated-dump=", "-w", "--debug-dump", "--debug-dump=", "-I", "--histogram"]
  signature:
    all:
      - '\AELF Header:[ \t]*$'
      - '^[ \t]+Magic:[ \t]+[0-9a-f ]+$'
input:
  # The heading, wherever it stands: two headers printed one after the
  # other are two headings, not a key named "ELF Header".
  ignore: ['^ELF Header:[ \t]*$']
parse:
  # Each line under the heading is one of the fields binutils prints for
  # the ELF header, indented, its label, a colon and the value padded to
  # a column. The labels are that fixed set, which is what refuses the
  # labelled lines of another command printed after the header.
  type: regex
  pattern: '^[ \t]+(?P<name>Magic|Class|Data|Version|OS/ABI|ABI Version|Type|Machine|Entry point address|Start of program headers|Start of section headers|Flags|Size of this header|Size of program headers|Number of program headers|Size of section headers|Number of section headers|Section header string table index):[ \t]*(?P<value>.*?)[ \t]*$'
