description: A domain member, whose adapter block follows its heading with no blank line and whose machine block carries only the three labels the exercise prints.
source: >-
  the ipconfig /all output published at
  https://learn.microsoft.com/en-us/training/modules/understand-active-directory-domain-name-system/8-guided-troubleshooting-exercise
