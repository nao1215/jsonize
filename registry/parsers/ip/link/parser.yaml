# `ip link` prints one block per interface: a header line, the link layer
# address, and then the interface's alias, its alternative names and, with
# -d, the settings of the kind of device it is. It may have none of those.
# It is `ip -s link` without the counter tables and `ip address` without
# the addresses, so the signature has to name both of those absences.
format: 1
command: ip
variant: link
description: ip link, one block per interface
metadata:
  tags: [linux, network, iproute2]
  compatible: [iproute2, BusyBox]
  references:
    - https://man7.org/linux/man-pages/man8/ip-link.8.html
detect:
  os: [linux]
  signature:
    all:
      # `ip -o link` continues the same line with the link layer after a
      # backslash, so the header is stated to the end of its line. iproute2
      # carries the mode and the group there and BusyBox carries neither,
      # which is why both are optional rather than what this is
      # recognised by.
      - '\A\d+: \S+: <[A-Z0-9_,-]*> mtu \d+ qdisc \S+(?: master \S+)?(?: state \S+)?(?: mode \S+)?(?: group \S+)?(?: qlen \d+)?[ \t]*$'
    none:
      # What `ip -s link` adds and what `ip address` adds: this form has
      # the counters of neither and the addresses of neither.
      - '^[ \t]+RX:[ \t]+bytes[ \t]+packets[ \t]+errors'
      - '^[ \t]+inet6?[ \t]+\S'
      # An interface with no address prints no inet line, so ip address
      # output whose first address is past the window has none here. Its
      # header still differs: iproute2 prints the mode before the group for
      # ip link and never for ip address.
      - '\A\d+: \S+: <[A-Z0-9_,-]*> mtu \d+ qdisc \S+(?: master \S+)?(?: state \S+)? group \S+'
parse:
  type: records
  start: '^\d+: '
  parts:
    - name: interface
      select: {limit: 1}
      parse:
        type: regex
        each: input
        # A bridged interface names its bridge between the queueing
        # discipline and the state, and a veth end names its peer after
        # an @. Both are absent on an ordinary interface.
        # BusyBox prints no mode and no group, and Ubuntu's build prints
        # no state either.
        pattern: '^(?P<index>\d+): (?P<name>[^:@]+)(?:@(?P<peer>\S+))?: <(?P<flags>[^>]*)> mtu (?P<mtu>\d+) qdisc (?P<qdisc>\S+)(?: master (?P<master>\S+))?(?: state (?P<state>\S+))?(?: mode (?P<mode>\S+))?(?: group (?P<group>\S+))?(?: qlen (?P<qlen>\d+))?\s*$'
      fields:
        index: {type: int}
        mtu: {type: int}
        state: {when_missing: omit}
        mode: {when_missing: omit}
        group: {when_missing: omit}
        qlen: {type: int, when_missing: omit}
        master: {when_missing: omit}
        peer: {when_missing: omit}
        flags: {type: array, split: ","}
    - name: link
      select: {skip: 1, limit: 1}
      parse:
        type: regex
        each: input
        # -d continues this line with the driver's own settings, whose
        # names and number come from the kernel module rather than from
        # the format, so they are kept as the text ip printed.
        pattern: '^[ \t]+link/(?P<type>\S+)(?: (?P<address>\S+))?(?: brd (?P<broadcast>\S+))?(?: permaddr (?P<permanent_address>\S+))?(?: link-netnsid (?P<netnsid>\d+))?(?:\s+(?P<settings>\S.*?))?\s*$'
      fields:
        netnsid: {type: int, when_missing: omit}
        # A tunnel device reports the address it was built from.
        permanent_address: {when_missing: omit}
        settings: {when_missing: omit}
    # What follows the link line is a free-text alias, any number of
    # alternative names, and, with -d, a line per kind of device holding
    # that kind's settings. Which of them appear and in what order is a
    # property of the interface, so they are read as a list where every
    # entry names its kind rather than as parts at fixed positions.
    # ip indents every one of them, so a line at the margin is not the
    # interface's, whatever it says.
    #
    # ip address indents its addresses and their lifetimes too, and
    # BusyBox prints the same header for both commands. The signature
    # refuses those lines only within its window, and interfaces with no
    # address can push the first one past it, so an inet, inet6 or
    # valid_lft line is matched here and refused by the kind field rather
    # than read as settings.
    - name: details
      select: {skip: 2}
      parse:
        type: regex
        patterns:
          - '^[ \t]+(?P<kind>altname) (?P<name>\S+)\s*$'
          - '^[ \t]+(?P<kind>alias) (?P<name>.+?)\s*$'
          - '^[ \t]+(?P<kind>inet6?|valid_lft)[ \t]+(?P<text>\S.*?)\s*$'
          - pattern: '^[ \t]+(?P<text>\S.*?)\s*$'
            values: {kind: settings}
      fields:
        kind: {regex: '(?P<kind>altname|alias|settings)'}
        name: {when_missing: omit}
        text: {when_missing: omit}
