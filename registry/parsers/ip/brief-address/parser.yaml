# `ip -brief address` is the one form of `ip addr` that is a table; the
# addresses are a list because an interface usually has several.
format: 1
command: ip
variant: brief-address
description: ip -brief address show
metadata:
  tags: [linux, network, iproute2]
  compatible: [iproute2]
  references:
    - https://man7.org/linux/man-pages/man8/ip-address.8.html
detect:
  os: [linux]
  args:
    any: ["-br", "-brief"]
  signature:
    all:
      # A name and the word UP is also every service status table there
      # is ("web01 UP 3 days"), and `ip -brief link` shares the first two
      # columns as well, so what follows the state has to be addresses in
      # CIDR form, or nothing at all for an interface that has none.
      - '\A\S+[ \t]+(?:UP|DOWN|UNKNOWN|LOWERLAYERDOWN)(?:[ \t]+[0-9a-fA-F:][0-9a-fA-F.:]*/\d+)*[ \t]*$'
parse:
  type: regex
  pattern: '^(?P<interface>[^\s@]+)(?:@(?P<peer>\S+))?\s+(?P<state>UP|DOWN|UNKNOWN|LOWERLAYERDOWN)\s*(?P<addresses>.*?)\s*$'
fields:
  interface: {required: true}
  # A veth or a tunnel prints the device it is tied to after an at sign
  # ("veth0@if2", "tunl0@NONE"); that is not part of its name, which is
  # how ip/link reads it too.
  peer: {when_missing: omit}
  state: {required: true}
  addresses: {type: array, split_regex: '\s+'}
