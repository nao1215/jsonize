# `ip route` writes a destination followed by key/value words whose set
# varies per route, mixed with flags that stand alone (linkdown), so the
# words after the device are kept as one list in the order printed.
format: 1
command: ip
variant: route
description: ip route show
metadata:
  tags: [linux, network, iproute2]
  compatible: [iproute2, BusyBox]
  references:
    - https://man7.org/linux/man-pages/man8/ip-route.8.html
detect:
  os: [linux]
  args:
    # iproute2 takes any prefix of an object's name ("ip ro", "ip -s l",
    # "tc q"), and the first object in its table that the prefix fits is
    # the one it runs, so each prefix is listed.
    any: ["route", "rout", "rou", "ro", "r"]
  signature:
    all:
      - '\A(?:default|\d+\.\d+\.\d+\.\d+/\d+|\S+/\d+) (?:via|dev|proto) '
parse:
  type: regex
  patterns:
    # A route may open with its type. The main table prints none, because
    # every route in it is unicast; `ip route show table all` prints the
    # local table too, whose routes are local, broadcast, anycast and
    # multicast, and a type read as a destination would put "local" where
    # a prefix belongs. The list is the one the kernel has, not the ones
    # seen so far: anycast is only printed for IPv6, which is why the
    # first pass missed it.
    - '^(?P<type>unicast|local|broadcast|anycast|multicast|throw|unreachable|prohibit|blackhole|nat) (?P<destination>\S+) via (?P<via>\S+) dev (?P<dev>\S+)\s*(?P<attributes>.*?)\s*$'
    - '^(?P<type>unicast|local|broadcast|anycast|multicast|throw|unreachable|prohibit|blackhole|nat) (?P<destination>\S+) dev (?P<dev>\S+)\s*(?P<attributes>.*?)\s*$'
    # A route with no device at all, which is what a rejecting type has.
    - '^(?P<type>throw|unreachable|prohibit|blackhole) (?P<destination>\S+)\s*(?P<attributes>.*?)\s*$'
    - '^(?P<destination>\S+) via (?P<via>\S+) dev (?P<dev>\S+)\s*(?P<attributes>.*?)\s*$'
    - '^(?P<destination>\S+) dev (?P<dev>\S+)\s*(?P<attributes>.*?)\s*$'
fields:
  destination: {required: true}
  dev: {when_missing: omit}
  type: {when_missing: omit}
  via: {when_missing: omit}
  # The words after the device are pairs (proto dhcp, metric 600) mixed
  # with lone flags (linkdown); they are kept in order rather than being
  # forced into a shape the output does not always have.
  attributes: {type: array, split_regex: '\s+'}
