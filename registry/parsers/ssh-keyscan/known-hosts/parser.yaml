# `ssh-keyscan` prints one line per host key it fetched, in the format
# of a known_hosts file: the host as it was named (or "[host]:port" for
# a port other than 22, or a hashed form opening with "|1|" under -H),
# the key type and the key in base64. Before each key ssh-keyscan prints
# a comment naming the host and the server's version string, "# host:22
# SSH-2.0-...", on standard output as well; that line describes the
# connection rather than a key, and a known_hosts file allows comments,
# so the comment lines are dropped.
#
# The key types are the ones OpenSSH names: ssh-rsa, ssh-ed25519,
# ssh-dss, ecdsa-sha2-nistp256 and its two larger curves, and the sk-
# forms for security keys, which end in "@openssh.com". A line whose
# second word is not one of those is not a host key line, and the text
# is refused rather than read as a host named by whatever the first
# word is.
#
# A host that could not be reached prints nothing here (the message goes
# to standard error), so a run over such hosts alone gives an empty
# text. The same lines with the key type first are the public keys of
# `ssh-add -L`, read by ssh-add/public-keys.
format: 1
command: ssh-keyscan
variant: known-hosts
description: ssh-keyscan host key lines in known_hosts format
metadata:
  tags: [linux, darwin, ssh, security]
  compatible: [OpenSSH]
  references:
    - https://man.openbsd.org/ssh-keyscan.1
    - https://man.openbsd.org/sshd.8#SSH_KNOWN_HOSTS_FILE_FORMAT
detect:
  signature:
    all:
      # Every line is a comment or a host, a key type and a key, and at
      # least one is a key.
      - '\A(?:(?:#[^\n]*|\S+ (?:ssh-rsa|ssh-ed25519|ssh-dss|ecdsa-sha2-nistp(?:256|384|521)|sk-[a-z0-9-]+@openssh\.com) [A-Za-z0-9+/]+=*)\n)*(?:#[^\n]*|\S+ (?:ssh-rsa|ssh-ed25519|ssh-dss|ecdsa-sha2-nistp(?:256|384|521)|sk-[a-z0-9-]+@openssh\.com) [A-Za-z0-9+/]+=*)\z'
      - '^\S+ (?:ssh-rsa|ssh-ed25519|ssh-dss|ecdsa-sha2-nistp(?:256|384|521)|sk-[a-z0-9-]+@openssh\.com) [A-Za-z0-9+/]+=*$'
input:
  ignore:
    - '^#'
parse:
  type: regex
  pattern: '^(?P<host>\S+) (?P<type>ssh-rsa|ssh-ed25519|ssh-dss|ecdsa-sha2-nistp(?:256|384|521)|sk-[a-z0-9-]+@openssh\.com) (?P<key>[A-Za-z0-9+/]+=*)$'
fields:
  host: {required: true}
  type: {required: true}
  key: {required: true}
