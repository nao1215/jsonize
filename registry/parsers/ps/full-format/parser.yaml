# `ps -eF` (and `ps -AF`, or `-F` for a selection of processes) prints
# the columns of `ps -ef` with three more between C and STIME: the size
# of the process image in pages (SZ), its resident set in kilobytes
# (RSS) and the processor it last ran on (PSR). CMD is the full command
# line, so it is the last column and keeps the spaces between the
# arguments.
format: 1
command: ps
variant: full-format
description: ps -eF (UID PID PPID C SZ RSS PSR STIME TTY TIME CMD)
metadata:
  tags: [linux, process]
  compatible: [procps-ng]
  references:
    - https://man7.org/linux/man-pages/man1/ps.1.html
detect:
  os: [linux]
  # -F is the option that adds the three columns; -e, -A and a list of
  # processes only choose which of them are printed.
  args:
    all: ["-F"]
  signature:
    all:
      - '\A\s*UID\s+PID\s+PPID\s+C\s+SZ\s+RSS\s+PSR\s+STIME\s+TTY\s+TIME\s+CMD\s*$'
parse:
  type: table
  header:
    columns: [uid, pid, ppid, c, sz, rss, psr, stime, tty, time, cmd]
  # The command line is the last column and holds the spaces of its
  # arguments.
  max_fields: 11
fields:
  pid: {type: int, required: true}
  ppid: {type: int, required: true}
  # Processor use, an integer percentage.
  c: {type: int}
  # Pages of the process image, and kilobytes resident: both are counts
  # the command prints in full rather than rounded readings.
  sz: {type: int}
  rss: {type: int}
  psr: {type: int}
  tty: {null_if: ["?"]}
  # Cumulative CPU time, printed as hours, minutes and seconds.
  time: {type: duration, layout: mm:ss, required: true}
  cmd: {required: true}
