# The columns FreeBSD ps prints for a listing: PID TT STAT TIME COMMAND.
# macOS and the POSIX form print PID TTY TIME CMD, with no state column,
# and the GNU long form is different again, so the header names this one
# on its own.
format: 1
command: ps
variant: freebsd
description: FreeBSD ps default columns (PID TT STAT TIME COMMAND)
metadata:
  tags: [freebsd, bsd, process]
  compatible: [FreeBSD ps]
  references:
    - https://man.freebsd.org/cgi/man.cgi?ps(1)
detect:
  os: [freebsd]
  signature:
    all:
      - '\A\s*PID[ \t]+TT[ \t]+STAT[ \t]+TIME[ \t]+COMMAND\s*$'
      # A heading alone is what a page describing the columns quotes. ps
      # lists itself at least, so there is a row: a process id, a
      # terminal, a state, and the time in minutes, seconds and
      # hundredths.
      - '^[ \t]*[0-9]+[ \t]+\S+[ \t]+\S+[ \t]+[0-9]+:[0-9]{2}\.[0-9]{2}[ \t]+\S'
exec:
  env:
    # procps writes a command line outside ASCII as "?" in the C locale,
    # and this is given the same UTF-8 locale that is still C, so that a
    # name reads the same whichever ps printed it.
    LC_ALL: C.UTF-8
parse:
  type: table
  header:
    # The heading is TT; the key is the one every other ps definition
    # uses for the same column.
    rename: {tt: tty}
  # Everything after the fourth column is the command, spaces and all.
  max_fields: 5
fields:
  pid: {type: int, required: true}
  # A process with no controlling terminal prints "-".
  tty: {null_if: ["-"]}
  stat: {required: true}
  # Cumulative CPU time, minutes and seconds with hundredths.
  time: {type: duration, layout: mm:ss, required: true}
  command: {required: true}
