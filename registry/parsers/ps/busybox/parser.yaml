format: 1
command: ps
variant: busybox
description: BusyBox ps default output (PID USER COMMAND)
metadata:
  tags: [linux, busybox, process]
  compatible: [BusyBox]
  references:
    - https://busybox.net/downloads/BusyBox.html#ps
detect:
  os: [linux]
  signature:
    all:
      # The text opens with the header.
      - '\A[ \t]*PID[ \t]+USER[ \t]'
      - '^\s*PID\s+USER\s+COMMAND\s*$'
exec:
  env:
    # procps writes a command line outside ASCII as "?" in the C locale,
    # and this is given the same UTF-8 locale that is still C, so that a
    # name reads the same whichever ps printed it.
    LC_ALL: C.UTF-8
parse:
  type: table
  header:
    columns: [pid, user, command]
fields:
  pid: {type: int}
