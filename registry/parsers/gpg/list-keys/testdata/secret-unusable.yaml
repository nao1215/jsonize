description: >-
  Secret keys with long key IDs and subkey fingerprints, and a revoked
  user ID that show-unusable-uids keeps in the list.
source: "gpg -K --keyid-format long --with-subkey-fingerprints --list-options show-unusable-uids,show-unusable-subkeys, GnuPG 2.4.8 on Ubuntu 26.04 with LC_ALL=C.UTF-8, in a GNUPGHOME made for the fixture; the GNUPGHOME path replaced with /home/user/.gnupg and the rule shortened to match"
os: linux
args: [-K, --keyid-format, long, --with-subkey-fingerprints, --list-options, "show-unusable-uids,show-unusable-subkeys"]
