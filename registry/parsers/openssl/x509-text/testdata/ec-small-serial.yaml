source: >-
  captured on Ubuntu 26.04 with OpenSSL 3.5.5, LC_ALL=C openssl x509 -noout
  -text over a self-signed certificate made for this fixture with
  `openssl req -x509 -key ec.key -set_serial 4096 -subj /CN=ec.example.test`
  on a prime256v1 key
description: >-
  an elliptic curve certificate, whose key section names the point, the
  curve and its OID rather than a modulus, and whose serial is small
  enough to be printed on its own label
os: linux
args: [x509, -noout, -text, -in, ec.pem]
