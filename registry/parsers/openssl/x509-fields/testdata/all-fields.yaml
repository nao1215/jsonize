description: All five options on a self-signed certificate made for the fixture; the default fingerprint hash is SHA1.
source: captured on Ubuntu 26.04 with OpenSSL 3.5.5, LC_ALL=C openssl x509 -noout -subject -issuer -dates -serial -fingerprint over a certificate made with openssl req -x509 -newkey ed25519 -subj '/CN=example.test/O=Example' -days 30
os: linux
args: [x509, -in, c.pem, -noout, -subject, -issuer, -dates, -serial, -fingerprint]
