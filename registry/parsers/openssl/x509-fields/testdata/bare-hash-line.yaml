description: -email and -hash beside -serial; -hash prints a bare hex value with no label, which this definition does not read.
source: captured on Ubuntu 26.04 with OpenSSL 3.5.5, LC_ALL=C openssl x509 -noout -email -hash -serial over a certificate made for the fixture, which has no email address
os: linux
args: [x509, -in, c.pem, -noout, -email, -hash, -serial]
expect_error: 'does not describe this input'
