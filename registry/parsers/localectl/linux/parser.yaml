# Same "Label: value" shape as hostnamectl, with the same labels-with-
# spaces problem, so the pairs are a list of name/value objects.
#
# What this definition refuses: a machine that sets more than one locale
# variable prints the extra ones as continuation lines indented under
# "System Locale:", and a line without a colon is not a pair. Reading it
# as a pair would need the value column to be guessed from the padding,
# which the format has no way to say, so such output is an error rather
# than a wrong answer.
format: 1
command: localectl
variant: linux
description: localectl system locale and keyboard settings
metadata:
  tags: [linux, systemd, locale]
  compatible: [systemd]
  references:
    - https://www.freedesktop.org/software/systemd/man/localectl.html
detect:
  os: [linux]
  signature:
    all:
      - '^[ \t]*System Locale: '
      - '^[ \t]*VC Keymap: '
parse:
  type: kv
  separator: ":"
  as: list
