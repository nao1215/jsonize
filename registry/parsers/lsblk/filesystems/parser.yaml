# `lsblk -f` swaps the size and topology columns for what filesystem the
# device carries. A device that holds no filesystem prints everything but
# NAME blank, and FSAVAIL is rounded ("142.6G"), so the use percentage is
# the only column that becomes a number.
format: 1
command: lsblk
variant: filesystems
description: lsblk -f, filesystem type, label, UUID and free space
metadata:
  tags: [linux, block-device, util-linux]
  compatible: [util-linux]
  references:
    - https://man7.org/linux/man-pages/man8/lsblk.8.html
detect:
  os: [linux]
  signature:
    all:
      - '^NAME[ \t]+FSTYPE[ \t]+FSVER[ \t]+LABEL[ \t]+UUID[ \t]+FSAVAIL[ \t]+FSUSE%[ \t]+MOUNTPOINTS?[ \t]*$'
      # The header is lined up with the columns. -r prints the same words
      # one space apart and the rows unaligned, which this cannot cut.
      - '^NAME(?:[ \t][^\n]*\S)?[ \t]{2,}\S'
parse:
  type: table
  split: aligned
  header:
    rename: {mountpoints: mountpoint}
fields:
  # lsblk draws the tree of devices in front of a name: a child starts
  # with "|-" or "`-" in the C locale and "├─" or "└─" in a UTF-8 one,
  # after "| " ("│ ") or two spaces for each level above it. The drawing
  # is not part of the name. A name without it, a disk at the top, is
  # kept whole.
  name: {required: true, regex: '(?:(?:[|│] |  )*(?:[|`]-|[├└]─))?(?P<name>.+)'}
  fsuse_percent: {type: int, trim_suffix: "%"}
