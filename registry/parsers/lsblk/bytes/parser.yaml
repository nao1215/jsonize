# `lsblk -b` prints the same columns as plain lsblk, with SIZE as an exact
# byte count instead of "20G". The header is identical, so the two are told
# apart by the shape of SIZE: -b writes bare digits on every row and plain
# lsblk always writes a suffix, down to "0B". Both definitions carry the
# other shape in signature.none, and one data row is enough to decide.
format: 1
command: lsblk
variant: bytes
description: lsblk -b, sizes as exact byte counts
metadata:
  tags: [linux, block-device, util-linux]
  compatible: [util-linux]
  references:
    - https://man7.org/linux/man-pages/man8/lsblk.8.html
detect:
  os: [linux]
  signature:
    all:
      - '^NAME[ \t]+MAJ:MIN[ \t]+RM[ \t]+SIZE[ \t]+RO[ \t]+TYPE[ \t]+MOUNTPOINTS?[ \t]*$'
      - '^\S+[ \t]+\d+:\d+[ \t]+[01][ \t]+\d+[ \t]+[01][ \t]'
    none:
      - '^\S+[ \t]+\d+:\d+[ \t]+[01][ \t]+[\d.]+[BKMGTPE][ \t]+[01][ \t]'
parse:
  type: table
  split: aligned
  header:
    rename: {mountpoints: mountpoint}
fields:
  name: {required: true}
  maj_min: {required: true}
  rm: {type: bool, required: true}
  size: {type: int, required: true}
  ro: {type: bool, required: true}
  type: {required: true}
