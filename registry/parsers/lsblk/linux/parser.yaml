# lsblk leaves MOUNTPOINT blank for unmounted devices and draws a tree in
# NAME, so cells are cut at header offsets.
format: 1
command: lsblk
variant: linux
description: lsblk default output (util-linux)
metadata:
  tags: [linux, block-device, util-linux]
  compatible: [util-linux]
  references:
    - https://man7.org/linux/man-pages/man8/lsblk.8.html
detect:
  os: [linux]
  signature:
    all:
      - '^NAME\s+MAJ:MIN\s+RM\s+SIZE\s+RO\s+TYPE\s+MOUNTPOINTS?\s*$'
parse:
  type: table
  split: aligned
  header:
    rename: {mountpoints: mountpoint}
# MOUNTPOINT is empty for anything that is not mounted, so it is the one
# optional column; a row that stops before RO is a truncated listing and
# is reported as an error rather than filled with nulls.
fields:
  name: {required: true}
  maj_min: {required: true}
  rm: {type: bool, required: true}
  # SIZE is rounded ("20G" for 20401094656 bytes) and lsblk offers -b for
  # the exact byte count, so the printed text is kept as it is.
  size: {required: true}
  ro: {type: bool, required: true}
  type: {required: true}
