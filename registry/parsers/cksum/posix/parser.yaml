# cksum prints a CRC, the size in bytes and the file name. Three
# whitespace separated cells, two of them numbers, is the shape of most
# columnar reports, so jz does not claim this format on its own:
# `jz --parser cksum` or `jz run cksum` says what produced it, and the
# signature then checks that the text really has that shape.
#
# Reading standard input leaves out the name, so the second pattern
# covers the two cell line and file is absent from the object it makes.
# uutils prints a name holding a backslash, a newline or a carriage
# return escaped, as "\\", "\n" and "\r", and puts a backslash in
# front of the CRC to say so. Such a name is decoded; escaped is true on
# its line and absent everywhere else. GNU cksum prints every name as it
# is and never marks a line, so a line without the mark carries the name
# as it is. A newline printed as it is splits the line, and the second
# half is not a cksum line, so the text is refused.
#
# `cksum -a <algorithm>` prints a tagged line instead ("SHA256 (f) = ...")
# and is not read here.
#
# The cells are separated by exactly one space, never a tab and never
# padding, so the signature asks for single spaces. That is what keeps
# this definition from claiming a tab separated report such as
# `git diff --numstat`, which has the same three cell shape.
format: 1
command: cksum
variant: posix
aliases:
  # macOS installs GNU coreutils under a g prefix, and the g name prints
  # what the command prints.
  - name: gcksum
description: cksum CRC, byte count and file name
metadata:
  tags: [linux, darwin, checksum]
  compatible: [GNU coreutils, uutils coreutils]
  references:
    - https://man7.org/linux/man-pages/man1/cksum.1.html
detect:
  auto_detect: false
  args:
    # -a sysv and -a bsd print the old sum(1) checksums, whose second
    # cell counts blocks rather than bytes. The option and its value are
    # separate arguments, so the values are what is listed. No other long
    # option of cksum begins with a, so --algorithm may be cut to any
    # prefix of itself, and each prefix is listed too.
    none: ["sysv", "bsd", "-asysv", "-absd",
           "--algorithm=sysv", "--algorith=sysv", "--algorit=sysv", "--algori=sysv", "--algor=sysv",
           "--algo=sysv", "--alg=sysv", "--al=sysv", "--a=sysv",
           "--algorithm=bsd", "--algorith=bsd", "--algorit=bsd", "--algori=bsd", "--algor=bsd",
           "--algo=bsd", "--alg=bsd", "--al=bsd", "--a=bsd"]
  signature:
    all:
      # A CRC, a byte count and a name. The CRC is a 32-bit checksum
      # written in full, so it has three digits or more except for the
      # one value in forty million that does not; a crontab entry opens
      # with a minute and an hour, which never do. Writing the width is
      # what tells the two apart, rather than a description of what a
      # crontab line looks like.
      - '\A\\?\d{3,10} \d+(?: \S|$)'
    none:
      # Any text may follow a CRC and a size, since it is a file name, so
      # there is no positive form that keeps out the default line of the
      # macOS and FreeBSD stat, which opens with a device and an inode
      # number: a "name" of a mode, counts and four quoted times. That
      # shape is refused here, which is the narrowing this definition
      # accepts; a file really named that way is read with --define.
      - '^\d+ \d+ [-bcdlpsw][-rwxsStT]{9}[@+.]? \d+ \S+ \S+ \d+ \d+ "[^"\n]*" "[^"\n]*" "[^"\n]*" "[^"\n]*" \d+ \d+ (?:0|0x[0-9a-fA-F]+) '
parse:
  type: regex
  patterns:
    - '^(?P<escaped>\\)?(?P<checksum>\d+)[ \t]+(?P<size>\d+)[ \t]+(?P<file>.+)$'
    - '^(?P<escaped>\\)?(?P<checksum>\d+)[ \t]+(?P<size>\d+)[ \t]*$'
fields:
  escaped: {type: bool, true_values: ["\\"], when_missing: omit}
  checksum: {type: int, required: true}
  size: {type: int, required: true}
  # The three escapes are all the format writes, so another one on a
  # marked line is refused rather than guessed at.
  file: {when_missing: omit, unescape: {when: escaped, sequences: {'\\': '\', '\n': "\n", '\r': "\r"}}}
