# uname -a on FreeBSD. The kernel version FreeBSD prints is itself
# "FreeBSD <release>", so the release appears twice, and the branch and
# build identifier follow it before the kernel configuration name.
format: 1
command: uname
variant: freebsd
description: uname -a on FreeBSD
metadata:
  tags: [freebsd, bsd, system]
  compatible: [FreeBSD uname]
  references:
    - https://man.freebsd.org/cgi/man.cgi?uname(1)
detect:
  os: [freebsd]
  args:
    any: ["-a"]
  signature:
    all:
      # The kernel name alone is not enough: anything quoting the banner
      # starts with it. uname -a puts the node name and the release
      # before the version, which opens with the name and the release
      # again. A release is a version number and the branch it was built
      # from, with a patch level after a release ("15.1-RELEASE-p3",
      # "15.0-CURRENT", "14.2-RC1"), which a sentence that happens to
      # name FreeBSD twice does not have.
      - '\AFreeBSD \S+ [0-9]+\.[0-9]+-[A-Z]+[0-9]*(?:-p[0-9]+)? FreeBSD [0-9]+\.[0-9]+-[A-Z]+[0-9]*(?:-p[0-9]+)? '
parse:
  type: regex
  each: input
  pattern: '^(?P<kernel_name>FreeBSD) (?P<node_name>\S+) (?P<kernel_release>[0-9]+\.[0-9]+-[A-Z]+[0-9]*(?:-p[0-9]+)?) (?P<kernel_version>FreeBSD .+?) (?P<kernel_config>\S+) (?P<machine>\S+)\s*$'
