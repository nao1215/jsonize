format: 1
command: uname
variant: darwin
description: uname -a on macOS
metadata:
  tags: [darwin, system]
  compatible: [macOS uname]
detect:
  os: [darwin]
  args:
    any: ["-a"]
  signature:
    all:
      # The kernel name alone is not enough: a log line that quotes the
      # kernel banner ("Darwin Kernel Version 23.5.0: ...") also starts
      # with it. uname -a puts the node name and the release before that
      # banner, so require the whole shape from the first character.
      - '\ADarwin \S+ \S+ Darwin Kernel Version '
parse:
  type: regex
  each: input
  pattern: '^(?P<kernel_name>Darwin) (?P<node_name>\S+) (?P<kernel_release>\S+) (?P<kernel_version>.+?) (?P<machine>\S+)\s*$'
