# `ss -s` prints two summary lines and then a table of socket counts by
# transport. The first two lines are counts of their own rather than
# rows of that table, so each is read on its own terms.
format: 1
command: ss
variant: summary
description: ss -s, socket counts by transport
metadata:
  tags: [linux, network, iproute2]
  compatible: [iproute2]
  references:
    - https://man7.org/linux/man-pages/man8/ss.8.html
detect:
  os: [linux]
  args:
    any: ["-s", "--summary"]
  signature:
    all:
      - '\ATotal: [0-9]+'
      - '^TCP:[ \t]+[0-9]+ \(estab [0-9]+,'
      - '^Transport[ \t]+Total[ \t]+IP[ \t]+IPv6'
parse:
  type: composite
  parts:
    - name: total
      select: {limit: 1}
      parse:
        type: regex
        each: input
        pattern: '\ATotal: (?P<sockets>[0-9]+)[ \t]*\z'
      fields:
        sockets: {type: int}
    - name: tcp
      select: {skip: 1, limit: 1}
      parse:
        type: regex
        each: input
        pattern: '\ATCP:[ \t]+(?P<total>[0-9]+) \(estab (?P<established>[0-9]+), closed (?P<closed>[0-9]+), orphaned (?P<orphaned>[0-9]+), timewait (?P<timewait>[0-9]+)\)[ \t]*\z'
      fields:
        total: {type: int}
        established: {type: int}
        closed: {type: int}
        orphaned: {type: int}
        timewait: {type: int}
    - name: transports
      select: {after: '^Transport[ \t]+Total'}
      parse:
        type: table
        header:
          none: true
          columns: [transport, total, ip, ipv6]
      fields:
        transport: {required: true}
        total: {type: int}
        ip: {type: int}
        ipv6: {type: int}
