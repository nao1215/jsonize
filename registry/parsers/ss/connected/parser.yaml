# Asked for the connected sockets of one protocol (`ss -u`, `ss -w`), ss
# leaves out both the Netid column and the State column, since every row
# would carry the same value in each. Adding -a brings the State column
# back, and ss/single-protocol reads that; ss/linux reads the table with
# both columns. The three are told apart by what the header opens with.
#
# The address and the port are separated by the last colon, which is what
# makes an IPv6 address ("[::]:22") and a scoped one ("127.0.0.53%lo:53")
# readable; both parts are reported separately as well as together.
#
# After the two address columns ss writes what the options asked for.
# -p prints the process list, users:((...)), which is read on its own;
# everything else -e, -o, -m and -i add -- the socket's uid, inode,
# cookie and cgroup, its timers, its memory and the congestion control
# state -- is kept under info as the text ss printed. What is there
# depends on the options and on the congestion control module in use,
# and ss writes some of it as name:value and some as two words, so a rule
# naming the parts of it would be a rule about this machine. A tail that
# holds the process list beside anything else is one string as well.
#
# -i and -m continue a row on an indented line, which input.fold joins
# back onto the row it belongs to.
format: 1
command: ss
variant: connected
description: ss socket table for the connected sockets of one protocol, without the Netid and State columns
metadata:
  tags: [linux, network, iproute2]
  compatible: [iproute2]
  references:
    - https://man7.org/linux/man-pages/man8/ss.8.html
detect:
  os: [linux]
  signature:
    all:
      - '\ARecv-Q\s+Send-Q\s+Local Address:Port\s+Peer Address:Port'
input:
  fold: '^[ \t]+\S'
  ignore:
    - '\ARecv-Q\s+Send-Q'
    - '^RTNETLINK answers:'
parse:
  type: regex
  patterns:
    - '^(?P<recv_q>\d+)\s+(?P<send_q>\d+)\s+(?P<local_address>\S+):(?P<local_port>[^\s:]+)\s+(?P<peer_address>\S+):(?P<peer_port>[^\s:]+)(?:\s+(?P<process>users:\(\(.*?\)\)))?(?:\s+(?P<info>\S.*?))?\s*$'
    # A unix socket table asked for with -x has the same header and holds
    # a path and an inode where the internet table holds an address and a
    # port, separated by whitespace rather than by a colon.
    - '^(?P<recv_q>\d+)\s+(?P<send_q>\d+)\s+(?P<local_address>\S+)\s+(?P<local_port>\S+)\s+(?P<peer_address>\S+)\s+(?P<peer_port>\S+)(?:\s+(?P<process>users:\(\(.*?\)\)))?(?:\s+(?P<info>\S.*?))?\s*$'
    # A netlink socket names a protocol and a process ("rtnl:kernel"),
    # and a packet socket a protocol and an interface ("arp:eno1"); the
    # peer of either is a bare "*" with no port, so there is no peer_port.
    - '^(?P<recv_q>\d+)\s+(?P<send_q>\d+)\s+(?P<local_address>\S+?):(?P<local_port>\S+)\s+(?P<peer_address>\*)(?:\s+(?P<process>users:\(\(.*?\)\)))?(?:\s+(?P<info>\S.*?))?\s*$'
fields:
  recv_q: {type: int, required: true}
  send_q: {type: int, required: true}
  local_address: {required: true}
  local_port: {required: true}
  peer_address: {required: true}
  peer_port: {when_missing: omit}
  process: {when_missing: omit}
  info: {when_missing: omit}
