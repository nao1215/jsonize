# `ss -tuln` and friends print a socket table. The address and the port
# are separated by the last colon, which is what makes an IPv6 address
# ("[::]:22") and a scoped one ("127.0.0.53%lo:53") readable; both parts
# are reported separately as well as together.
#
# The last column is the process list -p prints, users:((...)), and
# nothing else. -e and -o print the socket's uid, inode, cgroup and
# timers in the same place; none of that is a process, so a line that
# carries it is refused rather than read into this key.
format: 1
command: ss
variant: linux
description: ss socket table (-t/-u/-l/-n and combinations)
metadata:
  tags: [linux, network, iproute2]
  compatible: [iproute2]
  references:
    - https://man7.org/linux/man-pages/man8/ss.8.html
detect:
  os: [linux]
  signature:
    all:
      - '\ANetid\s+State\s+Recv-Q\s+Send-Q\s+Local Address:Port\s+Peer Address:Port'
input:
  ignore:
    - '\ANetid\s+State'
    - '^RTNETLINK answers:'
parse:
  type: regex
  patterns:
    # An internet socket: the address and the port share a column and are
    # separated by the last colon.
    - '^(?P<netid>\S+)\s+(?P<state>\S+)\s+(?P<recv_q>\d+)\s+(?P<send_q>\d+)\s+(?P<local_address>\S+):(?P<local_port>[^\s:]+)\s+(?P<peer_address>\S+):(?P<peer_port>[^\s:]+)(?:\s+(?P<process>users:\(\(.*\)\)))?\s*$'
    # A unix socket: the same two columns hold a path (or "*") and the
    # inode number, separated by whitespace instead of a colon. Plain
    # `ss` with no filter lists these, so the table mixes both shapes.
    - '^(?P<netid>\S+)\s+(?P<state>\S+)\s+(?P<recv_q>\d+)\s+(?P<send_q>\d+)\s+(?P<local_address>\S+)\s+(?P<local_port>\S+)\s+(?P<peer_address>\S+)\s+(?P<peer_port>\S+)(?:\s+(?P<process>users:\(\(.*\)\)))?\s*$'
fields:
  netid: {required: true}
  state: {required: true}
  recv_q: {type: int, required: true}
  send_q: {type: int, required: true}
  local_address: {required: true}
  local_port: {required: true}
  peer_address: {required: true}
  peer_port: {required: true}
  process: {when_missing: omit}
