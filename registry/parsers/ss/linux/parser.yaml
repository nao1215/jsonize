# `ss -tuln` and friends print a socket table. The address and the port
# are separated by the last colon, which is what makes an IPv6 address
# ("[::]:22") and a scoped one ("127.0.0.53%lo:53") readable; both parts
# are reported separately as well as together.
format: 1
command: ss
variant: linux
description: ss socket table (-t/-u/-l/-n and combinations)
metadata:
  tags: [linux, network, iproute2]
  compatible: [iproute2]
  references:
    - https://man7.org/linux/man-pages/man8/ss.8.html
detect:
  os: [linux]
  signature:
    all:
      - '\ANetid\s+State\s+Recv-Q\s+Send-Q\s+Local Address:Port\s+Peer Address:Port'
input:
  ignore:
    - '\ANetid\s+State'
parse:
  type: regex
  pattern: '^(?P<netid>\S+)\s+(?P<state>\S+)\s+(?P<recv_q>\d+)\s+(?P<send_q>\d+)\s+(?P<local_address>\S+):(?P<local_port>[^\s:]+)\s+(?P<peer_address>\S+):(?P<peer_port>[^\s:]+)\s*(?P<process>\S.*)?$'
fields:
  netid: {required: true}
  state: {required: true}
  recv_q: {type: int, required: true}
  send_q: {type: int, required: true}
  local_address: {required: true}
  local_port: {required: true}
  peer_address: {required: true}
  peer_port: {required: true}
  process: {when_missing: omit}
