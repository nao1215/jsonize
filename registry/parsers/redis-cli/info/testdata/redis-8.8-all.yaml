source: captured from Redis 8.8.0 on Linux with LC_ALL=C from a server started for the capture on port 16379 (redis-cli -p 16379 info); CRLF line endings as redis-cli wrote them
description: >-
  Every section of a freshly started server: fourteen sections, of which
  Hotkeys, Modules, Errorstats and Keysizes hold no key, and values that
  hold spaces, colons and commas.
os: linux
args: ["-p", "16379", "info"]
