# `route` and `route -n` print the same table; -n only changes the values
# (an address instead of a host name, "0.0.0.0" instead of "default" and
# "*"), so one definition reads both and no detect.args is needed.
#
# `netstat -r` prints the same banner and the same first four columns.
# The two are separated by the header row, which reports Metric, Ref and
# Use here and MSS, Window and irtt there; netstat/routing pins the other
# one. `netstat -e -r` is this table rather than that one, which is what
# the alias says, so `jz run netstat -re` reaches the definition written
# for the columns it prints.
format: 1
command: route
variant: linux
aliases:
  - name: netstat
    args: {all: ["-e", "-r"]}
description: route kernel IP routing table
metadata:
  tags: [linux, network, net-tools]
  compatible: [BusyBox, net-tools 2.10]
  references:
    - https://man7.org/linux/man-pages/man8/route.8.html
detect:
  os: [linux]
  signature:
    all:
      - '\AKernel IP routing table[ \t]*$'
      - '^Destination[ \t]+Gateway[ \t]+Genmask[ \t]+Flags[ \t]+Metric[ \t]+Ref[ \t]+Use[ \t]+Iface[ \t]*$'
input:
  ignore:
    - '^Kernel IP routing table[ \t]*$'
parse:
  type: table
  split: whitespace
fields:
  # The flag cell is a set of letters (U, G, H, ! for a rejecting route)
  # rather than a number or a list, and is kept as the word it is.
  #
  # A rejecting route (`ip route add unreachable ...`) has no gateway,
  # reference count or interface, and net-tools prints "-" in each of
  # those cells. The count is null there; the gateway and the interface
  # are words and keep the "-" that was printed.
  destination: {required: true}
  gateway: {required: true}
  genmask: {required: true}
  flags: {required: true}
  metric: {type: int, null_if: ["-"]}
  ref: {type: int, null_if: ["-"]}
  use: {type: int, null_if: ["-"]}
  iface: {required: true}
