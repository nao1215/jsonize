# chage -l prints seven labels padded with tabs and separated from the
# value by a colon. The label set is fixed: chage writes all seven on
# every run, in this order, so the result is a map whose keys are
# known in advance rather than a {name, value} list, which would only add
# a level of indirection to a fixed record.
#
# The labels contain spaces, so they cannot be written as `fields` names
# and no value can be converted. That loses nothing here: one label holds
# a date ("Nov 03, 2025", or "2025-11-03" with -i), the word "never" or
# the sentence "password must be changed", and the three counted labels
# hold a number whose meaning depends on the same three spellings. Every
# value reaches JSON as the string chage printed, and the keys are the
# labels as printed.
format: 1
command: chage
variant: linux
description: chage -l password ageing information for one account
metadata:
  tags: [linux, account, shadow]
  compatible: [shadow-utils]
  references:
    - https://man7.org/linux/man-pages/man1/chage.1.html
detect:
  os: [linux]
  signature:
    all:
      # chage -l prints these seven lines and nothing else, in this
      # order, so the text is all of them: whatever follows the last is
      # not chage's, and is refused rather than read as one more field.
      - '\ALast password change[ \t]+: [^\n]*\nPassword expires[ \t]+: [^\n]*\nPassword inactive[ \t]+: [^\n]*\nAccount expires[ \t]+: [^\n]*\nMinimum number of days between password change[ \t]+: [^\n]*\nMaximum number of days between password change[ \t]+: [^\n]*\nNumber of days of warning before password expires[ \t]+: [^\n]*\n?\z'
parse:
  type: kv
  separator: ":"
  as: map
