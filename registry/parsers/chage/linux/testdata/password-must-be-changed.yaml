source: |
  captured on Ubuntu 26.04 (shadow 1:4.17.4-2ubuntu3) with LC_ALL=C from
  chage -l -P <dir> testuser, reading a synthetic passwd/shadow pair under
  a prefix directory; the real accounts on this machine cannot be listed
  without root.
description: |
  A last change day of 0 makes chage print the sentence "password must be
  changed" for the first three labels, and an expiry day is set so that
  "Account expires" is a date rather than "never".
os: linux
