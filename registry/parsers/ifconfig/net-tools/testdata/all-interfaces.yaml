description: >-
  ifconfig -a: an Ethernet-type interface with a broadcast and a global
  and link-local IPv6 address, a down interface with no address, the
  container's eth0 with rounded MiB and KiB totals, the loopback, and a
  tun device with a destination and an unspecified hardware address.
source: captured with LC_ALL=C and `ifconfig -a` in a debian:stable-slim container with net-tools 2.10 installed, a dummy interface given an IPv4 address with a broadcast and three IPv6 addresses, a second dummy left down with MTU 9000, and a tun device given a point-to-point address; the MAC addresses are replaced with 02:00:00:00:00:0N and the link-local address derived from one with the matching fe80::ff:fe00:N
os: linux
args: ["-a"]
