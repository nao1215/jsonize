description: >-
  net start run for real on Windows Server 2025: the display names of
  the running services, some with the service name in brackets.
source: >-
  captured on GitHub Actions windows-latest (Windows Server 2025, build
  26100.33296) on 2026-09-15 with `cmd /c "net start 2>&1"` from
  PowerShell, written with WriteAllLines (CRLF line endings, the blank
  lines around the list as the command wrote them). Nothing was
  replaced: the list names no user, host or address.
os: windows
args: [start]
