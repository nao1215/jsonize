# `mise ls` writes a tool, its installed version and, when that version
# is the one a configuration file asks for, the file and the request it
# holds. There is no title row, and two words on a line describe far too
# much, so the definition is only used when it is named and the only
# evidence it accepts is a mise configuration file in the third column.
# A listing where no version is activated by a configuration file is
# therefore refused rather than guessed at.
format: 1
command: mise
variant: ls
description: mise ls installed tool versions
metadata:
  tags: [toolchain, version-manager]
  compatible: [mise]
  references:
    - https://mise.jdx.dev/cli/ls.html
detect:
  args:
    any: ["ls", "list"]
  auto_detect: false
  signature:
    all:
      - '\A[A-Za-z0-9][A-Za-z0-9._+-]*[ \t]+\S'
      - '(?m)^\S+[ \t]+\S+[ \t]+\S*(?:mise\.toml|mise/config\.toml|\.tool-versions)(?:[ \t]|$)'
parse:
  type: table
  split: whitespace
  min_fields: 2
  header:
    none: true
    columns: [tool, version, source, requested]
fields:
  tool: {required: true}
  # A version opens with a digit, so two words of prose are not a tool
  # and its version.
  version: {required: true, regex: '(?P<version>[0-9]\S*)'}
