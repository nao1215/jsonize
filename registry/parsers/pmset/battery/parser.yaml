# pmset -g batt prints the power source the machine is drawing from, then
# a line per battery or UPS: a dash and the name, the id in parentheses, a
# tab, the charge in percent, the state ("charging", "discharging",
# "charged", "AC attached; not charging"), the time left as hours and
# minutes or "(no estimate)", and whether the battery is present. A
# machine without a battery, such as a desktop or a virtual machine,
# prints the source line alone and batteries is empty.
#
# remaining is the time pmset prints before "remaining", in seconds; it
# is null where pmset has no estimate yet.
format: 1
command: pmset
variant: battery
description: pmset -g batt power source and battery charge on macOS
metadata:
  tags: [darwin, power, hardware]
  compatible: [macOS pmset]
detect:
  os: [darwin]
  args:
    all: ["-g"]
    any: ["batt", "ps"]
  signature:
    all:
      # The source line, then battery lines and nothing else.
      - '\ANow drawing from ''[^''\n]+''[ \t]*(?:\n[ \t]*-[^\n]* \(id=\d+\)\t\d+%; [^\n]* present: (?:true|false)[ \t]*)*\z'
parse:
  type: composite
  parts:
    - name: power_source
      select: {limit: 1}
      parse:
        type: regex
        each: input
        pattern: '\ANow drawing from ''(?P<name>[^''\n]+)''[ \t]*\z'
      fields:
        name: {required: true}
    - name: batteries
      select: {skip: 1}
      parse:
        type: regex
        pattern: '^[ \t]*-(?P<name>\S[^\n]*?) \(id=(?P<id>\d+)\)\t(?P<percent>\d+)%; (?P<state>[^\n]*?)(?:; (?P<remaining>\d+:\d{2}) remaining|; \(no estimate\))? present: (?P<present>true|false)[ \t]*$'
      fields:
        name: {required: true}
        id: {type: int, required: true}
        percent: {type: int, required: true}
        state: {required: true}
        remaining: {type: duration, layout: h:mm}
        present: {type: bool, true_values: ["true"], false_values: ["false"]}
