# The filename column is absent when wc reads standard input, so only
# three fields are required.
format: 1
command: wc
variant: posix
description: wc output (lines, words, characters, optional filename)
metadata:
  tags: [linux, darwin, text]
  compatible: [GNU coreutils, BusyBox, macOS wc]
detect:
  signature:
    # wc prints no header, so the very first line is a count line (\A).
    # The guard rejects tables that merely start with numbers, such as
    # `ps -ef` on macOS, whose fourth column is numeric too.
    all:
      - '\A\s*\d+\s+\d+\s+\d+(?:\s+\S.*)?$'
    none:
      - '^\s*\d+\s+\d+\s+\d+\s+\d+\s+\S'
parse:
  type: table
  header:
    none: true
    columns: [lines, words, characters, filename]
  min_fields: 3
fields:
  lines: {type: int}
  words: {type: int}
  characters: {type: int}
  filename: {when_missing: omit}
