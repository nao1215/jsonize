# Three numbers in a row describe far too many things (any numeric table,
# a diff summary) for jz to claim them as wc output, so this parser is
# only used when the parser is named or when jz ran wc itself. The
# signature still checks the shape afterwards.
#
# The third column of the default output is a BYTE count. `wc -m` prints
# characters instead in the same layout, so its output must not be read
# with this definition; `wc -l`, `-w` and `-c` print a single column,
# which this definition rejects rather than guessing which one it is.
format: 1
command: wc
variant: posix
aliases:
  # macOS installs GNU coreutils under a g prefix, and the g name prints
  # what the command prints.
  - name: gwc
description: wc default output (lines, words, bytes, optional filename)
metadata:
  tags: [linux, darwin, text]
  compatible: [GNU coreutils, BusyBox, macOS wc]
  references:
    - https://pubs.opengroup.org/onlinepubs/9699919799/utilities/wc.html
detect:
  auto_detect: false
  args:
    # -m puts characters where the bytes go, and -L adds the longest
    # line's length as a fourth count, which the last column would take as
    # the start of the file name. Piped in, neither can be told from a name
    # with a space in it, so this is the only place they are refused.
    none: ["-m", "--chars", "-L", "--max-line-length"]
  signature:
    all:
      - '\A\s*\d+\s+\d+\s+\d+(?:\s+\S.*)?$'
parse:
  # Matched rather than split on whitespace: one space separates the
  # counts from the name, and a name that begins or ends with a space
  # keeps it.
  type: regex
  pattern: '^[ \t]*(?P<lines>\d+)[ \t]+(?P<words>\d+)[ \t]+(?P<bytes>\d+)(?: (?P<filename>.+))?$'
fields:
  lines: {type: int, required: true}
  words: {type: int, required: true}
  bytes: {type: int, required: true}
  filename: {when_missing: omit}
