# A checksum, two characters and a file name is the shape of every
# hashing tool's output and of plenty of other reports, so jz does not
# claim this format on its own: `jz --parser sha384sum` or
# `jz run sha384sum` says what produced it, and the signature then checks
# that the text really has that shape. The digest length is what tells
# one hashing tool's output from another's.
#
# The second character says how the file was read: two spaces for text
# mode, a space and an asterisk for binary mode. It is not reported
# because it describes the run, not the file.
#
# GNU and uutils print a name holding a backslash, a newline or a
# carriage return escaped, as "\\", "\n" and "\r", and put a
# backslash in front of the digest to say so. Such a name is decoded;
# escaped is true on its line and absent everywhere else. A line
# without the mark carries the name as it is: GNU and uutils mark every
# name they escape, and BusyBox escapes none. A newline that BusyBox
# prints as it is splits the line, and the second half is not a
# checksum line, so the text is refused.
# `sha384sum --zero` ends a line with NUL and escapes nothing, and jz
# refuses text with NUL in it. `sha384sum -c` prints a different format
# and is not read here.
format: 1
command: sha384sum
variant: posix
aliases:
  # macOS installs GNU coreutils under a g prefix, and the g name prints
  # what the command prints.
  - name: gsha384sum
description: sha384sum checksum lines
metadata:
  tags: [linux, darwin, checksum]
  compatible: [GNU coreutils, uutils coreutils, BusyBox]
  references:
    - https://man7.org/linux/man-pages/man1/sha384sum.1.html
detect:
  auto_detect: false
  signature:
    all:
      # A name may begin with a space, so any character follows the mode.
      - '\A\\?[0-9a-fA-F]{96}[ \t][ *][^\n]'
parse:
  type: regex
  pattern: '^(?P<escaped>\\)?(?P<checksum>[0-9a-fA-F]{96})[ \t][ *](?P<file>.+)$'
fields:
  escaped: {type: bool, true_values: ["\\"], when_missing: omit}
  checksum: {required: true}
  # The three escapes are all the format writes, so another one on a
  # marked line is refused rather than guessed at.
  file: {required: true, unescape: {when: escaped, sequences: {'\\': '\', '\n': "\n", '\r': "\r"}}}
