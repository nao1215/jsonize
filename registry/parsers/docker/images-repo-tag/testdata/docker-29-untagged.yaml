source: >-
  captured from Docker 29.2.1 on Linux with LC_ALL=C; the header and the
  first eight rows of the listing
description: >-
  Images with no reference, which print "<none>" in both REPOSITORY and TAG
  and become null. The IDs were replaced, keeping their length.
os: linux
args: ["images", "--filter", "dangling=true", "--format", 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedSince}}\t{{.Size}}']
