# `uptime -p` (procps) prints the time since boot as words: "up 10 hours,
# 21 minutes". Each unit is printed only when it is not zero, largest
# first, and minutes are printed while the machine has been up for less
# than a minute ("up 0 minutes").
#
# The parts are reported as printed rather than added up to seconds.
# procps takes years as 365 days and weeks modulo 52, so past a year the
# parts no longer add up to the time since boot; `uptime` without -p, or
# /proc/uptime, has the exact figure.
format: 1
command: uptime
variant: pretty
description: uptime -p, the time since boot in words
metadata:
  tags: [linux, system]
  compatible: [procps-ng]
  references:
    - https://man7.org/linux/man-pages/man1/uptime.1.html
    - https://gitlab.com/procps-ng/procps/-/blob/master/library/uptime.c
detect:
  os: [linux]
  args:
    any: ["-p", "--pretty"]
  signature:
    all:
      - '\Aup \d+ (?:decade|year|week|day|hour|minute)s?(?:, \d+ (?:decade|year|week|day|hour|minute)s?)*[ \t]*\n?\z'
parse:
  type: regex
  each: input
  pattern: '^up (?:(?P<decades>\d+) decades?(?:, |$))?(?:(?P<years>\d+) years?(?:, |$))?(?:(?P<weeks>\d+) weeks?(?:, |$))?(?:(?P<days>\d+) days?(?:, |$))?(?:(?P<hours>\d+) hours?(?:, |$))?(?:(?P<minutes>\d+) minutes?)?[ \t]*$'
# A unit that is not printed is zero, which the text does not say; it is
# null rather than a number the output never showed.
fields:
  decades: {type: int}
  years: {type: int}
  weeks: {type: int}
  days: {type: int}
  hours: {type: int}
  minutes: {type: int}
