format: 1
command: uptime
variant: linux
description: "uptime on Linux (procps and BusyBox): comma separated load averages"
metadata:
  tags: [linux, system]
  compatible: [procps-ng, BusyBox]
  references:
    - https://man7.org/linux/man-pages/man1/uptime.1.html
detect:
  os: [linux]
  signature:
    # `w` prints this very line before its user table, so the signature
    # anchors the whole line and rejects anything that continues into a
    # table.
    all:
      - '^\s*\d{1,2}:\d{2}(?::\d{2})?\s+up\s+.*,\s+load average: [\d.]+, [\d.]+, [\d.]+\s*$'
    none:
      - '^USER\s+TTY\s'
parse:
  type: regex
  each: input
  pattern: '^\s*(?P<time>\d{1,2}:\d{2}(?::\d{2})?)\s+up\s+(?P<uptime>.+?),\s+(?P<users>\d+) users?,\s+load average: (?P<load_1m>[\d.]+), (?P<load_5m>[\d.]+), (?P<load_15m>[\d.]+)\s*$'
fields:
  users: {type: int}
  load_1m: {type: float}
  load_5m: {type: float}
  load_15m: {type: float}
