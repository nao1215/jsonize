# BusyBox `unzip -l` prints the same header as Info-ZIP but writes the
# date as MM-DD-YYYY and rules the totals block with a leading space. The
# date shape is the only thing that tells the two apart on a listing, so
# both signatures require a data row and not just the header.
#
# BusyBox writes a name it cannot represent in the current locale as
# question marks; jz runs commands under LC_ALL=C, so a non-ASCII member
# name arrives mangled. Nothing can recover it here, and Info-ZIP unzip
# reports the same archive correctly.
format: 1
command: unzip
variant: busybox
description: BusyBox unzip -l archive listing
metadata:
  tags: [linux, archive]
  compatible: [BusyBox]
  references:
    - https://busybox.net/downloads/BusyBox.html
detect:
  signature:
    all:
      # The text opens with the archive line.
      - '\AArchive:[ \t]'
      - '^[ \t]*Length[ \t]+Date[ \t]+Time[ \t]+Name[ \t]*$'
      - '^[ \t]*\d+[ \t]+\d{2}-\d{2}-\d{4}[ \t]+\d{2}:\d{2}[ \t]'
input:
  ignore:
    - '^Archive:[ \t]'
    - '^[ \t]*Length[ \t]+Date[ \t]+Time[ \t]+Name[ \t]*$'
    - '^[ \t]*-{3,}(?:[ \t]+-{3,})*[ \t]*$'
    - '^[ \t]*\d+[ \t]+\d+ files?$'
parse:
  type: regex
  pattern: '^[ \t]*(?P<length>\d+)[ \t]+(?P<date>\d{2}-\d{2}-\d{4})[ \t]+(?P<time>\d{2}:\d{2})   (?P<name>.+)$'
fields:
  length: {type: int, required: true}
  name: {required: true}
