description: >
  md5sum --tag over four files: a plain name, one with a space, one
  with a backslash and one with a newline. The last two are marked with
  a leading backslash and escaped, and read back as the names they are.
source: captured on Ubuntu 26.04 with GNU coreutils 9.7 (gnumd5sum), LC_ALL=C md5sum --tag over files made for the fixture
os: linux
args: [--tag, "back\\slash.txt", "new\nline.txt", plain.txt, "with space.txt"]
