# df -P with -B, -m or --block-size counts in the unit asked for and
# names it in the heading as a number of bytes: "512-blocks",
# "1048576-blocks". The figures are exact counts of that unit, so the
# unit comes out with them, the way df/gnu-blocks does it without -P.
# A unit given with no number (-BM) is printed after every figure too
# ("12581M"), and the figure is still a whole count.
#
# The heading rule spells out every size but 1024, which is df/portable,
# so the two describe different text.
#
# A file system's name may hold spaces, so a line is read by what each
# column holds (see df/gnu).
format: 1
command: df
variant: portable-blocks
aliases:
  - name: gdf
description: GNU coreutils df -P with -B, -m or --block-size (counts in the unit the heading names)
metadata:
  tags: [linux, filesystem, coreutils]
  compatible: [GNU coreutils]
  references:
    - https://www.gnu.org/software/coreutils/manual/html_node/df-invocation.html
detect:
  os: [linux]
  args:
    any: ["-P", "--portability"]
    none: ["-T", "--print-type", "-h", "--human-readable", "-H", "--si", "-i", "--inodes"]
  signature:
    all:
      - '\AFilesystem\s+(?:[0-9]{1,3}|[0-9]{5,}|[02-9][0-9]{3}|1[1-9][0-9]{2}|10[013-9][0-9]|102[0-35-9])-blocks\s+Used\s+Available\s+Capacity\s+Mounted on\s*$'
input:
  ignore:
    - '^df: '
parse:
  type: composite
  parts:
    - name: header
      select: {limit: 1}
      parse:
        type: regex
        each: input
        pattern: '\AFilesystem\s+(?P<block_size>[0-9]+)-blocks\s+Used\s+Available\s+Capacity\s+Mounted on\s*\z'
      fields:
        block_size: {type: int, required: true}
    # --total closes the table with a row named total whose mount point
    # is a dash; it is kept, as printed, since it is what was asked for.
    - name: filesystems
      select: {skip: 1}
      parse:
        type: regex
        pattern: '^(?P<filesystem>\S.*?)\s+(?P<blocks>\d+|-)(?:[KMGTPEZYRQ](?:i?B)?|kB)?\s+(?P<used>\d+|-)(?:[KMGTPEZYRQ](?:i?B)?|kB)?\s+(?P<available>\d+|-)(?:[KMGTPEZYRQ](?:i?B)?|kB)?\s+(?P<capacity_percent>\d+%|-)\s+(?P<mounted_on>/.*|-)$'
      fields:
        filesystem: {required: true}
        blocks: {type: int, null_if: ["-"]}
        used: {type: int, null_if: ["-"]}
        available: {type: int, null_if: ["-"]}
        capacity_percent: {type: int, trim_suffix: "%", null_if: ["-"]}
        mounted_on: {required: true}
