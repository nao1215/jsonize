# `df -h` and `df -H` print the same header and differ only in the base of
# the suffixes: -h counts 1024 per step, -H (--si) counts 1000. The output
# does not say which was used, and the numbers are rounded anyway, so the
# sizes are reported exactly as printed instead of being turned into a
# byte count jsonize cannot actually know. Run plain `df` for exact
# 1K-block numbers.
format: 1
command: df
variant: gnu-human
aliases:
  # macOS installs GNU coreutils under a g prefix, and the g name prints
  # what the command prints.
  - name: gdf
description: GNU coreutils df -h / -H (sizes kept as printed)
metadata:
  tags: [linux, filesystem, coreutils]
  compatible: [GNU coreutils]
  references:
    - https://www.gnu.org/software/coreutils/manual/html_node/df-invocation.html
detect:
  os: [linux]
  args:
    any: ["-h", "--human-readable", "-H", "--si"]
  signature:
    all:
      - '^Filesystem\s+Size\s+Used\s+Avail\s+Use%\s+Mounted on\s*$'
# df writes "df: /path: Permission denied" for mount points it cannot
# stat; those lines land in the output when stderr is merged into it.
#
# A file system's name may hold spaces, so a line is read by what each
# column holds: three sizes, a percentage and a mount point (see df/gnu).
input:
  ignore:
    - '^df: '
    - '^Filesystem\s+Size\s+Used\s+Avail\s+Use%\s+Mounted on\s*$'
parse:
  type: regex
  pattern: '^(?P<filesystem>\S.*?)\s+(?P<size>\S+)\s+(?P<used>\S+)\s+(?P<available>\S+)\s+(?P<use_percent>\d+%|-)\s+(?P<mounted_on>/.*)$'
fields:
  filesystem: {required: true}
  size: {required: true}
  used: {required: true}
  available: {required: true}
  use_percent: {type: int, trim_suffix: "%", null_if: ["-"]}
  mounted_on: {required: true}
