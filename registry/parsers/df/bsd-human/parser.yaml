# macOS df -h prints binary suffixes (466Gi) and df -H decimal ones
# (500G); both are rounded, so the sizes are reported as printed rather
# than converted. Run plain `df` for exact 512-byte block counts.
format: 1
command: df
variant: bsd-human
description: BSD df -h / -H output on macOS (sizes kept as printed)
metadata:
  tags: [darwin, bsd, filesystem]
  compatible: [macOS df]
detect:
  os: [darwin]
  args:
    any: ["-h", "-H"]
  signature:
    all:
      - '^Filesystem\s+Size\s+Used\s+Avail\s+Capacity\s+iused\s+ifree\s+%iused\s+Mounted on\s*$'
# The filesystem column may contain spaces ("map auto_home"), so cells are
# cut at header offsets instead of whitespace.
parse:
  type: table
  split: aligned
  header:
    columns: [filesystem, size, used, available, capacity_percent, iused, ifree, iused_percent, mounted_on]
fields:
  filesystem: {required: true}
  size: {required: true}
  used: {required: true}
  available: {required: true}
  capacity_percent: {type: int, trim_suffix: "%", null_if: ["-"], required: true}
  iused: {type: int, required: true}
  ifree: {type: int, required: true}
  iused_percent: {type: int, trim_suffix: "%", null_if: ["-"], required: true}
  mounted_on: {required: true}
