# macOS df -h prints binary suffixes (466Gi) and df -H decimal ones
# (500G); both are rounded, so the sizes are reported as printed rather
# than converted. Run plain `df` for exact 512-byte block counts.
#
# The inode counts are abbreviated here too ("459k"), which is why they
# are strings in this variant and numbers in the plain one.
format: 1
command: df
variant: bsd-human
description: BSD df -h / -H output on macOS (sizes kept as printed)
metadata:
  tags: [darwin, bsd, filesystem]
  compatible: [macOS df]
  references:
    - https://ss64.com/mac/df.html
detect:
  os: [darwin]
  args:
    any: ["-h", "-H"]
  signature:
    all:
      - '^Filesystem\s+Size\s+Used\s+Avail\s+Capacity\s+iused\s+ifree\s+%iused\s+Mounted on\s*$'
input:
  ignore:
    - '^Filesystem\s+Size'
parse:
  type: regex
  patterns:
    - '^(?P<filesystem>.+?)\s+(?P<size>[\d.]+[KMGTPBEi]*)\s+(?P<used>[\d.]+[KMGTPBEi]*)\s+(?P<available>[\d.]+[KMGTPBEi]*)\s+(?P<capacity_percent>\S+)\s+(?P<iused>\S+)\s+(?P<ifree>\S+)\s+(?P<iused_percent>\S+)\s+(?P<mounted_on>/.*?)\s*$'
    - '^(?P<filesystem>.+?)\s+(?P<size>[\d.]+[KMGTPBEi]*)\s+(?P<used>[\d.]+[KMGTPBEi]*)\s+(?P<available>[\d.]+[KMGTPBEi]*)\s+(?P<capacity_percent>\S+)\s+(?P<mounted_on>/.*?)\s*$'
fields:
  filesystem: {required: true}
  size: {required: true}
  used: {required: true}
  available: {required: true}
  capacity_percent: {type: int, trim_suffix: "%", null_if: ["-"], required: true}
  # -h rounds the size columns and leaves the inode counts alone, so
  # these are exact and become numbers the way df/bsd reads them.
  iused: {type: int, null_if: ["-"], when_missing: omit}
  ifree: {type: int, null_if: ["-"], when_missing: omit}
  iused_percent: {type: int, trim_suffix: "%", null_if: ["-"], when_missing: omit}
  mounted_on: {required: true}
