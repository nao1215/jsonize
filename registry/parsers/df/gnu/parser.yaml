# GNU coreutils df, default 1K-block output. BusyBox df prints the same
# layout, so this definition covers both (see metadata.compatible).
format: 1
command: df
variant: gnu
aliases:
  # macOS installs GNU coreutils under a g prefix, and the g name prints
  # what the command prints.
  - name: gdf
description: df default output with 1K blocks (GNU coreutils, BusyBox)
metadata:
  tags: [linux, filesystem, coreutils]
  compatible: [GNU coreutils, BusyBox]
  references:
    - https://www.gnu.org/software/coreutils/manual/html_node/df-invocation.html
detect:
  os: [linux]
  args:
    none: ["-h", "--human-readable", "-H", "--si", "-i", "--inodes", "-T", "--print-type"]
  signature:
    all:
      # The text opens with the header, after any df: warnings.
      - '\A(?:df: [^\n]*\n)*Filesystem[ \t]'
      - '^Filesystem\s+1K-blocks\s+Used\s+Available\s+Use%\s+Mounted on\s*$'
# A file system's name may hold spaces (a FUSE mount named "photos 2024"),
# so a line is read by what each column holds rather than split at
# blanks: four figures, a percentage, and a mount point that starts at
# "/". Split at blanks, "photos 2024" put 2024 in 1k_blocks and every
# figure one column to the right. BusyBox prints a name longer than its
# 20-column field on a line of its own and the figures, indented, on the
# next; fold joins the two.
#
# df writes "df: /path: Permission denied" for mount points it cannot
# stat; those lines land in the output when stderr is merged into it.
#
# -BK counts in the default unit, so the heading does not change, but a
# unit given without a number makes df print it after every figure
# ("4740K"). The figure is still a whole count of 1K blocks, so the letter
# is matched and left out.
input:
  fold: '^[ \t]+[\d-]'
  ignore:
    - '^df: '
    - '^Filesystem\s+1K-blocks\s+Used\s+Available\s+Use%\s+Mounted on\s*$'
parse:
  type: regex
  pattern: '^(?P<filesystem>\S.*?)\s+(?P<1k_blocks>\S+?)K?\s+(?P<used>\S+?)K?\s+(?P<available>\S+?)K?\s+(?P<use_percent>\d+%|-)\s+(?P<mounted_on>/.*|-)$'
# --total closes the table with a row named total whose mount point (and
# type) is a dash; it is kept, as printed, since it is what was asked for.
fields:
  filesystem: {required: true}
  # df -a lists automount points nothing has mounted yet, and df prints a
  # dash for figures it could not read; that is null, not zero.
  1k_blocks: {type: int, null_if: ["-"]}
  used: {type: int, null_if: ["-"]}
  available: {type: int, null_if: ["-"]}
  use_percent: {type: int, trim_suffix: "%", null_if: ["-"]}
  mounted_on: {required: true}
