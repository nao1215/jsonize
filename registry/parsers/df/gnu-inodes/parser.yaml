# `df -i` reports inode counts instead of blocks. The counts are exact,
# so they become numbers; a filesystem that has no inodes at all prints
# "-" for the percentage.
format: 1
command: df
variant: gnu-inodes
aliases:
  # macOS installs GNU coreutils under a g prefix, and the g name prints
  # what the command prints.
  - name: gdf
description: df -i on GNU coreutils, exact inode counts
metadata:
  tags: [linux, filesystem]
  compatible: [GNU coreutils]
  references:
    - https://www.gnu.org/software/coreutils/manual/html_node/df-invocation.html
detect:
  os: [linux]
  args:
    any: ["-i", "--inodes"]
  signature:
    # The rule below reads the shape of the values, so it has to see
    # every row: a listing whose first rows are all small would
    # otherwise be judged on those alone.
    window: 200
    all:
      # The text opens with the header, after any df: warnings.
      - '\A(?:df: [^\n]*\n)*Filesystem[ \t]'
      - '^Filesystem\s+Inodes\s+IUsed\s+IFree\s+IUse%\s+Mounted on\s*$'
    none:
      # The same header covers `df -ih`, whose counts carry a suffix and
      # are rounded. Those are read by df/gnu-inodes-human and must not
      # be converted to numbers here.
      # A name may hold spaces ("photos 2024"), so the count is looked
      # for after any of them.
      - '^\S[^\n]*?[ \t][\d.]+[KMGTPE][ \t]'
# A file system's name may hold spaces, so a line is read by what each
# column holds: three counts, a percentage and a mount point (see df/gnu).
input:
  ignore:
    - '^df: '
    - '^Filesystem\s+Inodes\s+IUsed\s+IFree\s+IUse%\s+Mounted on\s*$'
parse:
  type: regex
  pattern: '^(?P<filesystem>\S.*?)\s+(?P<inodes>\S+)\s+(?P<iused>\S+)\s+(?P<ifree>\S+)\s+(?P<iuse_percent>\d+%|-)\s+(?P<mounted_on>/.*|-)$'
# --total closes the table with a row named total whose mount point (and
# type) is a dash; it is kept, as printed, since it is what was asked for.
fields:
  filesystem: {required: true}
  # df -a lists automount points nothing has mounted yet, and df prints a
  # dash for figures it could not read; that is null, not zero.
  inodes: {type: int, null_if: ["-"]}
  iused: {type: int, null_if: ["-"]}
  ifree: {type: int, null_if: ["-"]}
  iuse_percent: {type: int, trim_suffix: "%", null_if: ["-"]}
  mounted_on: {required: true}
