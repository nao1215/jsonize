# BusyBox df -h labels the fourth column "Available" where GNU prints
# "Avail"; that single word is what tells the two apart. Sizes are kept as
# printed: they are rounded, so a byte count derived from them would claim
# a precision the output does not have.
format: 1
command: df
variant: busybox-human
description: BusyBox df -h (sizes kept as printed)
metadata:
  tags: [linux, busybox, filesystem]
  compatible: [BusyBox]
  references:
    - https://busybox.net/downloads/BusyBox.html#df
detect:
  os: [linux]
  args:
    any: ["-h"]
  signature:
    all:
      # The text opens with the header, after any df: warnings.
      - '\A(?:df: [^\n]*\n)*Filesystem[ \t]'
      - '^Filesystem\s+Size\s+Used\s+Available\s+Use%\s+Mounted on\s*$'
# A file system's name may hold spaces, so a line is read by what each
# column holds (see df/gnu). A name longer than BusyBox's 20-column field
# is printed on a line of its own and the figures, indented, on the
# next; fold joins the two.
input:
  fold: '^[ \t]+[\d-]'
  ignore:
    - '^df: '
    - '^Filesystem\s+Size\s+Used\s+Available\s+Use%\s+Mounted on\s*$'
parse:
  type: regex
  pattern: '^(?P<filesystem>\S.*?)\s+(?P<size>\S+)\s+(?P<used>\S+)\s+(?P<available>\S+)\s+(?P<use_percent>\d+%|-)\s+(?P<mounted_on>/.*)$'
fields:
  filesystem: {required: true}
  size: {required: true}
  used: {required: true}
  available: {required: true}
  use_percent: {type: int, trim_suffix: "%", null_if: ["-"]}
  mounted_on: {required: true}
