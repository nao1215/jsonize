source: captured on Ubuntu 26.04 (GNU coreutils 9.7) with LC_ALL=C; the user name in one mount point replaced
description: >-
  df -BM. A unit given without a number makes df print that unit after
  every figure as well as in the heading. The figures are still whole
  counts of the unit, so the letter is left off.
os: linux
args: ["-BM"]
