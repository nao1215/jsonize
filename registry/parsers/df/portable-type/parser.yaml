# `df -P -T`: the POSIX format of df/portable with the filesystem type
# inserted as the second column, which GNU coreutils prints.
format: 1
command: df
variant: portable-type
aliases:
  - name: gdf
description: df -P -T, the POSIX format with the filesystem type (GNU coreutils)
metadata:
  tags: [linux, filesystem, coreutils]
  compatible: [GNU coreutils]
  references:
    - https://www.gnu.org/software/coreutils/manual/html_node/df-invocation.html
detect:
  os: [linux]
  args:
    any: ["-P", "--portability"]
  signature:
    all:
      - '\AFilesystem\s+Type\s+1024-blocks\s+Used\s+Available\s+Capacity\s+Mounted on\s*$'
input:
  ignore:
    - '^df: '
parse:
  type: table
  header:
    columns: [filesystem, type, 1024_blocks, used, available, capacity_percent, mounted_on]
fields:
  filesystem: {required: true}
  type: {required: true}
  1024_blocks: {type: int, null_if: ["-"]}
  used: {type: int, null_if: ["-"]}
  available: {type: int, null_if: ["-"]}
  capacity_percent: {type: int, trim_suffix: "%", null_if: ["-"]}
  mounted_on: {required: true}
