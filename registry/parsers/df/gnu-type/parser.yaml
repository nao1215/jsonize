# `df -T` inserts the filesystem type as a second column; the block
# counts are the exact ones `df` prints without -h.
format: 1
command: df
variant: gnu-type
aliases:
  # macOS installs GNU coreutils under a g prefix, and the g name prints
  # what the command prints.
  - name: gdf
description: df -T on GNU coreutils, with the filesystem type column
metadata:
  tags: [linux, filesystem]
  compatible: [GNU coreutils]
  references:
    - https://www.gnu.org/software/coreutils/manual/html_node/df-invocation.html
detect:
  os: [linux]
  args:
    any: ["-T", "--print-type"]
    none: ["-h", "--human-readable", "-H", "--si", "-i", "--inodes"]
  signature:
    all:
      - '^Filesystem\s+Type\s+1K-blocks\s+Used\s+Available\s+Use%\s+Mounted on\s*$'
# A file system's name may hold spaces, so a line is read by what each
# column holds (see df/gnu); the type is one word.
input:
  ignore:
    - '^df: '
    - '^Filesystem\s+Type\s+1K-blocks\s+Used\s+Available\s+Use%\s+Mounted on\s*$'
parse:
  type: regex
  pattern: '^(?P<filesystem>\S.*?)\s+(?P<type>\S+)\s+(?P<1k_blocks>\S+)\s+(?P<used>\S+)\s+(?P<available>\S+)\s+(?P<use_percent>\d+%|-)\s+(?P<mounted_on>/.*)$'
fields:
  filesystem: {required: true}
  type: {required: true}
  # df -a lists automount points nothing has mounted yet, and df prints a
  # dash for figures it could not read; that is null, not zero.
  1k_blocks: {type: int, null_if: ["-"]}
  used: {type: int, null_if: ["-"]}
  available: {type: int, null_if: ["-"]}
  use_percent: {type: int, trim_suffix: "%", null_if: ["-"]}
  mounted_on: {required: true}
