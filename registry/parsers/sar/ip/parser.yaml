# `sar -n IP` prints a banner, then one row per sampling
# interval and a summary block labelled Average:. It is read the way the
# other sar reports are: the banner, a LINUX RESTART line and the column
# name lines are left out, and the columns are written out here, since
# the name line opens with a time rather than with a name. The figures
# are numbers with a fraction.
format: 1
command: sar
variant: ip
description: sar -n IP IPv4 traffic
metadata:
  tags: [linux, performance, sysstat]
  compatible: [sysstat]
  references:
    - https://man7.org/linux/man-pages/man1/sar.1.html
detect:
  os: [linux]
  args:
    # Another report after this one, `-h` values with units, and
    # with -n a second keyword, none of which this reads.
    none: ["-B", "-b", "-d", "-F", "-H", "-I", "-m", "-q", "-r", "-S", "-u", "-v", "-W", "-w", "-y", "-A", "-h", "DEV", "EDEV", "NFS", "NFSD", "SOCK", "EIP", "ICMP", "EICMP", "TCP", "ETCP", "UDP", "SOCK6", "IP6", "EIP6", "ICMP6", "EICMP6", "UDP6", "SOFT", "FC", "ALL"]
  signature:
    all:
      - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[^\n]*\n[ \t]*\n(?:\d\d:\d\d:\d\d[ \t]+LINUX RESTART[^\n]*\n[ \t]*\n)*(?:\d\d:\d\d:\d\d|Average:)[ \t]+irec/s[ \t]+fwddgm/s[ \t]+idel/s[ \t]+orq/s[ \t]+asmrq/s[ \t]+asmok/s[ \t]+fragok/s[ \t]+fragcrt/s[ \t]*$'
input:
  ignore:
    - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[ \t]+\S+[ \t]+_\S+_[ \t]+\(\d+ CPU\)[ \t]*$'
    - '^\d\d:\d\d:\d\d[ \t]+LINUX RESTART(?:[ \t]+\(\d+ CPU\))?[ \t]*$'
    - '^(?:\d\d:\d\d:\d\d|Average:)[ \t]+irec/s[ \t]+fwddgm/s[ \t]+idel/s[ \t]+orq/s[ \t]+asmrq/s[ \t]+asmok/s[ \t]+fragok/s[ \t]+fragcrt/s[ \t]*$'
parse:
  type: table
  split: whitespace
  header:
    none: true
    columns: [time, irec_per_s, fwddgm_per_s, idel_per_s, orq_per_s, asmrq_per_s, asmok_per_s, fragok_per_s, fragcrt_per_s]
fields:
  time: {required: true, trim_suffix: ":"}
  irec_per_s: {type: float}
  fwddgm_per_s: {type: float}
  idel_per_s: {type: float}
  orq_per_s: {type: float}
  asmrq_per_s: {type: float}
  asmok_per_s: {type: float}
  fragok_per_s: {type: float}
  fragcrt_per_s: {type: float}
