# `sar -n EIP` prints a banner, then one row per sampling
# interval and a summary block labelled Average:. It is read the way the
# other sar reports are: the banner, a LINUX RESTART line and the column
# name lines are left out, and the columns are written out here, since
# the name line opens with a time rather than with a name. The figures
# are numbers with a fraction.
format: 1
command: sar
variant: ip-errors
description: sar -n EIP IPv4 errors
metadata:
  tags: [linux, performance, sysstat]
  compatible: [sysstat]
  references:
    - https://man7.org/linux/man-pages/man1/sar.1.html
detect:
  os: [linux]
  args:
    # Another report after this one, `-h` values with units, and
    # with -n a second keyword, none of which this reads.
    none: ["-B", "-b", "-d", "-F", "-H", "-I", "-m", "-q", "-r", "-S", "-u", "-v", "-W", "-w", "-y", "-A", "-h", "DEV", "EDEV", "NFS", "NFSD", "SOCK", "IP", "ICMP", "EICMP", "TCP", "ETCP", "UDP", "SOCK6", "IP6", "EIP6", "ICMP6", "EICMP6", "UDP6", "SOFT", "FC", "ALL"]
  signature:
    all:
      - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[^\n]*\n[ \t]*\n(?:\d\d:\d\d:\d\d[ \t]+LINUX RESTART[^\n]*\n[ \t]*\n)*(?:\d\d:\d\d:\d\d|Average:)[ \t]+ihdrerr/s[ \t]+iadrerr/s[ \t]+iukwnpr/s[ \t]+idisc/s[ \t]+odisc/s[ \t]+onort/s[ \t]+asmf/s[ \t]+fragf/s[ \t]*$'
input:
  ignore:
    - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[ \t]+\S+[ \t]+_\S+_[ \t]+\(\d+ CPU\)[ \t]*$'
    - '^\d\d:\d\d:\d\d[ \t]+LINUX RESTART(?:[ \t]+\(\d+ CPU\))?[ \t]*$'
    - '^(?:\d\d:\d\d:\d\d|Average:)[ \t]+ihdrerr/s[ \t]+iadrerr/s[ \t]+iukwnpr/s[ \t]+idisc/s[ \t]+odisc/s[ \t]+onort/s[ \t]+asmf/s[ \t]+fragf/s[ \t]*$'
parse:
  type: table
  split: whitespace
  header:
    none: true
    columns: [time, ihdrerr_per_s, iadrerr_per_s, iukwnpr_per_s, idisc_per_s, odisc_per_s, onort_per_s, asmf_per_s, fragf_per_s]
fields:
  time: {required: true, trim_suffix: ":"}
  ihdrerr_per_s: {type: float}
  iadrerr_per_s: {type: float}
  iukwnpr_per_s: {type: float}
  idisc_per_s: {type: float}
  odisc_per_s: {type: float}
  onort_per_s: {type: float}
  asmf_per_s: {type: float}
  fragf_per_s: {type: float}
