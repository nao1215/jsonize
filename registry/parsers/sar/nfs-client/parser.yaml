# `sar -n NFS` prints a banner, then one row per sampling
# interval and a summary block labelled Average:. It is read the way the
# other sar reports are: the banner, a LINUX RESTART line and the column
# name lines are left out, and the columns are written out here, since
# the name line opens with a time rather than with a name. The figures
# are numbers with a fraction.
format: 1
command: sar
variant: nfs-client
description: sar -n NFS NFS client activity
metadata:
  tags: [linux, performance, sysstat]
  compatible: [sysstat]
  references:
    - https://man7.org/linux/man-pages/man1/sar.1.html
detect:
  os: [linux]
  signature:
    all:
      - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[^\n]*\n[ \t]*\n(?:\d\d:\d\d:\d\d[ \t]+LINUX RESTART[^\n]*\n[ \t]*\n)*(?:\d\d:\d\d:\d\d|Average:)[ \t]+call/s[ \t]+retrans/s[ \t]+read/s[ \t]+write/s[ \t]+access/s[ \t]+getatt/s[ \t]*$'
input:
  ignore:
    - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[ \t]+\S+[ \t]+_\S+_[ \t]+\(\d+ CPU\)[ \t]*$'
    - '^\d\d:\d\d:\d\d[ \t]+LINUX RESTART(?:[ \t]+\(\d+ CPU\))?[ \t]*$'
    - '^(?:\d\d:\d\d:\d\d|Average:)[ \t]+call/s[ \t]+retrans/s[ \t]+read/s[ \t]+write/s[ \t]+access/s[ \t]+getatt/s[ \t]*$'
parse:
  type: table
  split: whitespace
  header:
    none: true
    columns: [time, call_per_s, retrans_per_s, read_per_s, write_per_s, access_per_s, getatt_per_s]
fields:
  time: {required: true, trim_suffix: ":"}
  call_per_s: {type: float}
  retrans_per_s: {type: float}
  read_per_s: {type: float}
  write_per_s: {type: float}
  access_per_s: {type: float}
  getatt_per_s: {type: float}
