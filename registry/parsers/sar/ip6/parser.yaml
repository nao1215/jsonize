# `sar -n IP6` prints a banner, then one row per sampling
# interval and a summary block labelled Average:. It is read the way the
# other sar reports are: the banner, a LINUX RESTART line and the column
# name lines are left out, and the columns are written out here, since
# the name line opens with a time rather than with a name. The figures
# are numbers with a fraction.
format: 1
command: sar
variant: ip6
description: sar -n IP6 IPv6 traffic
metadata:
  tags: [linux, performance, sysstat]
  compatible: [sysstat]
  references:
    - https://man7.org/linux/man-pages/man1/sar.1.html
detect:
  os: [linux]
  signature:
    all:
      - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[^\n]*\n[ \t]*\n(?:\d\d:\d\d:\d\d[ \t]+LINUX RESTART[^\n]*\n[ \t]*\n)*(?:\d\d:\d\d:\d\d|Average:)[ \t]+irec6/s[ \t]+fwddgm6/s[ \t]+idel6/s[ \t]+orq6/s[ \t]+asmrq6/s[ \t]+asmok6/s[ \t]+imcpck6/s[ \t]+omcpck6/s[ \t]+fragok6/s[ \t]+fragcr6/s[ \t]*$'
input:
  ignore:
    - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[ \t]+\S+[ \t]+_\S+_[ \t]+\(\d+ CPU\)[ \t]*$'
    - '^\d\d:\d\d:\d\d[ \t]+LINUX RESTART(?:[ \t]+\(\d+ CPU\))?[ \t]*$'
    - '^(?:\d\d:\d\d:\d\d|Average:)[ \t]+irec6/s[ \t]+fwddgm6/s[ \t]+idel6/s[ \t]+orq6/s[ \t]+asmrq6/s[ \t]+asmok6/s[ \t]+imcpck6/s[ \t]+omcpck6/s[ \t]+fragok6/s[ \t]+fragcr6/s[ \t]*$'
parse:
  type: table
  split: whitespace
  header:
    none: true
    columns: [time, irec6_per_s, fwddgm6_per_s, idel6_per_s, orq6_per_s, asmrq6_per_s, asmok6_per_s, imcpck6_per_s, omcpck6_per_s, fragok6_per_s, fragcr6_per_s]
fields:
  time: {required: true, trim_suffix: ":"}
  irec6_per_s: {type: float}
  fwddgm6_per_s: {type: float}
  idel6_per_s: {type: float}
  orq6_per_s: {type: float}
  asmrq6_per_s: {type: float}
  asmok6_per_s: {type: float}
  imcpck6_per_s: {type: float}
  omcpck6_per_s: {type: float}
  fragok6_per_s: {type: float}
  fragcr6_per_s: {type: float}
