# `sar -n EICMP` prints a banner, then one row per sampling
# interval and a summary block labelled Average:. It is read the way the
# other sar reports are: the banner, a LINUX RESTART line and the column
# name lines are left out, and the columns are written out here, since
# the name line opens with a time rather than with a name. The figures
# are numbers with a fraction.
format: 1
command: sar
variant: icmp-errors
description: sar -n EICMP ICMPv4 errors
metadata:
  tags: [linux, performance, sysstat]
  compatible: [sysstat]
  references:
    - https://man7.org/linux/man-pages/man1/sar.1.html
detect:
  os: [linux]
  signature:
    all:
      - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[^\n]*\n[ \t]*\n(?:\d\d:\d\d:\d\d[ \t]+LINUX RESTART[^\n]*\n[ \t]*\n)*(?:\d\d:\d\d:\d\d|Average:)[ \t]+ierr/s[ \t]+oerr/s[ \t]+idstunr/s[ \t]+odstunr/s[ \t]+itmex/s[ \t]+otmex/s[ \t]+iparmpb/s[ \t]+oparmpb/s[ \t]+isrcq/s[ \t]+osrcq/s[ \t]+iredir/s[ \t]+oredir/s[ \t]*$'
input:
  ignore:
    - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[ \t]+\S+[ \t]+_\S+_[ \t]+\(\d+ CPU\)[ \t]*$'
    - '^\d\d:\d\d:\d\d[ \t]+LINUX RESTART(?:[ \t]+\(\d+ CPU\))?[ \t]*$'
    - '^(?:\d\d:\d\d:\d\d|Average:)[ \t]+ierr/s[ \t]+oerr/s[ \t]+idstunr/s[ \t]+odstunr/s[ \t]+itmex/s[ \t]+otmex/s[ \t]+iparmpb/s[ \t]+oparmpb/s[ \t]+isrcq/s[ \t]+osrcq/s[ \t]+iredir/s[ \t]+oredir/s[ \t]*$'
parse:
  type: table
  split: whitespace
  header:
    none: true
    columns: [time, ierr_per_s, oerr_per_s, idstunr_per_s, odstunr_per_s, itmex_per_s, otmex_per_s, iparmpb_per_s, oparmpb_per_s, isrcq_per_s, osrcq_per_s, iredir_per_s, oredir_per_s]
fields:
  time: {required: true, trim_suffix: ":"}
  ierr_per_s: {type: float}
  oerr_per_s: {type: float}
  idstunr_per_s: {type: float}
  odstunr_per_s: {type: float}
  itmex_per_s: {type: float}
  otmex_per_s: {type: float}
  iparmpb_per_s: {type: float}
  oparmpb_per_s: {type: float}
  isrcq_per_s: {type: float}
  osrcq_per_s: {type: float}
  iredir_per_s: {type: float}
  oredir_per_s: {type: float}
