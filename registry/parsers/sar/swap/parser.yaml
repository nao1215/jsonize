# `sar -S` prints a banner naming the kernel, the host, the date and
# the CPU count, then one row per sampling interval and a summary row
# labelled Average:. The banner is dropped: it is one line about the run
# rather than a row of the report, and a table cannot hold both.
#
# The column names sit on a line that opens with the time the report
# started rather than with a name, so the names are written out here and
# that line is ignored. `sar -n DEV` repeats the name line above the
# summary block, which is why the ignore pattern accepts either label.
#
# The first cell is the time of the sample, except on a summary row where
# it is the word Average. The trailing colon that only the summary rows
# carry is removed so the cell holds one or the other and nothing else.
#
# A daily file that spans a reboot has a LINUX RESTART line where the
# machine came back up, and the report starts again after it with its
# own column names and its own Average rows. The line is dropped like
# the banner: it marks a moment rather than a sample, and the rows on
# either side of it keep their times.
format: 1
command: sar
variant: swap
description: sar -S swap space utilisation
metadata:
  tags: [linux, performance, sysstat]
  compatible: [sysstat]
  references:
    - https://man7.org/linux/man-pages/man1/sar.1.html
detect:
  os: [linux]
  signature:
    all:
      - '^(?:\d\d:\d\d:\d\d|Average:)[ \t]+kbswpfree[ \t]+kbswpused[ \t]+%swpused[ \t]+kbswpcad[ \t]+%swpcad[ \t]*$'
input:
  ignore:
    # The banner, and the line sar prints where the day's file records a
    # reboot. Both are stated whole, so no other line is left out with them.
    - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[ \t]+\S+[ \t]+_\S+_[ \t]+\(\d+ CPU\)[ \t]*$'
    - '^\d\d:\d\d:\d\d[ \t]+LINUX RESTART(?:[ \t]+\(\d+ CPU\))?[ \t]*$'
    - '^(?:\d\d:\d\d:\d\d|Average:)[ \t]+kbswpfree[ \t]+kbswpused'
parse:
  type: table
  split: whitespace
  header:
    none: true
    columns: [time, kbswpfree, kbswpused, swpused_percent, kbswpcad, swpcad_percent]
fields:
  time: {required: true, trim_suffix: ":"}
  kbswpfree: {type: int}
  kbswpused: {type: int}
  swpused_percent: {type: float}
  kbswpcad: {type: int}
  swpcad_percent: {type: float}
