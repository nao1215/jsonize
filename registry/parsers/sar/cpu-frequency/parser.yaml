# `sar -m CPU` prints a banner, then one row per sampling
# interval and a summary block labelled Average:. It is read the way the
# other sar reports are: the banner, a LINUX RESTART line and the column
# name lines are left out, and the columns are written out here, since
# the name line opens with a time rather than with a name. The figures
# are numbers with a fraction.
format: 1
command: sar
variant: cpu-frequency
description: sar -m CPU clock frequency of each CPU
metadata:
  tags: [linux, performance, sysstat]
  compatible: [sysstat]
  references:
    - https://man7.org/linux/man-pages/man1/sar.1.html
detect:
  os: [linux]
  args:
    # Another report after this one, and `-h` values with units,
    # neither of which this reads.
    none: ["-B", "-b", "-d", "-F", "-H", "-I", "-n", "-q", "-r", "-S", "-u", "-v", "-W", "-w", "-y", "-A", "-h"]
  signature:
    all:
      - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[^\n]*\n[ \t]*\n(?:\d\d:\d\d:\d\d[ \t]+LINUX RESTART[^\n]*\n[ \t]*\n)*(?:\d\d:\d\d:\d\d|Average:)[ \t]+CPU[ \t]+MHz[ \t]*$'
input:
  ignore:
    - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[ \t]+\S+[ \t]+_\S+_[ \t]+\(\d+ CPU\)[ \t]*$'
    - '^\d\d:\d\d:\d\d[ \t]+LINUX RESTART(?:[ \t]+\(\d+ CPU\))?[ \t]*$'
    - '^(?:\d\d:\d\d:\d\d|Average:)[ \t]+CPU[ \t]+MHz[ \t]*$'
parse:
  type: table
  split: whitespace
  header:
    none: true
    columns: [time, cpu, mhz]
fields:
  time: {required: true, trim_suffix: ":"}
  cpu: {required: true}
  mhz: {type: float}
