# `sar -d` prints the activity of each block device: a banner, then one
# row per device per sampling interval and a summary block labelled
# Average:. It is read the way sar/network-device is: the banner and the
# column name lines are left out and the columns are written out here,
# since the name line opens with a time rather than with a name.
#
# The device is named as the kernel names it (nvme0n1, sda, loop0); a
# device mapper volume is dev253-0 unless -p asks for its name.
format: 1
command: sar
variant: disk
description: sar -d block device activity
metadata:
  tags: [linux, performance, sysstat, disk]
  compatible: [sysstat]
  references:
    - https://man7.org/linux/man-pages/man1/sar.1.html
detect:
  os: [linux]
  args:
    # Another report after this one, and `-h` values with units,
    # neither of which this reads.
    none: ["-B", "-b", "-F", "-H", "-I", "-m", "-n", "-q", "-r", "-S", "-u", "-v", "-W", "-w", "-y", "-A", "-h"]
  signature:
    all:
      - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[^\n]*\n[ \t]*\n(?:\d\d:\d\d:\d\d[ \t]+LINUX RESTART[^\n]*\n[ \t]*\n)*(?:\d\d:\d\d:\d\d|Average:)[ \t]+DEV[ \t]+tps[ \t]+rkB/s[ \t]+wkB/s[ \t]+dkB/s[ \t]+areq-sz[ \t]+aqu-sz[ \t]+await[ \t]+%util[ \t]*$'
input:
  ignore:
    - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[ \t]+\S+[ \t]+_\S+_[ \t]+\(\d+ CPU\)[ \t]*$'
    - '^\d\d:\d\d:\d\d[ \t]+LINUX RESTART(?:[ \t]+\(\d+ CPU\))?[ \t]*$'
    - '^(?:\d\d:\d\d:\d\d|Average:)[ \t]+DEV[ \t]+tps[ \t]+rkB/s'
parse:
  type: table
  split: whitespace
  header:
    none: true
    columns: [time, device, tps, rkb_per_s, wkb_per_s, dkb_per_s, areq_sz, aqu_sz, await, util_percent]
fields:
  time: {required: true, trim_suffix: ":"}
  device: {required: true}
  tps: {type: float}
  rkb_per_s: {type: float}
  wkb_per_s: {type: float}
  dkb_per_s: {type: float}
  areq_sz: {type: float}
  aqu_sz: {type: float}
  await: {type: float}
  util_percent: {type: float}
