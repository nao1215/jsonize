# `sar -r ALL` prints a banner, then one row per sampling
# interval and a summary block labelled Average:. It is read the way the
# other sar reports are: the banner, a LINUX RESTART line and the column
# name lines are left out, and the columns are written out here, since
# the name line opens with a time rather than with a name. -r ALL adds the
# anonymous, slab, kernel stack, page table and vmalloc sizes to what
# sar/memory reads. A size in kilobytes is a whole number and a
# percentage has a fraction.
format: 1
command: sar
variant: memory-all
description: sar -r ALL memory utilization with every field
metadata:
  tags: [linux, performance, sysstat]
  compatible: [sysstat]
  references:
    - https://man7.org/linux/man-pages/man1/sar.1.html
detect:
  os: [linux]
  signature:
    all:
      - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[^\n]*\n[ \t]*\n(?:\d\d:\d\d:\d\d[ \t]+LINUX RESTART[^\n]*\n[ \t]*\n)*(?:\d\d:\d\d:\d\d|Average:)[ \t]+kbmemfree[ \t]+kbavail[ \t]+kbmemused[ \t]+%memused[ \t]+kbbuffers[ \t]+kbcached[ \t]+kbcommit[ \t]+%commit[ \t]+kbactive[ \t]+kbinact[ \t]+kbdirty[ \t]+kbanonpg[ \t]+kbslab[ \t]+kbkstack[ \t]+kbpgtbl[ \t]+kbvmused[ \t]*$'
input:
  ignore:
    - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[ \t]+\S+[ \t]+_\S+_[ \t]+\(\d+ CPU\)[ \t]*$'
    - '^\d\d:\d\d:\d\d[ \t]+LINUX RESTART(?:[ \t]+\(\d+ CPU\))?[ \t]*$'
    - '^(?:\d\d:\d\d:\d\d|Average:)[ \t]+kbmemfree[ \t]+kbavail[ \t]+kbmemused[ \t]+%memused[ \t]+kbbuffers[ \t]+kbcached[ \t]+kbcommit[ \t]+%commit[ \t]+kbactive[ \t]+kbinact[ \t]+kbdirty[ \t]+kbanonpg[ \t]+kbslab[ \t]+kbkstack[ \t]+kbpgtbl[ \t]+kbvmused[ \t]*$'
parse:
  type: table
  split: whitespace
  header:
    none: true
    columns: [time, kbmemfree, kbavail, kbmemused, memused_percent, kbbuffers, kbcached, kbcommit, commit_percent, kbactive, kbinact, kbdirty, kbanonpg, kbslab, kbkstack, kbpgtbl, kbvmused]
fields:
  time: {required: true, trim_suffix: ":"}
  kbmemfree: {type: int}
  kbavail: {type: int}
  kbmemused: {type: int}
  memused_percent: {type: float}
  kbbuffers: {type: int}
  kbcached: {type: int}
  kbcommit: {type: int}
  commit_percent: {type: float}
  kbactive: {type: int}
  kbinact: {type: int}
  kbdirty: {type: int}
  kbanonpg: {type: int}
  kbslab: {type: int}
  kbkstack: {type: int}
  kbpgtbl: {type: int}
  kbvmused: {type: int}
