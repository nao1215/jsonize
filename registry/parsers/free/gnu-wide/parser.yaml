format: 1
command: free
variant: gnu-wide
description: procps free -w (buffers and cache in separate columns, KiB as printed)
metadata:
  tags: [linux, memory, procps]
  compatible: [procps-ng]
  references:
    - https://man7.org/linux/man-pages/man1/free.1.html
detect:
  os: [linux]
  args:
    any: ["-w", "--wide"]
    none: ["-h", "--human"]
  signature:
    all:
      # The text opens with the header.
      - '\A[ \t]+total[ \t]'
      - '^\s+total\s+used\s+free\s+shared\s+buffers\s+cache\s+available\s*$'
      # -h and -w together print the same header over rounded figures
      # with a suffix, which free/gnu-wide-human reads. The row says
      # which of the two it is, and reading one as the other would
      # convert "61Gi" to a number or leave a kibibyte count a string.
      - '^Mem:\s+\d+\s+\d+\s+\d+\s+\d+\s+\d+\s+\d+\s+\d+\s*$'
parse:
  type: table
  header:
    leading_label: type
  min_fields: 4
fields:
  type: {trim_suffix: ":", required: true}
  total: {type: int, required: true}
  used: {type: int}
  free: {type: int}
  shared: {type: int}
  buffers: {type: int}
  cache: {type: int}
  available: {type: int}
