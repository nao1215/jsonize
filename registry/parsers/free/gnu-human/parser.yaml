# `free -h` counts 1024 per suffix step and `free -h --si` counts 1000,
# and the output does not say which is in use. The values are rounded in
# either case, so they are reported as printed; run plain `free` for exact
# kibibyte numbers.
format: 1
command: free
variant: gnu-human
description: procps free -h (sizes kept as printed)
metadata:
  tags: [linux, memory, procps]
  compatible: [procps-ng, BusyBox]
  references:
    - https://man7.org/linux/man-pages/man1/free.1.html
detect:
  os: [linux]
  args:
    any: ["-h", "--human"]
  signature:
    all:
      # The text opens with the header.
      - '\A[ \t]+total[ \t]'
      - '^\s+total\s+used\s+free\s+shared\s+buff/cache\s+available\s*$'
      - '^Mem:\s+[\d.]+[KMGTPB]i?\b'
parse:
  type: table
  header:
    leading_label: type
  min_fields: 4
fields:
  # The rows free prints are Mem, Swap, and Total with -t, Low and High
  # with -l; a line that opens with any other word is not a row of
  # free.
  type: {trim_suffix: ":", required: true, regex: '(?P<type>Mem|Swap|Total|Low|High)'}
  total: {required: true}
  used: {required: true}
  free: {required: true}
