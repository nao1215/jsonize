# procps-ng free, exact figures. They are in the unit free was asked for:
# KiB by default, and -b, -k, -m, -g and their long forms change it
# without changing the header, so the output does not say which and
# neither does this. Rounded -h output is free/gnu-human's, and stays
# the strings printed.
format: 1
command: free
variant: gnu
description: procps free default output (values in KiB as printed)
metadata:
  tags: [linux, memory, procps]
  compatible: [procps-ng, BusyBox]
  references:
    - https://man7.org/linux/man-pages/man1/free.1.html
detect:
  os: [linux]
  args:
    none: ["-h", "--human", "-w", "--wide"]
  signature:
    all:
      # The text opens with the header.
      - '\A[ \t]+total[ \t]'
      - '\A\s+total\s+used\s+free\s+shared\s+buff/cache\s+available\s*$'
      - '\A[^\n]*\nMem:\s+\d+\s+\d+\s+\d+\s+\d+\s+\d+\s+\d+\s*$'
parse:
  type: table
  header:
    leading_label: type
  min_fields: 4
fields:
  # The rows free prints are Mem, Swap, and Total with -t, Low and High
  # with -l; a line that opens with any other word is not a row of
  # free.
  type: {trim_suffix: ":", required: true, regex: '(?P<type>Mem|Swap|Total|Low|High)'}
  total: {type: int, required: true}
  used: {type: int}
  free: {type: int}
  shared: {type: int}
  buff_cache: {type: int}
  available: {type: int}
