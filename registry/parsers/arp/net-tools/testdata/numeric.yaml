description: >-
  arp -n with an unresolved entry, one set by hand (CM), the container's
  gateway (C) and two published proxy entries (MP) whose type is * and
  whose address is <from_interface>.
source: >-
  captured with LC_ALL=C and `arp -n` from net-tools 2.10 in a debian:stable-slim container, after `arp -i dummy0 -s`, `arp -s ... pub`, `arp -Ds ... pub` and a neighbour added with `ip neigh ... nud failed` on a dummy interface; the gateway's hardware address is replaced by 02:00:00:00:00:01
os: linux
args: ["-n"]
