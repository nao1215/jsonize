description: >-
  arp -a from net-tools with every kind of entry the cache held: one the
  kernel has not resolved, one set by hand (PERM), the container's gateway,
  and two published for a proxy (PERM PUB), which print <from_interface>
  where the hardware address goes.
source: >-
  captured with LC_ALL=C and `arp -a` from net-tools 2.10 in a
  debian:stable-slim container, after `arp -i dummy0 -s`, `arp -s ... pub`,
  `arp -Ds ... pub` and a neighbour added with `ip neigh ... nud failed` on a
  dummy interface; the gateway's hardware address is replaced by
  02:00:00:00:00:01
os: linux
args: ["-a"]
