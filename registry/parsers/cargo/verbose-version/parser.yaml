# `cargo -vV` (--version --verbose) prints the version line, then one
# "key: value" line each for the release, the commit, the host triple and
# the libraries cargo was built with (libgit2, libcurl, ssl) and the
# operating system. The version line is read into the version, the short
# commit and the date it states; the rest is kept as a map under the keys
# cargo printed, since which libraries appear depends on how cargo was
# built. A library's version keeps the build details printed after it.
format: 1
command: cargo
variant: verbose-version
description: cargo -vV, the version, commit, host and libraries of cargo
metadata:
  tags: [development, rust, toolchain]
  compatible: [cargo]
  references:
    - https://doc.rust-lang.org/cargo/commands/cargo.html
detect:
  args:
    any: ["-vV", "-Vv"]
  signature:
    all:
      - '\Acargo [0-9]+\.[0-9]+\.[0-9]+\S* \([^)\n]+\)\nrelease: '
parse:
  type: composite
  parts:
    - name: version
      select: {limit: 1}
      parse:
        type: regex
        each: input
        pattern: '\Acargo (?P<version>[0-9]+\.[0-9]+\.[0-9]+\S*) \((?P<commit>[0-9a-f]+|[^ )]+) (?P<date>[0-9]{4}-[0-9]{2}-[0-9]{2})\)\z'
    - name: details
      select: {skip: 1}
      parse:
        type: kv
        separator: ": "
        as: map
