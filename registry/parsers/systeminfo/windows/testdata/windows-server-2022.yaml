description: >-
  A whole systeminfo report run for real on a Windows Server 2022
  machine, with the counted lists the published excerpt stops short of:
  a processor, five hotfixes and two network cards, each card writing
  its own properties under its entry. Every continuation is joined onto
  the label that announced it. The three Virtual Memory lines carry a
  second colon and keep what follows the first as their value.
source: >-
  captured on a GitHub-hosted windows-2022 runner (Windows Server 2022
  Datacenter, build 20348, en-US culture and UI language, console code
  page 65001) on 2026-09-13 with `systeminfo > systeminfo.txt` in
  cmd.exe. Replaced with made-up values of the same shape: the host name
  (on the Host Name and Logon Server lines), the product ID and the
  link-local IPv6 address. The hotfix numbers, the private IPv4 address
  and the Azure DHCP server address were kept.
os: windows
args: []
