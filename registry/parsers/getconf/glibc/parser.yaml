# `getconf -a` prints a variable name padded to a column and then its
# value. A variable that is not defined on this system has no value at
# all, which becomes null rather than an empty string. Two of the values
# (GNU_LIBC_VERSION, GNU_LIBPTHREAD_VERSION) contain a space, so the
# value is the rest of the line rather than one word.
#
# The numbers stay strings: the same listing mixes limits, byte counts,
# compiler flags and version strings, and a name such as ULONG_MAX
# carries a value that does not fit a JSON number.
format: 1
command: getconf
variant: glibc
description: getconf -a system configuration variables
metadata:
  tags: [linux, system, libc]
  compatible: [glibc]
  references:
    - https://man7.org/linux/man-pages/man1/getconf.1.html
detect:
  os: [linux]
  args:
    any: ["-a"]
  signature:
    all:
      # The text opens with a variable, its value padded to column 36; a
      # name that long is followed by one space.
      - '\A(?:[A-Z_][A-Z0-9_]*[ \t]{2,}|[A-Z_][A-Z0-9_]{34,} )\S'
      # Names glibc always prints, whichever part of the listing is seen.
      - '^(?:LINK_MAX|NAME_MAX|PATH_MAX|SYMLINK_MAX|GNU_LIBC_VERSION|_POSIX_VDISABLE)[ \t]'
      # Two adjacent lines of the same shape; one alone is any two-column
      # text.
      - '^[A-Z_][A-Z0-9_]*[ \t]+[^\n]*\n[A-Z_][A-Z0-9_]*[ \t]+'
parse:
  type: regex
  # Every name is the shape the signature gives it, so a line without
  # one, such as the bare number `getconf LONG_BIT` prints, is not a
  # variable with no value.
  pattern: '^(?P<name>[A-Z_][A-Z0-9_]*)(?:[ \t]+|$)(?P<value>.*?)[ \t]*$'
fields:
  name: {required: true}
  value: {null_if: [""]}
