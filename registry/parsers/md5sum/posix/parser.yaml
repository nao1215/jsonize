# The same format sha256sum prints, with a 32 digit digest. A checksum
# and a file name describes far too many reports for jz to claim it on
# its own, so this definition is used only when the parser is named
# (`jz --parser md5sum`, or `jz run md5sum`); the signature is still
# checked then, and the digest length is what keeps md5sum and sha256sum
# from reading each other's output.
#
# GNU and uutils print a name holding a backslash, a newline or a
# carriage return escaped, as "\\", "\n" and "\r", and put a
# backslash in front of the digest to say so. Such a name is decoded;
# escaped is true on its line and absent everywhere else. A line
# without the mark carries the name as it is: GNU and uutils mark every
# name they escape, and BusyBox escapes none. A newline that BusyBox
# prints as it is splits the line, and the second half is not a
# checksum line, so the text is refused.
# `md5sum --zero` ends a line with NUL and escapes nothing, and jz
# refuses text with NUL in it. `md5sum -c` prints a different format
# and is not read here.
format: 1
command: md5sum
variant: posix
aliases:
  # macOS installs GNU coreutils under a g prefix, and the g name prints
  # what the command prints.
  - name: gmd5sum
description: md5sum checksum lines
metadata:
  tags: [linux, darwin, checksum]
  compatible: [GNU coreutils, uutils coreutils, BusyBox]
  references:
    - https://man7.org/linux/man-pages/man1/md5sum.1.html
detect:
  auto_detect: false
  signature:
    all:
      # A name may begin with a space, so any character follows the mode.
      - '\A\\?[0-9a-fA-F]{32}[ \t][ *][^\n]'
parse:
  type: regex
  pattern: '^(?P<escaped>\\)?(?P<checksum>[0-9a-fA-F]{32})[ \t][ *](?P<file>.+)$'
fields:
  escaped: {type: bool, true_values: ["\\"], when_missing: omit}
  checksum: {required: true}
  # The three escapes are all the format writes, so another one on a
  # marked line is refused rather than guessed at.
  file: {required: true, unescape: {when: escaped, sequences: {'\\': '\', '\n': "\n", '\r': "\r"}}}
