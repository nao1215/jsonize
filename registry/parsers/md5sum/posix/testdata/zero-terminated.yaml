source: captured on Ubuntu 26.04 with GNU coreutils 9.7 (gnumd5sum), LC_ALL=C md5sum --zero over files made for the fixture
description: >
  --zero ends each line with NUL instead of a newline and escapes no
  name. Text with NUL in it is refused rather than read as one line.
os: linux
args: [--zero]
expect_error: NUL
