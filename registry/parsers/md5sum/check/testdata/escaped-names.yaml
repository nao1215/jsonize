description: A name holding a backslash and one holding a newline, which GNU coreutils prints escaped behind a leading backslash; both read back as the names they are.
source: captured on Ubuntu 26.04 with GNU coreutils 9.7 (gnusha256sum), LC_ALL=C sha256sum -c over a checksum file made for the fixture
os: linux
args: [-c, gnu.sha256]
