description: >-
  `kubectl get all -A` opens with the pod table, but the names carry a
  "pod/" prefix and four more tables follow under headers of their own,
  so the signature refuses it rather than reading the first table.
source: captured from kubectl v1.35.0 against a kind v1.35.0 cluster on Linux with LC_ALL=C; the cluster name in the node names was replaced by "example", padded to the printed width
os: linux
args: [get, all, -A]
expect_error: does not describe this input
