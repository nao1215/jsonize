description: >-
  Every namespace, so NAMESPACE leads the columns. Every RESTARTS cell
  carries the age of the last restart, and two pods are younger than the
  rest ("3d23h").
source: captured from kubectl v1.35.0 against a kind v1.35.0 cluster on Linux with LC_ALL=C; the cluster name in the node names was replaced by "example", padded to the printed width
os: linux
args: [get, pods, -A]
