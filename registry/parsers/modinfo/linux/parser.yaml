# modinfo prints one field per line, the label padded to sixteen columns.
# Several labels repeat: a module names as many aliases and as many
# parameters as it has, and the order they come in is the order the module
# declared them.
#
# So the fields are a list of name and value pairs, not one object. An
# object would have to answer what a repeated label means, and both
# answers are wrong: keeping the last alias throws the others away, and
# collecting every label into an array would give "license" a
# one-element array as well. A list keeps the repeats and the order, and
# it also survives the fact that which labels appear at all depends on
# the module -- a built-in module prints "file", one loaded from disk
# prints "vermagic" and the four sig_ fields instead.
#
# modinfo continues a value on lines indented by two tabs: the hex bytes
# of a signature, and a parameter description written over several lines
# (drm's debug parameter describes each bit on its own). A continuation
# line is not a field, so it is joined to the value it continues.
#
# The signature is not carried. Joined, it is only hex bytes, which the
# signer and sig_key lines already identify, and it is dropped whole.
format: 1
command: modinfo
variant: linux
description: modinfo module fields
metadata:
  tags: [linux, kernel, kmod]
  compatible: [kmod]
  references:
    - https://man7.org/linux/man-pages/man8/modinfo.8.html
detect:
  os: [linux]
  signature:
    all:
      # The text opens with the file or the name.
      - '\A(?:filename|name):[ \t]'
      # Every module prints a filename, padded to the sixteen-column
      # label field: "(builtin)" for a built-in module, a path for one
      # loaded from disk.
      - '^filename:[ \t]{2,}\S'
    any:
      # Which of the rest a module carries is up to the module. A driver
      # that loads firmware names every file before anything else, and
      # r8169 names 29, so firmware is what the first twenty lines show.
      - '^firmware:[ \t]{2,}\S'
      - '^license:[ \t]{2,}\S'
      - '^description:[ \t]{2,}\S'
      - '^vermagic:[ \t]{2,}\S'
      - '^alias:[ \t]{2,}\S'
input:
  fold: '^\t\t\S'
  ignore:
    # Stated to the end, so what is dropped is the signature and not a
    # line of another command's output that follows it.
    - '\Asignature:[ \t]+(?:[0-9A-F]{2}: ?)*[0-9A-F]{2}[ \t]*\z'
parse:
  type: regex
  # A label is a lower-case word, as the kernel's module macros name
  # them, and the padding follows its colon, so the pairs are read with a
  # pattern rather than as any text around a colon:
  # `c1:00.0 Ethernet controller: ...` from lspci has a colon too.
  pattern: '^(?P<name>[a-z][a-z0-9_]*):(?:[ \t]+|$)(?P<value>.*?)[ \t]*$'
