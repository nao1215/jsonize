# "key = value" pairs. Values keep their text: many are tab separated
# lists (net.ipv4.tcp_rmem) or paths, and a number here is not more
# useful than the string the kernel printed.
format: 1
command: sysctl
variant: linux
description: sysctl -a kernel parameters
metadata:
  tags: [linux, kernel, procps]
  compatible: [procps-ng, BusyBox]
  references:
    - https://man7.org/linux/man-pages/man8/sysctl.8.html
detect:
  os: [linux]
  args:
    any: ["-a", "--all", "-A"]
  signature:
    all:
      # Any dotted key with spaces around "=" is also a properties file
      # or a git config listing, so the first line has to start with one
      # of the kernel's own top-level names, not merely contain one.
      - '\A(?:kernel|net|vm|fs|dev|abi|debug|crypto|sunrpc)\.[a-z0-9_.]+ = '
parse:
  type: kv
  separator: " = "
  as: list
