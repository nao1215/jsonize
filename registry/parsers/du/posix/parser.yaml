format: 1
command: du
variant: posix
aliases:
  # macOS installs GNU coreutils under a g prefix, and the g name prints
  # what the command prints.
  - name: gdu
description: du output (tab separated size and path) on Linux, macOS and BusyBox
metadata:
  tags: [linux, darwin, filesystem]
  compatible: [GNU coreutils, BusyBox, macOS du]
  references:
    - https://man7.org/linux/man-pages/man1/du.1.html
# A number, a tab and a path is also the shape of `git diff --numstat`
# and of any other tab-separated report, so jz does not claim this format
# on its own: `jz --parser du` or `jz run du` says it is du output, and
# the signature then checks that the text really has that shape.
detect:
  auto_detect: false
  signature:
    window: 200
    all:
      # No du pads the count, so a report that right-aligns its first
      # cell into a column is something else: `git shortlog -s` writes
      # the commit count that way.
      - '\A\d+\t\S'
    # A size with a suffix is `du -h`, whose numbers are rounded and whose
    # variant is gnu-human. The first line of such a listing can still be
    # a plain count (a size below one kibibyte prints as "0"), so the whole
    # window is searched rather than the first line alone.
    none:
      # du prints two cells and never a third, so a line with a second
      # tab in it belongs to some other tab separated report:
      # `git diff --numstat` writes two counts before the path, and
      # `pactl list short sinks` writes an index, a name and three more
      # columns.
      - '^[^\t\n]*\t[^\t\n]*\t'
parse:
  type: table
  split: delimiter
  delimiter: "\t"
  header:
    none: true
    columns: [size, name]
fields:
  size: {type: int, required: true}
  name: {required: true}
