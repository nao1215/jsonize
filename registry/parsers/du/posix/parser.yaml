format: 1
command: du
variant: posix
description: du output (tab separated size and path) on Linux, macOS and BusyBox
metadata:
  tags: [linux, darwin, filesystem]
  compatible: [GNU coreutils, BusyBox, macOS du]
# A number, a tab and a path is also the shape of `git diff --numstat`
# and of any other tab-separated report, so jz does not claim this format
# on its own: `jz --parser du` or `jz run du` says it is du output, and
# the signature then checks that the text really has that shape.
detect:
  auto_detect: false
  signature:
    window: 200
    all:
      - '\A\s*\d+\t\S'
    # A size with a suffix is `du -h`, whose numbers are rounded and whose
    # variant is gnu-human. The first line of such a listing can still be
    # a plain count (a size below one kibibyte prints as "0"), so the whole
    # window is searched rather than the first line alone.
    none:
      - '^[\d.]+[KMGTPEZY]\t'
parse:
  type: table
  split: delimiter
  delimiter: "\t"
  header:
    none: true
    columns: [size, name]
fields:
  size: {type: int, required: true}
  name: {required: true}
