format: 1
command: du
variant: posix
aliases:
  # macOS installs GNU coreutils under a g prefix, and the g name prints
  # what the command prints.
  - name: gdu
description: du output (tab separated size and path) on Linux, macOS and BusyBox
metadata:
  tags: [linux, darwin, filesystem]
  compatible: [GNU coreutils, BusyBox, macOS du]
  references:
    - https://man7.org/linux/man-pages/man1/du.1.html
# A number, a tab and a path is also the shape of `git diff --numstat`
# and of any other tab-separated report, so jz does not claim this format
# on its own: `jz --parser du` or `jz run du` says it is du output, and
# the signature then checks that the text really has that shape.
detect:
  auto_detect: false
  signature:
    window: 200
    all:
      # A count, one tab, and a path that runs to the end of the line.
      # Two things follow from writing the whole line rather than its
      # opening. No du pads the count, so a report that right-aligns its
      # first cell into a column is something else (`git shortlog -s`);
      # and du prints two cells and never a third, so a tab separated
      # report with more of them is not this one (`git diff --numstat`,
      # `pactl list short sinks`).
      - '\A\d+\t[^\t\n]*$'
    none:
      # du -h prints an empty file as a plain 0, so a listing that names
      # one first opens with a line this signature fits; the rounded
      # sizes further down are du/gnu-human's.
      - '^[ \t]*[\d.]+[KMGTPEZY]\t'
parse:
  # Matched rather than split on the tab: a split trims its cells, and a
  # name that begins or ends with a space would lose it.
  type: regex
  pattern: '^(?P<size>\d+)\t(?P<name>[^\t]+)$'
fields:
  # size is in the unit du counted in, which the output does not show:
  # 1024-byte blocks by default for GNU and BusyBox, 512-byte blocks for
  # the BSD and macOS du, bytes with -b, and whatever -k, -m or
  # --block-size asked for.
  size: {type: int, required: true}
  name: {required: true}
