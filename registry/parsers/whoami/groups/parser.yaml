# `whoami /groups` on Windows prints the groups in the access token of
# the current user: a "GROUP INFORMATION" banner underlined with
# hyphens, then a table with a header and a rule of equals signs. The
# columns are as wide as their longest value, so the rows are cut where
# the header's words start; "Group Name" is one column.
#
# The type is one of the kinds of account Windows names there
# ("Well-known group", "Alias", "Group", "Label"), and the SID is the
# security identifier in its S-1- form. The attributes are a list
# separated by a comma and a space ("Mandatory group, Enabled by
# default, Enabled group"), and empty for the integrity label, which
# becomes null. The type and the SID are held to those shapes, which is
# what refuses a row of another table printed after the listing.
#
# whoami /priv prints a table of the same layout under another banner
# and is read by whoami/privileges.
format: 1
command: whoami
variant: groups
description: whoami /groups on Windows, the groups in the current user's access token
metadata:
  tags: [windows, user]
  compatible: [Windows]
  references:
    - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/whoami
detect:
  # In pipe mode the producing OS is unknown and this is skipped, so the
  # signature below has to say what the format is on its own.
  os: [windows]
  signature:
    all:
      # The banner, its underline and the header of the table.
      - '\AGROUP INFORMATION[ \t]*\n-+[ \t]*\n(?:[ \t]*\n)*Group Name[ \t]+Type[ \t]+SID[ \t]+Attributes[ \t]*\n=+ =+ =+ =+[ \t]*$'
input:
  ignore:
    # The banner, its underline and the rule under the header.
    - '^GROUP INFORMATION[ \t]*$'
    - '^-+[ \t]*$'
    - '^=+ =+ =+ =+[ \t]*$'
parse:
  type: table
  split: aligned
  header:
    columns: [group_name, type, sid, attributes]
fields:
  # A SID Windows cannot resolve is listed with no name and the type
  # Unknown SID type; the name is then null. The type and the SID are
  # always printed.
  group_name: {}
  type: {required: true, regex: '(?P<type>Well-known group|Alias|Group|Label|User|Computer|Domain|Unknown SID type)'}
  sid: {required: true, regex: '(?P<sid>S-1-\d+(?:-\d+)*)'}
  attributes:
    type: array
    split: ","
    items: {regex: '(?P<attributes>[A-Z][a-z]+(?: [a-z]+)*)'}
