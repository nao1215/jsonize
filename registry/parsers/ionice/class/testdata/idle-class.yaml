source: "captured on Ubuntu 26.04 (util-linux 2.41.3) with LC_ALL=C: ionice -c 3 sh -c 'ionice -p $$ 1'"
os: linux
description: "The idle class carries no priority, so that line is the class name alone. Two pids print two lines, which is also why the pid cannot be recovered: ionice does not print it. The arguments are not recorded because the shell's pid is not reproducible."
