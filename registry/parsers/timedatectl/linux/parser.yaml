# systemd prints aligned "Label: value" lines. The labels contain spaces,
# so the keys are the labels with the spaces replaced, and the booleans
# systemd spells yes/no become real booleans.
format: 1
command: timedatectl
variant: linux
description: timedatectl clock and time zone status
metadata:
  tags: [linux, systemd, time]
  compatible: [systemd]
  references:
    - https://www.freedesktop.org/software/systemd/man/timedatectl.html
detect:
  os: [linux]
  signature:
    all:
      # The text opens with the local time.
      - '\A[ \t]*Local time: '
      - '^\s*Local time: '
      - '^\s*Time zone: '
parse:
  type: regex
  each: input
  pattern: '(?s)\A\s*Local time: (?P<local_time>[^\n]+)\n\s*Universal time: (?P<universal_time>[^\n]+)\n(?:\s*RTC time: (?P<rtc_time>[^\n]+)\n)?\s*Time zone: (?P<time_zone>[^\n]+)\n\s*System clock synchronized: (?P<system_clock_synchronized>\S+)\n\s*NTP service: (?P<ntp_service>\S+)\n\s*RTC in local TZ: (?P<rtc_in_local_tz>\S+)'
fields:
  # The local clock is stated in a zone abbreviation, which names a
  # different offset in different parts of the world. It stays the string
  # it was printed as until --assume-zone gives that abbreviation an
  # offset; the universal clock says UTC and needs nothing.
  local_time: {type: time, layout: "Mon 2006-01-02 15:04:05 MST", required: true}
  universal_time: {type: time, layout: "Mon 2006-01-02 15:04:05 MST", required: true}
  # The hardware clock is printed with no zone at all, and timedatectl
  # reports it in UTC.
  rtc_time: {type: time, layout: "Mon 2006-01-02 15:04:05", when_missing: omit}
  time_zone: {required: true}
  system_clock_synchronized: {type: bool}
  rtc_in_local_tz: {type: bool}
