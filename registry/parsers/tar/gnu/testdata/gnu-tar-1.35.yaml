description: |
  A throwaway archive built for this fixture: directories, an empty
  member, a symbolic link, a name with a space, and a member nine
  directories deep with a long leaf name. Owner and group were set to
  alice with --owner/--group. The capture also listed a name with a
  backslash and a Japanese name, which tar printed escaped; those two
  lines were taken out when escaped names became refused, and
  escaped-names and octal-name hold that case.
source: captured on Ubuntu 26.04 with GNU tar 1.35, LC_ALL=C tar -tvf
os: linux
args: [-tvf]
