# `tar -tvf` prints a listing close to `ls -l`, with two differences that
# matter here: the owner and the group are one owner/group cell, and the
# timestamp is ISO (2026-01-15 09:30). GNU tar prints minutes only unless
# --full-time is given; BusyBox tar prints seconds, which is what
# separates this definition from tar/busybox.
#
# Two patterns rather than one: only a member whose mode starts with l is
# a symbolic link, so " -> " is a target separator there and an ordinary
# part of the name everywhere else.
#
# GNU tar quotes a name by its --quoting-style, and the text does not say
# which style that was. The default writes a backslash as "\\", a newline
# as "\n" and, under LC_ALL=C, a non-ASCII byte in octal; the literal
# style writes them as they are; the others put the name in quotes. A
# backslash, or a quote at the start, therefore means two names at once,
# and such a name is refused rather than decoded by guess. A name tar
# leaves alone is the name. Run tar in a UTF-8 locale (`jz run
# --keep-locale`) to get non-ASCII names as they are.
#
# The size of a device member is printed as major,minor rather than a
# byte count and is not read here.
format: 1
command: tar
variant: gnu
aliases:
  # GNU tar is installed as gtar where the system tar is the BSD one.
  - name: gtar
description: GNU tar -tvf archive listing
metadata:
  tags: [linux, darwin, archive]
  compatible: [GNU tar]
  references:
    - https://www.gnu.org/software/tar/manual/tar.html
detect:
  signature:
    all:
      - '^[-dlcbps][-rwxsStT]{9}[ \t]+[^ \t/]*/[^ \t]*[ \t]+\d+[ \t]+\d{4}-\d{2}-\d{2}[ \t]+\d{2}:\d{2}[ \t]'
parse:
  type: regex
  patterns:
    - '^(?P<mode>l[-rwxsStT]{9})[ \t]+(?P<owner>[^ \t/]*)/(?P<group>[^ \t]*)[ \t]+(?P<size>\d+)[ \t]+(?P<date>\d{4}-\d{2}-\d{2})[ \t]+(?P<time>\d{2}:\d{2}) (?P<name>.+?) -> (?P<link_to>.+)$'
    - '^(?P<mode>[-dlcbps][-rwxsStT]{9})[ \t]+(?P<owner>[^ \t/]*)/(?P<group>[^ \t]*)[ \t]+(?P<size>\d+)[ \t]+(?P<date>\d{4}-\d{2}-\d{2})[ \t]+(?P<time>\d{2}:\d{2}) (?P<name>.+)$'
fields:
  size: {type: int, required: true}
  name: {required: true, regex: '(?P<name>[^\\''"‘][^\\]*)'}
  # The pattern splits at the first " -> ", so any other one is in the
  # target, and then the text says two things: the name may hold one as
  # well as the target. So may a target that starts with "-> ", where two
  # arrows share a space. Such a line is refused rather than read either
  # way, and so is a target tar quoted or escaped, as a name is.
  link_to: {when_missing: omit, regex: '(?P<link_to>(?: |- )*(?:(?:[^ \\''"‘-]|-[^ >\\]|->[^ \\])(?:[^ \\]| (?: |- )*(?:[^ \\-]|-[^ >\\]|->[^ \\]))*(?: (?: |- )*(?:-|->)?)?|-|->)?)'}
