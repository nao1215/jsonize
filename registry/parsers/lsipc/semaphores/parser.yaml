# `lsipc -s` prints one row per System V semaphore set: the key, the
# id, the permissions, the owner and how many semaphores the set holds.
# No cell holds a space, so the cells are cut at whitespace. When there
# is no set lsipc prints nothing at all, not even the header; `jz run`
# reports that as an empty list, and the empty text on a pipe is
# refused as holding nothing to read.
#
# -t adds time columns, -c the creator columns and -i turns the listing
# into one set's labelled properties and a table of its elements; all
# three change the header and are refused.
format: 1
command: lsipc
variant: semaphores
description: lsipc -s, the System V semaphore sets
metadata:
  tags: [linux, ipc, util-linux]
  compatible: [util-linux]
  references:
    - https://man7.org/linux/man-pages/man1/lsipc.1.html
detect:
  os: [linux]
  args:
    any: ["-s", "--semaphores"]
  signature:
    all:
      # The header, then nothing but rows that open with a hexadecimal
      # key and a numeric id and end with a count.
      - '\AKEY[ \t]+ID[ \t]+PERMS[ \t]+OWNER[ \t]+NSEMS[ \t]*\n(?:0x[0-9a-f]+[ \t]+[0-9]+[ \t]+\S+[ \t]+\S+[ \t]+[0-9]+[ \t]*(?:\n|\z))+\z'
parse:
  type: table
  split: whitespace
fields:
  key: {required: true}
  id: {type: int, required: true}
  perms: {required: true}
  owner: {required: true}
  nsems: {type: int, required: true}
