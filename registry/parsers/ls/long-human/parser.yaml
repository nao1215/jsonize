format: 1
command: ls
variant: long-human
description: ls -lh long listing with human readable sizes (normalised to bytes)
metadata:
  tags: [linux, darwin, filesystem]
  compatible: [GNU coreutils, macOS ls]
detect:
  args:
    any: ["-h", "--human-readable", "-lh", "-alh", "-lah"]
  signature:
    all:
      - '^[-dlcbps][-rwxsStT]{9}[.+@]?\s+\d+\s+\S+\s+\S+\s+[\d.]+[KMGTPB]\s+\w{3}\s+\d{1,2}\s+'
input:
  ignore:
    - '^total '
parse:
  type: regex
  pattern: '^(?P<flags>[-dlcbps][-rwxsStT]{9}[.+@]?)\s+(?P<links>\d+)\s+(?P<owner>\S+)\s+(?P<group>\S+)\s+(?P<size>[\d.]+[KMGTPB]?)\s+(?P<date>\w{3}\s+\d{1,2}\s+(?:\d{2}:\d{2}|\d{4}))\s+(?P<filename>.+?)(?: -> (?P<link_to>.+))?$'
fields:
  links: {type: int}
  size: {type: size}
  link_to: {when_missing: omit}
