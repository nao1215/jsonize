# `ls -lR`, and `ls -l` given more than one directory, print one block
# per directory: the directory's path and a colon, the total, then the
# long listing of what is in it. The blocks are records, and each entry
# is read the way ls/long reads a line.
#
# The heading is the hard part. A file whose name ends with a colon
# prints a line that also ends with one, and taking that line for a
# heading would file the entries under a directory that does not exist.
# So a heading is a line ending with a colon that does not open the way
# an entry does: ten mode characters followed by a blank, with an
# optional ".", "+" or "@" between them. The expression says that
# without a look-ahead, which is why it lists where the first character
# that breaks the mode may be. A directory whose own name opens like a
# mode line is refused rather than misread.
#
# The total is left out, as ls/long leaves it out: it counts blocks in a
# unit the output does not name.
format: 1
command: ls
variant: long-recursive
aliases:
  # The same two names ls/long answers to: gls is GNU ls on macOS, and
  # vdir is ls -l under another name, so it needs no flag.
  - name: gls
  - name: vdir
    args: {none: ["-F", "-p", "--classify", "--classify=always", "--file-type", "--indicator-style=slash", "--indicator-style=file-type", "--indicator-style=classify"]}
description: ls -lR, or ls -l given several directories, as one record per directory
metadata:
  tags: [linux, filesystem]
  compatible: [GNU coreutils, uutils coreutils, BusyBox]
  references:
    - https://pubs.opengroup.org/onlinepubs/9699919799/utilities/ls.html
detect:
  args:
    any: ["-l", "--format=long", "--format=verbose"]
    # A mark after each name (-F, -p) is not part of the name; see ls/long.
    none: ["-F", "-p", "--classify", "--classify=always", "--file-type", "--indicator-style=slash", "--indicator-style=file-type", "--indicator-style=classify"]
  signature:
    all:
      # The output opens with a heading and the total under it.
      - '\A(?:[-dlcbps][-rwxsStT]{0,9}[.+@]?:|(?:[^-dlcbps\n]|[-dlcbps][-rwxsStT]{0,8}[^-rwxsStT\n]|[-dlcbps][-rwxsStT]{9}(?:[^.+@ \t\n]|[.+@][^ \t\n]))[^\n]*:)\ntotal [0-9.,]+[KMGTPEZYkB]*$'
input:
  ignore:
    - '^total [0-9.,]+[KMGTPEZYkB]*$'
parse:
  type: records
  start: '^(?:[-dlcbps][-rwxsStT]{0,9}[.+@]?:|(?:[^-dlcbps]|[-dlcbps][-rwxsStT]{0,8}[^-rwxsStT]|[-dlcbps][-rwxsStT]{9}(?:[^.+@ \t]|[.+@][^ \t])).*:)$'
  parts:
    - name: directory
      select: {limit: 1}
      parse:
        type: regex
        each: input
        pattern: '\A(?P<path>.+):\z'
      fields:
        path: {required: true}
    - name: entries
      select: {skip: 1}
      parse:
        type: regex
        patterns:
          - '^(?P<flags>l[-rwxsStT]{9}[.+@]?)\s+(?P<links>\d+)\s+(?P<owner>\S+)\s+(?P<group>\S+)\s+(?P<size>[\d.]+[kKMGTPEZYRQBi]*)\s+(?P<date>\w{3}\s+\d{1,2}\s+(?:\d{2}:\d{2}|\d{4}))\s+(?P<filename>.+?) -> (?P<link_to>.+)$'
          - '^(?P<flags>[-dlcbps][-rwxsStT]{9}[.+@]?)\s+(?P<links>\d+)\s+(?P<owner>\S+)\s+(?P<group>\S+)\s+(?P<size>[\d.]+[kKMGTPEZYRQBi]*)\s+(?P<date>\w{3}\s+\d{1,2}\s+(?:\d{2}:\d{2}|\d{4}))\s+(?P<filename>.*[^/])$'
      fields:
        links: {type: int, required: true}
        size: {required: true}
        filename: {required: true}
        link_to: {when_missing: omit}
