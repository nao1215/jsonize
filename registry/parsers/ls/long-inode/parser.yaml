# `ls -li` is the long listing with the inode number in front of the
# mode. A line of `ls -l` starts with the mode and a line here starts with
# a number, so those two never see each other's output, but `ls -ls`
# prints a block count in that same position and is the same shape down to
# the character. Nothing in the text says whether the leading number
# counts inodes or blocks, so the text is not evidence on its own: this
# definition is used only when the parser is named, and `jz run` picks it
# only when -i asked for inodes and -s did not ask for blocks. A piped
# listing is refused rather than guessed at.
#
# The size is reported exactly as printed ("4096" or "4.0K") for the same
# reason as in ls/long: a -h size is rounded and its base is not visible.
#
# The inode column is right-aligned to the widest number in the listing,
# so most lines begin with spaces. Only a directory whose inodes are all
# the same width starts every line at the first column.
format: 1
command: ls
variant: long-inode
aliases:
  # macOS installs GNU coreutils under a g prefix, and the g name prints
  # what the command prints.
  - name: gls
description: ls -li long listing with the inode number
metadata:
  tags: [linux, darwin, filesystem]
  compatible: [GNU coreutils, macOS ls, BusyBox]
  references:
    - https://pubs.opengroup.org/onlinepubs/9699919799/utilities/ls.html
detect:
  # A leading number in front of the mode is what `ls -ls` prints too,
  # and it counts blocks there; the permission string after it says the
  # line is an ls listing but not which of the two options wrote it, so
  # the text is not evidence on its own.
  auto_detect: false
  args:
    any: ["-i", "--inode"]
    # -s adds a column; -F and the rest mark each name, and -Z and
    # --author paired with -g, -o or -G print two names under other
    # meanings, all of which ls/long explains.
    # Quoting and escaping change the names this reads: a name comes
    # back with the quotes or the escapes in it.
    # macOS ls -e prints an entry's access control list on the lines
    # under it and -O adds its file flags as a column; neither is read.
    none: ["-e", "-O", "-s", "--size", "-F", "-p", "--classify", "--classify=always", "--file-type", "--indicator-style=slash", "--indicator-style=file-type", "--indicator-style=classify", "-Z", "--context", "--author", "-Q", "--quote-name", "--quoting-style", "--quoting-style=shell", "--quoting-style=shell-always", "--quoting-style=shell-escape", "--quoting-style=shell-escape-always", "--quoting-style=c", "--quoting-style=escape", "--quoting-style=locale", "--quoting-style=clocale", "-b", "--escape", "-q", "--hide-control-chars"]
  signature:
    all:
      - '(?m)^[ \t]*\d+\s+(?:[-dlps][-rwxsStT]{9}[.+@]?\s+\d+\s+\S+\s+[^\s:?][^\s:]*\s+[\d.]+[kKMGTPEZYRQBi]*|[cb][-rwxsStT]{9}[.+@]?\s+\d+\s+\S+\s+[^\s:?][^\s:]*\s+\d+,\s*\d+)\s+\w{3}\s+\d{1,2}\s+'
exec:
  env:
    # GNU ls quotes names in the style QUOTING_STYLE names, which a
    # user's shell profile may set; literal is what it prints to a pipe
    # without it. BSD ls does not read the variable.
    QUOTING_STYLE: literal
input:
  ignore:
    - '^total\s'
parse:
  type: regex
  # A device file has major and minor numbers where the size goes, which
  # ls/long explains.
  patterns:
    - '^[ \t]*(?P<inode>\d+)\s+(?P<flags>l[-rwxsStT]{9}[.+@]?)\s+(?P<links>\d+)\s+(?P<owner>\S+)\s+(?P<group>[^\s:?][^\s:]*)\s+(?P<size>[\d.]+[kKMGTPEZYRQBi]*)\s+(?P<date>\w{3}\s+\d{1,2}\s+(?:\d{2}:\d{2}|\d{4})) (?P<filename>.+?) -> (?P<link_to>.+)$'
    - '^[ \t]*(?P<inode>\d+)\s+(?P<flags>[cb][-rwxsStT]{9}[.+@]?)\s+(?P<links>\d+)\s+(?P<owner>\S+)\s+(?P<group>[^\s:?][^\s:]*)\s+(?P<major>\d+),\s*(?P<minor>\d+)\s+(?P<date>\w{3}\s+\d{1,2}\s+(?:\d{2}:\d{2}|\d{4})) (?P<filename>.*[^/])$'
    - '^[ \t]*(?P<inode>\d+)\s+(?P<flags>[-dlps][-rwxsStT]{9}[.+@]?)\s+(?P<links>\d+)\s+(?P<owner>\S+)\s+(?P<group>[^\s:?][^\s:]*)\s+(?P<size>[\d.]+[kKMGTPEZYRQBi]*)\s+(?P<date>\w{3}\s+\d{1,2}\s+(?:\d{2}:\d{2}|\d{4})) (?P<filename>.*[^/])$'
fields:
  inode: {type: int, required: true}
  links: {type: int, required: true}
  major: {type: int}
  minor: {type: int}
  filename: {required: true}
  # The pattern splits at the first " -> ", so any other one is in the
  # target, and then the text says two things: the name may hold one as
  # well as the target. So may a target that starts with "-> ", where two
  # arrows share a space. Such a line is refused rather than read either
  # way.
  link_to: {when_missing: omit, regex: '(?P<link_to>(?: |- )*(?:(?:[^ -]|-[^ >]|->[^ ])(?:[^ ]| (?: |- )*(?:[^ -]|-[^ >]|->[^ ]))*(?: (?: |- )*(?:-|->)?)?|-|->)?)'}
