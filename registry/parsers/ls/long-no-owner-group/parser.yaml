# `ls -og` is the long listing with both the owner and the group column
# dropped, which leaves the size where a plain long listing prints a user
# name. That missing pair of columns is the whole difference and it is
# visible in every line, so no argument filter is needed.
#
# `ls -o` and `ls -g` each drop one of the two columns and print the same
# five columns as each other; nothing in the text says whether the name
# that remains is the owner or the group, so neither has a definition.
format: 1
command: ls
variant: long-no-owner-group
aliases:
  # macOS installs GNU coreutils under a g prefix, and the g name prints
  # what the command prints.
  - name: gls
description: ls -og long listing without the owner and group columns
metadata:
  tags: [linux, darwin, filesystem]
  compatible: [GNU coreutils, macOS ls]
  references:
    - https://pubs.opengroup.org/onlinepubs/9699919799/utilities/ls.html
detect:
  args:
    # A mark after each name (-F, -p) is not part of the name; see ls/long.
    # Quoting and escaping change the names this reads: a name comes
    # back with the quotes or the escapes in it.
    # macOS ls -e prints an entry's access control list on the lines
    # under it and -O adds its file flags as a column; neither is read.
    none: ["-e", "-O", "-F", "-p", "--classify", "--classify=always", "--file-type", "--indicator-style=slash", "--indicator-style=file-type", "--indicator-style=classify", "-Q", "--quote-name", "--quoting-style", "--quoting-style=shell", "--quoting-style=shell-always", "--quoting-style=shell-escape", "--quoting-style=shell-escape-always", "--quoting-style=c", "--quoting-style=escape", "--quoting-style=locale", "--quoting-style=clocale", "-b", "--escape", "-q", "--hide-control-chars"]
  signature:
    all:
      # The text opens with the total, or with an entry where there is none.
      - '\A(?:total [^\n]*$|[-dlcbps][-rwxsStT]{9})'
      - '^[-dlcbps][-rwxsStT]{9}[.+@]?\s+\d+\s+(?:[\d.]+[kKMGTPEZYRQBi]*|\d+,\s*\d+)\s+\w{3}\s+\d{1,2}\s+(?:\d{2}:\d{2}|\d{4})\s+\S'
exec:
  env:
    # GNU ls quotes names in the style QUOTING_STYLE names, which a
    # user's shell profile may set; literal is what it prints to a pipe
    # without it. BSD ls does not read the variable.
    QUOTING_STYLE: literal
input:
  ignore:
    - '^total\s'
parse:
  type: regex
  # A device file has major and minor numbers where the size goes, which
  # ls/long explains.
  patterns:
    - '^(?P<flags>l[-rwxsStT]{9}[.+@]?)\s+(?P<links>\d+)\s+(?P<size>[\d.]+[kKMGTPEZYRQBi]*)\s+(?P<date>\w{3}\s+\d{1,2}\s+(?:\d{2}:\d{2}|\d{4})) (?P<filename>.+?) -> (?P<link_to>.+)$'
    - '^(?P<flags>[cb][-rwxsStT]{9}[.+@]?)\s+(?P<links>\d+)\s+(?P<major>\d+),\s*(?P<minor>\d+)\s+(?P<date>\w{3}\s+\d{1,2}\s+(?:\d{2}:\d{2}|\d{4})) (?P<filename>.*[^/])$'
    - '^(?P<flags>[-dlcbps][-rwxsStT]{9}[.+@]?)\s+(?P<links>\d+)\s+(?P<size>[\d.]+[kKMGTPEZYRQBi]*)\s+(?P<date>\w{3}\s+\d{1,2}\s+(?:\d{2}:\d{2}|\d{4})) (?P<filename>.*[^/])$'
fields:
  links: {type: int, required: true}
  major: {type: int}
  minor: {type: int}
  filename: {required: true}
  # The pattern splits at the first " -> ", so any other one is in the
  # target, and then the text says two things: the name may hold one as
  # well as the target. So may a target that starts with "-> ", where two
  # arrows share a space. Such a line is refused rather than read either
  # way.
  link_to: {when_missing: omit, regex: '(?P<link_to>(?: |- )*(?:(?:[^ -]|-[^ >]|->[^ ])(?:[^ ]| (?: |- )*(?:[^ -]|-[^ >]|->[^ ]))*(?: (?: |- )*(?:-|->)?)?|-|->)?)'}
