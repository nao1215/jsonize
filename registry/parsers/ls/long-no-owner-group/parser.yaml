# `ls -og` is the long listing with both the owner and the group column
# dropped, which leaves the size where a plain long listing prints a user
# name. That missing pair of columns is the whole difference and it is
# visible in every line, so no argument filter is needed.
#
# `ls -o` and `ls -g` each drop one of the two columns and print the same
# five columns as each other; nothing in the text says whether the name
# that remains is the owner or the group, so neither has a definition.
format: 1
command: ls
variant: long-no-owner-group
aliases:
  # macOS installs GNU coreutils under a g prefix, and the g name prints
  # what the command prints.
  - name: gls
description: ls -og long listing without the owner and group columns
metadata:
  tags: [linux, darwin, filesystem]
  compatible: [GNU coreutils, macOS ls]
  references:
    - https://pubs.opengroup.org/onlinepubs/9699919799/utilities/ls.html
detect:
  args:
    # A mark after each name (-F, -p) is not part of the name; see ls/long.
    none: ["-F", "-p", "--classify", "--classify=always", "--file-type", "--indicator-style=slash", "--indicator-style=file-type", "--indicator-style=classify"]
  signature:
    all:
      - '^[-dlcbps][-rwxsStT]{9}[.+@]?\s+\d+\s+[\d.]+[KMGTPBi]*\s+\w{3}\s+\d{1,2}\s+(?:\d{2}:\d{2}|\d{4})\s+\S'
input:
  ignore:
    - '^total\s'
parse:
  type: regex
  patterns:
    - '^(?P<flags>l[-rwxsStT]{9}[.+@]?)\s+(?P<links>\d+)\s+(?P<size>[\d.]+[KMGTPBi]*)\s+(?P<date>\w{3}\s+\d{1,2}\s+(?:\d{2}:\d{2}|\d{4}))\s+(?P<filename>.+?) -> (?P<link_to>.+)$'
    - '^(?P<flags>[-dlcbps][-rwxsStT]{9}[.+@]?)\s+(?P<links>\d+)\s+(?P<size>[\d.]+[KMGTPBi]*)\s+(?P<date>\w{3}\s+\d{1,2}\s+(?:\d{2}:\d{2}|\d{4}))\s+(?P<filename>.*[^/])$'
fields:
  links: {type: int, required: true}
  size: {required: true}
  filename: {required: true}
  link_to: {when_missing: omit}
