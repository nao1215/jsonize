# `rustc -vV` (--version --verbose) prints the version line, then one
# "key: value" line each for the binary, the commit it was built from,
# the host triple, the release and the LLVM it uses. The version line is
# read into the version, the short commit and the date it states; the
# rest is kept as a map under the keys rustc printed, since a toolchain
# built without LLVM or from a source tarball leaves some of them out or
# prints "unknown".
format: 1
command: rustc
variant: verbose-version
description: rustc -vV, the version, commit, host and LLVM of the compiler
metadata:
  tags: [development, rust, toolchain]
  compatible: [rustc]
  references:
    - https://doc.rust-lang.org/rustc/command-line-arguments.html
detect:
  args:
    any: ["-vV", "-Vv"]
  signature:
    all:
      - '\Arustc [0-9]+\.[0-9]+\.[0-9]+\S* \([^)\n]+\)\nbinary: rustc$'
parse:
  type: composite
  parts:
    - name: version
      select: {limit: 1}
      parse:
        type: regex
        each: input
        pattern: '\Arustc (?P<version>[0-9]+\.[0-9]+\.[0-9]+\S*) \((?P<commit>[0-9a-f]+|[^ )]+) (?P<date>[0-9]{4}-[0-9]{2}-[0-9]{2})\)\z'
    - name: details
      select: {skip: 1}
      parse:
        type: kv
        separator: ": "
        as: map
