# `taskset -pc` reports one process and puts the pid inside the sentence
# rather than in a column. Setting an affinity prints the list twice, the
# value before the change and the value after it, so the second line is
# there only when the command changed something.
#
# A CPU list is a set written with ranges ("0-31", "0,2,4"), so it stays
# the string it was printed as.
format: 1
command: taskset
variant: affinity-list
description: taskset -pc CPU affinity list of a process
metadata:
  tags: [linux, process, scheduling, util-linux]
  compatible: [util-linux]
  references:
    - https://man7.org/linux/man-pages/man1/taskset.1.html
detect:
  os: [linux]
  signature:
    all:
      # Without -c the same command prints "affinity mask: ffffffff",
      # a bit field rather than a list, which is a different format.
      # `chrt -p` opens with the same "pid N's current " words, so the
      # noun after them is what tells the two apart.
      - '\Apid \d+''s current affinity list: [0-9]'
parse:
  type: regex
  each: input
  patterns:
    - '\Apid (?P<pid>\d+)''s current affinity list: (?P<affinity_list>[^\n]+)\npid \d+''s new affinity list: (?P<new_affinity_list>[^\n]+?)[ \t]*\z'
    - '\Apid (?P<pid>\d+)''s current affinity list: (?P<affinity_list>[^\n]+?)[ \t]*\z'
fields:
  pid: {type: int}
  affinity_list: {required: true}
