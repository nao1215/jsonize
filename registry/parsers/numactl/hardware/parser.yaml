# `numactl --hardware` prints a count of the memory nodes, then three
# lines about each node, then a distance matrix.
#
# The three lines per node repeat, so they are a records part inside the
# composite. The matrix header names the columns with node numbers rather
# than with column names, so it is dropped and each row keeps its
# distances as a list in column order.
#
# The sizes are printed in whole megabytes and are exact, so they are
# numbers; the unit is on the line rather than in the value, and is left
# out of the JSON the way every other exact number in the registry is.
#
# The size and free lines repeat the node number, and it is not read
# there: the record the three lines belong to is opened by the cpus
# line, which is where the number comes from. RE2 has no backreference,
# so the definition cannot say that the two are the same number.
format: 1
command: numactl
variant: hardware
description: numactl --hardware memory nodes and distances
metadata:
  tags: [linux, memory, numa]
  compatible: [numactl]
  references:
    - https://man7.org/linux/man-pages/man8/numactl.8.html
detect:
  os: [linux]
  signature:
    all:
      - '\Aavailable: \d+ nodes? \('
      - '^node distances:[ \t]*$'
input:
  ignore:
    # The header of the distance matrix, which is the word node followed
    # by the node numbers. A per-node line has a word after the number.
    - '^node(?:[ \t]+\d+)+[ \t]*$'
parse:
  type: composite
  parts:
    - name: available
      select: {limit: 1}
      parse:
        type: regex
        each: input
        pattern: '\Aavailable: (?P<count>\d+) nodes? \((?P<nodes>[^)]*)\)'
      fields:
        count: {type: int, required: true}
        nodes: {type: array, split_regex: '[ \t,]+', items: {type: int}}
    - name: nodes
      select: {after: '\Aavailable:', until: '^node distances:'}
      parse:
        type: records
        start: '^node \d+ cpus:'
        parts:
          - name: cpus
            select: {limit: 1}
            parse:
              type: regex
              each: input
              pattern: '^node (?P<node>\d+) cpus:[ \t]*(?P<cpus>.*?)[ \t]*$'
            fields:
              node: {type: int, required: true}
              cpus: {type: array, split_regex: '[ \t]+', items: {type: int}}
          - name: memory
            select: {skip: 1}
            parse:
              type: regex
              pattern: '^node \d+ (?P<name>size|free): (?P<megabytes>\d+) MB[ \t]*$'
            fields:
              megabytes: {type: int}
    - name: distances
      select: {after: '^node distances:'}
      parse:
        type: regex
        pattern: '^[ \t]*(?P<node>\d+):[ \t]*(?P<distances>.*?)[ \t]*$'
      fields:
        node: {type: int, required: true}
        distances: {type: array, split_regex: '[ \t]+', items: {type: int}}
