# `numactl --hardware` prints how many NUMA nodes the machine has, a
# block of facts per node, and a distance matrix. The per-node lines all
# start with "node N", so they are read as one list rather than as a
# block per node: which of them a kernel prints varies, and a list of
# what was printed says that without claiming a shape.
format: 1
command: numactl
variant: hardware
description: numactl --hardware, NUMA nodes and the distances between them
metadata:
  tags: [linux, memory, numa]
  compatible: [numactl]
  references:
    - https://man7.org/linux/man-pages/man8/numactl.8.html
detect:
  os: [linux]
  args:
    any: ["--hardware", "-H"]
  signature:
    all:
      - '\Aavailable: [0-9]+ nodes '
      - '^node [0-9]+ cpus:'
parse:
  type: composite
  parts:
    - name: available
      select: {limit: 1}
      parse:
        type: regex
        each: input
        pattern: '\Aavailable: (?P<nodes>[0-9]+) nodes \((?P<node_ids>[^)]*)\)[ \t]*\z'
      fields:
        nodes: {type: int}
    # The value is left as printed: a cpu list is a list of numbers, a
    # size is a number and its unit, and one key cannot be both.
    - name: node
      select: {after: '^available:'}
      ignore: ['^node distances:', '^node[ \t]+[0-9 \t]*$', '^[ \t]*[0-9]+:']
      parse:
        type: regex
        pattern: '^node (?P<node>[0-9]+) (?P<key>\S+):[ \t]*(?P<value>.*?)[ \t]*$'
      fields:
        node: {type: int, required: true}
    # The matrix is one row per node, and the row is the distance to each
    # node in the order the header names them.
    - name: distances
      select: {after: '^node distances:'}
      ignore: ['^node[ \t]+[0-9 \t]*$']
      parse:
        type: regex
        pattern: '^[ \t]*(?P<node>[0-9]+):[ \t]+(?P<to>[0-9 \t]+?)[ \t]*$'
      fields:
        node: {type: int}
        to: {type: array, split_regex: '[ \t]+', items: {type: int}}
