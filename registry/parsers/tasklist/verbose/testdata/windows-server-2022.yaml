description: >-
  tasklist /v for the svchost.exe processes run for real on Windows
  Server 2022, the same columns and widths as on 2025.
source: >-
  captured on GitHub Actions windows-2022 (Windows Server 2022, build
  20348.5499) on 2026-09-15 with
  `cmd /c "tasklist /v /fi "IMAGENAME eq svchost.exe" 2>&1"` from
  PowerShell, written with WriteAllLines (CRLF line endings, the blank
  line above the header as the command wrote it). The host name and the
  account name in the User Name column were replaced with examplehost02
  and user, padded with spaces to the column's width.
os: windows
args: ["/v", "/fi", "IMAGENAME eq svchost.exe"]
