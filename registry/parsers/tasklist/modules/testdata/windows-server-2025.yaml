description: >-
  tasklist /m for one process run for real on Windows Server 2025: the
  modules of lsass.exe, a list that runs over dozens of continuation
  lines.
source: >-
  captured on GitHub Actions windows-latest (Windows Server 2025, build
  26100.33296) on 2026-09-15 with
  `cmd /c "tasklist /m /fi "IMAGENAME eq lsass.exe" 2>&1"` from
  PowerShell, written with WriteAllLines (CRLF line endings, the blank
  line above the header as the command wrote it). Nothing was replaced:
  the listing names no user, host or address.
os: windows
args: ["/m", "/fi", "IMAGENAME eq lsass.exe"]
