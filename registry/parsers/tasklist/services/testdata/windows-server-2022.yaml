description: >-
  tasklist /svc run for real on Windows Server 2022, the same layout as
  on 2025; the service list of SMSvcHost.exe breaks after a comma and
  continues with one name on the next line.
source: >-
  captured on GitHub Actions windows-2022 (Windows Server 2022, build
  20348.5499) on 2026-09-15 with `cmd /c "tasklist /svc 2>&1"` from
  PowerShell, written with WriteAllLines (CRLF line endings, the blank
  line above the header as the command wrote it). Nothing was replaced:
  the listing names no user, host or address.
os: windows
args: ["/svc"]
