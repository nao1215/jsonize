description: >-
  tasklist /fo list for one process run for real on Windows Server 2022,
  the same labels and padding as on 2025 with a three-digit process id.
source: >-
  captured on GitHub Actions windows-2022 (Windows Server 2022, build
  20348.5499) on 2026-09-15 with
  `cmd /c "tasklist /fo list /fi "IMAGENAME eq lsass.exe" 2>&1"` from
  PowerShell, written with WriteAllLines (CRLF line endings, the blank
  line above the block as the command wrote it). Nothing was replaced.
os: windows
args: ["/fo", "list", "/fi", "IMAGENAME eq lsass.exe"]
