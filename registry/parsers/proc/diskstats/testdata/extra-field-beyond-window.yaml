description: |
  A twenty-first field on a row past the signature window, which the
  signature never sees. The parser counts the fields of every row, so the
  row is refused for being wider than the format's columns rather than
  read with the extra field folded into the last counter.

  Before max_fields was set, the refusal came from the type of the last
  column: the extra field landed in flush_ms and failed to convert to an
  integer. A table whose last column were text would have taken it
  silently.
expect_error: 'expected at most 20 fields but found 21'
os: linux
source: |
  synthetic; 204 rows of padding to run past the 200-line window, then
  one row of twenty-one fields.
