# /proc/<pid>/limits is a four column table of the resource limits the
# process runs under: the name of the limit, its soft and hard value,
# and the unit they are counted in.
#
# The columns are fixed widths ("%-25s %-20s %-20s %-10s") and the name
# of a limit holds spaces, so the row is cut where the header words
# start. Two of the headings are two words ("Soft Limit", "Hard Limit"),
# and naming those columns soft_limit and hard_limit makes each one
# column.
#
# A value is a decimal or the word unlimited, so both stay the text that
# was printed rather than becoming a number that has to encode "no
# limit" somehow, which is the same choice the ulimit definitions make.
#
# The unit is null on the rows that have none: a nice value and a
# realtime priority are plain numbers and the kernel leaves the column
# empty for them.
format: 1
command: proc
variant: self-limits
description: /proc/<pid>/limits soft and hard resource limits
metadata:
  tags: [linux, process, limits, proc]
  compatible: [Linux]
  references:
    - https://man7.org/linux/man-pages/man5/proc_pid_limits.5.html
detect:
  os: [linux]
  signature:
    all:
      # The header, which is the whole of the first line and names the
      # four columns.
      - '\ALimit[ \t]+Soft Limit[ \t]+Hard Limit[ \t]+Units[ \t]*$'
      # RLIMIT_CPU is first in the kernel's table, so this row follows
      # the header on every process.
      - '^Max cpu time[ \t]+(?:unlimited|\d+)[ \t]'
parse:
  type: table
  split: aligned
  header:
    columns: [limit, soft_limit, hard_limit, units]
fields:
  limit: {required: true}
  soft_limit: {required: true, regex: '(?P<soft_limit>unlimited|\d+)'}
  hard_limit: {required: true, regex: '(?P<hard_limit>unlimited|\d+)'}
