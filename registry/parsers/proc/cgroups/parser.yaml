# /proc/cgroups lists the cgroup controllers the kernel has: a header
# line that opens with "#", then one tab-separated row per controller with
# the hierarchy it is attached to (0 on a cgroup v2 system), the number of
# cgroups using it and whether it is enabled.
format: 1
command: proc
variant: cgroups
description: /proc/cgroups, the cgroup controllers and whether they are enabled
metadata:
  tags: [linux, kernel, cgroup]
  compatible: [linux]
  references:
    - https://man7.org/linux/man-pages/man7/cgroups.7.html
detect:
  os: [linux]
  signature:
    all:
      - '\A#subsys_name\thierarchy\tnum_cgroups\tenabled\n'
input:
  ignore:
    - '^#subsys_name\thierarchy\tnum_cgroups\tenabled$'
parse:
  type: regex
  pattern: '^(?P<subsystem>[a-z_]+)\t(?P<hierarchy>[0-9]+)\t(?P<num_cgroups>[0-9]+)\t(?P<enabled>[01])$'
fields:
  hierarchy: {type: int}
  num_cgroups: {type: int}
  enabled: {type: bool, true_values: ["1"], false_values: ["0"]}
