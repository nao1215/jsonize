# /proc/mounts is the mount table in the six fields of /etc/fstab: the
# device, where it is mounted, the filesystem type, the options, and the
# dump and pass numbers, which the kernel writes as 0 0 because they are
# a property of the configuration file rather than of a mount.
#
# The two formats are the same syntax, and /etc/mtab is a symbolic link
# to this file on a systemd machine, so a signature cannot separate them
# by what the fields are. What separates them is that this one is
# written by the kernel and the other by hand. Every line here is a
# mount with all six fields, the option list always opens with rw or ro
# because that is the first thing show_vfsmnt() prints, and the last two
# fields are always 0. A file where every line is that is /proc/mounts;
# an fstab holds comments, blank lines, options spelled defaults, and a
# pass number of 1 or 2 for the filesystems fsck should check. The
# etc/fstab definition carries the same expression in its `none` for the
# other direction of the pair.
#
# What is left over is an fstab with no comments in it whose every entry
# is written the way the kernel writes this file. Such a file is read
# here, and the objects it produces are the same ones the fstab
# definition would produce, with dump and pass present rather than
# omitted.
#
# Mount points keep the escapes the kernel wrote: a space is \040, and a
# tab, a newline and a backslash are escaped the same way.
format: 1
command: proc
variant: mounts
description: /proc/mounts mounted filesystem table
metadata:
  tags: [linux, filesystem, mount, proc]
  compatible: [Linux]
  references:
    - https://man7.org/linux/man-pages/man5/proc_mounts.5.html
    - https://man7.org/linux/man-pages/man5/fstab.5.html
detect:
  os: [linux]
  signature:
    # A machine with snap and container mounts runs well past the
    # default window, and the shape below is about every line.
    window: 200
    all:
      # Every line is a mount the kernel wrote: six fields, an option
      # list opening with rw or ro, and a dump and pass of 0.
      - '\A(?:\S+ \S+ \S+ (?:rw|ro)(?:,\S+)? 0 0\n)*\S+ \S+ \S+ (?:rw|ro)(?:,\S+)? 0 0[ \t]*\z'
parse:
  type: regex
  pattern: '^(?P<device>\S+) (?P<mount_point>\S+) (?P<fs_type>\S+) (?P<options>\S+) (?P<dump>\d+) (?P<pass>\d+)[ \t]*$'
fields:
  device: {required: true}
  mount_point: {required: true}
  fs_type: {required: true}
  options: {type: array, split: ","}
  dump: {type: int, required: true}
  pass: {type: int, required: true}
