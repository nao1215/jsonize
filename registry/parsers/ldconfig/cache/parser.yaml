# `ldconfig -p` prints one tab indented entry per library:
#
#     libz.so.1 (libc6,x86-64) => /usr/lib/x86_64-linux-gnu/libz.so.1
#
# The count line that opens the report and the "Cache generated by" line
# that closes it (glibc 2.32 and later; a cache written by an older
# ldconfig has no trailer) are dropped rather than parsed: the count
# restates the length of the array and the trailer names the ldconfig
# build, so neither says anything about a library. The count line is
# still what makes the format recognisable, so it is also the signature,
# which means a grep of the entries alone is refused.
format: 1
command: ldconfig
variant: cache
description: ldconfig -p shared library cache listing
metadata:
  tags: [linux, library, glibc]
  compatible: [GNU C Library]
  references:
    - https://man7.org/linux/man-pages/man8/ldconfig.8.html
detect:
  os: [linux]
  signature:
    all:
      # The count line, then entries, then at most the one trailer. In a
      # cache of any size the window ends inside the entries, which is
      # why the trailer is optional here.
      - "\\A\\d+ libs found in cache `[^']+'(?:\\n\\t\\S+ \\([^)]*\\) => [^\\n]*)*(?:\\nCache generated by: [^\\n]*)?\\z"
input:
  ignore:
    - "^\\d+ libs found in cache `[^']+'$"
    - '^Cache generated by: '
parse:
  type: regex
  pattern: '^\t(?P<library>\S+) \((?P<flags>[^)]*)\) => (?P<path>.+?)\s*$'
fields:
  library: {required: true}
  # The parenthesised list names the ABI and the architecture the entry
  # was built for, and how many members it has varies: "(libc6)" on i386,
  # "(libc6,x86-64)" on amd64, "(libc6,x86-64,OS ABI: Linux 3.2.0)" where
  # the cache records a minimum kernel version.
  flags: {type: array, split: ","}
  path: {required: true}
