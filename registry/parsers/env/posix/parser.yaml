# One NAME=value record per line, values kept exactly as printed
# (trim: false), because a trailing or leading space in an environment
# variable is part of its value.
#
# What this format cannot express: a value that itself contains a
# newline. "A=one\nB=two" is one variable whose value is "one\nB=two" and
# two variables A and B at the same time, and no amount of matching can
# tell them apart. jz reads it as two variables. Use `env -0` (see the
# nul variant) when values may contain newlines.
format: 1
command: env
variant: posix
description: env / printenv output as a list of name/value pairs
metadata:
  tags: [linux, darwin, environment]
  compatible: [GNU coreutils, BusyBox, macOS env]
  references:
    - https://man7.org/linux/man-pages/man1/env.1.html
detect:
  # NAME=value is the shape of a .env file, a properties file, a shell
  # fragment and the show subcommand of half the systemd tools, so the
  # text is not evidence that env produced it. Every format that came
  # along wanted another none expression here, which is a list of other
  # people's formats growing inside this one; naming the parser is the
  # answer the rest of the registry already uses for a generic shape.
  auto_detect: false
  signature:
    # Two consecutive NAME=value lines. One line alone is not enough:
    # `id` also starts with "uid=...".
    all:
      - '^[A-Za-z_][A-Za-z0-9_]*=[^\n]*\n[A-Za-z_][A-Za-z0-9_]*='
    none:
      # env prints values raw and never adds quotes, so a quoted value
      # means some other program wrote the assignment for a shell to
      # read. This one stays because it is a property of env itself, and
      # it is what makes --parser env refuse the wrong text.
      - '^[A-Za-z_][A-Za-z0-9_]*="'
      - "^[A-Za-z_][A-Za-z0-9_]*='"
parse:
  type: kv
  separator: "="
  as: list
  trim: false
