# One NAME=value record per line, values kept exactly as printed
# (trim: false), because a trailing or leading space in an environment
# variable is part of its value.
#
# What this format cannot express: a value that itself contains a
# newline. "A=one\nB=two" is one variable whose value is "one\nB=two" and
# two variables A and B at the same time, and no amount of matching can
# tell them apart. jz reads it as two variables. Use `env -0` (see the
# nul variant) when values may contain newlines.
format: 1
command: env
variant: posix
aliases:
  # macOS installs GNU coreutils under a g prefix, and the g name prints
  # what the command prints.
  - name: genv
  - name: printenv
description: env / printenv output as a list of name/value pairs
metadata:
  tags: [linux, darwin, environment]
  compatible: [GNU coreutils, BusyBox, macOS env]
  references:
    - https://man7.org/linux/man-pages/man1/env.1.html
detect:
  # NAME=value is the shape of a .env file, a properties file, a shell
  # fragment and the show subcommand of half the systemd tools, so the
  # text is not evidence that env produced it. Every format that came
  # along wanted another none expression here, which is a list of other
  # people's formats growing inside this one; naming the parser is the
  # answer the rest of the registry already uses for a generic shape.
  auto_detect: false
  signature:
    all:
      # Every line is NAME=value with the value written raw, and there
      # are at least two of them. env never quotes a value, so a file
      # written for a shell to read (/etc/os-release, `go env`, `locale`)
      # has a quoted line somewhere in it and is not this format, rather
      # than being a format this one has to know about and exclude. Two
      # lines because `id` opens with "uid=..." on a line of its own.
      - '\A(?:[A-Za-z_][A-Za-z0-9_]*=(?:[^"''\n][^\n]*)?\n)+[A-Za-z_][A-Za-z0-9_]*=(?:[^"''\n][^\n]*)?\z'
      # At least one variable is named in capitals, the way PATH, HOME
      # and everything a shell exports is. A listing whose names are all
      # lower case and whose values all open with "=" is `pip freeze`
      # (certifi==2026.7.22), which the line rule above cannot tell from
      # a variable named certifi with the value "=2026.7.22".
      - '^[A-Z_][A-Z0-9_]*='
    none:
      # The one exclusion this definition keeps, against the argument
      # above: `timedatectl show` and `loginctl show-user` print
      # Key=value with a capitalised key somewhere (NTP, UID) and never a
      # quoted value, so nothing in the two rules above tells them from
      # an environment, and no positive rule can: a mixed-case name
      # (ImageOS on a CI runner) is a legal variable, and a shell run
      # with -i may export no PATH. The two lines named here are the
      # ones timedatectl/show and loginctl/show open with and read.
      - '\A(?:Timezone=|UID=[0-9]+\n)'
parse:
  type: kv
  separator: "="
  as: list
  trim: false
