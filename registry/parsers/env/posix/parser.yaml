# One NAME=value record per line, values kept exactly as printed
# (trim: false), because a trailing or leading space in an environment
# variable is part of its value.
#
# What this format cannot express: a value that itself contains a
# newline. "A=one\nB=two" is one variable whose value is "one\nB=two" and
# two variables A and B at the same time, and no amount of matching can
# tell them apart. jz reads it as two variables. Use `env -0` (see the
# nul variant) when values may contain newlines.
format: 1
command: env
variant: posix
description: env / printenv output as a list of name/value pairs
metadata:
  tags: [linux, darwin, environment]
  compatible: [GNU coreutils, BusyBox, macOS env]
detect:
  signature:
    # Two consecutive NAME=value lines. One line alone is not enough:
    # `id` also starts with "uid=...", and a single assignment is too
    # weak a claim to convert without being asked.
    all:
      - '^[A-Za-z_][A-Za-z0-9_]*=[^\n]*\n[A-Za-z_][A-Za-z0-9_]*='
    none:
      # env prints values raw and never adds quotes. A quoted value comes
      # from a program writing assignments for a shell to read: the
      # quotes there are syntax, and reading the text as env output would
      # leave them inside the value. /etc/os-release does this with
      # double quotes, `go env` with single ones.
      - '^[A-Za-z_][A-Za-z0-9_]*="'
      - "^[A-Za-z_][A-Za-z0-9_]*='"
      # os-release keys are not environment variables even when its
      # values happen to be unquoted.
      - '^(?:PRETTY_NAME|VERSION_ID|VERSION_CODENAME|ID_LIKE|HOME_URL)='
parse:
  type: kv
  separator: "="
  as: list
  trim: false
