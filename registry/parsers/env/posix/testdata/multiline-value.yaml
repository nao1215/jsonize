description: |
  A value that spans lines cannot be represented line by line. The
  signature asks that every line be an assignment, so the continuation
  line means this is not the format, and jz says so before it starts
  reading rather than after three lines of it. `env -0` is what prints
  such a value unambiguously, and env/null-separated reads that.
expect_error: 'does not describe this input'
source: hand-written edge case
