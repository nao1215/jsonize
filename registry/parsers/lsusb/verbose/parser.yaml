# `lsusb -v` is a tree, and the depth is a property of the device rather
# than of the format: a configuration has interfaces, an interface has
# endpoints, and an endpoint's attributes have their own flags. Every
# line is a node, its depth is how many two-space units open it, and its
# children are the lines under it.
#
# Four shapes appear at various depths, so the node is read by five
# expressions in order: the bus line, a heading ("Device Descriptor:"), a
# name and a value separated by a run of spaces, a "key: value" line, and
# a bare flag.
#
# The values are left as printed. lsusb writes a number and its meaning
# in one cell ("9 Hub", "0x81  EP 1 IN"), and splitting that would be
# guessing which half a reader wanted.
format: 1
command: lsusb
variant: verbose
description: lsusb -v devices as a tree of their descriptors
metadata:
  tags: [linux, hardware, usb, usbutils]
  compatible: [usbutils]
  references:
    - https://man7.org/linux/man-pages/man8/lsusb.8.html
detect:
  os: [linux]
  args:
    any: ["-v", "--verbose"]
  signature:
    all:
      - '\ABus \d{3} Device \d{3}: ID [0-9a-f]{4}:[0-9a-f]{4}'
      - '^Device Descriptor:$'
  # The plain listing is the bus lines alone, and its signature is met by
  # this output too. The descriptor blocks say which of the two this is.
  priority: 10
parse:
  type: tree
  indent: "  "
  # A top-level line is a device, or a labelled section or value of it
  # written against the left edge: "Device Descriptor:", "Hub
  # Descriptor:", "Negotiated speed: High Speed (480Mbps)". The label
  # opens with a capital, so a line of any other shape at the top is
  # not part of the report.
  root: '^(?:Bus \d{3} Device \d{3}: ID [0-9a-f]{4}:[0-9a-f]{4}|[A-Z][A-Za-z ]*:(?: .*)?$)'
  node:
    parse:
      type: regex
      patterns:
        - '^Bus (?P<bus>\d{3}) Device (?P<device>\d{3}): ID (?P<vendor_id>[0-9a-f]{4}):(?P<product_id>[0-9a-f]{4})\s*(?P<description>.*?)\s*$'
        - '^(?P<name>\S.*?):$'
        - '^(?P<name>\S+(?: \S+)*?)\s{2,}(?P<value>.*?)\s*$'
        - '^(?P<name>[^:]+): (?P<value>.*?)\s*$'
        - '^(?P<text>.+?)\s*$'
