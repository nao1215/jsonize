# `tree` draws a directory and what is under it, and closes with a count
# of what it found. The depth is a property of the directory, so it is
# read as a tree.
#
# A level is four characters, and which four depends on whether anything
# follows: a branch is "|-- " and the last one "`-- ", while a level that
# only passes through is "|   " or four spaces. Naming all four is what
# lets the depth be counted.
format: 1
command: tree
variant: listing
description: tree, a directory and what is under it
metadata:
  tags: [filesystem]
  compatible: [tree]
  references:
    - https://linux.die.net/man/1/tree
detect:
  args:
    # -F marks each name with its kind, and -p -s -h -u -g -D --inodes
    # --device and --du put the metadata in brackets before it; neither is
    # part of the name. -f prints the whole path where the name goes.
    none: ["-J", "--json", "-X", "-H", "-F", "--classify", "-p", "-s", "-h", "--si", "-u", "-g", "-D", "--inodes", "--device", "--du", "-f"]
  signature:
    # The root, then nothing but lines drawn under it, then the count.
    # Most trees are longer than the twenty lines detection looks at, and
    # the count is then past them, so the second expression takes a
    # window that is all tree: the root and nineteen lines under it, or
    # eighteen and the blank line before the count. A shorter text ends
    # within the window and has to end with the count, which is what
    # tells a tree from one line drawn the same way (`npm ls` of an empty
    # project prints "`-- (empty)"). The numbers are the window's.
    window: 20
    # In a UTF-8 locale the same drawing is "├── ", "└── " and "│" with
    # two no-break spaces and a space, which is what a pipe from an
    # ordinary shell carries.
    any:
      - '\A\S[^\n]*(?:\n(?:\|   |    |│\x{a0}\x{a0} )*(?:\|-- |`-- |├── |└── )[^\n]*)+\n\n[0-9]+ director(?:y|ies)(?:, [0-9]+ files?)?[ \t]*\z'
      - '\A\S[^\n]*(?:\n(?:\|   |    |│\x{a0}\x{a0} )*(?:\|-- |`-- |├── |└── )[^\n]*){18,}\n?\z'
input:
  # The count at the end is the same facts the tree already carries: it
  # counts the nodes above it, the top directory included.
  ignore: ['^[0-9]+ director(?:y|ies)(?:, [0-9]+ files?)?[ \t]*$']
parse:
  type: tree
  indent: ["|   ", "    ", "|-- ", "`-- ", "│   ", "├── ", "└── "]
  node:
    parse:
      type: regex
      # tree prints a symbolic link as "name -> target". A name is kept as
      # printed, and tree 2 prints a space in it as "\ " and a backslash as
      # "\\" (-N prints them raw), so a trailing space is part of it too.
      patterns:
        - '^(?P<name>.+?) -> (?P<link_to>.+)$'
        - '^(?P<name>.+)$'
    fields:
      name: {required: true}
      # The pattern splits at the first " -> ", so any other one is in the
      # target, and then the text says two things: the name may hold one as
      # well as the target. So may a target that starts with "-> ", where two
      # arrows share a space. Such a line is refused rather than read either
      # way.
      link_to: {when_missing: omit, regex: '(?P<link_to>(?: |- )*(?:(?:[^ -]|-[^ >]|->[^ ])(?:[^ ]| (?: |- )*(?:[^ -]|-[^ >]|->[^ ]))*(?: (?: |- )*(?:-|->)?)?|-|->)?)'}
