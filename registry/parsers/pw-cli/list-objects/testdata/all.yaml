source: "pw-cli ls on Ubuntu 26.04 with PipeWire 1.6.2, LC_ALL=C, while pw-record ran so that a stream node and two links were present; a webcam serial in two names replaced with 0123ABCD"
description: >-
  Every object in the registry: the core, modules, factories, metadata,
  clients, devices, nodes, ports and links. Some descriptions are in the
  language the audio server runs in, which LC_ALL=C on the client does not
  change.
os: linux
args: ["ls"]
