# zipinfo with no format option prints its short listing: the unix
# permissions the member was stored with, the zip version and host system
# that wrote it, the uncompressed size, two attribute characters, the
# compression method, the modification date and time, and the name.
#
# The two attribute characters are reported as one string because that is
# how zipinfo documents them: the first is t or b for a text or binary
# member, the second is x for an extra field, l for a comment, or - for
# neither, and either may be upper case when the member has an extended
# local header.
#
# The archive names itself and states its own size on disk, neither of
# which any row carries and neither of which the rows add up to, so both
# are read. The trailing totals do add up from the rows and are dropped,
# as is "Empty zipfile.", which says what an empty list of members
# already says.
format: 1
command: zipinfo
variant: default
description: zipinfo short archive listing
metadata:
  tags: [linux, darwin, archive]
  compatible: [Info-ZIP zipinfo]
  references:
    - https://manpages.debian.org/unstable/unzip/zipinfo.1.en.html
detect:
  signature:
    all:
      - '\AArchive:[ \t]+\S'
      - '^Zip file size: \d+ bytes, number of entries: \d+$'
input:
  ignore:
    - '^\d+ files?, \d+ bytes uncompressed'
    - '^Empty zipfile\.$'
parse:
  type: composite
  parts:
    # zipinfo prints the name it was given and the size of the file on
    # disk, which is the archive's own size and not the sum of anything
    # below it.
    - name: archive
      select: {limit: 2}
      parse:
        type: regex
        each: input
        pattern: '\AArchive:[ \t]+(?P<name>.+?)[ \t]*\nZip file size: (?P<size>\d+) bytes, number of entries: (?P<entries>\d+)[ \t]*\z'
      fields:
        name: {required: true}
        size: {type: int, required: true}
        entries: {type: int, required: true}
    - name: members
      select: {skip: 2}
      parse:
        type: regex
        pattern: '^(?P<mode>[-dlcbps][-rwxsStT]{9})[ \t]+(?P<version>\S+)[ \t]+(?P<os>\S+)[ \t]+(?P<size>\d+)[ \t]+(?P<attributes>\S\S)[ \t]+(?P<method>\S+)[ \t]+(?P<date>\d{2}-[A-Za-z]{3}-\d{2})[ \t]+(?P<time>\d{2}:\d{2}) (?P<name>.+)$'
      fields:
        size: {type: int, required: true}
        name: {required: true}
