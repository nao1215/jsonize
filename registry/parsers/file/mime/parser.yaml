# `file -i` (`--mime`) reports each file as a MIME type and a character
# set instead of a sentence, and `--mime-type` as the type alone. The
# names are padded to one column, as in the sentence form file/posix
# reads.
#
# A MIME type names one of a fixed set of top-level types, which is what
# the signature holds every line to; a line that is not a type, such as
# the message file prints for a file it cannot open, is refused.
format: 1
command: file
variant: mime
description: file -i and file --mime-type, one MIME type per file
metadata:
  tags: [linux, darwin, filesystem]
  compatible: [file]
  references:
    - https://man7.org/linux/man-pages/man1/file.1.html
detect:
  args:
    any: ["-i", "--mime", "--mime-type"]
  signature:
    all:
      - '\A(?:[^:\n]+:[ \t]+(?:application|audio|font|image|inode|message|model|multipart|text|video)/[-+.\w]+(?:; charset=[-\w]+)?[ \t]*(?:\n|\z))+\z'
exec:
  env:
    # In the C locale file writes each byte of a name outside ASCII as a
    # backslash and three octal digits, and a backslash in a name as it
    # is, so "caf\303\251" could be either name. A UTF-8 locale prints
    # the letters as they are and escapes only what cannot be printed.
    LC_ALL: C.UTF-8
parse:
  type: regex
  pattern: '^(?P<file>[^:]+):[ \t]+(?P<mime_type>[a-z]+/[-+.\w]+)(?:; charset=(?P<charset>[-\w]+))?[ \t]*$'
fields:
  # A backslash and three octal digits is how file escapes a byte it
  # cannot print, and nothing tells it from a name that holds those four
  # characters, so such a name is refused rather than kept as printed.
  file: {required: true, regex: '(?P<file>(?:[^\\]|\\+(?:[0-7]{1,2}\\+)*(?:[^0-7\\]|[0-7][^0-7\\]|[0-7]{2}[^0-7\\]|[0-7]{0,2}$))*)'}
  mime_type: {required: true}
  charset: {when_missing: omit}
