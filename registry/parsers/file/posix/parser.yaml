# file(1) prints one "path: description" line per file and nothing else.
# The path column is padded when several files are named, so the colon is
# what separates the two, not the spacing.
#
# The signature says what this format is, not what it is not. Two things
# have to hold, and together they are the claim:
#
#   1. Every line is "path: description". Not the first line, every one.
#      A report that merely opens with a labelled line has rows
#      underneath that break it: `apt show` and `dpkg -s` continue a
#      Description onto indented lines, `zipinfo` closes with a sentence,
#      `lscpu` names properties whose labels hold a space.
#   2. Some description names a kind of file, from the list below.
#
# That list is the point of this definition, and it is a decision rather
# than a survey: it is what jz undertakes to read as file(1) output. It
# is not an attempt to enumerate what file(1) can print, which depends on
# a magic database that differs between machines and grows with every
# release. A kind that is absent here is one jz says it cannot identify,
# which is an answer; adding one widens what this definition covers, and
# the fixture beside it is what says so.
#
# The window covers a whole plausible listing rather than the leading
# twenty lines, because rule 1 is about all of the output. `apt show`
# keeps its first twenty lines labelled and only continues one after
# that, so a short window would have let it through.
format: 1
command: file
variant: posix
description: file type descriptions
metadata:
  tags: [linux, darwin, filesystem]
  compatible: [file(1)]
  references:
    - https://man7.org/linux/man-pages/man1/file.1.html
exec:
  env:
    # In the C locale file writes each byte of a name outside ASCII as a
    # backslash and three octal digits, and a backslash in a name as it
    # is, so "caf\303\251" could be either name. A UTF-8 locale prints
    # the letters as they are and escapes only what cannot be printed.
    LC_ALL: C.UTF-8
detect:
  auto_detect: false
  signature:
    window: 200
    all:
      # Every line is a path, a colon and a description.
      - '\A(?:\S+:[ \t]+\S[^\n]*\n)*\S+:[ \t]+\S[^\n]*\z'
      # Some description names a kind of file jz undertakes to read. Case
      # is ignored because file(1) capitalises a description that opens
      # with a proper noun ("Composite Document File V2 Document"). A
      # listing that names no kind at all is refused: "could not read it"
      # is a sentence other tools write too.
      #
      # A kind is a word of the description's prose, so what follows it
      # is the end of the line, a space or punctuation. A slash or a
      # hyphen after it makes it part of a longer token: `link/ether` and
      # `link-netnsid` in `ip -o link`, whose every line is also "word:
      # text", or a MIME type, which `file -i` prints and this definition
      # does not undertake to read.
      - '(?i)^\S+:[ \t]+[^\n]*\b(?:text|data|empty|directory|link|executable|script|archive|image|document|database|socket|fifo|special|font|compressed)(?:[ \t,;:.()]|$)'
      # And every description does, or is one of the two file(1) writes
      # for a file it was given but could not identify. One line naming a
      # kind is not evidence on its own: any dump of a file's bytes has
      # some line whose printable column happens to spell one of these
      # words, and `xxd` output was read as a listing of sixteen byte
      # long paths until this expression covered the whole text. An error
      # message rarer than these two is refused, which is the same answer
      # this definition gives for a kind it does not name.
      - '(?i)\A(?:\S+:[ \t]+[^\n]*\b(?:text|data|empty|directory|link|executable|script|archive|image|document|database|socket|fifo|special|font|compressed|cannot open|no read permission)(?:[ \t,;:.()][^\n]*)?\n)*\S+:[ \t]+[^\n]*\b(?:text|data|empty|directory|link|executable|script|archive|image|document|database|socket|fifo|special|font|compressed|cannot open|no read permission)(?:[ \t,;:.()][^\n]*)?\z'
parse:
  type: regex
  pattern: '^(?P<file>[^:]+):\s+(?P<type>.+?)\s*$'
fields:
  # A backslash and three octal digits is how file escapes a byte it
  # cannot print, and nothing tells it from a name that holds those four
  # characters, so such a name is refused rather than kept as printed.
  file: {required: true, regex: '(?P<file>(?:[^\\]|\\+(?:[0-7]{1,2}\\+)*(?:[^0-7\\]|[0-7][^0-7\\]|[0-7]{2}[^0-7\\]|[0-7]{0,2}$))*)'}
  type: {required: true}
