# file(1) prints one "path: description" line per file and nothing else.
# The path column is padded when several files are named, so the colon is
# what separates the two, not the spacing.
#
# The signature says what this format is, not what it is not. Two things
# have to hold, and together they are the claim:
#
#   1. Every line is "path: description". Not the first line, every one.
#      A report that merely opens with a labelled line has rows
#      underneath that break it: `apt show` and `dpkg -s` continue a
#      Description onto indented lines, `zipinfo` closes with a sentence,
#      `lscpu` names properties whose labels hold a space.
#   2. Some description names a kind of file, from the list below.
#
# That list is the point of this definition, and it is a decision rather
# than a survey: it is what jz undertakes to read as file(1) output. It
# is not an attempt to enumerate what file(1) can print, which depends on
# a magic database that differs between machines and grows with every
# release. A kind that is absent here is one jz says it cannot identify,
# which is an answer; adding one widens what this definition covers, and
# the fixture beside it is what says so.
#
# The window covers a whole plausible listing rather than the leading
# twenty lines, because rule 1 is about all of the output. `apt show`
# keeps its first twenty lines labelled and only continues one after
# that, so a short window would have let it through.
format: 1
command: file
variant: posix
description: file type descriptions
metadata:
  tags: [linux, darwin, filesystem]
  compatible: [file(1)]
  references:
    - https://man7.org/linux/man-pages/man1/file.1.html
detect:
  auto_detect: false
  signature:
    window: 200
    all:
      # Every line is a path, a colon and a description.
      - '\A(?:\S+:[ \t]+\S[^\n]*\n)*\S+:[ \t]+\S[^\n]*\z'
      # The kinds of file jz undertakes to read. Case is ignored because
      # file(1) capitalises a description that opens with a proper noun
      # ("Composite Document File V2 Document").
      - '(?i)^\S+:[ \t]+[^\n]*\b(?:text|data|empty|directory|link|executable|script|archive|image|document|database|socket|fifo|special|font|compressed)\b'
parse:
  type: regex
  pattern: '^(?P<file>[^:]+):\s+(?P<type>.+?)\s*$'
fields:
  file: {required: true}
  type: {required: true}
