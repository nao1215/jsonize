# "path: description". The path column is padded when several files are
# named, so the colon is what separates them, not the spacing.
#
# One line of that shape is far too little evidence on its own, so the
# signature also asks that no line lacks the separator: file prints one
# "path: description" line per file and nothing else, while a report that
# only opens with a labelled line (an archive listing announcing its
# archive) has rows underneath that carry no colon followed by a space.
format: 1
command: file
variant: posix
description: file type descriptions
metadata:
  tags: [linux, darwin, filesystem]
  compatible: [file(1)]
  references:
    - https://man7.org/linux/man-pages/man1/file.1.html
detect:
  auto_detect: false
  signature:
    all:
      - '\A\S+:\s+\S'
    none:
      - '^(?:[^:\n]|:[^ \t\n])*$'
parse:
  type: regex
  pattern: '^(?P<file>[^:]+):\s+(?P<type>.+?)\s*$'
fields:
  file: {required: true}
  type: {required: true}
