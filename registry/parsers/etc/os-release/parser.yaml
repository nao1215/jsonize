# /etc/os-release is NAME=value with quoted values. It is a file rather
# than a command, so it is read as `cat /etc/os-release | jz --parser
# os-release`; the shape alone is too close to a shell fragment for jz to
# claim it.
format: 1
command: etc
variant: os-release
description: /etc/os-release distribution identification
metadata:
  tags: [linux, system]
  compatible: [systemd]
  references:
    - https://www.freedesktop.org/software/systemd/man/os-release.html
detect:
  # Three keys the file is defined to carry, each on its own line. One of
  # them alone is a shell assignment like any other, but PRETTY_NAME
  # together with NAME and ID is this file and close to nothing else,
  # which is enough to read /etc/os-release without being asked.
  signature:
    all:
      # An assignment opens the file.
      - '\A[A-Z_][A-Z0-9_]*='
      - '^PRETTY_NAME='
      - '^NAME='
      - '^ID='
parse:
  type: kv
  separator: "="
  as: map
  # The quotes around a value with spaces are shell syntax, not content.
  unquote: true
