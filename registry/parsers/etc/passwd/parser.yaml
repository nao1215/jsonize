# /etc/passwd, seven colon separated fields. The password field is the
# placeholder the shadow file leaves behind, not a secret.
format: 1
command: etc
variant: passwd
description: /etc/passwd account entries
metadata:
  tags: [linux, darwin, user]
  compatible: [shadow-utils]
  references:
    - https://man7.org/linux/man-pages/man5/passwd.5.html
detect:
  auto_detect: false
  signature:
    all:
      # Exactly seven colon separated fields, the way /etc/group counts
      # its four. Without the count any colon separated record with two
      # numbers in the third and fourth field qualifies, which is what
      # the key listing of `gpg --with-colons` looks like.
      - '\A[^:\n]+:[^:\n]*:\d+:\d+:[^:\n]*:[^:\n]*:[^:\n]*$'
input:
  ignore:
    - '^\s*#'
parse:
  type: table
  split: delimiter
  delimiter: ":"
  header:
    none: true
    columns: [username, password, uid, gid, gecos, home, shell]
fields:
  username: {required: true}
  uid: {type: int, required: true}
  gid: {type: int, required: true}
  home: {required: true}
  shell: {required: true}
