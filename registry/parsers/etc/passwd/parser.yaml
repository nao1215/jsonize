# /etc/passwd, seven colon separated fields. The password field is the
# placeholder the shadow file leaves behind, not a secret.
format: 1
command: etc
variant: passwd
description: /etc/passwd account entries
metadata:
  tags: [linux, darwin, user]
  compatible: [shadow-utils]
  references:
    - https://man7.org/linux/man-pages/man5/passwd.5.html
detect:
  auto_detect: false
  signature:
    all:
      # Seven fields ending the line, of which the sixth is the home
      # directory and so an absolute path. Without those two conditions
      # any line carrying six colons and two numbers between them passes:
      # the first line of BusyBox ifconfig
      # ("br-0 Link encap:Ethernet  HWaddr 52:54:00:25:74:A0") splits into
      # exactly seven fields with 54 and 00 where the ids go.
      - '\A[^:\n]+:[^:\n]*:\d+:\d+:[^:\n]*:/[^:\n]*:[^:\n]*$'
input:
  ignore:
    - '^\s*#'
parse:
  type: table
  split: delimiter
  delimiter: ":"
  header:
    none: true
    columns: [username, password, uid, gid, gecos, home, shell]
fields:
  username: {required: true}
  uid: {type: int, required: true}
  gid: {type: int, required: true}
  home: {required: true}
  shell: {required: true}
