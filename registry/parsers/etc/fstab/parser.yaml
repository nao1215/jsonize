# /etc/fstab: one line per file system. The dump and pass numbers are
# optional in the format, so a line may stop after the options, which is
# why the three alternatives differ only in how far they read.
#
# /proc/mounts is written in the same six fields, and on a systemd
# machine /etc/mtab is a symbolic link to it, so the two cannot be told
# apart by what the fields are. They are told apart by who wrote them,
# which is what the expression in `none` says: see proc/mounts, which
# carries the same expression as its signature.
format: 1
command: etc
variant: fstab
description: /etc/fstab file system table
metadata:
  tags: [linux, filesystem]
  compatible: [util-linux]
  references:
    - https://man7.org/linux/man-pages/man5/fstab.5.html
detect:
  auto_detect: false
  signature:
    all:
      # The file opens with an entry, after any comments: a device
      # specification, a mount point, a file system type and a comma
      # separated option list. Anchoring the device to the spellings
      # fstab allows is what keeps another whitespace separated table
      # from reading as an entry, and requiring the first entry rather
      # than any line is what keeps a mount table out: `findmnt` opens
      # with its column names, which name no device.
      - '\A(?:[ \t]*(?:#[^\n]*)?\n)*(?:/\S+|UUID=\S+|LABEL=\S+|PARTUUID=\S+|PARTLABEL=\S+|ID=\S+|none|tmpfs|proc|sysfs|devpts|debugfs|overlay|cgroup2?|\S+:/\S*)[ \t]+(?:/\S*|none|swap)[ \t]+[\w.+-]+[ \t]+[\w=,.:@/+-]+(?:[ \t]+\d+){0,2}[ \t]*$'
    none:
      # The mount table the kernel writes to /proc/mounts. Every line of
      # it is an entry with all six fields, the option list opens with
      # rw or ro because that is the first thing show_vfsmnt() prints,
      # and the dump and pass numbers are always 0. An fstab holds
      # comments, blank lines, options spelled defaults, and a pass
      # number of 1 or 2 for the file systems fsck should check, so
      # nothing that is written by hand looks like this all the way
      # down.
      - '\A(?:\S+ \S+ \S+ (?:rw|ro)(?:,\S+)? 0 0\n)*\S+ \S+ \S+ (?:rw|ro)(?:,\S+)? 0 0[ \t]*\z'
input:
  ignore:
    - '^\s*#'
parse:
  type: regex
  patterns:
    - '^(?P<device>\S+)[ \t]+(?P<mount_point>\S+)[ \t]+(?P<fs_type>\S+)[ \t]+(?P<options>\S+)[ \t]+(?P<dump>\d+)[ \t]+(?P<pass>\d+)[ \t]*$'
    - '^(?P<device>\S+)[ \t]+(?P<mount_point>\S+)[ \t]+(?P<fs_type>\S+)[ \t]+(?P<options>\S+)[ \t]+(?P<dump>\d+)[ \t]*$'
    - '^(?P<device>\S+)[ \t]+(?P<mount_point>\S+)[ \t]+(?P<fs_type>\S+)[ \t]+(?P<options>\S+)[ \t]*$'
fields:
  device: {required: true}
  mount_point: {required: true}
  fs_type: {required: true}
  options: {type: array, split: ","}
  dump: {type: int, when_missing: omit}
  pass: {type: int, when_missing: omit}
