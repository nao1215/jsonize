# /etc/protocols: an internet protocol, its number, and the names it also
# goes by. Comments and blank lines are dropped.
format: 1
command: etc
variant: protocols
aliases:
  - name: getent
    args:
      all: ["protocols"]
description: /etc/protocols entries
metadata:
  tags: [linux, darwin, network]
  compatible: [POSIX protocols file]
  references:
    - https://man7.org/linux/man-pages/man5/protocols.5.html
detect:
  signature:
    all:
      # A lower-case name, a number under 256, and then the same name in
      # upper case, which is the convention every line of this file
      # follows and which separates it from any other two-column listing.
      - '\A(?:[ \t]*(?:#[^\n]*)?\n)*[a-z][a-z0-9-]*[ \t]+(?:[0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])[ \t]+[A-Za-z0-9-]+(?:[ \t]|$)'
input:
  ignore:
    - '^[ \t]*#'
parse:
  type: regex
  pattern: '^(?P<name>\S+)[ \t]+(?P<number>[0-9]+)[ \t]*(?P<aliases>[^#]*?)[ \t]*(?:#.*)?$'
fields:
  name: {required: true}
  number: {type: int, required: true}
  aliases: {type: array, split_regex: '[ \t]+'}
