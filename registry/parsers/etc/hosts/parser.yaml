# /etc/hosts: an address and the names that resolve to it. Comments and
# blank lines are dropped; a trailing comment on a line is kept out of
# the host names.
format: 1
command: etc
variant: hosts
aliases:
  # `getent hosts` prints this file, adding whatever the other name
  # services answer with.
  - name: getent
    args:
      all: ["hosts"]
description: /etc/hosts entries
metadata:
  tags: [linux, darwin, network]
  compatible: [POSIX hosts file]
  references:
    - https://man7.org/linux/man-pages/man5/hosts.5.html
detect:
  auto_detect: false
  signature:
    all:
      # The file opens with an entry, after any comments: an address and
      # the names it maps to, running to the end of the line. Writing the
      # whole first entry rather than any line that resembles one settles
      # two neighbours without naming them. A routing table opens with
      # its own title and column names, so `netstat -r` and `route` are
      # not this format; and a host name never holds a colon, so the
      # hardware address in a neighbour table ends the line early. Colon
      # separated hex digits alone describe a clock too, which is how
      # "12:34  up 3 days" from uptime(1) reads as an address followed by
      # names.
      - '\A(?:[ \t]*(?:#[^\n]*)?\n)*(?:\d+\.\d+\.\d+\.\d+|[0-9a-fA-F]*::[0-9a-fA-F:]*|(?:[0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4})(?:%\S+)?(?:[ \t]+[A-Za-z0-9][A-Za-z0-9._-]*)+[ \t]*$'
    none:
      # The one exclusion this definition keeps, and the reason it is an
      # exclusion: `ip neighbour` prints "ADDRESS dev INTERFACE STATE"
      # for a neighbour whose hardware address it does not have, and
      # every word of that is a legal host name. Nothing in the text
      # tells the two apart, so there is no positive form to write.
      - '^\S+[ \t]+dev[ \t]+\S+[ \t]+(?:lladdr|PERMANENT|NOARP|REACHABLE|STALE|DELAY|PROBE|INCOMPLETE|FAILED|NONE)(?:[ \t]|$)'
input:
  ignore:
    - '^\s*#'
parse:
  type: regex
  pattern: '^(?P<address>\S+)\s+(?P<names>[^#]+?)\s*(?:#.*)?$'
fields:
  address: {required: true}
  names: {type: array, split_regex: '\s+'}
