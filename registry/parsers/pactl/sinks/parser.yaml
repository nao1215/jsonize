# `pactl list sinks` prints a block per sink: a heading with its index,
# then indented "Key: Value" lines, with the properties and formats
# indented one level further under headings of their own. Which keys a
# sink has depends on the driver, so the block is read as a map rather
# than as named columns, and so is the property list; the ports and the
# formats are lists of their own.
format: 1
command: pactl
variant: sinks
description: pactl list sinks or sources, one block per device
metadata:
  tags: [linux, audio, pulseaudio, pipewire]
  compatible: [PulseAudio, PipeWire]
  references:
    - https://man.archlinux.org/man/pactl.1
detect:
  os: [linux]
  args:
    all: ["list"]
    none: ["short"]
  signature:
    all:
      - '\A(?:Sink|Source) #[0-9]+[ \t]*$'
      - '^\tState: \S'
      - '^\tName: \S'
input:
  # The volume list is too wide for a terminal and pactl breaks it, so
  # the rest of it is joined back onto the line it belongs to. The break
  # is at a space run rather than at a key, which is what separates a
  # continuation from the deeper lines under Properties.
  fold: '^\t[ ]{4,}\S'
parse:
  type: records
  start: '^(?:Sink|Source) #[0-9]+[ \t]*$'
  parts:
    - name: index
      select: {limit: 1}
      parse:
        type: regex
        each: input
        pattern: '\A(?P<kind>Sink|Source) #(?P<index>[0-9]+)[ \t]*\z'
      fields:
        index: {type: int}
    # One level of "Key: Value" lines. The three headings that open a
    # nested list, and the lines under them, belong to the parts below.
    - name: attributes
      select: {skip: 1}
      ignore: ['^\t\t', '^\t(?:Properties|Ports|Formats):[ \t]*$']
      parse:
        type: kv
        separator: ": "
        as: map
    # `key = "value"` lines, one per property the server reports. Which
    # keys there are depends on the driver, so they are read as a map.
    - name: properties
      select: {after: '^\tProperties:$', until: '^\t\S'}
      parse:
        type: kv
        separator: " = "
        as: map
        unquote: true
    # One line per port: its name, then a description with the type,
    # priority and availability in brackets, kept as printed.
    - name: ports
      select: {after: '^\tPorts:$', until: '^\t\S'}
      parse:
        type: regex
        pattern: '^\t\t(?P<name>[^:]+): (?P<description>.+?)[ \t]*$'
    - name: formats
      select: {after: '^\tFormats:$', until: '^\t\S'}
      parse:
        type: regex
        pattern: '^\t\t(?P<format>.+?)[ \t]*$'
