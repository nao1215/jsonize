# `loginctl list-users` prints a different table from the session list,
# so it is a variant of its own rather than a shape the session columns
# could absorb. The trailing "N users listed." line is a legend.
format: 1
command: loginctl
variant: users
description: loginctl list-users table
metadata:
  tags: [linux, systemd, session]
  compatible: [systemd]
  references:
    - https://www.freedesktop.org/software/systemd/man/loginctl.html
detect:
  os: [linux]
  args:
    any: ["list-users"]
  signature:
    all:
      # The text opens with the header.
      - '\A[ \t]*UID[ \t]+USER[ \t]'
      - '^[ \t]*UID[ \t]+USER[ \t]+LINGER[ \t]+STATE[ \t]*$'
input:
  # The count of what was listed closes the output and is read as its
  # end, so a line after it that no rule names is unread rather than
  # taken for one more row.
  select:
    until: '^[0-9]+ users listed\.$'
parse:
  type: table
  split: whitespace
fields:
  uid: {type: int}
  linger: {type: bool}
