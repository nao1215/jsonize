# `loginctl list-seats` prints one column and a legend. The header is the
# whole of the evidence the text carries, so it is anchored at the start
# of the input, and the subcommand is required as well: a seat list and a
# session list are both loginctl output and only the arguments tell them
# apart before the header is read.
format: 1
command: loginctl
variant: seats
description: loginctl list-seats table
metadata:
  tags: [linux, systemd, session]
  compatible: [systemd]
  references:
    - https://www.freedesktop.org/software/systemd/man/loginctl.html
detect:
  os: [linux]
  args:
    any: ["list-seats"]
  signature:
    # The header is one word, which a list of anything else can open with
    # ("SEAT", then "A12"), so the legend loginctl closes the table with
    # is required too.
    all:
      - '\A[ \t]*SEAT[ \t]*$'
      - '^[0-9]+ seats? listed\.$'
input:
  ignore:
    - '^[0-9]+ seats? listed\.$'
parse:
  type: table
  split: whitespace
fields:
  # logind accepts a seat name only when it starts with "seat", and the
  # one column takes the whole line, so the name is what keeps a row of
  # another table printed after this one from becoming a seat.
  seat: {required: true, regex: '(?P<seat>seat[A-Za-z0-9_-]*)'}
