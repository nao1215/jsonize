# The access point table has cells that hold spaces (a rate is a number
# and its unit, a security cell lists every scheme the network offers),
# so the columns are cut at the header words rather than at whitespace.
#
# IN-USE is empty on every network but the one this machine is joined to,
# and an empty cell is null, so in_use is true on that one network and
# null on the rest rather than false.
#
# The rate keeps its unit and stays a string: it is the number the driver
# reports followed by Mbit/s, and splitting the two would invent a unit
# key that the other cells do not have.
format: 1
command: nmcli
variant: wifi
description: nmcli device wifi list
metadata:
  tags: [linux, network, wireless, networkmanager]
  compatible: [NetworkManager]
  references:
    - https://networkmanager.dev/docs/api/latest/nmcli.html
detect:
  os: [linux]
  signature:
    all:
      - '\AIN-USE[ \t]+BSSID[ \t]+SSID[ \t]+MODE[ \t]+CHAN[ \t]+RATE[ \t]+SIGNAL[ \t]+BARS[ \t]+SECURITY'
parse:
  type: table
  split: aligned
fields:
  bssid: {required: true}
  in_use: {type: bool, true_values: ["*"]}
  ssid: {null_if: ["--"]}
  chan: {type: int}
  signal: {type: int}
  security: {type: array, split_regex: '[ \t]+'}
