source: transcribed from the container example under "systemd-analyze time" in the systemd-analyze(1) manual, https://www.freedesktop.org/software/systemd/man/systemd-analyze.html; not captured on a real system
description: >
  A container, which has no firmware, loader, kernel or initrd stage.
