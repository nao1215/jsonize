# `systemd-analyze critical-chain` prints the chain of units that decided
# when the boot finished, each indented under the one it waited for. The
# depth is a property of the machine's unit graph rather than of the
# format, so it is read as a tree.
#
# A level is two characters, and the last level of a line is written with
# a backtick and a dash where the ones above it are spaces. Naming both
# forms is what lets the depth be counted.
format: 1
command: systemd-analyze
variant: critical-chain
description: systemd-analyze critical-chain, the units the boot waited on
metadata:
  tags: [linux, systemd, boot]
  compatible: [systemd]
  references:
    - https://www.freedesktop.org/software/systemd/man/systemd-analyze.html
detect:
  os: [linux]
  args:
    any: ["critical-chain"]
  signature:
    all:
      - '\AThe time when unit became active or started is printed after the "@" character\.'
      # The first unit under the target. It is "`-" when the chain does
      # not branch and "|-" when it does (--fuzz), and in a UTF-8 locale
      # the same two are drawn "└─" and "├─".
      - '^(?:`-|\|-|└─|├─)\S+ @'
input:
  # The two sentences above the chain are the same on every system: they
  # say what the "@" and "+" in the lines below mean, which is what the
  # node pattern reads them as.
  ignore:
    - '^The time when unit became active or started is printed after the "@" character\.[ \t]*$'
  select:
    after: '^The time the unit took to start is printed after the "\+" character\.$'
parse:
  type: tree
  indent: ["  ", "`-", "| ", "|-", "│ ", "└─", "├─"]
  # A top-level line is the unit the chain leads to, and a unit name
  # ends in its type; a line of any other shape at the top is not part
  # of the report.
  root: '^\S+\.(?:service|socket|device|mount|automount|swap|target|path|timer|slice|scope)(?: @|[ \t]*$)'
  node:
    parse:
      type: regex
      patterns:
        # A unit that was already active has no times of its own.
        - '^(?P<unit>\S+) @(?P<activated>[^ ]+)(?: \+(?P<startup>[^ ]+))?[ \t]*$'
        - '^(?P<unit>\S+)[ \t]*$'
    fields:
      unit: {required: true}
      activated: {type: duration, layout: mm:ss}
      startup: {type: duration, layout: mm:ss}
