# "12: 2 2 3": the number, a colon, and its prime factors with a
# multiplicity repeated as many times as it occurs. A number with no
# factors to print (0 and 1) ends at the colon, so the list is empty
# rather than missing.
#
# A number, a colon and numbers describes far too much on one line, so
# the signature describes the whole text instead: every line must have
# that shape and nothing else on it. That keeps prose and `factor -h`
# out, the latter writing the same factors as "2^2 3". What it cannot
# keep out is another listing of numbers under numbers, since only
# multiplying them says which is which, and that is why the definition
# is used only when it is named.
format: 1
command: factor
variant: default
aliases:
  # macOS installs GNU coreutils under a g prefix, and the g name prints
  # what the command prints.
  - name: gfactor
description: factor prime factors of each number
metadata:
  tags: [math]
  compatible: [GNU coreutils, uutils coreutils]
  references:
    - https://www.gnu.org/software/coreutils/manual/html_node/factor-invocation.html
detect:
  auto_detect: false
  signature:
    all:
      - '\A\d+:(?: \d+)*(?:\n\d+:(?: \d+)*)*\z'
parse:
  type: regex
  # The factors are one group that is allowed to be empty, so that every
  # object has the key and 1 comes out with an empty list.
  pattern: '^(?P<number>\d+):[ \t]*(?P<factors>[0-9]*(?:[ \t]+[0-9]+)*)[ \t]*$'
fields:
  # factor is arbitrary precision: GNU builds it against GMP and prints
  # numbers that no integer type here can hold, so the numbers stay the
  # digits they were printed as. 18446744073709551615 in the boundary
  # fixture is already past a signed 64-bit integer.
  number: {required: true}
  factors:
    type: array
    split_regex: '[ \t]+'
