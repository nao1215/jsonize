description: |
  A 12-byte file written for this fixture, so the whole dump is one short
  line: every byte slot after the twelfth is blank and the opening bracket
  stays in the column it has on a full line. The bytes are
  ">short|dump<", which puts all three of the fences the hexadecimal
  dumps use inside the text column of a dump that has only one line to be
  recognised by.
source: |
  built and captured on Ubuntu 26.04 with od (uutils coreutils) 0.8.0,
  LC_ALL=C od -A x -t x1z short.bin
os: linux
