# `upower -d` prints one block per device, headed by its object path, and
# then a "Daemon:" block for the daemon itself. The blocks repeat, so the
# definition describes one of them and `records` applies it to each.
#
# The labels contain spaces and which of them appear depends on the
# device, so the pairs are a list of name/value objects and the values
# stay strings, percent sign and all.
#
# The device type heading (battery, line-power, unknown) and the rows of
# a "History (charge):" block have no colon. They are read as entries of
# the same list, the heading as a label with an empty value and a history
# row as its time and the rest of the row, so the list keeps every line
# in the order upower printed it.
format: 1
command: upower
variant: dump
description: upower -d every device and the daemon
metadata:
  tags: [linux, power, upower]
  compatible: [UPower]
  references:
    - https://upower.freedesktop.org/docs/
detect:
  os: [linux]
  args:
    any: ["-d", "--dump"]
  signature:
    all:
      # A device path or, on a machine with no power devices at all, the
      # daemon block on its own.
      - '\A(?:Device:[ \t]+/org/freedesktop/UPower/devices/\S|Daemon:[ \t]*$)'
parse:
  type: records
  start: '^(?:Device|Daemon):'
  parts:
    # The daemon block has no path, which leaves it null.
    - name: device
      select: {limit: 1}
      parse:
        type: regex
        each: input
        pattern: '\A(?P<kind>Device|Daemon):(?:[ \t]+(?P<path>\S+))?[ \t]*\z'
      fields:
        kind: {required: true}
    - name: properties
      select: {skip: 1}
      parse:
        type: regex
        patterns:
          # "label: value". A label may contain spaces, and the value runs
          # to the end of the line, colons and all.
          - '^[ \t]+(?P<name>icon-name):[ \t]*''(?P<value>.*)''[ \t]*$'
          - '^[ \t]+(?P<name>[^:\t]+?)[ \t]*:[ \t]*(?P<value>.*?)[ \t]*$'
          # The device type (battery, line-power, unknown, ...) on a line of
          # its own above the pairs that apply to it. It is a label with no
          # value, which is what the "History (charge):" heading is too.
          - '^  (?P<name>[a-z][a-z-]*)(?P<value>)[ \t]*$'
          # A history row under its heading: a time, a value and a state,
          # tab-separated. The time is the label and the rest the value.
          - '^    (?P<name>-?[0-9]+)\t(?P<value>[^\t]+\t\S+)$'
