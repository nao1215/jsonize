source: "captured on Ubuntu 26.04 (util-linux 2.41.3) with LC_ALL=C: namei -l /usr/bin/ls /nope/x"
os: linux
description: "Two paths make two blocks, and a component that does not exist is reported as a name and a message instead of a mode, an owner and a group. The arguments are not recorded because namei exits 1 on the missing path."
