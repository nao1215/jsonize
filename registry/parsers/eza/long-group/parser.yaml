# `eza -lg` prints the columns of eza/long with the group after the
# user: five columns before the name.
#
# -H prints a link count in front of the size instead, and -S a
# block count after it, which is also five columns. A row of
# `eza -lH` reads here as a size of 1, a user of 3.1M and a group of
# the user, and with -n and plain sizes nothing in the text is out of
# place. So the text is not evidence of which option wrote it: this
# definition is used when -g is among the arguments or when it is
# named, and a piped listing is refused. The names, the size and the
# date are what eza/long explains.
format: 1
command: eza
variant: long-group
description: eza -lg long listing with the group column
metadata:
  tags: [linux, darwin, filesystem]
  compatible: [eza]
  references:
    - https://github.com/eza-community/eza
detect:
  # The text of this column set is also the text of another one (see
  # the top of this file), so it is not evidence on its own.
  auto_detect: false
  args:
    any: ["-g", "--group"]
    # Each of these adds or removes a column, or appends a mark to the
    # name that is not part of it; see eza/long.
    none: ["-H", "--links", "-i", "--inode", "-S", "--blocksize", "-o", "--octal-permissions", "-Z", "--context", "--git", "-@", "--extended", "-T", "--tree", "--no-filesize", "--no-user", "--no-permissions", "--no-time", "-F=always", "--classify=always"]
  signature:
    all:
      # Every line is a row of these columns, below the headings where
      # --header printed them. A second timestamp column (-m with -u), the
      # attribute lines -@ prints under a row, the tree -T draws before a
      # name and the directory headings -R prints are all refused here.
      - '\A(?:Permissions +Size +User +Group +Date (?:Modified|Accessed|Created|Changed) +Name\n)?(?:(?:[.dcbps|][-rwxsStT]{9}@?|l[-rwxsStT]{9}@?) +(?:(?:[\d.]+(?:[KkMGTPEZYRQ]i?)?|-)|(?:\d+),(?:\d+)) +(?:\S+) +(?:\S+) +(?:\d{1,2} [A-Z][a-z]{2} (?:\d{2}:\d{2}| \d{4})) +\S[^\n]*\n)*(?:[.dcbps|][-rwxsStT]{9}@?|l[-rwxsStT]{9}@?) +(?:(?:[\d.]+(?:[KkMGTPEZYRQ]i?)?|-)|(?:\d+),(?:\d+)) +(?:\S+) +(?:\S+) +(?:\d{1,2} [A-Z][a-z]{2} (?:\d{2}:\d{2}| \d{4})) +\S[^\n]*\z'
exec:
  env:
    NO_COLOR: "1"
input:
  ignore:
    # The column headings --header (-h) prints above the rows.
    - '^Permissions +Size +User +Group +Date (?:Modified|Accessed|Created|Changed) +Name$'
parse:
  type: regex
  # A link line first, for each of the three ways its name and its
  # target may be written, then every other line.
  patterns:
    - '^(?P<permissions>l[-rwxsStT]{9}@?) +(?:(?P<size>[\d.]+(?:[KkMGTPEZYRQ]i?)?|-)|(?P<major>\d+),(?P<minor>\d+)) +(?P<user>\S+) +(?P<group>\S+) +(?P<date>\d{1,2} [A-Z][a-z]{2} (?:\d{2}:\d{2}| \d{4})) +''(?P<name>[^''\\]* [^''\\]*)'' -> ''(?P<link_to>[^''\\]* [^''\\]*)''$'
    - '^(?P<permissions>l[-rwxsStT]{9}@?) +(?:(?P<size>[\d.]+(?:[KkMGTPEZYRQ]i?)?|-)|(?P<major>\d+),(?P<minor>\d+)) +(?P<user>\S+) +(?P<group>\S+) +(?P<date>\d{1,2} [A-Z][a-z]{2} (?:\d{2}:\d{2}| \d{4})) +''(?P<name>[^''\\]* [^''\\]*)'' -> "(?P<link_to>[^\\]*''[^\\]*)"$'
    - '^(?P<permissions>l[-rwxsStT]{9}@?) +(?:(?P<size>[\d.]+(?:[KkMGTPEZYRQ]i?)?|-)|(?P<major>\d+),(?P<minor>\d+)) +(?P<user>\S+) +(?P<group>\S+) +(?P<date>\d{1,2} [A-Z][a-z]{2} (?:\d{2}:\d{2}| \d{4})) +''(?P<name>[^''\\]* [^''\\]*)'' -> (?P<link_to>[^\s''\\]+)$'
    - '^(?P<permissions>l[-rwxsStT]{9}@?) +(?:(?P<size>[\d.]+(?:[KkMGTPEZYRQ]i?)?|-)|(?P<major>\d+),(?P<minor>\d+)) +(?P<user>\S+) +(?P<group>\S+) +(?P<date>\d{1,2} [A-Z][a-z]{2} (?:\d{2}:\d{2}| \d{4})) +"(?P<name>[^"\\]*''[^"\\]*)" -> ''(?P<link_to>[^''\\]* [^''\\]*)''$'
    - '^(?P<permissions>l[-rwxsStT]{9}@?) +(?:(?P<size>[\d.]+(?:[KkMGTPEZYRQ]i?)?|-)|(?P<major>\d+),(?P<minor>\d+)) +(?P<user>\S+) +(?P<group>\S+) +(?P<date>\d{1,2} [A-Z][a-z]{2} (?:\d{2}:\d{2}| \d{4})) +"(?P<name>[^"\\]*''[^"\\]*)" -> "(?P<link_to>[^\\]*''[^\\]*)"$'
    - '^(?P<permissions>l[-rwxsStT]{9}@?) +(?:(?P<size>[\d.]+(?:[KkMGTPEZYRQ]i?)?|-)|(?P<major>\d+),(?P<minor>\d+)) +(?P<user>\S+) +(?P<group>\S+) +(?P<date>\d{1,2} [A-Z][a-z]{2} (?:\d{2}:\d{2}| \d{4})) +"(?P<name>[^"\\]*''[^"\\]*)" -> (?P<link_to>[^\s''\\]+)$'
    - '^(?P<permissions>l[-rwxsStT]{9}@?) +(?:(?P<size>[\d.]+(?:[KkMGTPEZYRQ]i?)?|-)|(?P<major>\d+),(?P<minor>\d+)) +(?P<user>\S+) +(?P<group>\S+) +(?P<date>\d{1,2} [A-Z][a-z]{2} (?:\d{2}:\d{2}| \d{4})) +(?P<name>[^\s''\\]+) -> ''(?P<link_to>[^''\\]* [^''\\]*)''$'
    - '^(?P<permissions>l[-rwxsStT]{9}@?) +(?:(?P<size>[\d.]+(?:[KkMGTPEZYRQ]i?)?|-)|(?P<major>\d+),(?P<minor>\d+)) +(?P<user>\S+) +(?P<group>\S+) +(?P<date>\d{1,2} [A-Z][a-z]{2} (?:\d{2}:\d{2}| \d{4})) +(?P<name>[^\s''\\]+) -> "(?P<link_to>[^\\]*''[^\\]*)"$'
    - '^(?P<permissions>l[-rwxsStT]{9}@?) +(?:(?P<size>[\d.]+(?:[KkMGTPEZYRQ]i?)?|-)|(?P<major>\d+),(?P<minor>\d+)) +(?P<user>\S+) +(?P<group>\S+) +(?P<date>\d{1,2} [A-Z][a-z]{2} (?:\d{2}:\d{2}| \d{4})) +(?P<name>[^\s''\\]+) -> (?P<link_to>[^\s''\\]+)$'
    - '^(?P<permissions>[.dcbps|][-rwxsStT]{9}@?) +(?:(?P<size>[\d.]+(?:[KkMGTPEZYRQ]i?)?|-)|(?P<major>\d+),(?P<minor>\d+)) +(?P<user>\S+) +(?P<group>\S+) +(?P<date>\d{1,2} [A-Z][a-z]{2} (?:\d{2}:\d{2}| \d{4})) +''(?P<name>[^''\\]* [^''\\]*)''$'
    - '^(?P<permissions>[.dcbps|][-rwxsStT]{9}@?) +(?:(?P<size>[\d.]+(?:[KkMGTPEZYRQ]i?)?|-)|(?P<major>\d+),(?P<minor>\d+)) +(?P<user>\S+) +(?P<group>\S+) +(?P<date>\d{1,2} [A-Z][a-z]{2} (?:\d{2}:\d{2}| \d{4})) +"(?P<name>[^\\]*''[^\\]*)"$'
    - '^(?P<permissions>[.dcbps|][-rwxsStT]{9}@?) +(?:(?P<size>[\d.]+(?:[KkMGTPEZYRQ]i?)?|-)|(?P<major>\d+),(?P<minor>\d+)) +(?P<user>\S+) +(?P<group>\S+) +(?P<date>\d{1,2} [A-Z][a-z]{2} (?:\d{2}:\d{2}| \d{4})) +(?P<name>[^\s''\\]+)$'
fields:
  size: {null_if: ["-"]}
  major: {type: int, when_missing: omit}
  minor: {type: int, when_missing: omit}
  name: {required: true}
  link_to: {when_missing: omit}
