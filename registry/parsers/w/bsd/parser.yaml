format: 1
command: w
variant: bsd
description: "w on macOS and BSD: uptime summary plus logged-in users"
metadata:
  tags: [darwin, bsd, user, system]
  compatible: [macOS w]
detect:
  os: [darwin, freebsd, openbsd, netbsd]
  signature:
    all:
      - '^.*load averages: '
      - '^USER\s+TTY\s+FROM\s+LOGIN@\s+IDLE\s+WHAT\s*$'
parse:
  type: composite
  parts:
    - name: uptime
      select: {limit: 1}
      parse:
        type: regex
        each: input
        pattern: '^\s*(?P<time>\d{1,2}:\d{2}(?::\d{2})?)\s+up\s+(?P<uptime>.+?),\s+(?P<users>\d+) users?,\s+load averages: (?P<load_1m>[\d.]+) (?P<load_5m>[\d.]+) (?P<load_15m>[\d.]+)\s*$'
      fields:
        users: {type: int}
        load_1m: {type: float}
        load_5m: {type: float}
        load_15m: {type: float}
    - name: users
      select: {skip: 1}
      parse:
        type: table
        split: aligned
        header:
          rename: {login: login_at}
      # A display manager session has no terminal, FROM is blank for a
      # local login and WHAT can be "-", so those columns stay optional.
      # A row without a user or a login time is a truncated listing.
      fields:
        user: {required: true}
        login_at: {required: true}
        from: {null_if: ["-"]}
        idle: {null_if: ["-"]}
        what: {null_if: ["-"]}
