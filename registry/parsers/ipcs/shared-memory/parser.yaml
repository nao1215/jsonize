# ipcs -m: the shared memory section on its own. The banners of the other
# two sections are excluded, which is what separates this from the default
# listing that prints all three.
#
# The cells are cut on whitespace rather than at the heading offsets. The
# owner is printed in a ten-column field and a longer login name pushes
# the rest of the row to the right; the trailing status column is two
# six-column flags printed side by side, so it is left as the last cell
# and keeps whatever text follows: nothing, "dest", "locked", or both.
format: 1
command: ipcs
variant: shared-memory
description: ipcs -m shared memory segments
metadata:
  tags: [linux, ipc, util-linux]
  compatible: [util-linux]
  references:
    - https://man7.org/linux/man-pages/man1/ipcs.1.html
detect:
  os: [linux]
  signature:
    all:
      - '^-+ Shared Memory Segments -+$'
      - '^key[ \t]+shmid[ \t]+owner[ \t]+perms[ \t]+bytes[ \t]+nattch[ \t]+status[ \t]*$'
    none:
      - '^-+ Message Queues -+$'
      - '^-+ Semaphore Arrays -+$'
input:
  select:
    after: '^-+ Shared Memory Segments -+$'
parse:
  type: table
  # The status flags are blank on an ordinary segment, so the row ends
  # after nattch.
  min_fields: 6
fields:
  # The key is printed as 0x%08x and names the segment; it is an
  # identifier rather than a count.
  key: {required: true}
  shmid: {type: int, required: true}
  owner: {required: true}
  # An octal mode printed without a leading zero. Read as a number it
  # would be decimal 640 rather than rw-r-----, so the digits stay as
  # they were printed.
  perms: {required: true}
  bytes: {type: int}
  nattch: {type: int}
  status: {}
