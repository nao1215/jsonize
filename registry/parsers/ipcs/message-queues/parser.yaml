# ipcs -q: the message queue section on its own, so the result is the
# list of queues rather than an object with one populated part. The
# banners of the other two sections are excluded, which is what separates
# this from the default listing that prints all three; no detect.args is
# needed for that, and writing one would only reject an invocation that
# reaches the same format by another spelling.
#
# The cells are cut on whitespace rather than at the heading offsets: the
# owner is printed in a ten-column field and a longer login name pushes
# the rest of the row to the right.
format: 1
command: ipcs
variant: message-queues
description: ipcs -q message queues
metadata:
  tags: [linux, ipc, util-linux]
  compatible: [util-linux]
  references:
    - https://man7.org/linux/man-pages/man1/ipcs.1.html
detect:
  os: [linux]
  signature:
    # The whole of the output is this one section: the banner, its
    # heading, and rows of that shape to the end. `ipcs` with no option
    # prints three sections, and its second banner is where this
    # expression stops short of the end rather than something the
    # definition has to name and exclude.
    window: 200
    all:
      - '\A(?:[ \t]*\n)*-+ Message Queues -+[ \t]*\nkey[ \t]+msqid[ \t]+owner[ \t]+perms[ \t]+used-bytes[ \t]+messages[ \t]*(?:\n(?:0x[0-9a-fA-F]+[ \t]+\d+(?:[ \t]+\S+)*[ \t]*|[ \t]*))*\z'
input:
  select:
    after: '^-+ Message Queues -+$'
parse:
  type: table
fields:
  # The key is printed as 0x%08x and names the queue; it is an identifier
  # rather than a count.
  key: {required: true}
  msqid: {type: int, required: true}
  owner: {required: true}
  # An octal mode printed without a leading zero. Read as a number it
  # would be decimal 660 rather than rw-rw----, so the digits stay as
  # they were printed.
  perms: {required: true}
  used_bytes: {type: int}
  messages: {type: int}
