format: 1
command: id
variant: posix
aliases:
  # macOS installs GNU coreutils under a g prefix, and the g name prints
  # what the command prints.
  - name: gid
description: id output with nested uid/gid/groups and optional SELinux context
metadata:
  tags: [linux, darwin, user]
  compatible: [GNU coreutils, BusyBox, macOS id]
  references:
    - https://www.gnu.org/software/coreutils/manual/html_node/id-invocation.html
detect:
  signature:
    all:
      # id prints one line and nothing else, so the line is the start of
      # the text. Anchored at a line instead, this claimed every report
      # that mentions a uid somewhere further down: `capsh --print` ends
      # with the process identity in exactly this shape.
      - '\Auid=\d+'
parse:
  type: regex
  each: input
  pattern: '^uid=(?P<uid>\S+) gid=(?P<gid>\S+)(?: groups=(?P<groups>\S+))?(?: context=(?P<context>\S+))?\s*$'
fields:
  uid:
    type: object
    regex: '^(?P<id>\d+)(?:\((?P<name>[^)]*)\))?$'
    fields:
      id: {type: int}
  gid:
    type: object
    regex: '^(?P<id>\d+)(?:\((?P<name>[^)]*)\))?$'
    fields:
      id: {type: int}
  groups:
    type: array
    split: ","
    items:
      type: object
      regex: '^(?P<id>\d+)(?:\((?P<name>[^)]*)\))?$'
      fields:
        id: {type: int}
  context:
    type: object
    when_missing: omit
    regex: '^(?P<user>[^:]+):(?P<role>[^:]+):(?P<type>[^:]+):(?P<level>.+)$'
