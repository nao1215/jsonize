# `pidstat -r` prints the same banner and shape as the default report
# with memory columns instead of CPU ones. The two are told apart by the
# fourth column name, %usr in one and minflt/s in the other.
#
# The fault counts are rates and are floats; the sizes are exact
# kilobytes and are integers. Command is last and keeps the rest of the
# line, because a task name can contain spaces ("Socket Process").
#
# Asked for an interval, pidstat closes with a summary block and prints
# the column names again above it. That repeat is dropped; the rows under
# it are labelled Average instead of with a time, and the trailing colon
# that only those rows carry is trimmed.
format: 1
command: pidstat
variant: memory
description: pidstat -r per-task memory use
metadata:
  tags: [linux, memory, process, sysstat]
  compatible: [sysstat]
  references:
    - https://man7.org/linux/man-pages/man1/pidstat.1.html
detect:
  os: [linux]
  signature:
    all:
      - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[ \t]+\S+[ \t]+_\S+_'
      - '^[0-9]{2}:[0-9]{2}:[0-9]{2}[ \t]+UID[ \t]+PID[ \t]+minflt/s'
input:
  ignore:
    - '^Average:[ \t]+UID[ \t]+PID[ \t]+minflt/s'
parse:
  type: composite
  parts:
    - name: report
      select: {limit: 1}
      parse:
        type: regex
        each: input
        pattern: '\ALinux[ \t]+(?P<kernel>\S+)[ \t]+\((?P<hostname>[^)]*)\)[ \t]+(?P<date>\S+)[ \t]+_(?P<architecture>.+?)_[ \t]+\((?P<cpu_count>[0-9]+)[ \t]+CPU\)[ \t]*\z'
      fields:
        cpu_count: {type: int}
    - name: tasks
      select: {skip: 1}
      parse:
        type: table
        header:
          columns: [time, uid, pid, minflt_s, majflt_s, vsz, rss, mem_percent, command]
      fields:
        time: {required: true, trim_suffix: ":"}
        uid: {type: int}
        pid: {type: int, required: true}
        minflt_s: {type: float}
        majflt_s: {type: float}
        vsz: {type: int}
        rss: {type: int}
        mem_percent: {type: float}
        command: {required: true}
