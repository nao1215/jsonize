# A sysstat report is a run of samples: the banner names the machine
# once, and everything after it repeats once per interval, column header
# and all. Reading it as an array of samples is what lets an interval run
# be read at all (the second header used to reach the table as a row) and
# what lets --stream hand over a sample as soon as it is complete. The
# closing summary block is a sample of its own, whose rows are labelled
# Average instead of with a time.
#
# The banner is dropped with it. It carries the kernel, the host and the
# CPU count, which `uname -a` and `nproc` also print and jz also reads;
# what it does not carry is a sample, and a shape that had one object for
# it and an array for the rest could not be streamed.
format: 1
command: pidstat
variant: linux
description: pidstat per-task CPU utilisation
metadata:
  tags: [linux, cpu, process, sysstat]
  compatible: [sysstat]
  references:
    - https://man7.org/linux/man-pages/man1/pidstat.1.html
detect:
  os: [linux]
  signature:
    all:
      - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[ \t]+\S+[ \t]+_\S+_'
      - '^[0-9]{2}:[0-9]{2}:[0-9]{2}[ \t]+UID[ \t]+PID[ \t]+%usr'
input:
  select:
    # The banner is stated whole, so what is dropped is exactly the line
    # described above and not whatever happens to open with "Linux".
    after: '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[ \t]+\S+[ \t]+_\S+_[ \t]+\(\d+ CPU\)'
parse:
  type: records
  # A sample opens with the column header and runs to the next one.
  start: '^(?:[0-9]{2}:[0-9]{2}:[0-9]{2}|Average:)[ \t]+UID[ \t]+PID[ \t]+%usr'
  parts:
    - name: tasks
      parse:
        type: table
        header:
          columns: [time, uid, pid, usr_percent, system_percent, guest_percent, wait_percent, cpu_percent, cpu, command]
      fields:
        time: {required: true, trim_suffix: ":"}
        uid: {type: int}
        pid: {type: int, required: true}
        usr_percent: {type: float}
        system_percent: {type: float}
        guest_percent: {type: float}
        wait_percent: {type: float}
        cpu_percent: {type: float}
        # A summary row is not about one processor and prints a dash
        # where the number goes.
        cpu: {type: int, null_if: ["-"]}
        command: {required: true}
