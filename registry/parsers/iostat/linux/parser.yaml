# A sysstat report is a run of samples: the banner names the machine
# once, and everything after it repeats once per interval. Reading it as
# an array of samples is what lets `iostat 1 3` be read at all (the
# second header used to reach a table as a row) and what lets --stream
# hand over a sample as soon as it is complete.
#
# The banner is dropped with it. It carries the kernel, the host and the
# CPU count, which `uname -a` and `nproc` also print and jz also reads;
# what it does not carry is a sample, and a shape that had one object for
# it and an array for the rest could not be streamed.
format: 1
command: iostat
variant: linux
description: iostat default report, one sample of CPU averages and per-device counters
metadata:
  tags: [linux, io, cpu, sysstat]
  compatible: [sysstat]
  references:
    - https://man7.org/linux/man-pages/man1/iostat.1.html
detect:
  os: [linux]
  signature:
    all:
      - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[ \t]+\S+[ \t]+_\S+_'
      - '^avg-cpu:[ \t]+%user[ \t]+%nice'
      - '^Device[ \t]+tps[ \t]'
input:
  select:
    # The banner is stated whole, so what is dropped is exactly the line
    # described above and not whatever happens to open with "Linux".
    after: '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[ \t]+\S+[ \t]+_\S+_[ \t]+\(\d+ CPU\)'
parse:
  type: records
  # A sample opens with the avg-cpu header and runs to the next one.
  start: '^avg-cpu:[ \t]'
  parts:
    # The avg-cpu header carries a leading "avg-cpu:" label that the rows do
    # not repeat, so the column names are declared instead of derived.
    - name: cpu
      select: {limit: 2}
      parse:
        type: table
        header:
          columns: [user_percent, nice_percent, system_percent, iowait_percent, steal_percent, idle_percent]
      fields:
        user_percent: {type: float, required: true}
        nice_percent: {type: float}
        system_percent: {type: float}
        iowait_percent: {type: float}
        steal_percent: {type: float}
        idle_percent: {type: float}
    # The device columns differ between sysstat releases (kB_dscd was added
    # for discards), so they are taken from the header line as printed.
    - name: devices
      select: {skip: 2}
      parse:
        type: table
      fields:
        device: {required: true}
        tps: {type: float}
        kb_read_s: {type: float}
        kb_wrtn_s: {type: float}
        kb_dscd_s: {type: float}
        kb_read: {type: int}
        kb_wrtn: {type: int}
        kb_dscd: {type: int}
        # -m prints the same figures in megabytes, under names of its own.
        mb_read_s: {type: float}
        mb_wrtn_s: {type: float}
        mb_dscd_s: {type: float}
        mb_read: {type: int}
        mb_wrtn: {type: int}
        mb_dscd: {type: int}
