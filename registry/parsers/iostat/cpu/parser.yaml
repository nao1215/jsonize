# A sysstat report is a run of samples: the banner names the machine
# once, and everything after it repeats once per interval. Reading it as
# an array of samples is what lets `iostat 1 3` be read at all (the
# second header used to reach a table as a row) and what lets --stream
# hand over a sample as soon as it is complete.
#
# The banner is dropped with it. It carries the kernel, the host and the
# CPU count, which `uname -a` and `nproc` also print and jz also reads;
# what it does not carry is a sample, and a shape that had one object for
# it and an array for the rest could not be streamed.
format: 1
command: iostat
variant: cpu
description: iostat -c, one sample of CPU averages without the device table
metadata:
  tags: [linux, cpu, sysstat]
  compatible: [sysstat]
  references:
    - https://man7.org/linux/man-pages/man1/iostat.1.html
detect:
  os: [linux]
  signature:
    all:
      - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[ \t]+\S+[ \t]+_\S+_'
      - '^avg-cpu:[ \t]+%user[ \t]+%nice'
    none:
      # Any device table, whether the default one that opens with tps or
      # the extended one that opens with r/s, means this is a fuller
      # report and not the CPU one.
      - '^Device[ \t]+\S'
input:
  select:
    after: '\ALinux[ \t]'
parse:
  type: records
  start: '^avg-cpu:[ \t]'
  parts:
    - name: cpu
      parse:
        type: table
        header:
          columns: [user_percent, nice_percent, system_percent, iowait_percent, steal_percent, idle_percent]
      fields:
        user_percent: {type: float, required: true}
        nice_percent: {type: float}
        system_percent: {type: float}
        iowait_percent: {type: float}
        steal_percent: {type: float}
        idle_percent: {type: float}
