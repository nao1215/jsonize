# iostat -c prints the banner and the avg-cpu table only. The device table
# is excluded by the signature so that the default report cannot land here.
format: 1
command: iostat
variant: cpu
description: iostat -c, CPU averages without the device table
metadata:
  tags: [linux, cpu, sysstat]
  compatible: [sysstat]
  references:
    - https://man7.org/linux/man-pages/man1/iostat.1.html
detect:
  os: [linux]
  signature:
    all:
      - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[ \t]+\S+[ \t]+_\S+_'
      - '^avg-cpu:[ \t]+%user[ \t]+%nice'
    none:
      - '^Device[ \t]+tps[ \t]'
parse:
  type: composite
  parts:
    - name: report
      select: {limit: 1}
      parse:
        type: regex
        each: input
        pattern: '\ALinux[ \t]+(?P<kernel>\S+)[ \t]+\((?P<hostname>[^)]*)\)[ \t]+(?P<date>\S+)[ \t]+_(?P<architecture>.+?)_[ \t]+\((?P<cpu_count>[0-9]+)[ \t]+CPU\)[ \t]*\z'
      fields:
        cpu_count: {type: int}
    # A repeated run (iostat -c 1 2) prints the header again between the
    # samples; that second header reaches this table as a row and is
    # reported as a conversion error rather than being dropped.
    - name: cpu
      select: {skip: 1}
      parse:
        type: table
        header:
          columns: [user_percent, nice_percent, system_percent, iowait_percent, steal_percent, idle_percent]
      fields:
        user_percent: {type: float, required: true}
        nice_percent: {type: float}
        system_percent: {type: float}
        iowait_percent: {type: float}
        steal_percent: {type: float}
        idle_percent: {type: float}
