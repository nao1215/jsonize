# A sysstat report is a run of samples: the banner names the machine
# once, and everything after it repeats once per interval. Reading it as
# an array of samples is what lets `iostat 1 3` be read at all (the
# second header used to reach a table as a row) and what lets --stream
# hand over a sample as soon as it is complete.
#
# The banner is dropped with it. It carries the kernel, the host and the
# CPU count, which `uname -a` and `nproc` also print and jz also reads;
# what it does not carry is a sample, and a shape that had one object for
# it and an array for the rest could not be streamed.
format: 1
command: iostat
variant: device
description: iostat -d, one sample of per-device counters without the CPU table
metadata:
  tags: [linux, io, sysstat]
  compatible: [sysstat]
  references:
    - https://man7.org/linux/man-pages/man1/iostat.1.html
detect:
  os: [linux]
  signature:
    all:
      - '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[ \t]+\S+[ \t]+_\S+_'
      - '^Device[ \t]+tps[ \t]'
    none:
      - '^avg-cpu:[ \t]+%user[ \t]+%nice'
input:
  select:
    # The banner is stated whole, so what is dropped is exactly the line
    # described above and not whatever happens to open with "Linux".
    after: '\ALinux[ \t]+\S+[ \t]+\([^)]*\)[ \t]+\S+[ \t]+_\S+_[ \t]+\(\d+ CPU\)'
parse:
  type: records
  start: '^Device[ \t]+tps[ \t]'
  parts:
    - name: devices
      parse:
        type: table
      fields:
        device: {required: true}
        tps: {type: float}
        kb_read_s: {type: float}
        kb_wrtn_s: {type: float}
        kb_dscd_s: {type: float}
        kb_read: {type: int}
        kb_wrtn: {type: int}
        kb_dscd: {type: int}
