# The attribute string is fixed width, with a letter per attribute and a
# dash where it is unset. The letters that are set are also listed, so a
# consumer need not know the column order.
format: 1
command: lsattr
variant: linux
description: lsattr file attributes
metadata:
  tags: [linux, filesystem, e2fsprogs]
  compatible: [e2fsprogs]
  references:
    - https://man7.org/linux/man-pages/man1/lsattr.1.html
detect:
  os: [linux]
  signature:
    all:
      # Any word followed by a path fits "word path", so the first field
      # is restricted to the attribute letters e2fsprogs prints, and it
      # has to contain at least one unset slot: a real attribute string
      # is mostly dashes. The path itself is relative when lsattr is
      # given no operand, so it cannot be required to start with a slash.
      - '\A[-aAcCdDeEFiIjmNPsStTuVx]{10,25}[ \t]+\S'
      - '\A[aAcCdDeEFiIjmNPsStTuVx]*-'
parse:
  type: regex
  # One space separates the attributes from the name, so a space after it
  # is the first character of the name. The attributes are the letters
  # and the width the signature names on every line, not only the first:
  # `total 8` is a word and a name.
  pattern: '^(?P<attributes>[-aAcCdDeEFiIjmNPsStTuVx]{10,25}) (?P<file>.+)$'
fields:
  attributes: {required: true}
  file: {required: true}
