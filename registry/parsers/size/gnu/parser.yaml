# GNU size in its default (Berkeley) format prints one row per object
# file: the sizes of the text, data and bss segments, their total in
# decimal and in hexadecimal, and the file name.
#
# The columns look right-aligned under the header, but the separator is a
# real tab and the padding only widens the cell, so the rows are cut on
# the tab rather than at the header positions. That is what keeps a name
# such as "check_fds.o (ex /usr/lib/x86_64-linux-gnu/libc.a)" — an
# archive member, spaces and all — in one piece.
#
# `size -A` (the System V format) prints a per-section table under a
# different header and is a different format; the signature refuses it.
# `size -t` appends a "(TOTALS)" row, which is an ordinary row here.
#
# hex is the same number as dec written in base 16. It stays a string
# because that is what the command printed; the decimal value is next to
# it already.
format: 1
command: size
variant: gnu
description: GNU size Berkeley format section sizes
metadata:
  tags: [linux, binary, binutils]
  compatible: [GNU binutils]
  references:
    - https://man7.org/linux/man-pages/man1/size.1.html
detect:
  signature:
    all:
      - '\A[ \t]*text\t[ \t]*data\t[ \t]*bss\t[ \t]*dec\t[ \t]*hex\tfilename[ \t]*$'
parse:
  type: table
  split: delimiter
  delimiter: "\t"
fields:
  text: {type: int}
  data: {type: int}
  bss: {type: int}
  dec: {type: int}
  filename: {required: true}
