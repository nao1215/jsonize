# `vmstat -a` replaces the buffer and cache columns with the active and
# inactive memory ones. Everything else is the default report, so the two
# definitions are told apart by those two column names.
format: 1
command: vmstat
variant: linux-active
description: vmstat -a, active and inactive memory instead of buffers and cache
metadata:
  tags: [linux, memory, procps]
  compatible: [procps-ng]
  references:
    - https://man7.org/linux/man-pages/man8/vmstat.8.html
detect:
  os: [linux]
  signature:
    all:
      - '\Aprocs[ \t]+-+memory-+'
      - '^[ \t]*r[ \t]+b[ \t]+swpd[ \t]+free[ \t]+inact[ \t]+active[ \t]'
input:
  ignore:
    - '\Aprocs[ \t]+-'
    - '^[ \t]*r[ \t]+b[ \t]+swpd[ \t]'
parse:
  type: table
  header:
    none: true
    columns: [r, b, swpd, free, inact, active, si, so, bi, bo, in, cs, us, sy, id, wa, st, gu, timestamp]
  min_fields: 17
fields:
  r: {type: int, required: true}
  b: {type: int, required: true}
  swpd: {type: int, required: true}
  free: {type: int, required: true}
  inact: {type: int, required: true}
  active: {type: int, required: true}
  si: {type: int}
  so: {type: int}
  bi: {type: int}
  bo: {type: int}
  in: {type: int}
  cs: {type: int}
  us: {type: int}
  sy: {type: int}
  id: {type: int}
  wa: {type: int}
  st: {type: int}
  gu: {type: int, when_missing: omit}
  # -t adds the date and time of each sample, in the zone the header of
  # the column names by its abbreviation only, so it stays as printed.
  timestamp: {when_missing: omit}
