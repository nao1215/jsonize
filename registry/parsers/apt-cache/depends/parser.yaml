# `apt-cache depends PKG` prints the package and, indented under it, each
# relationship it has; a virtual package's providers are indented one
# level further. The depth is a property of the dependency graph, so it
# is read as a tree.
format: 1
command: apt-cache
variant: depends
description: apt-cache depends, what a package depends on
metadata:
  tags: [linux, debian, package]
  compatible: [APT]
  references:
    - https://manpages.debian.org/apt-cache
detect:
  args:
    any: ["depends"]
  signature:
    all:
      # The package line is followed by an indented relationship, the
      # next package, a virtual package in angle brackets, or nothing.
      # `apt-cache rdepends` follows it with a "Reverse Depends:"
      # heading, and with APT::Cache::ShowDependencyType set its entries
      # are "  Depends: pkg" lines like these; apt-cache/rdepends reads it.
      - '\A\S+[ \t]*(?:\n[ <a-z0-9]|\z)'
      - '^  (?:Pre)?Depends: \S+[ \t]*$'
parse:
  type: tree
  # A relationship ORed with the one after it is printed with "|" in the
  # second column of its indentation (" |PreDepends: x"). The one-space
  # unit takes the blank in front of the "|", so the mark stays in the
  # node's text and is read into alternative rather than dropped: without
  # it an alternative would read as a second relationship required too.
  indent: ["  ", " "]
  # A top-level line is a package name, one word in the characters a
  # Debian package name may hold, with an architecture after a colon
  # when the query named one; a line of any other shape at the top is
  # not part of the report.
  root: '^[a-z0-9][a-z0-9+.-]*(?::[a-z0-9-]+)?[ \t]*$'
  node:
    parse:
      type: regex
      patterns:
        # A relationship names its kind; a provider under one is a bare
        # package name, and so is the package the report is about.
        - '^(?P<alternative>\|?)(?P<relation>[^|\s]\S*): (?P<package>.+?)[ \t]*$'
        - '^(?P<package>.+?)[ \t]*$'
    fields:
      package: {required: true}
      relation: {when_missing: omit}
      # true when this relationship is ORed with the next one
      alternative: {type: bool, true_values: ["|"], false_values: [""], when_missing: omit}
