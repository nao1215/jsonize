# `ethtool -i` is the one ethtool form whose whole output is "key: value"
# on a single line each. The five supports- keys are yes/no answers, so
# they become booleans; a driver that cannot answer prints "N/A".
format: 1
command: ethtool
variant: driver-info
description: ethtool -i driver information
metadata:
  tags: [linux, network, ethtool]
  compatible: [ethtool]
  references:
    - https://man7.org/linux/man-pages/man8/ethtool.8.html
detect:
  os: [linux]
  args:
    any: ["-i", "--driver"]
  signature:
    all:
      # ethtool -i prints these ten lines in this order and nothing
      # else, so a line after the last is another command's and is
      # refused rather than read as one more property.
      - '\Adriver:[^\n]*\nversion:[^\n]*\nfirmware-version:[^\n]*\nexpansion-rom-version:[^\n]*\nbus-info:[^\n]*\nsupports-statistics:[^\n]*\nsupports-test:[^\n]*\nsupports-eeprom-access:[^\n]*\nsupports-register-dump:[^\n]*\nsupports-priv-flags:[^\n]*\n?\z'
parse:
  type: kv
  separator: ":"
  as: map
fields:
  driver: {required: true}
  firmware-version: {null_if: ["N/A"]}
  bus-info: {null_if: ["N/A"]}
  supports-statistics: {type: bool}
  supports-test: {type: bool}
  supports-eeprom-access: {type: bool}
  supports-register-dump: {type: bool}
  supports-priv-flags: {type: bool}
