description: >-
  `git log --stat` is not the default format. Its diffstat sits inside the
  commit block, unindented, where the message would be, and git/log-stat
  is the definition that reads it. This one refuses it by the closing
  count line rather than reporting the file statistics as lines of the
  commit message.
source: git 2.43 on Linux, `git log --stat`
expect_error: 'does not describe this input'
