# `--oneline` is `--pretty=oneline --abbrev-commit`: an abbreviated object
# name, one space and the subject. A commit with an empty message prints
# the space and nothing after it, so the subject is an empty string there.
#
# `--graph` draws the history with |, / and \ in front of the commit, and
# `--decorate` inserts "(HEAD -> main)" between the object name and the
# subject; neither is this format and the signature refuses both.
format: 1
command: git
variant: log-oneline
description: git log --oneline
metadata:
  tags: [git, vcs]
  compatible: [git]
  references:
    - https://git-scm.com/docs/git-log#Documentation/git-log.txt---oneline
detect:
  args:
    any: ["log"]
    # These put names or hashes before the subject, which cannot be told
    # from a subject that opens the same way. log.decorate in a user's
    # configuration does the same without an argument and is not seen.
    none: ["--decorate", "--decorate=short", "--decorate=full", "--parents", "--children"]
  # A hexadecimal word and a line of text is the shape of far too many
  # reports to claim on sight, so jz reads it only when the parser is
  # named (`jz run git log --oneline`, `--parser git`).
  auto_detect: false
  signature:
    all:
      # An abbreviated commit hash, one space, and the subject. The upper
      # bound is what jz undertakes to read. git sizes the abbreviation
      # to the number of objects in the repository, so it is seven digits
      # for a young one and grows by a digit every sixteenfold; fifteen
      # is past what any repository reaches. Sixteen is where a symbol
      # table starts: `nm` prints a zero padded sixty-four bit address
      # and then a one letter type, which is a hexadecimal word and a
      # line of text like any other, and was read as a commit until this
      # bound came down from twenty. A digest listing is the same shape
      # again but its hash is a fixed 32, 40 or 64 digits, none of which
      # leaves a space where this expression wants one, so md5sum,
      # sha1sum and sha256sum are not this format rather than being
      # excluded from it. `git log --no-abbrev --oneline` and
      # `--abbrev=16` fall outside for the same reason, and say so by
      # failing rather than by being read as something else.
      - '\A[0-9a-f]{7,15} '
    any:
      # The subject, which a commit may leave empty. What it is never is
      # a bare number: that second column belongs to `cksum`, which
      # writes a checksum, a size and a name.
      - '\A[0-9a-f]{7,15}[ \t]*$'
      - '\A[0-9a-f]{7,15} \S*[^\s\d]'
parse:
  type: regex
  pattern: '^(?P<commit>[0-9a-f]{4,40}) (?P<subject>.*)$'
fields:
  commit: {required: true}
