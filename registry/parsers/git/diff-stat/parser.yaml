# `--stat` is the human-readable summary: one line per path with the
# number of changed lines and a bar, then a closing line counting the
# files, the insertions and the deletions. The two shapes are read as two
# parts, so the closing line does not become a row with empty columns in
# the middle of the file list.
#
# What the file lines carry is what git printed, which is less than the
# truth in two places. The bar is scaled to the width of the terminal
# (80 columns when the output is a pipe), so its plus and minus signs are
# a picture rather than a count of insertions and deletions, and it stays
# the string it was drawn as. A path too long for the column is printed
# elided from the left ("..." and the tail), and a rename is elided the
# same way. `git diff --numstat` prints both exactly, and this definition
# is for the report a person was meant to read.
#
# A file git treats as binary has no line count and prints the two sizes
# instead, or the word "Bin" alone when neither side has a size.
format: 1
command: git
variant: diff-stat
description: git diff --stat summary of changed files
metadata:
  tags: [git, vcs]
  compatible: [git]
  references:
    - https://git-scm.com/docs/git-diff#Documentation/git-diff.txt---stat
detect:
  args:
    any: ["diff"]
    # --numstat prints its own format, which git/diff-numstat reads, and
    # a diff with nothing in it prints nothing either way: the variants
    # an empty output is judged against have to be that one alone.
    none: ["--numstat"]
  signature:
    all:
      # The first line has to be a file line, which keeps out
      # `git log --stat` and `git show --stat`: they print the same
      # summary under a commit header and are a different format. The
      # closing line is no use as evidence, because a diff of more than
      # twenty files pushes it past the end of the window.
      - '\A .+ \|[ ]+(?:\d+|Bin)'
      # Every line in the window is a file line, and the closing line
      # follows the last of them.
      - '\A(?: [^\n]*? \|[ ]+(?:\d+(?: [+-]+)?|Bin(?: \d+ -> \d+ bytes)?)\n)* [^\n]*? \|[ ]+(?:\d+(?: [+-]+)?|Bin(?: \d+ -> \d+ bytes)?)(?:\n \d+ files? changed(?:, \d+ insertions?\(\+\))?(?:, \d+ deletions?\(-\))?)?\z'
    any:
      # git pads every count to the width of the largest one plus a
      # space, so some line has a count field other than five characters
      # wide, or holds the four-digit count that made it five. diffstat
      # always prints a field five characters wide, and a text whose
      # counts are all shorter than four digits in such a field is its
      # output, not git's (diffstat/default).
      - '(?m)^ [^\n]*? \|(?: \d{1,4}| {2}\d{1,2}| {3}\d| {5,}\d| {4,}\d\d| {3,}\d{3}| {2,}\d{4}| \d{5,}| Bin)(?: |$)'
    window: 200
parse:
  type: composite
  parts:
    - name: files
      select: {until: '^[ ]+\d+ files? changed(?:,|$)'}
      parse:
        type: regex
        pattern: '^ (?P<path>.*?)[ ]+\|[ ]+(?:(?P<changes>\d+)(?: (?P<graph>[+-]+))?|Bin(?: (?P<old_bytes>\d+) -> (?P<new_bytes>\d+) bytes)?)$'
      fields:
        path: {required: true}
        changes: {type: int}
        old_bytes: {type: int}
        new_bytes: {type: int}
    - name: summary
      parse:
        type: regex
        each: input
        pattern: '(?m)^[ ]+(?P<files_changed>\d+) files? changed(?:, (?P<insertions>\d+) insertions?\(\+\))?(?:, (?P<deletions>\d+) deletions?\(-\))?$'
      fields:
        files_changed: {type: int, required: true}
        insertions: {type: int}
        deletions: {type: int}
