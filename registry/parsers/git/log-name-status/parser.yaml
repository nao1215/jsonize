# `git log --name-status` prints each commit the way git/log reads it,
# then a blank line and one line per changed path: the status letter, a
# tab and the path. A rename or a copy adds the similarity score to the
# letter and the new path after a second tab, as git/diff-name-status
# reads it. A merge commit prints no paths.
format: 1
command: git
variant: log-name-status
description: git log --name-status, each commit with the status of each changed path
metadata:
  tags: [git, vcs]
  compatible: [git]
  references:
    - https://git-scm.com/docs/git-log#Documentation/git-log.txt---name-status
detect:
  args:
    any: ["--name-status"]
    none: ["--stat", "--stat=", "--shortstat", "--name-only", "--numstat", "-p", "-u", "--patch", "--raw", "--summary", "--oneline", "--graph"]
  signature:
    all:
      - '\Acommit [0-9a-f]{7,40}\b'
      - '^Author:[ \t]'
      - '^(?:[ADMTUXB]|[RC][0-9]{3})\t\S'
    window: 200
  # git/log's signature holds for this text when the first path line is
  # past its window; this variant is the one that reads the paths.
  priority: 1
input:
  skip_blank: false
parse:
  type: records
  start: '^commit [0-9a-f]{7,40}\b'
  parts:
    - name: commit
      select: {limit: 1}
      parse:
        type: regex
        each: input
        pattern: '\Acommit (?P<hash>[0-9a-f]{7,40})(?: \((?P<refs>[^)]*)\))?[ \t]*$'
      fields:
        hash: {required: true}
        refs: {type: array, split: ",", when_missing: omit}
    - name: headers
      select: {skip: 1, until: '^[ \t]*$'}
      parse:
        type: kv
        separator: ":"
        as: map
    # The message ends at the first line that is not indented, where the
    # paths begin.
    - name: message
      select: {after: '^[ \t]*$', until: '^[^ \t]'}
      parse:
        type: regex
        each: input
        pattern: '(?s)\A(?P<lines>(?:[ ]{4}[^\n]*|[ \t]*)(?:\n(?:[ ]{4}[^\n]*|[ \t]*))*?)[ \t\r\n]*\z'
      fields:
        lines: {type: array, split: "\n"}
    - name: files
      select: {after: '^[ \t]*$'}
      ignore:
        - '^[ ]{4}'
        - '^[ \t]*$'
      parse:
        type: regex
        patterns:
          - '^(?P<status>[RC])(?P<score>[0-9]{3})\t(?P<path>[^\t]+)\t(?P<new_path>[^\t]+)$'
          - '^(?P<status>[ADMTUXB])(?P<score>)??\t(?P<path>[^\t]+)(?P<new_path>)??$'
      fields:
        status: {required: true}
        score: {type: int}
        path: {required: true, unescape: {quote: '"', octal: true, sequences: {'\\': '\', '\"': '"', '\a': "\a", '\b': "\b", '\t': "\t", '\n': "\n", '\v': "\v", '\f': "\f", '\r': "\r"}}}
        new_path: {unescape: {quote: '"', octal: true, sequences: {'\\': '\', '\"': '"', '\a': "\a", '\b': "\b", '\t': "\t", '\n': "\n", '\v': "\v", '\f': "\f", '\r': "\r"}}}
