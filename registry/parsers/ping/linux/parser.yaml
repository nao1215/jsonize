# ping is a header, one line per reply and a summary. The three parts
# have nothing in common, so they are three parts of a composite result
# rather than a flat list of dissimilar rows.
format: 1
command: ping
variant: linux
aliases:
  - name: ping6
description: ping replies and summary (iputils)
metadata:
  tags: [linux, network]
  compatible: [iputils]
  references:
    - https://man7.org/linux/man-pages/man8/ping.8.html
detect:
  os: [linux]
  signature:
    all:
      - '\APING \S+ \([\d.:a-f]+\) \d+\(\d+\) bytes of data\.'
      - '^--- \S+ ping statistics ---$'
parse:
  type: composite
  parts:
    - name: destination
      select: {limit: 1}
      parse:
        type: regex
        each: input
        pattern: '^PING (?P<name>\S+) \((?P<address>[^)]+)\) (?P<data_bytes>\d+)\((?P<packet_bytes>\d+)\) bytes of data\.$'
      fields:
        data_bytes: {type: int}
        packet_bytes: {type: int}
    - name: replies
      select: {after: 'bytes of data\.', until: '^--- '}
      parse:
        type: regex
        on_mismatch: skip
        pattern: '^(?P<bytes>\d+) bytes from (?P<responder>[^:]+): icmp_seq=(?P<icmp_seq>\d+) ttl=(?P<ttl>\d+) time=(?P<time_ms>[\d.]+) ms$'
      fields:
        bytes: {type: int}
        icmp_seq: {type: int}
        ttl: {type: int}
        time_ms: {type: float}
    - name: statistics
      select: {after: '^--- '}
      parse:
        type: regex
        each: input
        pattern: '(?s)(?P<packets_transmitted>\d+) packets transmitted, (?P<packets_received>\d+) received, (?P<packet_loss_percent>[\d.]+)% packet loss, time (?P<time_ms>\d+)ms\nrtt min/avg/max/mdev = (?P<round_trip_min_ms>[\d.]+)/(?P<round_trip_avg_ms>[\d.]+)/(?P<round_trip_max_ms>[\d.]+)/(?P<round_trip_mdev_ms>[\d.]+) ms'
      fields:
        packets_transmitted: {type: int}
        packets_received: {type: int}
        packet_loss_percent: {type: float}
        time_ms: {type: int}
        round_trip_min_ms: {type: float}
        round_trip_avg_ms: {type: float}
        round_trip_max_ms: {type: float}
        round_trip_mdev_ms: {type: float}
