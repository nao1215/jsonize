# `systemctl list-jobs` prints the jobs the manager is running now, and
# closes with a count that repeats the number of rows. The count is
# dropped: it says nothing the array does not.
#
# A manager with nothing to do prints one line and no table at all, so
# the column names are written here rather than read from a header line
# that is not always there, and the heading is dropped where it is. An
# empty list is what that run means, not a format jz could not read.
format: 1
command: systemctl
variant: jobs
description: systemctl list-jobs, the jobs the manager is running
metadata:
  tags: [linux, systemd]
  compatible: [systemd]
  references:
    - https://www.freedesktop.org/software/systemd/man/systemctl.html
detect:
  os: [linux]
  args:
    any: ["list-jobs"]
  signature:
    any:
      - '\A[ \t]*JOB[ \t]+UNIT[ \t]+TYPE[ \t]+STATE[ \t]*$'
      - '\ANo jobs running\.[ \t]*\z'
input:
  # The count of what was listed closes the output and is read as its
  # end, so a line after it that no rule names is unread rather than
  # taken for one more row.
  select:
    until: '^[0-9]+ jobs? listed\.$'
  ignore:
    - '^[ \t]*JOB[ \t]+UNIT[ \t]+TYPE[ \t]+STATE[ \t]*$'
    - '^No jobs running\.'
parse:
  type: table
  header:
    none: true
    columns: [job, unit, type, state]
fields:
  job: {type: int, required: true}
  unit: {required: true}
  type: {required: true}
  state: {required: true}
