# `systemctl list-units` is an aligned table with a leading marker column
# that is blank for a healthy unit and "*" (or another glyph) for one
# that needs attention. The marker is reported rather than dropped.
format: 1
command: systemctl
variant: units
description: systemctl list-units table
metadata:
  tags: [linux, systemd, service]
  compatible: [systemd]
  references:
    - https://www.freedesktop.org/software/systemd/man/systemctl.html
detect:
  os: [linux]
  signature:
    all:
      - '\A\s*UNIT\s+LOAD\s+ACTIVE\s+SUB\s+DESCRIPTION\s*$'
input:
  ignore:
    - '\A\s*UNIT\s+LOAD'
    - '^\s*$'
    - '^\d+ loaded units listed'
    - '^To show all installed unit files'
    - '^Legend:'
    - '^LOAD\s+='
    # The legend points with "->" in the C locale and with an arrow
    # character in a UTF-8 one.
    - '^\s+(?:LOAD|ACTIVE|SUB)\s+(?:->|→)'
    - '^LOAD\s+(?:->|→)'
    - '^ACTIVE\s+='
    - '^SUB\s+='
parse:
  type: regex
  # The three states are lower-case words ("not-found", "activating"),
  # which is what keeps a line of prose, a legend written some other way,
  # from being read as a unit.
  pattern: '^(?P<marker>\S)?\s+(?P<unit>\S+)\s+(?P<load>[a-z][a-z-]*)\s+(?P<active>[a-z][a-z-]*)\s+(?P<sub>[a-z][a-z-]*)\s+(?P<description>.+?)\s*$'
fields:
  marker: {when_missing: omit}
  unit: {required: true}
  load: {required: true}
  active: {required: true}
  sub: {required: true}
  description: {required: true}
