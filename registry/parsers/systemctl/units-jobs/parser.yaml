# `systemctl list-units` while a listed unit has a job pending: a JOB
# column appears between SUB and DESCRIPTION, filled on that unit and
# blank on the others. systemctl/units reads the table without it.
#
# The job ("start") is a word a description could begin with too, so the
# rows are cut where the header's words start rather than matched word by
# word. A unit without a job reads the same as it does in systemctl/units.
#
# The header is indented by the width of the marker column, and that
# indentation is what this definition reads: with --plain there is no
# marker column and the header starts at the left edge, which is
# systemctl/units-jobs-plain.
format: 1
command: systemctl
variant: units-jobs
description: systemctl list-units table while a job is pending
metadata:
  tags: [linux, systemd, service]
  compatible: [systemd]
  references:
    - https://www.freedesktop.org/software/systemd/man/systemctl.html
detect:
  os: [linux]
  signature:
    all:
      - '\A[ \t]+UNIT\s+LOAD\s+ACTIVE\s+SUB\s+JOB\s+DESCRIPTION\s*$'
input:
  # The count of what was listed closes the output and is read as its
  # end, so a line after it that no rule names is unread rather than
  # taken for one more row.
  select:
    until: '^\d+ loaded units listed\.(?: Pass --all to see loaded but inactive units, too\.)?$'
  ignore:
    - '^\s*$'
    - '^To show all installed unit files'
    - '^Legend:'
    # "->" in the C locale, an arrow character in a UTF-8 one.
    - '^\s+(?:LOAD|ACTIVE|SUB|JOB)\s+(?:->|→)'
parse:
  type: table
  split: aligned
  header:
    leading_label: marker
    columns: [marker, unit, load, active, sub, job, description]
fields:
  marker: {when_missing: omit}
  unit: {required: true}
  # The states systemd documents for the two columns, which is what tells
  # a unit's row from six columns of another table.
  load: {required: true, regex: '(?P<load>loaded|not-found|bad-setting|error|masked|merged|stub)'}
  active: {required: true, regex: '(?P<active>active|reloading|inactive|failed|activating|deactivating|maintenance|refreshing)'}
  sub: {required: true}
  job: {when_missing: omit}
  description: {required: true}
