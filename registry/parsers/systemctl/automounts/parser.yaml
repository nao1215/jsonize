# `systemctl list-automounts` prints what is mounted on demand, where,
# whether it is mounted now, its idle timeout and the automount unit. The
# timeout is a printed duration and is empty when none is set; "yes" and
# "no" say whether the mount is there. A path can contain a space, so the
# row is cut where the header words start rather than on runs of
# whitespace.
format: 1
command: systemctl
variant: automounts
description: systemctl list-automounts table
metadata:
  tags: [linux, systemd]
  compatible: [systemd]
  references:
    - https://www.freedesktop.org/software/systemd/man/systemctl.html
detect:
  os: [linux]
  signature:
    all:
      - '\A[ \t]*WHAT[ \t]+WHERE[ \t]+MOUNTED[ \t]+IDLE TIMEOUT[ \t]+UNIT[ \t]*$'
input:
  ignore:
    - '^[0-9]+ automounts? listed\.$'
    - '^Pass --all to see loaded but inactive automounts, too\.$'
parse:
  type: table
  split: aligned
  # The idle timeout is one column under a heading of two words, which
  # naming it idle_timeout says. With --all systemd can also list an
  # automount with nothing under WHERE, and where is then null.
  header:
    columns: [what, where, mounted, idle_timeout, unit]
fields:
  what: {required: true}
  mounted: {type: bool, required: true, true_values: [yes], false_values: [no]}
  # systemd prints a dash where no timeout is set, and otherwise a
  # duration in its own spelling ("30s", "1min 30s"), which is kept as
  # printed for the reason every other printed duration is.
  idle_timeout: {null_if: ["-"]}
  unit: {required: true, regex: '(?P<unit>\S+\.automount)'}
