version: "1"

suite:
  name: real commands on macOS

# The bsd variants ship transcribed fixtures; this suite is what proves
# them against the real binaries on the macOS CI runner.
scenarios:
  - name: df selects the bsd variants
    only: {os: darwin}
    steps:
      - run:
          command: jz run --meta df
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.variant", equals: bsd }
              - { path: "$.data[0].mounted_on", equals: / }
              - { path: "$.data[0].512_blocks", gt: 0 }
      - run:
          command: jz run --meta df -h
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.variant", equals: bsd-human }
              - { path: "$.data[0].size", matches: "^[0-9.]+[KMGTP]i?$" }

  - name: uptime, ps, mount, uname, id, du and wc
    only: {os: darwin}
    steps:
      - run:
          command: jz run --meta uptime
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.variant", equals: bsd }
              - { path: "$.data.load_1m", gte: 0 }
      - run:
          command: jz run --meta ps -ef
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.variant", equals: unix }
              - { path: "$.data[0].pid", equals: 1 }
      - run:
          command: jz run --meta ps aux
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.variant", equals: bsd }
              - { path: "$.data[0].command", matches: ".+" }
      - run:
          command: jz run --meta mount
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.variant", equals: bsd }
              - { path: "$.data[0].mount_point", equals: / }
              - { path: "$.data[0].type", matches: "^[a-z]+$" }
      - run:
          command: jz run uname -a
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.kernel_name", equals: Darwin }
              - { path: "$.machine", matches: "^(arm64|x86_64)$" }
      - run:
          command: jz run id
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$.gid.name", matches: ".+" }
      - run:
          command: jz run du -s .
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].name", equals: "." }
      - fixture:
          file: words.txt
          content: "one two\nthree\n"
      - run:
          command: jz run wc words.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].lines", equals: 2 }
              - { path: "$[0].words", equals: 3 }
              - { path: "$[0].filename", equals: words.txt }

  - name: piping a real command into jz identifies it without any hint
    only: {os: darwin}
    steps:
      - run:
          shell: true
          command: LC_ALL=C df | jz --meta
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.parser", equals: df }
              - { path: "$.variant", equals: bsd }
              - { path: "$.data[0].mounted_on", equals: / }
      - run:
          shell: true
          command: LC_ALL=C uname -a | jz
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$.kernel_name", equals: Darwin }
      - run:
          shell: true
          command: LC_ALL=C mount | jz --meta
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.parser", equals: mount }
              - { path: "$.variant", equals: bsd }
