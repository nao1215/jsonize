version: "1"

suite:
  name: real commands on macOS

# The bsd variants ship transcribed fixtures; this suite is what proves
# them against the real binaries on the macOS CI runner. Nothing here is
# gated on a command being present: every command is part of macOS.
# What is pinned is which definition the real output lands on and the
# structure that differs from the GNU one, never a value of the machine's.
scenarios:
  - name: df selects the bsd variants
    only: {os: darwin}
    steps:
      - run:
          command: jz run df
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].mounted_on", equals: / }
              - { path: "$[0].512_blocks", gt: 0 }
      - run:
          command: jz run df -h
      - assert:
          exit_code: 0
          stdout:
            json:
              # -h rounds every column it can, the inode counts
              # included, so each stays the text that was printed.
              - { path: "$[0].size", matches: "^[0-9.]+[KMGTP]i?$" }
              - { path: "$[0].iused", matches: "^[0-9.]+[kKMGTP]?$" }

  - name: uptime, ps, mount, uname, id, du and wc
    only: {os: darwin}
    steps:
      - run:
          command: jz run uptime
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.load_1m", gte: 0 }
      - run:
          command: jz run ps -ef
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].pid", equals: 1 }
      - run:
          command: jz run ps aux
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].command", matches: ".+" }
      - run:
          command: jz run mount
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].mount_point", equals: / }
              - { path: "$[0].type", matches: "^[a-z]+$" }
      - run:
          command: jz run uname -a
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.kernel_name", equals: Darwin }
              - { path: "$.machine", matches: "^(arm64|x86_64)$" }
      - run:
          command: jz run id
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$.gid.name", matches: ".+" }
      - run:
          command: jz run du -s .
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].name", equals: "." }
      - fixture:
          file: words.txt
          content: "one two\nthree\n"
      - run:
          command: jz run wc words.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].lines", equals: 2 }
              - { path: "$[0].words", equals: 3 }
              - { path: "$[0].filename", equals: words.txt }

  - name: piping a real command into jz identifies it without any hint
    only: {os: darwin}
    steps:
      - run:
          shell: true
          command: LC_ALL=C df | jz
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].mounted_on", equals: / }
      - run:
          shell: true
          command: LC_ALL=C uname -a | jz
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$.kernel_name", equals: Darwin }
      - run:
          shell: true
          command: LC_ALL=C mount | jz
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].mount_point", equals: / }
              - { path: "$[0].type", matches: "^[a-z]+$" }

  # The GNU and BSD shapes of the same commands are exclusive: the real
  # BSD output is refused by the GNU definition, and the GNU fixture by
  # the BSD one. Naming the variant does not get past the signature.
  - name: the real BSD output lands on the bsd definitions and the GNU shape is refused
    only: {os: darwin}
    steps:
      - run:
          command: jz run --explain df
      - assert:
          exit_code: 0
          stderr:
            contains: "df/bsd from embedded"
      - run:
          command: jz run --explain df -h
      - assert:
          exit_code: 0
          stderr:
            contains: "df/bsd-human from embedded"
      - run:
          command: jz run --explain uptime
      - assert:
          exit_code: 0
          stderr:
            contains: "uptime/bsd from embedded"
      - run:
          command: jz run --explain ps aux
      - assert:
          exit_code: 0
          stderr:
            contains: "ps/bsd from embedded"
      - run:
          command: jz run --explain mount
      - assert:
          exit_code: 0
          stderr:
            contains: "mount/bsd from embedded"
      - run:
          command: jz run --explain uname -a
      - assert:
          exit_code: 0
          stderr:
            contains: "uname/darwin from embedded"
      - run:
          shell: true
          command: LC_ALL=C df | jz --parser df --variant gnu
      - assert:
          exit_code: 4
          stdout: {empty: true}
      - run:
          shell: true
          command: LC_ALL=C mount | jz --parser mount --variant linux
      - assert:
          exit_code: 4
          stdout: {empty: true}
      - run:
          command: jz --parser df --variant bsd --file ${specdir}/testdata/df-gnu.txt
      - assert:
          exit_code: 4
          stdout: {empty: true}

  # --stream with a real command on macOS: du names no operating system,
  # so it is selected here the way it is on Linux, and each operand is
  # one line as soon as it is read.
  - name: jz run --stream du writes one line per operand
    only: {os: darwin}
    steps:
      - fixture:
          file: a/x
          content: "x\n"
      - fixture:
          file: b/y
          content: "y\n"
      - run:
          command: jz run --stream du -s a b
      - assert:
          exit_code: 0
          stdout:
            contains: '"name":'
            count: 2
      - assert:
          stdout:
            contains: '"name":"b"'

  # ping and ping6 as macOS ships them: every runner answers on the
  # loopback, and nothing answers 192.0.2.1 (TEST-NET-1), which is how a
  # timeout and a total loss are run for real.
  - name: ping and ping6 land on ping/bsd, a timeout and a loss included
    only: {os: darwin}
    steps:
      - run:
          command: jz run --explain ping -c 2 -i 0.2 127.0.0.1
      - assert:
          exit_code: 0
          stderr:
            contains: "ping/bsd from embedded"
          stdout:
            json:
              - { path: "$.destination.address", equals: 127.0.0.1 }
              - { path: "$.replies", length: 2 }
              - { path: "$.replies[0].kind", equals: reply }
              - { path: "$.replies[0].icmp_seq", equals: 0 }
              - { path: "$.replies[0].time_ms", gte: 0 }
              - { path: "$.statistics.packets_received", equals: 2 }
              - { path: "$.statistics.round_trip_avg_ms", gte: 0 }
      - run:
          command: jz run ping6 -c 2 -i 0.2 ::1
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.destination.source", equals: "::1" }
              - { path: "$.destination.name", equals: null }
              - { path: "$.replies[1].responder", equals: "::1" }
              - { path: "$.statistics.name", equals: "::1" }
      # ping ends with status 2 when nothing came back, and jz mirrors it
      # with the JSON of what was printed.
      - run:
          command: jz run ping -c 2 -t 3 192.0.2.1
      - assert:
          exit_code: 2
          stderr:
            contains: "ping exited with status 2"
          stdout:
            json:
              - { path: "$.replies[0].kind", equals: no_answer }
              - { path: "$.statistics.packets_received", equals: 0 }
              - { path: "$.statistics.packet_loss_percent", equals: 100 }
              - { path: "$.statistics.round_trip_avg_ms", equals: null }
      - run:
          command: jz run --stream ping -c 3 -i 0.2 127.0.0.1
      - assert:
          exit_code: 0
          stdout:
            matches: '\A\{"part":"destination",[^\n]*\n(?:\{"part":"replies","value":\{"kind":"reply",[^\n]*\n){3}\{"part":"statistics","value":\{"name":"127\.0\.0\.1","packets_transmitted":3,"packets_received":3,[^\n]*\n\z'
      # The Linux variant does not read it, named or not.
      - run:
          command: jz run --parser ping --variant linux -- ping -c 1 127.0.0.1
      - assert:
          exit_code: 4
          stdout: {empty: true}

  - name: stat and stat -x land on the bsd variants for a file, a directory and a link
    only: {os: darwin}
    steps:
      - fixture:
          file: file.txt
          content: "hello\n"
      - fixture:
          file: with space.txt
          content: "x"
      - fixture:
          file: dir/.keep
          content: ""
      - fixture:
          file: link
          symlink: file.txt
      - run:
          command: jz run --explain stat ${workdir}/file.txt ${workdir}/dir ${workdir}/link "${workdir}/with space.txt"
      - assert:
          exit_code: 0
          stderr:
            contains: "stat/bsd from embedded"
          stdout:
            json:
              - { path: "$", length: 4 }
              - { path: "$[0].access_flags", matches: "^-rw" }
              - { path: "$[0].size", equals: 6 }
              - { path: "$[1].access_flags", matches: "^d" }
              - { path: "$[2].access_flags", matches: "^l" }
              - { path: "$[2].size", equals: 8 }
              - { path: "$[3].file", matches: "with space\\.txt$" }
              - { path: "$[0].modify_time", matches: "^[A-Z][a-z]{2} [ 0-9][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2} [0-9]{4}$" }
      - run:
          command: jz run stat -L ${workdir}/link
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].access_flags", matches: "^-rw" }
      - run:
          command: jz run --explain stat -x ${workdir}/file.txt ${workdir}/link
      - assert:
          exit_code: 0
          stderr:
            contains: "stat/bsd-verbose from embedded"
          stdout:
            json:
              - { path: "$", length: 2 }
              - { path: "$[0].type", equals: Regular File }
              - { path: "$[0].access_mode", matches: "^0[0-7]{3}$" }
              - { path: "$[1].type", equals: Symbolic Link }
      # A format this definition does not read is refused, not guessed.
      - run:
          command: jz run stat -r ${workdir}/file.txt
      - assert:
          exit_code: 4
          stdout: {empty: true}

  - name: jz run ls reads the names macOS ls writes to a pipe
    only: {os: darwin}
    steps:
      - fixture:
          file: dir/a b.txt
          content: ""
      - fixture:
          file: dir/日本語.txt
          content: ""
      - run:
          command: jz run ls ${workdir}/dir
      - assert:
          exit_code: 0
          stdout:
            equals: '[{"name":"a b.txt"},{"name":"日本語.txt"}]'
