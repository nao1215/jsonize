version: "1"

suite:
  name: real commands on macOS

# The bsd variants ship transcribed fixtures; this suite is what proves
# them against the real binaries on the macOS CI runner. Nothing here is
# gated on a command being present: every command is part of macOS.
# What is pinned is which definition the real output lands on and the
# structure that differs from the GNU one, never a value of the machine's.
scenarios:
  - name: df selects the bsd variants
    only: {os: darwin}
    steps:
      - run:
          command: jz run df
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].mounted_on", equals: / }
              - { path: "$[0].512_blocks", gt: 0 }
      - run:
          command: jz run df -h
      - assert:
          exit_code: 0
          stdout:
            json:
              # -h rounds every column it can, the inode counts
              # included, so each stays the text that was printed.
              - { path: "$[0].size", matches: "^[0-9.]+[KMGTP]i?$" }
              - { path: "$[0].iused", matches: "^[0-9.]+[kKMGTP]?$" }

  - name: uptime, ps, mount, uname, id, du and wc
    only: {os: darwin}
    steps:
      - run:
          command: jz run uptime
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.load_1m", gte: 0 }
      - run:
          command: jz run ps -ef
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].pid", equals: 1 }
      - run:
          command: jz run ps aux
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].command", matches: ".+" }
      - run:
          command: jz run mount
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].mount_point", equals: / }
              - { path: "$[0].type", matches: "^[a-z]+$" }
      - run:
          command: jz run uname -a
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.kernel_name", equals: Darwin }
              - { path: "$.machine", matches: "^(arm64|x86_64)$" }
      - run:
          command: jz run id
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$.gid.name", matches: ".+" }
      - run:
          command: jz run du -s .
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].name", equals: "." }
      - fixture:
          file: words.txt
          content: "one two\nthree\n"
      - run:
          command: jz run wc words.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].lines", equals: 2 }
              - { path: "$[0].words", equals: 3 }
              - { path: "$[0].filename", equals: words.txt }

  - name: piping a real command into jz identifies it without any hint
    only: {os: darwin}
    steps:
      - run:
          shell: true
          command: LC_ALL=C df | jz
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].mounted_on", equals: / }
      - run:
          shell: true
          command: LC_ALL=C uname -a | jz
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$.kernel_name", equals: Darwin }
      - run:
          shell: true
          command: LC_ALL=C mount | jz
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].mount_point", equals: / }
              - { path: "$[0].type", matches: "^[a-z]+$" }

  # The GNU and BSD shapes of the same commands are exclusive: the real
  # BSD output is refused by the GNU definition, and the GNU fixture by
  # the BSD one. Naming the variant does not get past the signature.
  - name: the real BSD output lands on the bsd definitions and the GNU shape is refused
    only: {os: darwin}
    steps:
      - run:
          command: jz run --explain df
      - assert:
          exit_code: 0
          stderr:
            contains: "df/bsd from embedded"
      - run:
          command: jz run --explain df -h
      - assert:
          exit_code: 0
          stderr:
            contains: "df/bsd-human from embedded"
      - run:
          command: jz run --explain uptime
      - assert:
          exit_code: 0
          stderr:
            contains: "uptime/bsd from embedded"
      - run:
          command: jz run --explain ps aux
      - assert:
          exit_code: 0
          stderr:
            contains: "ps/bsd from embedded"
      - run:
          command: jz run --explain mount
      - assert:
          exit_code: 0
          stderr:
            contains: "mount/bsd from embedded"
      - run:
          command: jz run --explain uname -a
      - assert:
          exit_code: 0
          stderr:
            contains: "uname/darwin from embedded"
      - run:
          shell: true
          command: LC_ALL=C df | jz --parser df --variant gnu
      - assert:
          exit_code: 4
          stdout: {empty: true}
      - run:
          shell: true
          command: LC_ALL=C mount | jz --parser mount --variant linux
      - assert:
          exit_code: 4
          stdout: {empty: true}
      - run:
          command: jz --parser df --variant bsd --file ${specdir}/testdata/df-gnu.txt
      - assert:
          exit_code: 4
          stdout: {empty: true}

  # --stream with a real command on macOS: du names no operating system,
  # so it is selected here the way it is on Linux, and each operand is
  # one line as soon as it is read.
  - name: jz run --stream du writes one line per operand
    only: {os: darwin}
    steps:
      - fixture:
          file: a/x
          content: "x\n"
      - fixture:
          file: b/y
          content: "y\n"
      - run:
          command: jz run --stream du -s a b
      - assert:
          exit_code: 0
          stdout:
            contains: '"name":'
            count: 2
      - assert:
          stdout:
            contains: '"name":"b"'

  # ping and ping6 as macOS ships them: every runner answers on the
  # loopback, and nothing answers 192.0.2.1 (TEST-NET-1), which is how a
  # timeout and a total loss are run for real.
  - name: ping and ping6 land on ping/bsd, a timeout and a loss included
    only: {os: darwin}
    steps:
      - run:
          command: jz run --explain ping -c 2 -i 0.2 127.0.0.1
      - assert:
          exit_code: 0
          stderr:
            contains: "ping/bsd from embedded"
          stdout:
            json:
              - { path: "$.destination.address", equals: 127.0.0.1 }
              - { path: "$.replies", length: 2 }
              - { path: "$.replies[0].kind", equals: reply }
              - { path: "$.replies[0].icmp_seq", equals: 0 }
              - { path: "$.replies[0].time_ms", gte: 0 }
              - { path: "$.statistics.packets_received", equals: 2 }
              - { path: "$.statistics.round_trip_avg_ms", gte: 0 }
      - run:
          command: jz run ping6 -c 2 -i 0.2 ::1
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.destination.source", equals: "::1" }
              - { path: "$.destination.name", equals: null }
              - { path: "$.replies[1].responder", equals: "::1" }
              - { path: "$.statistics.name", equals: "::1" }
      # ping ends with status 2 when nothing came back, and jz mirrors it
      # with the JSON of what was printed.
      - run:
          command: jz run ping -c 2 -t 3 192.0.2.1
      - assert:
          exit_code: 2
          stderr:
            contains: "ping exited with status 2"
          stdout:
            json:
              - { path: "$.replies[0].kind", equals: no_answer }
              - { path: "$.statistics.packets_received", equals: 0 }
              - { path: "$.statistics.packet_loss_percent", equals: 100 }
              - { path: "$.statistics.round_trip_avg_ms", equals: null }
      - run:
          command: jz run --stream ping -c 3 -i 0.2 127.0.0.1
      - assert:
          exit_code: 0
          stdout:
            matches: '\A\{"part":"destination",[^\n]*\n(?:\{"part":"replies","value":\{"kind":"reply",[^\n]*\n){3}\{"part":"statistics","value":\{"name":"127\.0\.0\.1","packets_transmitted":3,"packets_received":3,[^\n]*\n\z'
      # The Linux variant does not read it, named or not.
      - run:
          command: jz run --parser ping --variant linux -- ping -c 1 127.0.0.1
      - assert:
          exit_code: 4
          stdout: {empty: true}

  - name: stat and stat -x land on the bsd variants for a file, a directory and a link
    only: {os: darwin}
    steps:
      - fixture:
          file: file.txt
          content: "hello\n"
      - fixture:
          file: with space.txt
          content: "x"
      - fixture:
          file: dir/.keep
          content: ""
      - fixture:
          file: link
          symlink: file.txt
      - run:
          command: jz run --explain stat ${workdir}/file.txt ${workdir}/dir ${workdir}/link "${workdir}/with space.txt"
      - assert:
          exit_code: 0
          stderr:
            contains: "stat/bsd from embedded"
          stdout:
            json:
              - { path: "$", length: 4 }
              - { path: "$[0].access_flags", matches: "^-rw" }
              - { path: "$[0].size", equals: 6 }
              - { path: "$[1].access_flags", matches: "^d" }
              - { path: "$[2].access_flags", matches: "^l" }
              - { path: "$[2].size", equals: 8 }
              - { path: "$[3].file", matches: "with space\\.txt$" }
              - { path: "$[0].modify_time", matches: "^[A-Z][a-z]{2} [ 0-9][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2} [0-9]{4}$" }
      - run:
          command: jz run stat -L ${workdir}/link
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].access_flags", matches: "^-rw" }
      - run:
          command: jz run --explain stat -x ${workdir}/file.txt ${workdir}/link
      - assert:
          exit_code: 0
          stderr:
            contains: "stat/bsd-verbose from embedded"
          stdout:
            json:
              - { path: "$", length: 2 }
              - { path: "$[0].type", equals: Regular File }
              - { path: "$[0].access_mode", matches: "^0[0-7]{3}$" }
              - { path: "$[1].type", equals: Symbolic Link }
      # A format this definition does not read is refused, not guessed.
      - run:
          command: jz run stat -r ${workdir}/file.txt
      - assert:
          exit_code: 4
          stdout: {empty: true}

  - name: jz run ls reads the names macOS ls writes to a pipe
    only: {os: darwin}
    steps:
      - fixture:
          file: dir/a b.txt
          content: ""
      - fixture:
          file: dir/日本語.txt
          content: ""
      - run:
          command: jz run ls ${workdir}/dir
      - assert:
          exit_code: 0
          stdout:
            equals: '[{"name":"a b.txt"},{"name":"日本語.txt"}]'

  - name: sw_vers, vm_stat, memory_pressure and system_profiler agree with sysctl and uname
    only: {os: darwin}
    steps:
      - run:
          command: sw_vers -productVersion
      - store:
          name: version
          from:
            stdout: {trim: true}
      - run:
          command: sw_vers -buildVersion
      - store:
          name: build
          from:
            stdout: {trim: true}
      - run:
          command: jz run --explain sw_vers
      - assert:
          exit_code: 0
          stderr:
            contains: "chose sw_vers/darwin from embedded"
          stdout:
            json:
              - { path: "$.product_version", equals: "${version}" }
              - { path: "$.build_version", equals: "${build}" }
      # sw_vers with one option prints the value alone, which is not the
      # three labelled lines.
      - run:
          command: jz run --parser sw_vers -- sw_vers -productVersion
      - assert:
          exit_code: 4
          stdout: {empty: true}
      - run:
          command: sysctl -n vm.pagesize
      - store:
          name: pagesize
          from:
            stdout: {trim: true}
      - run:
          command: jz run --explain vm_stat
      - assert:
          exit_code: 0
          stderr:
            contains: "chose vm_stat/darwin from embedded"
          stdout:
            json:
              - { path: "$.page_size", equals: "${pagesize}" }
              - { path: "$.pages_free", gt: 0 }
      - run:
          command: sysctl -n hw.memsize
      - store:
          name: memsize
          from:
            stdout: {trim: true}
      - run:
          command: jz run --explain memory_pressure
      - assert:
          exit_code: 0
          stderr:
            contains: "chose memory_pressure/darwin from embedded"
          stdout:
            json:
              - { path: "$.memory", equals: "${memsize}" }
              - { path: "$.page_size", equals: "${pagesize}" }
      - run:
          command: uname -r
      - store:
          name: release
          from:
            stdout: {trim: true}
      - run:
          command: sysctl -n hw.model
      - store:
          name: model
          from:
            stdout: {trim: true}
      - run:
          command: jz run --explain system_profiler SPSoftwareDataType SPHardwareDataType
      - assert:
          exit_code: 0
          stderr:
            contains: "chose system_profiler/data-type from embedded"
          stdout:
            json:
              - { path: "$[0].label", equals: Software }
              - { path: "$[0].children[0].children[?(@.label=='Kernel Version')].value", equals: "Darwin ${release}" }
              - { path: "$[1].label", equals: Hardware }
              - { path: "$[1].children[0].children[?(@.label=='Model Identifier')].value", equals: "${model}" }
      # -json is the machine's own format and is not this definition's.
      - run:
          command: jz run --parser system_profiler -- system_profiler -json SPSoftwareDataType
      - assert:
          exit_code: 4
          stdout: {empty: true}

  - name: netstat, networksetup, scutil, diskutil, launchctl and pmset land on their macOS definitions
    only: {os: darwin}
    steps:
      - run:
          command: jz run --explain netstat -i
      - assert:
          exit_code: 0
          stderr:
            contains: "chose netstat/darwin-interface from embedded"
          stdout:
            json:
              - { path: "$[?(@.name=='lo0' && @.network=='127')].address", equals: localhost }
              - { path: "$[?(@.name=='lo0' && @.network=='127')].mtu", equals: 16384 }
      - run:
          command: jz run --explain netstat -rn
      - assert:
          exit_code: 0
          stderr:
            contains: "chose netstat/freebsd-routing from embedded"
          stdout:
            json: { path: "$[?(@.family.name=='Internet')].routes[?(@.destination=='127.0.0.1')].netif", equals: lo0 }
      - run:
          shell: true
          command: ifconfig en0 ether
      - store:
          name: mac
          from:
            stdout: {matches: 'ether ([0-9a-f:]{17})'}
      - run:
          command: jz run --explain networksetup -listallhardwareports
      - assert:
          exit_code: 0
          stderr:
            contains: "chose networksetup/hardware-ports from embedded"
          stdout:
            json: { path: "$[?(@.device=='en0')].ethernet_address", equals: "${mac}" }
      - run:
          command: jz run --explain scutil --dns
      - assert:
          exit_code: 0
          stderr:
            contains: "chose scutil/dns from embedded"
          stdout:
            json: { path: "$.resolvers[0].number", equals: 1 }
      - run:
          command: jz run --explain diskutil list
      - assert:
          exit_code: 0
          stderr:
            contains: "chose diskutil/list from embedded"
          stdout:
            json:
              - { path: "$[0].disk.device", equals: /dev/disk0 }
              - { path: "$[0].partitions[0].identifier", equals: disk0 }
      - run:
          command: jz run --explain launchctl list
      - assert:
          exit_code: 0
          stderr:
            contains: "chose launchctl/list from embedded"
          stdout:
            json: { path: "$[0].label", matches: '^\S+$' }
      - run:
          command: jz run --explain pmset -g
      - assert:
          exit_code: 0
          stderr:
            contains: "chose pmset/settings from embedded"
          stdout:
            json: { path: "$.currently_in_use[?(@.name=='sleep')].value", matches: '^[0-9]+$' }
      # pmset -g batt prints the power source, another format.
      - run:
          command: jz run pmset -g batt
      - assert:
          exit_code: 4
          stdout: {empty: true}

  - name: top, otool, lipo, shasum and the security status commands land on their macOS definitions
    only: {os: darwin}
    steps:
      - run:
          command: jz run --explain top -l 1 -n 5
      - assert:
          exit_code: 0
          stderr:
            contains: "chose top/darwin from embedded"
          stdout:
            json:
              - { path: "$.summary.processes", gt: 0 }
              - { path: "$.processes", length: 5 }
      - run:
          command: jz run --explain otool -L /bin/ls
      - assert:
          exit_code: 0
          stderr:
            contains: "chose otool/libraries from embedded"
          stdout:
            json:
              - { path: "$[0].file.name", equals: /bin/ls }
              - { path: "$[0].libraries[?(@.path=='/usr/lib/libSystem.B.dylib')].compatibility_version", equals: 1.0.0 }
      # /bin/ls ships as a universal file, which is what lipo -info reads.
      - run:
          command: jz run --explain lipo -info /bin/ls
      - assert:
          exit_code: 0
          stderr:
            contains: "chose lipo/info from embedded"
          stdout:
            json: { path: "$[0].file", equals: /bin/ls }
      - fixture:
          file: hello.txt
          content: "hello\n"
      - run:
          command: jz run --explain shasum -a 256 ${workdir}/hello.txt
      - assert:
          exit_code: 0
          stderr:
            contains: "chose sha256sum/posix from embedded"
          stdout:
            json:
              - { path: "$", length: 1 }
              - { path: "$[0].checksum", equals: 5891b5b522d5df086d0ff0b110fbd9d21bb4fc7163af34d08286a2e846f6be03 }
      - run:
          command: jz run --explain csrutil status
      - assert:
          exit_code: 0
          stderr:
            contains: "chose csrutil/status from embedded"
      - run:
          command: jz run --explain spctl --status
      - assert:
          exit_code: 0
          stderr:
            contains: "chose spctl/status from embedded"
      - run:
          command: jz run --explain fdesetup status
      - assert:
          exit_code: 0
          stderr:
            contains: "chose fdesetup/status from embedded"

  - name: sysctl and lsof land on the definitions they share with FreeBSD and Linux, and ls -le is refused
    only: {os: darwin}
    steps:
      - run:
          command: sysctl -n hw.ncpu
      - store:
          name: ncpu
          from:
            stdout: {trim: true}
      - run:
          command: jz run --explain sysctl kern.ostype hw.ncpu
      - assert:
          exit_code: 0
          stderr:
            contains: "chose sysctl/freebsd from embedded"
          stdout:
            json:
              - { path: "$", length: 2 }
              - { path: "$[?(@.name=='kern.ostype')].value", equals: Darwin }
              - { path: "$[?(@.name=='hw.ncpu')].value", equals: "${ncpu}" }
      # -n prints the values alone, which no name can be told from.
      - run:
          command: jz run sysctl -n hw.ncpu
      - assert:
          exit_code: 4
          stdout: {empty: true}
      # The runner keeps connections open to GitHub while a job runs.
      - run:
          command: jz run --explain lsof -i -n -P
      - assert:
          exit_code: 0
          stderr:
            contains: "chose lsof/linux from embedded"
          stdout:
            json:
              - { path: "$[0].pid", gt: 0 }
              - { path: "$[0].type", matches: '^IPv[46]$' }
      # -e prints each access control list under its entry.
      - run:
          command: jz run ls -le /Users
      - assert:
          exit_code: 4
          stdout: {empty: true}
          stderr:
            contains: "excluded by the argument -e"

  # Every macOS system has lo0 with 127.0.0.1, and mDNSResponder keeps a
  # permanent ARP entry for its multicast group, so neither depends on the
  # runner's network.
  - name: ifconfig and arp land on ifconfig/bsd and arp/darwin
    only: {os: darwin}
    steps:
      - run:
          command: jz run --explain ifconfig lo0
      - assert:
          exit_code: 0
          stderr:
            contains: "chose ifconfig/bsd from embedded"
          stdout:
            json:
              - { path: "$", length: 1 }
              - { path: "$[0].interface.name", equals: lo0 }
              - { path: "$[0].inet[0].address", equals: 127.0.0.1 }
              - { path: "$[0].inet[0].mask", equals: "0xff000000" }
              - { path: "$[0].status.mtu", gt: 0 }
      - run:
          command: jz run --explain ifconfig -a
      - assert:
          exit_code: 0
          stderr:
            contains: "chose ifconfig/bsd from embedded"
          stdout:
            json:
              - { path: "$[?(@.interface.name == 'lo0')].status.flags[0]", equals: UP }
      - run:
          command: jz run --explain arp -an
      - assert:
          exit_code: 0
          stderr:
            contains: "chose arp/darwin from embedded"
          stdout:
            json:
              - { path: "$[0].interface", matches: "." }
