version: "1"

suite:
  name: real commands on macOS

# The bsd variants ship transcribed fixtures; this suite is what proves
# them against the real binaries on the macOS CI runner. Nothing here is
# gated on a command being present: every command is part of macOS.
# What is pinned is which definition the real output lands on and the
# structure that differs from the GNU one, never a value of the machine's.
scenarios:
  - name: df selects the bsd variants
    only: {os: darwin}
    steps:
      - run:
          command: jz run df
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].mounted_on", equals: / }
              - { path: "$[0].512_blocks", gt: 0 }
      - run:
          command: jz run df -h
      - assert:
          exit_code: 0
          stdout:
            json:
              # -h rounds every column it can, the inode counts
              # included, so each stays the text that was printed.
              - { path: "$[0].size", matches: "^[0-9.]+[KMGTP]i?$" }
              - { path: "$[0].iused", matches: "^[0-9.]+[kKMGTP]?$" }

  - name: uptime, ps, mount, uname, id, du and wc
    only: {os: darwin}
    steps:
      - run:
          command: jz run uptime
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.load_1m", gte: 0 }
      - run:
          command: jz run ps -ef
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].pid", equals: 1 }
      - run:
          command: jz run ps aux
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].command", matches: ".+" }
      - run:
          command: jz run mount
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].mount_point", equals: / }
              - { path: "$[0].type", matches: "^[a-z]+$" }
      - run:
          command: jz run uname -a
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.kernel_name", equals: Darwin }
              - { path: "$.machine", matches: "^(arm64|x86_64)$" }
      - run:
          command: jz run id
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$.gid.name", matches: ".+" }
      - run:
          command: jz run du -s .
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].name", equals: "." }
      - fixture:
          file: words.txt
          content: "one two\nthree\n"
      - run:
          command: jz run wc words.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].lines", equals: 2 }
              - { path: "$[0].words", equals: 3 }
              - { path: "$[0].filename", equals: words.txt }

  - name: piping a real command into jz identifies it without any hint
    only: {os: darwin}
    steps:
      - run:
          shell: true
          command: LC_ALL=C df | jz
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].mounted_on", equals: / }
      - run:
          shell: true
          command: LC_ALL=C uname -a | jz
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$.kernel_name", equals: Darwin }
      - run:
          shell: true
          command: LC_ALL=C mount | jz
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].mount_point", equals: / }
              - { path: "$[0].type", matches: "^[a-z]+$" }

  # The GNU and BSD shapes of the same commands are exclusive: the real
  # BSD output is refused by the GNU definition, and the GNU fixture by
  # the BSD one. Naming the variant does not get past the signature.
  - name: the real BSD output lands on the bsd definitions and the GNU shape is refused
    only: {os: darwin}
    steps:
      - run:
          command: jz run --explain df
      - assert:
          exit_code: 0
          stderr:
            contains: "df/bsd from embedded"
      - run:
          command: jz run --explain df -h
      - assert:
          exit_code: 0
          stderr:
            contains: "df/bsd-human from embedded"
      - run:
          command: jz run --explain uptime
      - assert:
          exit_code: 0
          stderr:
            contains: "uptime/bsd from embedded"
      - run:
          command: jz run --explain ps aux
      - assert:
          exit_code: 0
          stderr:
            contains: "ps/bsd from embedded"
      - run:
          command: jz run --explain mount
      - assert:
          exit_code: 0
          stderr:
            contains: "mount/bsd from embedded"
      - run:
          command: jz run --explain uname -a
      - assert:
          exit_code: 0
          stderr:
            contains: "uname/darwin from embedded"
      - run:
          shell: true
          command: LC_ALL=C df | jz --parser df --variant gnu
      - assert:
          exit_code: 4
          stdout: {empty: true}
      - run:
          shell: true
          command: LC_ALL=C mount | jz --parser mount --variant linux
      - assert:
          exit_code: 4
          stdout: {empty: true}
      - run:
          command: jz --parser df --variant bsd --file ${specdir}/testdata/df-gnu.txt
      - assert:
          exit_code: 4
          stdout: {empty: true}

  # --stream with a real command on macOS: du names no operating system,
  # so it is selected here the way it is on Linux, and each operand is
  # one line as soon as it is read.
  - name: jz run --stream du writes one line per operand
    only: {os: darwin}
    steps:
      - fixture:
          file: a/x
          content: "x\n"
      - fixture:
          file: b/y
          content: "y\n"
      - run:
          command: jz run --stream du -s a b
      - assert:
          exit_code: 0
          stdout:
            contains: '"name":'
            count: 2
      - assert:
          stdout:
            contains: '"name":"b"'
