version: "1"

suite:
  name: streaming

# --stream writes one JSON document per line as each record becomes
# readable, instead of one array once the input has ended. It is the only
# option that changes the output contract, so what it changes is pinned
# here: every line is a complete document, and the lines already written
# stay written when a later one cannot be read.
scenarios:
  - name: every parse type that yields records streams the same records it prints whole
    steps:
      - fixture:
          file: df.txt
          content: |
            Filesystem     1K-blocks    Used Available Use% Mounted on
            tmpfs            1000000    5000    995000   1% /run
            /dev/sda1       20000000 5000000  15000000  25% /
      - run:
          command: jz --stream --file ${workdir}/df.txt
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"filesystem":"tmpfs","1k_blocks":1000000,"used":5000,"available":995000,"use_percent":1,"mounted_on":"/run"}
              {"filesystem":"/dev/sda1","1k_blocks":20000000,"used":5000000,"available":15000000,"use_percent":25,"mounted_on":"/"}

      # regex, one object per line.
      - fixture:
          file: mount.txt
          content: |
            proc on /proc type proc (rw,nosuid,nodev,noexec,relatime)
            sysfs on /sys type sysfs (rw,nosuid,nodev,noexec,relatime)
      - run:
          command: jz --stream --file ${workdir}/mount.txt
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"filesystem":"proc","mount_point":"/proc","type":"proc","options":["rw","nosuid","nodev","noexec","relatime"]}
              {"filesystem":"sysfs","mount_point":"/sys","type":"sysfs","options":["rw","nosuid","nodev","noexec","relatime"]}

      # kv, one object per key.
      - fixture:
          file: passwd.txt
          content: |
            root:x:0:0:root:/root:/bin/bash
            daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin
      - run:
          command: jz --stream --parser etc --variant passwd --file ${workdir}/passwd.txt
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"username":"root","password":"x","uid":0,"gid":0,"gecos":"root","home":"/root","shell":"/bin/bash"}
              {"username":"daemon","password":"x","uid":1,"gid":1,"gecos":"daemon","home":"/usr/sbin","shell":"/usr/sbin/nologin"}

      # records, one object per block; a block closes at the next start
      # line and the last one at the end of the input.
      - fixture:
          file: hosts.txt
          content: |
            127.0.0.1	localhost
            192.168.10.2	host1 host1.example.com
      - run:
          command: jz --stream --parser etc --variant hosts --file ${workdir}/hosts.txt
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"address":"127.0.0.1","names":["localhost"]}
              {"address":"192.168.10.2","names":["host1","host1.example.com"]}

  - name: a format read as one object has no streaming form
    steps:
      - fixture:
          file: uptime.txt
          content: |
             14:20:01 up 13 days,  4:30,  2 users,  load average: 0.52, 0.58, 0.59
      - run:
          command: jz --stream --file ${workdir}/uptime.txt
      - assert:
          exit_code: 2
          stdout:
            equals: ""
          stderr:
            contains: "has no streaming form"
      - assert:
          stderr:
            contains: "Drop --stream"
      # Without --stream the same input converts.
      - run:
          command: jz --file ${workdir}/uptime.txt
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$.users", equals: 2 }

  - name: --pretty and --stream state two different shapes
    steps:
      - run:
          command: jz --stream --pretty
          stdin: "x\n"
      - assert:
          exit_code: 2
          stderr:
            contains: "--pretty and --stream cannot be used together"

  - name: a record that cannot be read leaves the ones before it written
    steps:
      - fixture:
          file: broken.txt
          content: |
            Filesystem     1K-blocks    Used Available Use% Mounted on
            tmpfs            1000000    5000    995000   1% /run
            /dev/sda1       not-a-number 5000000  15000000  25% /
      - run:
          command: jz --stream --file ${workdir}/broken.txt
      - assert:
          exit_code: 3
          stdout:
            equals: |
              {"filesystem":"tmpfs","1k_blocks":1000000,"used":5000,"available":995000,"use_percent":1,"mounted_on":"/run"}
          stderr:
            contains: "cannot convert"
      # Read whole, the same input leaves standard output empty.
      - run:
          command: jz --file ${workdir}/broken.txt
      - assert:
          exit_code: 3
          stdout:
            equals: ""

  - name: a record in the middle that cannot be read is skipped, not fatal
    steps:
      - fixture:
          file: gap.txt
          content: |
            Filesystem     1K-blocks    Used Available Use% Mounted on
            tmpfs            1000000    5000    995000   1% /run
            garbage
            /dev/sda1       20000000 5000000  15000000  25% /
      - run:
          command: jz --stream --file ${workdir}/gap.txt
      - assert:
          exit_code: 3
          stdout:
            equals: |
              {"filesystem":"tmpfs","1k_blocks":1000000,"used":5000,"available":995000,"use_percent":1,"mounted_on":"/run"}
              {"filesystem":"/dev/sda1","1k_blocks":20000000,"used":5000000,"available":15000000,"use_percent":25,"mounted_on":"/"}
          stderr:
            contains: "line 3"
      # Read whole, the same text is not the format it claimed to be, so
      # nothing is written and the status is the same 3.
      - run:
          command: jz --file ${workdir}/gap.txt
      - assert:
          exit_code: 3
          stdout:
            equals: ""

  - name: --extract applies to every record of a stream
    steps:
      - fixture:
          file: df2.txt
          content: |
            Filesystem     1K-blocks    Used Available Use% Mounted on
            tmpfs            1000000    5000    995000   1% /run
            /dev/sda1       20000000 5000000  15000000  25% /
      - run:
          command: jz --stream --extract mounted_on --file ${workdir}/df2.txt
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"mounted_on":"/run"}
              {"mounted_on":"/"}
      - run:
          command: jz --stream --extract mountpoint --file ${workdir}/df2.txt
      - assert:
          exit_code: 2
          stdout:
            equals: ""
          stderr:
            contains: 'no key "mountpoint" in the output'

  # A command that keeps printing is answered while it is still printing,
  # and what happens when the reader or the command stops first is
  # pinned in process.atago.yaml.
  - name: jz run --stream mirrors the command's own status
    skip: {os: windows}
    steps:
      - fixture:
          file: failing-du
          mode: "0755"
          content: |
            #!/bin/sh
            printf '4\t/run\n'
            echo 'du: /mnt: Permission denied' >&2
            exit 1
      - run:
          command: jz run --stream --parser du -- sh ${workdir}/failing-du
      - assert:
          exit_code: 1
          stdout:
            equals: |
              {"size":4,"name":"/run"}
          stderr:
            contains: "Permission denied"
      - assert:
          stderr:
            contains: "exited with status 1"

  # A composite is one object read whole; streamed, it is one document per
  # part as each part becomes readable, a list part one per element.
  - name: a composite streams part by part, and --extract names the parts
    steps:
      - fixture:
          file: ping.txt
          from: "${specdir}/testdata/ping-macos-26-timeout.txt"
      - run:
          command: jz --stream --file ${workdir}/ping.txt
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            equals: |
              {"part":"destination","value":{"name":"192.0.2.1","address":"192.0.2.1","source":null,"data_bytes":56,"packet_bytes":null}}
              {"part":"replies","value":{"kind":"no_answer","error":"Request timeout","icmp_seq":0}}
              {"part":"statistics","value":{"name":"192.0.2.1","packets_transmitted":2,"packets_received":0,"duplicates":null,"packet_loss_percent":100,"out_of_wait_time":null,"round_trip_min_ms":null,"round_trip_avg_ms":null,"round_trip_max_ms":null,"round_trip_stddev_ms":null}}
      - run:
          command: jz --stream --extract statistics --file ${workdir}/ping.txt
      - assert:
          exit_code: 0
          stdout:
            matches: '\A\{"part":"statistics",[^\n]*\}\n\z'

  # The first record of a csv read without a header line is a record, in
  # a stream as in the whole document, and the columns it numbers are the
  # ones every later record is read under.
  - name: a csv without a header line streams the records it reads whole
    steps:
      - fixture:
          file: rows.csv
          content: |
            id,note
            1,"two
            lines"
            2,
      - run:
          command: jz --stream --parser csv --variant comma-no-header --file ${workdir}/rows.csv
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"column_1":"id","column_2":"note"}
              {"column_1":"1","column_2":"two\nlines"}
              {"column_1":"2","column_2":""}
      - run:
          command: jz --stream --parser csv --variant comma-no-header --columns key,text --file ${workdir}/rows.csv
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"key":"id","text":"note"}
              {"key":"1","text":"two\nlines"}
              {"key":"2","text":""}
      # A quote in the middle of a value opens nothing: the bad line is
      # reported and the lines after it are still records.
      - fixture:
          file: bad-quote.csv
          content: "1,x\"y\n2,z\n3,w\n"
      - run:
          command: jz --stream --parser csv --variant comma-no-header --file ${workdir}/bad-quote.csv
      - assert:
          exit_code: 3
          stdout:
            equals: |
              {"column_1":"2","column_2":"z"}
              {"column_1":"3","column_2":"w"}
          stderr:
            contains: "line 1"

  # YAML streams the way JSON does, one document per record, and every
  # document opens with "---" and closes with "...": a reader knows a
  # record is whole when its "..." arrives, without waiting for the next.
  - name: --yaml with --stream writes one marked YAML document per record
    steps:
      - fixture:
          file: df.txt
          from: "${specdir}/testdata/df-gnu.txt"
      - run:
          command: jz --stream --yaml --file ${workdir}/df.txt
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            matches: '\A---\nfilesystem: tmpfs\n"1k_blocks": 12882672\n(?s:.*)\n\.\.\.\n\z'
      - assert:
          stdout:
            matches: '\A(?:---\n(?:[^\n]+\n)+\.\.\.\n){7}\z'
      - run:
          command: jz --stream --yaml --parser csv --variant comma-no-header --file ${workdir}/df.txt
      - assert:
          exit_code: 0
          stdout:
            matches: '\A---\ncolumn_1: "Filesystem +1K-blocks [^"\n]+"\n\.\.\.\n---\n'

  - name: --yaml keeps types, nulls, order and the strings that look like something else
    steps:
      - fixture:
          file: df.txt
          content: |
            Filesystem      Size  Used Avail Use% Mounted on
            tmpfs           1.0G     0  1.0G   0% /run
            yes             955M  1.8T   no%  -  /mnt/on
      # A rounded size, a count that stayed text and a word a YAML reader
      # takes for a boolean are all quoted; a number is not.
      - run:
          command: jz --yaml --parser df --variant gnu-human --file ${workdir}/df.txt
      - assert:
          exit_code: 0
          stdout:
            equals: |
              - filesystem: tmpfs
                size: "1.0G"
                used: "0"
                available: "1.0G"
                use_percent: 0
                mounted_on: /run
              - filesystem: "yes"
                size: "955M"
                used: "1.8T"
                available: no%
                use_percent: null
                mounted_on: /mnt/on
      - fixture:
          file: kv.txt
          content: |
            name=yes
            count=007
            empty=
            path=/usr/local
            time=12:30:45
      - run:
          command: jz --yaml --parser kv --variant equals --file ${workdir}/kv.txt
      - assert:
          exit_code: 0
          stdout:
            equals: |
              - name: name
                value: "yes"
              - name: count
                value: "007"
              - name: empty
                value: ""
              - name: path
                value: /usr/local
              - name: time
                value: "12:30:45"
      - fixture:
          file: ping.txt
          from: "${specdir}/testdata/ping-macos-26-timeout.txt"
      - run:
          command: jz --yaml --file ${workdir}/ping.txt
      - assert:
          exit_code: 0
          stdout:
            equals: |
              destination:
                name: "192.0.2.1"
                address: "192.0.2.1"
                source: null
                data_bytes: 56
                packet_bytes: null
              replies:
                - kind: no_answer
                  error: Request timeout
                  icmp_seq: 0
              statistics:
                name: "192.0.2.1"
                packets_transmitted: 2
                packets_received: 0
                duplicates: null
                packet_loss_percent: 100.0
                out_of_wait_time: null
                round_trip_min_ms: null
                round_trip_avg_ms: null
                round_trip_max_ms: null
                round_trip_stddev_ms: null
      - assert:
          stdout:
            yaml:
              - { path: "$.statistics.packet_loss_percent", equals: 100 }
              - { path: "$.replies[0].icmp_seq", equals: 0 }
              - { path: "$.destination.address", equals: "192.0.2.1" }
