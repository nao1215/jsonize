version: "1"

suite:
  name: definitions given on the command line

# jz reads output it has a definition for. --define is the answer for the
# output it does not: the caller writes the definition instead of the
# name of one, and nothing is selected, so nothing can be selected
# wrongly. The registry also carries a handful of definitions that
# describe a shape rather than a command, for the same job under a name.
scenarios:
  - name: --define reads with the definition it is given
    steps:
      - run:
          command: "jz --define 'parse: {type: csv}'"
          stdin: |
            a,b
            1,"x,y"
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$", length: 1 }
              - { path: "$[0].b", equals: "x,y" }
      # The definition it used is what --explain has to say.
      - run:
          command: "jz --explain --define 'parse: {type: csv}'"
          stdin: |
            a,b
            1,2
      - assert:
          exit_code: 0
          stderr:
            contains: "jz: explain: defined inline/inline: the definition was given with --define"

  - name: a table drawn with rules is read cell by cell
    steps:
      - fixture:
          file: box.txt
          from: "${specdir}/testdata/box-table.txt"
      - run:
          command: "jz --define 'parse: {type: table, split: box}' --file ${workdir}/box.txt"
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$", length: 2 }
              - { path: "$[0].name", equals: web }
              # A value wrapped over two lines is one cell.
              - { path: "$[0].image", equals: "nginx:1.27\n(alpine)" }
      # An empty cell is null rather than the empty string.
      - run:
          command: jz --parser table --variant box --file ${workdir}/box.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[1].ports", equals: null }
      # A rule separates the header from the body and nothing else in the
      # common case, so every line of the body is a row.
      - fixture:
          file: rows.txt
          content: |
            +----+-------+
            | id | name  |
            +----+-------+
            |  1 | alpha |
            |  2 | beta  |
            |  3 | gamma |
            +----+-------+
      - run:
          command: jz --parser table --variant box --file ${workdir}/rows.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$", length: 3 }
              - { path: "$[1].name", equals: beta }

  - name: an ini file is read as sections of keys
    steps:
      - fixture:
          file: settings.ini
          from: "${specdir}/testdata/sections.ini"
      - run:
          command: jz --parser ini --file ${workdir}/settings.ini
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.core.bare", equals: "false" }
              - { path: "$.user.name", equals: Alice }
      # Keys written before the first heading go under the empty name.
      - assert:
          stdout:
            contains: '"":{"top":"1"}'
      # An ini result is one object, so it has no streaming form.
      - run:
          command: jz --parser ini --stream --file ${workdir}/settings.ini
      - assert:
          exit_code: 2
          stdout: {empty: true}
          stderr:
            contains: "has no streaming form"

  - name: --define states the whole definition, so nothing is left to choose
    steps:
      - run:
          command: "jz --define 'parse: {type: csv}' --parser df"
          stdin: "a,b\n"
      - assert:
          exit_code: 2
          stdout: {empty: true}
          stderr:
            contains: "cannot be used together"
      - run:
          command: "jz --define 'parse: {type: nope}'"
          stdin: "a,b\n"
      - assert:
          exit_code: 5
          stdout: {empty: true}
          stderr:
            contains: "--define: parse.type:"
      # The four keys that place a definition in a registry get an
      # explanation rather than "unknown key".
      - run:
          command: "jz --define 'command: df'"
          stdin: "a,b\n"
      - assert:
          exit_code: 5
          stderr:
            contains: "does not live in a registry"

  # A definition that describes a shape reads anything of that shape,
  # which is why it is never chosen on its own.
  - name: a shape definition is never reached by automatic detection
    steps:
      - fixture:
          file: df-gnu.txt
          from: "${specdir}/testdata/df-gnu.txt"
      - run:
          command: jz --explain --file ${workdir}/df-gnu.txt
      - assert:
          exit_code: 0
          stderr:
            contains: "df/gnu from embedded"
          stdout:
            json:
              # Typed, which a shape could not have done: it says nothing
              # about what its columns mean.
              - { path: "$[1].use_percent", equals: 92 }
      - run:
          command: jz --parser table --variant whitespace --file ${workdir}/df-gnu.txt
      - assert:
          exit_code: 3
          stdout: {empty: true}

  # A csv file is data. Two headings with one name are numbered so that
  # every value keeps a key of its own, and the number never lands on a
  # heading the file already has; a row that holds the header's values
  # is a row unless the definition says the header is printed again; a
  # quoted value keeps every line it holds, a blank one included. The
  # stream reads all of it the same way.
  - name: a csv keeps every value under a key of its own
    steps:
      - run:
          command: jz --parser csv --variant comma
          stdin: |
            x,x,x_2
            1,2,3
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            equals: |
              [{"x":"1","x_3":"2","x_2":"3"}]
      - run:
          command: jz --stream --parser csv --variant comma
          stdin: |
            x,x,x_2
            1,2,3
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"x":"1","x_3":"2","x_2":"3"}

  - name: a csv row that repeats the header is a row
    steps:
      - fixture:
          file: rows.csv
          content: |
            name,count
            x,1
            name,count
            y,2
      - run:
          command: jz --parser csv --variant comma --file ${workdir}/rows.csv
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"name":"x","count":"1"},{"name":"name","count":"count"},{"name":"y","count":"2"}]
      - run:
          command: jz --stream --parser csv --variant comma --file ${workdir}/rows.csv
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"name":"x","count":"1"}
              {"name":"name","count":"count"}
              {"name":"y","count":"2"}
      # A table is read the other way round: the same line there is the
      # header printed again. Which of the two a format is, is the
      # definition's type rather than a key beside it.
      - run:
          command: "jz --define 'parse: {type: table, split: delimiter, delimiter: \",\"}' --file ${workdir}/rows.csv"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"name":"x","count":"1"},{"name":"y","count":"2"}]
      # The key that used to choose between the two is gone, and a
      # definition that writes it is refused where it is read.
      - run:
          command: "jz --define 'parse: {type: csv, header: {repeated: true}}' --file ${workdir}/rows.csv"
      - assert:
          exit_code: 5
          stdout: {empty: true}
          stderr: {contains: "unknown key \"repeated\""}

  - name: a quoted csv value keeps the blank line it holds
    steps:
      - fixture:
          file: quoted.csv
          content: |
            x
            "a

            b"
            # not a comment
      - run:
          command: jz --parser csv --variant comma --file ${workdir}/quoted.csv
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            json:
              - { path: "$", length: 2 }
              - { path: "$[0].x", equals: "a\n\nb" }
              - { path: "$[1].x", equals: "# not a comment" }
      - run:
          command: jz --stream --parser csv --variant comma --file ${workdir}/quoted.csv
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"x":"a\n\nb"}
              {"x":"# not a comment"}
      # input.ignore names records, not the lines inside a quoted value:
      # the line that looks like a comment inside the value stays, the
      # record that is one goes.
      - run:
          command: "jz --define '{input: {ignore: [\"^#\"]}, parse: {type: csv}}' --file ${workdir}/quoted.csv"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"x":"a\n\nb"}]

  - name: a csv error names the line of the input it is on
    steps:
      - fixture:
          file: bad.csv
          content: |
            x,y
            1,"a
            b"
            4,5
            abc,6
      - run:
          command: "jz --define '{parse: {type: csv}, fields: {x: {type: int}}}' --file ${workdir}/bad.csv"
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr: {contains: "line 5: field \"x\": cannot convert \"abc\" to int"}
      - run:
          command: "jz --stream --define '{parse: {type: csv}, fields: {x: {type: int}}}' --file ${workdir}/bad.csv"
      - assert:
          exit_code: 3
          stdout:
            equals: |
              {"x":1,"y":"a\nb"}
              {"x":4,"y":"5"}
          stderr: {contains: "line 5: field \"x\": cannot convert \"abc\" to int"}
      # A quote in the middle of a field is refused on its own line, and
      # the message is about the input rather than about a record.
      - fixture:
          file: quote.csv
          content: |
            x,y
            1,"a
            b",c"d
      - run:
          command: jz --parser csv --variant comma --file ${workdir}/quote.csv
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr: {contains: "line 3: column 5: bare \" in non-quoted-field"}
      - assert:
          stderr: {not_contains: "record on line"}

  # A definition is refused where it is read, not where it fails to
  # apply: a group named twice in one pattern, a fixed value named
  # after the key a tree writes its children under, and a fields map
  # beside a parser that reads its values through parts or nodes would
  # each write over a value in silence.
  - name: a definition that would write over one of its own values is refused before anything is read
    steps:
      - run:
          command: "jz --define 'parse: {type: regex, pattern: \"(?P<x>a)(?P<x>b)\"}'"
          stdin: "ab\n"
      - assert:
          exit_code: 5
          stdout: {empty: true}
          stderr: {contains: "names the group \"x\" twice"}
      - run:
          command: "jz --define 'parse: {type: tree, indent: \"  \", node: {parse: {type: regex, patterns: [{pattern: \"(?P<name>[a-z]+)\", values: {children: lost}}]}}}'"
          stdin: "a\n"
      - assert:
          exit_code: 5
          stdout: {empty: true}
          stderr: {contains: "names a key \"children\""}
      - run:
          command: "jz --define '{parse: {type: composite, parts: [{name: p, parse: {type: kv}}]}, fields: {value: {type: int}}}'"
          stdin: "a=1\n"
      - assert:
          exit_code: 5
          stdout: {empty: true}
          stderr: {contains: "fields: does not apply to type composite"}
      - run:
          command: "jz --define '{parse: {type: tree, indent: \"  \", node: {parse: {type: regex, pattern: \"(?P<name>[a-z]+)\"}}}, fields: {name: {required: true}}}'"
          stdin: "a\n"
      - assert:
          exit_code: 5
          stdout: {empty: true}
          stderr: {contains: "fields: does not apply to type tree"}
      # The same rules in the right place read the same text.
      - run:
          command: "jz --define '{parse: {type: composite, parts: [{name: p, parse: {type: kv}, fields: {value: {type: int}}}]}}'"
          stdin: "a=1\n"
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$.p[0].value", equals: 1 }

  - name: an integer has one sign
    steps:
      - run:
          command: "jz --define '{parse: {type: kv}, fields: {n: {type: int}, m: {type: int}}}'"
          stdin: "n=+1\nm=-2\n"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"name":"n","value":1},{"name":"m","value":-2}]
      - run:
          command: "jz --define '{parse: {type: kv}, fields: {n: {type: int}}}'"
          stdin: "n=++1\n"
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr: {contains: "cannot convert \"++1\" to int"}
      - run:
          command: "jz --define '{parse: {type: kv}, fields: {n: {type: int}}}'"
          stdin: "n=+-1\n"
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr: {contains: "cannot convert \"+-1\" to int"}

  # A sub-field of an object is read in the object's own match: the
  # group its unescape rule names is a group of the object's pattern,
  # and whether that group took part is what decides.
  - name: a nested object decodes an escape when its own group says so
    steps:
      - run:
          command: >-
            jz --define '{parse: {type: regex, pattern: "(?P<x>.*)"}, fields: {x: {type: object, regex: "(?P<flag>!)?(?P<name>.*)", fields: {name: {unescape: {when: flag, sequences: {"\\n": "\n"}}}}}}}'
          stdin: "!a\\nb\nc\\nd\n"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"x":{"flag":"!","name":"a\nb"}},{"x":{"flag":null,"name":"c\\nd"}}]
