version: "1"

suite:
  name: cookbook

# Every recipe of website/content/cookbook.md, run the way the page shows
# it. A scenario is named after its section ("<section>: ..."), and a test
# in internal/cli checks that every section has one, so the page cannot
# show a command this suite does not run. A pipe on the page is stdin
# here, so the same words run under cmd.exe.
scenarios:
  - name: "Convert what a command printed: df -h output becomes one object per file system"
    steps:
      - run:
          command: jz
          stdin: |
            Filesystem      Size  Used Avail Use% Mounted on
            /dev/nvme0n1p2  1.8T  1.6T  145G  92% /
            tmpfs           7.8G  4.0K  7.8G   1% /tmp
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"filesystem":"/dev/nvme0n1p2","size":"1.8T","used":"1.6T","available":"145G","use_percent":92,"mounted_on":"/"},{"filesystem":"tmpfs","size":"7.8G","used":"4.0K","available":"7.8G","use_percent":1,"mounted_on":"/tmp"}]

  - name: "Let jz run the command: jz run df -h reads the host's file systems"
    skip: {os: windows}
    steps:
      - run:
          command: jz run df -h
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].filesystem", matches: '.' }

  - name: "Keep only the keys you need: --extract keeps the named keys"
    steps:
      - run:
          command: jz --extract mounted_on --extract use_percent
          stdin: |
            Filesystem      Size  Used Avail Use% Mounted on
            /dev/nvme0n1p2  1.8T  1.6T  145G  92% /
            tmpfs           7.8G  4.0K  7.8G   1% /tmp
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"use_percent":92,"mounted_on":"/"},{"use_percent":1,"mounted_on":"/tmp"}]
      - run:
          command: jz --extract mountpoint
          stdin: |
            Filesystem      Size  Used Avail Use% Mounted on
            /dev/nvme0n1p2  1.8T  1.6T  145G  92% /
            tmpfs           7.8G  4.0K  7.8G   1% /tmp
      - assert:
          exit_code: 2
          stdout: {empty: true}

  - name: "Follow a command that keeps printing: --stream writes a line per sample"
    steps:
      - fixture:
          file: vmstat.txt
          from: "${specdir}/testdata/vmstat-repeated.txt"
      - run:
          command: jz --stream
          stdin: {file: vmstat.txt}
      - assert:
          exit_code: 0
          stdout:
            contains: |
              {"r":1,"b":0,"swpd":1950392,"free":7552816,"buff":2853928,"cache":39453912,"si":4,"so":16,"bi":511,"bo":1601,"in":20347,"cs":9,"us":3,"sy":1,"id":96,"wa":0,"st":0,"gu":0}
              {"r":0,"b":0,"swpd":1950392,"free":7560728,"buff":2853928,"cache":39453924,"si":0,"so":0,"bi":0,"bo":60,"in":9188,"cs":12769,"us":1,"sy":0,"id":99,"wa":0,"st":0,"gu":0}

  - name: "Add fields to every record of a stream: jz new --each wraps each record"
    steps:
      - run:
          command: jz new --each --string host=server-a sample:=@-
          stdin: "{\"r\":1,\"b\":0}\n{\"r\":0,\"b\":0}\n"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"host":"server-a","sample":{"r":1,"b":0}}
              {"host":"server-a","sample":{"r":0,"b":0}}

  - name: "Stop a stream at the first bad record: --stop-on-error keeps what came before"
    steps:
      - run:
          command: jz --format jsonl --stream --stop-on-error
          stdin: "{\"n\":1}\nnot json\n{\"n\":2}\n"
      - assert:
          exit_code: 3
          stdout:
            equals: |
              {"n":1}
          stderr:
            contains: "jz: jsonl: line 2: the line is not one JSON value"

  - name: "See which parser jz chose: --explain names the definition on standard error"
    steps:
      - run:
          command: jz --explain
          stdin: |
            Filesystem      Size  Used Avail Use% Mounted on
            /dev/nvme0n1p2  1.8T  1.6T  145G  92% /
            tmpfs           7.8G  4.0K  7.8G   1% /tmp
      - assert:
          exit_code: 0
          stderr:
            contains: |
              jz: explain: chose df/gnu-human from embedded
              jz: explain: scope: every definition in the registry, by its signature alone

  - name: "Name the parser when detection refuses: git numstat needs --parser git"
    steps:
      - run:
          command: jz
          stdin: "10\t2\tmain.go\n3\t0\tREADME.md\n"
      - assert:
          exit_code: 4
          stdout: {empty: true}
          stderr:
            contains: |
              jz: unable to identify the input format
              it could be `git` output, but that format is too generic for jz to claim on its own
      - run:
          command: jz --parser git
          stdin: "10\t2\tmain.go\n3\t0\tREADME.md\n"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"added":10,"deleted":2,"path":"main.go"},{"added":3,"deleted":0,"path":"README.md"}]

  - name: "Read output jz has no parser for: --define reads a table"
    steps:
      - run:
          command: "jz --define 'parse: {type: table}'"
          stdin: |
            NAME    STATUS  AGE
            api     Running 3d
            worker  Pending 5m
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"name":"api","status":"Running","age":"3d"},{"name":"worker","status":"Pending","age":"5m"}]

  - name: "Convert a CSV file: users.csv becomes one object per row"
    steps:
      - fixture:
          file: users.csv
          content: |
            id,name,email
            1,alice,alice@example.com
            2,bob,bob@example.com
      - run:
          command: jz --file ${workdir}/users.csv
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"id":"1","name":"alice","email":"alice@example.com"},{"id":"2","name":"bob","email":"bob@example.com"}]

  - name: "Type the columns of a CSV file: --type converts the columns it names"
    steps:
      - fixture:
          file: sales.csv
          content: |
            sku,units,price,in_stock
            007,12,1.50,yes
            008,,,false
      - run:
          command: jz --file ${workdir}/sales.csv --type units=int --type price=float --type in_stock=bool
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"sku":"007","units":12,"price":1.5,"in_stock":true},{"sku":"008","units":null,"price":null,"in_stock":false}]

  - name: "Read a CSV without a header line: --columns names the columns"
    steps:
      - fixture:
          file: rows.csv
          content: |
            1,alice
            2,bob
      - run:
          command: jz --file ${workdir}/rows.csv --columns id,name
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"id":"1","name":"alice"},{"id":"2","name":"bob"}]

  - name: "Convert YAML to JSON: a file by its extension and a pipe with --format"
    steps:
      - fixture:
          file: deploy.yaml
          content: |
            name: api
            replicas: 3
            image:
              repository: example/api
              tag: "1.4"
      - run:
          command: jz --file ${workdir}/deploy.yaml
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"name":"api","replicas":3,"image":{"repository":"example/api","tag":"1.4"}}
      - run:
          command: jz --format yaml
          stdin: |
            name: api
            replicas: 3
            image:
              repository: example/api
              tag: "1.4"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"name":"api","replicas":3,"image":{"repository":"example/api","tag":"1.4"}}

  - name: "Read compressed JSON Lines logs: a gzip file streamed with one key"
    steps:
      - fixture:
          file: events.jsonl.gz
          from: "${specdir}/testdata/events.jsonl.gz"
      - run:
          command: jz --file ${workdir}/events.jsonl.gz --stream --extract msg
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"msg":"started"}
              {"msg":"slow"}

  - name: "Read LTSV access logs: one object per line"
    steps:
      - fixture:
          file: access.ltsv
          content: "time:2026-09-15T07:00:01Z\thost:192.0.2.10\tstatus:200\treq:GET /api HTTP/1.1\ntime:2026-09-15T07:00:02Z\thost:192.0.2.11\tstatus:404\treq:GET /missing HTTP/1.1\n"
      - run:
          command: jz --file ${workdir}/access.ltsv
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"time":"2026-09-15T07:00:01Z","host":"192.0.2.10","status":"200","req":"GET /api HTTP/1.1"},{"time":"2026-09-15T07:00:02Z","host":"192.0.2.11","status":"404","req":"GET /missing HTTP/1.1"}]

  - name: "Turn lines into a JSON array: one string per line, spaces kept"
    steps:
      - run:
          command: jz --format lines
          stdin: "main\nfeature/login\n spaced \n"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              ["main","feature/login"," spaced "]

  - name: "Read find -print0 output: a NUL ends each name"
    steps:
      - run:
          command: jz --format nul
          stdin: "./a.log\0./b c.log\0./line\nbreak.log\0"
      - assert:
          exit_code: 0
          stdout:
            equals: "[\"./a.log\",\"./b c.log\",\"./line\\nbreak.log\"]\n"

  - name: "Wrap a whole text in a JSON string: every line break kept"
    steps:
      - run:
          command: jz --format text
          stdin: "Fix the parser\n\nIt dropped the last line.\n\n"
      - assert:
          exit_code: 0
          stdout:
            equals: "\"Fix the parser\\n\\nIt dropped the last line.\\n\\n\"\n"

  - name: "Build a JSON body for an API call: jz new makes the object"
    steps:
      - run:
          command: jz new name=api version=1.4.0 replicas:=3 'tags[]=web' 'tags[]=prod'
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"name":"api","version":"1.4.0","replicas":3,"tags":["web","prod"]}
      - run:
          command: jz new version=007
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"version":"007"}

  - name: "Pass a variable that may start with @: --string writes the text as it is"
    steps:
      - run:
          command: "jz new --string 'message=@here: deploy := done' status=ok"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"message":"@here: deploy := done","status":"ok"}

  - name: "Keep a file's line endings: --text-file keeps them and =@ drops the last"
    steps:
      - fixture:
          file: NOTES.txt
          content: "Fixed a crash.\n\nThanks to everyone.\n"
      - fixture:
          file: TITLE
          content: "Release 1.4\n"
      - run:
          command: jz new --text-file body=${workdir}/NOTES.txt title=@${workdir}/TITLE
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"body":"Fixed a crash.\n\nThanks to everyone.\n","title":"Release 1.4"}

  - name: "Build nested JSON: --path places values at JSON Pointers"
    steps:
      - run:
          command: jz new --path /metadata/name=api --path /spec/replicas:=3 --path /spec/containers/-/image=example/api:1.4 kind=Deployment
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"metadata":{"name":"api"},"spec":{"replicas":3,"containers":[{"image":"example/api:1.4"}]},"kind":"Deployment"}
      - run:
          command: jz new --path /spec/replicas:=3 --path /spec/replicas:=4
      - assert:
          exit_code: 2
          stdout: {empty: true}
          stderr:
            contains: "/spec/replicas is given twice"

  - name: "Put a file's contents into JSON: a text file and a YAML file as values"
    steps:
      - fixture:
          file: VERSION
          content: |
            1.4.0
      - fixture:
          file: deploy.yaml
          content: |
            name: api
            replicas: 3
            image:
              repository: example/api
              tag: "1.4"
      - run:
          command: jz new version=@${workdir}/VERSION spec:=@${workdir}/deploy.yaml
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"version":"1.4.0","spec":{"name":"api","replicas":3,"image":{"repository":"example/api","tag":"1.4"}}}

  - name: "Make a JSON array: jz new --array"
    steps:
      - run:
          command: jz new --array web :=8080 :=true
      - assert:
          exit_code: 0
          stdout:
            equals: |
              ["web",8080,true]

  # The recipes below put jz in a pipeline, which is what jz is for, so
  # the pipe is the thing being run and cannot become stdin the way the
  # recipes above do. They name the shell (bash, which every runner has,
  # Windows through Git) so that pipefail is available and so that the
  # words are read the way the page writes them.
  - name: "Pick the records you want with jq: jq selects the records jz named and typed"
    steps:
      - fixture:
          file: df.txt
          content: |
            Filesystem      Size  Used Avail Use% Mounted on
            /dev/nvme0n1p2  1.8T  1.6T  145G  92% /
            tmpfs           7.8G  4.0K  7.8G   1% /tmp
      - run:
          command: >-
            bash -c "set -o pipefail; jz --file '${workdir}/df.txt' |
            jq -r '.[] | select(.use_percent >= 90) | .mounted_on'"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              /

  - name: "Fail a step when a value is out of range: jq -e turns a check into a status"
    steps:
      - fixture:
          file: df.txt
          content: |
            Filesystem      Size  Used Avail Use% Mounted on
            /dev/nvme0n1p2  1.8T  1.6T  145G  92% /
            tmpfs           7.8G  4.0K  7.8G   1% /tmp
      - run:
          command: >-
            bash -c "set -o pipefail; jz --file '${workdir}/df.txt' |
            jq -e 'all(.use_percent < 90)' > /dev/null"
      - assert:
          exit_code: 1
          stdout: {empty: true}
      # The same check against a report with nothing over the threshold.
      - fixture:
          file: quiet.txt
          content: |
            Filesystem      Size  Used Avail Use% Mounted on
            tmpfs           7.8G  4.0K  7.8G   1% /tmp
      - run:
          command: >-
            bash -c "set -o pipefail; jz --file '${workdir}/quiet.txt' |
            jq -e 'all(.use_percent < 90)' > /dev/null"
      - assert:
          exit_code: 0

  - name: "Send JSON to an HTTP API: jz new writes the body and curl posts it"
    services:
      - name: server
        command: e2ehelper serve -addr ${workdir}/addr.txt
        ready: {file: addr.txt, store: addr, timeout: 20s}
    steps:
      # The body on its own, so that the jz the page shows is run as the
      # page writes it and not only inside a shell the suite names.
      - run:
          command: jz new service=api replicas:=3
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"service":"api","replicas":3}
      - run:
          command: >-
            bash -c "set -o pipefail; jz new service=api replicas:=3 |
            curl -sS -X POST -H 'content-type: application/json'
            --data-binary @- 'http://${addr}/plain' -o /dev/null -w '%{http_code}\n'"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              200

  - name: "Save a report for a later step: the file jz wrote is read by the next command"
    steps:
      - fixture:
          file: df.txt
          content: |
            Filesystem      Size  Used Avail Use% Mounted on
            /dev/nvme0n1p2  1.8T  1.6T  145G  92% /
      - run:
          command: >-
            bash -c "cd '${workdir}' && jz --file df.txt > df.json &&
            jq -r '.[0].mounted_on' df.json"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              /

  - name: "Read the explanation in a script: --explain=json is read with sed and jq"
    steps:
      - fixture:
          file: df.txt
          content: |
            Filesystem      Size  Used Avail Use% Mounted on
            /dev/nvme0n1p2  1.8T  1.6T  145G  92% /
      # The explanation on its own, before the pipeline that reads it, and
      # a text nothing reads, which is the second half of the recipe.
      - run:
          command: jz --explain=json
          stdin: |
            Filesystem      Size  Used Avail Use% Mounted on
            /dev/nvme0n1p2  1.8T  1.6T  145G  92% /
      - assert:
          exit_code: 0
          stderr:
            contains: '"definition":"df/gnu-human"'
      - run:
          command: jz --explain=json
          stdin: "no format here\n"
      - assert:
          exit_code: 4
          stdout: {empty: true}
          stderr:
            contains: '"outcome":"unidentified"'
      - run:
          command: >-
            bash -c "set -o pipefail; jz --explain=json --file '${workdir}/df.txt' 2>&1 >/dev/null |
            sed -n 's/^jz: explain: //p' | jq -r '.chosen.definition'"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              df/gnu-human
      - run:
          command: >-
            bash -c "printf 'no format here\n' | jz --explain=json 2>&1 >/dev/null |
            sed -n 's/^jz: explain: //p' | jq -c '{outcome, exit: .error.exit}'"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"outcome":"unidentified","exit":4}

  - name: "Fail a CI step when jz cannot read the output: unidentified text is exit 4 and no JSON"
    steps:
      - run:
          command: jz
          stdin: "no format here\n"
      - assert:
          exit_code: 4
          stdout: {empty: true}
          stderr:
            contains: "jz: unable to identify the input format"

  - name: "Get the JSON Schema of an output: jz list --schema"
    steps:
      - run:
          command: jz list --schema df gnu-human
      - assert:
          exit_code: 0
          stdout:
            contains: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "$id": "https://nao1215.github.io/jsonize/schemas/df/gnu-human.json",

  - name: "Add a parser of your own: a personal registry is tested and then read"
    steps:
      - fixture:
          file: my-registry/parsers/mytool/status/parser.yaml
          content: |
            format: 1
            command: mytool
            variant: status
            description: mytool status, one service per line
            detect:
              signature:
                all:
                  - '\ASERVICE[ \t]+STATE[ \t]*$'
            parse:
              type: table
            fields:
              service: {required: true}
      - fixture:
          file: my-registry/parsers/mytool/status/testdata/basic.txt
          content: |
            SERVICE  STATE
            api      running
            worker   stopped
      - run:
          command: jz test --update ${workdir}/my-registry
      - assert:
          exit_code: 0
          stderr:
            contains: "1 passed, 0 failed"
      - run:
          command: jz
          stdin: |
            SERVICE  STATE
            api      running
            worker   stopped
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/my-registry"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"service":"api","state":"running"},{"service":"worker","state":"stopped"}]
