version: "1"

suite:
  name: data files
  # standin is a copy of e2ehelper under another name, which jz run starts
  # and which relays its input, so the csv a command prints is the fixture.
  setup:
    - fixture:
        file: bin/.keep
        content: ""
    - run:
        command: e2ehelper as standin ${suitedir}/bin

# A data file is read as the format its extension names, and input from a
# pipe as the format --format names. Nothing is detected: the person who
# named the file, or the caller, stated the format, and a reader that
# finds text the format does not allow says where and prints no JSON.
# Every scenario runs on every system; the input is a fixture or stdin,
# never a shell pipeline, so the same command line runs under cmd.exe.
scenarios:
  - name: a csv or a tsv file is read as one object per row with keys from its header
    steps:
      - fixture:
          file: users.csv
          content: |
            id,name,note
            1,alice,
            2,"bob, jr","said ""hi"""
      - run:
          command: jz --file ${workdir}/users.csv
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            equals: |
              [{"id":"1","name":"alice","note":""},{"id":"2","name":"bob, jr","note":"said \"hi\""}]
      - fixture:
          file: SCORES.TSV
          content: "name\tscore\ncarol\t9\n"
      - run:
          command: jz --file ${workdir}/SCORES.TSV
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"name":"carol","score":"9"}]
      # A file without a header line takes its names from --columns.
      - fixture:
          file: rows.csv
          content: |
            1,alice
            2,bob
      - run:
          command: jz --file ${workdir}/rows.csv --columns id,name
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"id":"1","name":"alice"},{"id":"2","name":"bob"}]

  # A csv is data, not command output: nothing in it is taken for colour
  # or for a blank line, and it reads the same through --format, its
  # extension and jz new.
  - name: a csv keeps an escape sequence and a record of spaces in its values, whichever way it is read
    steps:
      - fixture:
          file: colours.csv
          content: "name,code\n\x1b[31mred\x1b[0m,007\n   ,1\n"
      - run:
          command: jz --file ${workdir}/colours.csv
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].name", equals: "\x1b[31mred\x1b[0m" }
              - { path: "$[0].code", equals: "007" }
              - { path: "$[1].name", equals: "   " }
      - run:
          command: jz --format csv
          stdin: "key\n   \nx\n"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"key":"   "},{"key":"x"}]
      - run:
          command: jz new rows:=@${workdir}/colours.csv
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.rows[0].name", equals: "\x1b[31mred\x1b[0m" }
              - { path: "$.rows[1].name", equals: "   " }

  - name: a csv definition in the user registry changes --parser csv and never a csv read as data
    # The user registry lives under os.UserConfigDir, which XDG_CONFIG_HOME
    # controls on Linux.
    only: {os: linux}
    env:
      XDG_CONFIG_HOME: "${workdir}/xdg"
    steps:
      - fixture:
          file: xdg/jsonize/registry/parsers/csv/comma/parser.yaml
          content: |
            format: 1
            command: csv
            variant: comma
            description: a user's csv that types a column
            detect: {auto_detect: false}
            parse: {type: csv}
            fields:
              code: {type: int}
      - fixture:
          file: codes.csv
          content: "name,code\nx,007\n"
      - run:
          command: jz --file ${workdir}/codes.csv
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"name":"x","code":"007"}]
      - run:
          command: jz --format csv --stream
          stdin: "name,code\nx,007\n"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"name":"x","code":"007"}
      - run:
          command: jz new rows:=@${workdir}/codes.csv
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"rows":[{"name":"x","code":"007"}]}
      - run:
          command: jz --parser csv --variant comma
          stdin: "name,code\nx,007\n"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"name":"x","code":7}]

  - name: json keeps its key order and its number literals, and yaml is typed by the core schema
    steps:
      - fixture:
          file: release.json
          content: |
            {"version": "0.2.0", "id": 12345678901234567890, "ratio": 2.50, "assets": []}
      - run:
          command: jz --file ${workdir}/release.json
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"version":"0.2.0","id":12345678901234567890,"ratio":2.50,"assets":[]}
      - fixture:
          file: deploy.yml
          content: |
            name: api
            replicas: 3
            debug: false
            image: "1.2"
            ports: [80, 443]
            limits:
              memory: 512Mi
            owner:
      - run:
          command: jz --file ${workdir}/deploy.yml
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"name":"api","replicas":3,"debug":false,"image":"1.2","ports":[80,443],"limits":{"memory":"512Mi"},"owner":null}

  - name: json lines and ltsv are lists of records, streamed with --stream, and a compressed file is read through its compression
    steps:
      - fixture:
          file: events.jsonl.gz
          from: "${specdir}/testdata/events.jsonl.gz"
      - run:
          command: jz --file ${workdir}/events.jsonl.gz
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"level":"info","msg":"started"},{"level":"warn","msg":"slow","ms":1200}]
      - run:
          command: jz --file ${workdir}/events.jsonl.gz --stream --extract msg
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"msg":"started"}
              {"msg":"slow"}
      - fixture:
          file: access.ltsv.bz2
          from: "${specdir}/testdata/access.ltsv.bz2"
      - run:
          command: jz --file ${workdir}/access.ltsv.bz2
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"host":"192.0.2.1","status":"200","req":"GET / HTTP/1.1"}]

  - name: input from a pipe is read as the format --format names
    steps:
      - run:
          command: jz --format yaml
          stdin: |
            a: 1
            b: [x, y]
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"a":1,"b":["x","y"]}
      - run:
          command: jz --format csv --explain
          stdin: |
            k,v
            a,1
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"k":"a","v":"1"}]
          stderr:
            contains: "read as csv: the format was given with --format, so nothing was chosen"
      - run:
          command: jz --format ltsv --stream
          stdin: "a:1\n\na:2\n"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"a":"1"}
              {"a":"2"}
      # The extension gives way to the format the caller names.
      - fixture:
          file: export.json
          content: "k:v\n"
      - run:
          command: jz --file ${workdir}/export.json --format ltsv --explain=json
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"k":"v"}]
          stderr:
            contains: '"outcome":"format"'

  - name: a data file the format does not allow is refused with the line, and no JSON
    steps:
      - fixture:
          file: broken.json
          content: |
            {
              "a": 1,
              "a": 2
            }
      - run:
          command: jz --file ${workdir}/broken.json
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr:
            contains: 'jz: json: line 3: the key "a" is given twice in one object'
      - fixture:
          file: bad.ltsv
          content: "host:a\tno label here\n"
      - run:
          command: jz --file ${workdir}/bad.ltsv
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr:
            contains: "jz: ltsv: line 1: field 2 has no label"
      - fixture:
          file: numbers.yaml
          content: "ok: 1\nbad: .inf\n"
      - run:
          command: jz --file ${workdir}/numbers.yaml
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr:
            contains: "jz: yaml: line 2: .inf is not a number JSON can hold"
      - fixture:
          file: not-gzip.json.gz
          from: "${specdir}/testdata/not-gzip.json.gz"
      - run:
          command: jz --file ${workdir}/not-gzip.json.gz
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr:
            contains: "the gzip data cannot be decompressed"
      # Input that cannot be read at all ends a stream with the status
      # the whole-document reading ends with. The checksum of this one
      # does not match, and nothing has been written when it is found.
      - fixture:
          file: broken.txt.gz
          base64: "H4sIAAAAAAAC/6vgAgAfCOpHAgAAAA=="
      - run:
          command: jz --file ${workdir}/broken.txt.gz
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr:
            contains: "gzip: invalid checksum"
      - run:
          command: jz --stream --file ${workdir}/broken.txt.gz
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr:
            contains: "gzip: invalid checksum"
      # A stream leaves out the line it cannot read and writes the rest;
      # --stop-on-error keeps only what came before it.
      - run:
          command: jz --format jsonl --stream
          stdin: "1\n2\nnot json\n3\n"
      - assert:
          exit_code: 3
          stdout:
            equals: |
              1
              2
              3
          stderr:
            contains: "jz: jsonl: line 3: the line is not one JSON value"
      - run:
          command: jz --format jsonl --stream --stop-on-error
          stdin: "1\n2\nnot json\n3\n"
      - assert:
          exit_code: 3
          stdout:
            equals: |
              1
              2

  - name: the options that state two answers, or none that fits, are usage errors
    steps:
      - run:
          command: jz --format xml
          stdin: "<a/>"
      - assert:
          exit_code: 2
          stdout: {empty: true}
          stderr:
            contains: 'unknown format "xml"; the formats are csv, tsv, ltsv, jsonl, json, yaml'
      - run:
          command: jz --format csv --parser df
          stdin: "a\n"
      - assert:
          exit_code: 2
          stderr:
            contains: "--format and --parser/--variant/--define cannot be used together"
      - run:
          command: jz --format json --stream
          stdin: "{}"
      - assert:
          exit_code: 2
          stderr:
            contains: "--stream writes the records of a record format (ltsv, jsonl, lines, nul), and a json document is one value"
      - run:
          command: jz --format json --extract missing
          stdin: '{"present": 1}'
      - assert:
          exit_code: 2
          stdout: {empty: true}
          stderr:
            contains: 'no key "missing" in the output'

  # text, lines and nul read what a pipe carries as strings, for a command
  # whose output has no format of its own: the whole of it, one string per
  # line, or one per NUL-terminated record. Nothing is trimmed but the
  # separator, an empty record stays "", and a separator at the end ends
  # the last record rather than starting an empty one.
  - name: text is one string and lines and nul are lists of strings, with nothing trimmed
    steps:
      - run:
          command: jz --format text
          stdin: "  indented\r\n\n"
      - assert:
          exit_code: 0
          stdout:
            equals: "\"  indented\\r\\n\\n\"\n"
      - run:
          command: jz --format text
          stdin: ""
      - assert:
          exit_code: 0
          stdout:
            equals: "\"\"\n"
      - run:
          command: jz --format lines
          stdin: "first\r\n\n  spaced  \nno ending"
      - assert:
          exit_code: 0
          stdout:
            equals: "[\"first\",\"\",\"  spaced  \",\"no ending\"]\n"
      - run:
          command: jz --format lines
          stdin: "one\n"
      - assert:
          exit_code: 0
          stdout:
            equals: "[\"one\"]\n"
      - run:
          command: jz --format lines
          stdin: ""
      - assert:
          exit_code: 0
          stdout:
            equals: "[]\n"
      - fixture:
          file: found.bin
          base64: "Li9hIGIALi9jCmQAAA=="
      - run:
          command: jz --format nul --file ${workdir}/found.bin
      - assert:
          exit_code: 0
          stdout:
            equals: "[\"./a b\",\"./c\\nd\",\"\"]\n"
      - fixture:
          file: last.bin
          base64: "eABBAA=="
      - run:
          command: jz --format nul --stream --file ${workdir}/last.bin
      - assert:
          exit_code: 0
          stdout:
            equals: |
              "x"
              "A"
      - run:
          command: jz --format text --stream
          stdin: "x"
      - assert:
          exit_code: 2
          stdout: {empty: true}
          stderr:
            contains: "--stream writes the records of a record format (ltsv, jsonl, lines, nul), and a text document is one value"

  # With --stream a line or a NUL-terminated record is written when its
  # separator arrives, while the input is still open.
  - name: lines and nul records are written as their separators arrive
    steps:
      - fixture:
          file: lines.feed
          content: |
            send first\r\n
            expect 1
            send \n
            expect 1
            send last
            close
            expect 1
            wait
      - run:
          command: e2ehelper feed -deadline 10s -script lines.feed -- jz --format lines --stream
          timeout: 60s
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            equals: |
              > expect 1
              "first"
              > expect 1
              ""
              > expect 1
              "last"
              status=0
      - fixture:
          file: zero-records.feed
          content: |
            send a b\x00
            expect 1
            send c\nd\x00
            expect 1
            close
            wait
      - run:
          command: e2ehelper feed -deadline 10s -script zero-records.feed -- jz --format nul --stream
          timeout: 60s
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            equals: |
              > expect 1
              "a b"
              > expect 1
              "c\nd"
              status=0

  - name: text that is not UTF-8 is refused with its line or record, and a stream keeps what it wrote
    steps:
      - fixture:
          file: latin1.txt
          base64: "b2sKY2Fm6QoK"
      - run:
          command: jz --format lines --file ${workdir}/latin1.txt
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr:
            contains: "jz: lines: line 2: the text is not valid UTF-8"
      - run:
          command: jz --format text --file ${workdir}/latin1.txt
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr:
            contains: "jz: text: line 2: the text is not valid UTF-8"
      - fixture:
          file: latin1.bin
          base64: "b2sAY2Fm6QA="
      - run:
          command: jz --format nul --stream --file ${workdir}/latin1.bin
      - assert:
          exit_code: 3
          stdout:
            equals: |
              "ok"
          stderr:
            contains: "jz: nul: record 2: the text is not valid UTF-8"

  # A conversion hands on what it was given. An escape that names half of
  # a surrogate pair names no character, and reading it as U+FFFD would
  # put a character in the output that the input may also hold for
  # itself, with nothing said about which it was. A control character
  # standing in YAML text is not text YAML allows.
  - name: text that names no character is refused rather than replaced
    steps:
      - fixture:
          file: half.json
          content: '{"name":"\ud800"}'
      - run:
          command: jz --file ${workdir}/half.json
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr:
            contains: 'jz: json: line 1: the escape \ud800 is half of a surrogate pair and names no character'
      - fixture:
          file: pair.json
          content: '{"name":"\ud83d\ude00","kept":"\ufffd"}'
      - run:
          command: jz --file ${workdir}/pair.json
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.name", equals: "\U0001F600" }
              - { path: "$.kept", equals: "\uFFFD" }
      - fixture:
          file: control.yaml
          base64: "a2V5OiBhYgBjZAo="
      - run:
          command: jz --file ${workdir}/control.yaml
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr:
            contains: "jz: yaml: line 1: the character U+0000 is not allowed in YAML text"
      - fixture:
          file: escaped.yaml
          content: |
            key: "ab\0cd"
      - run:
          command: jz --file ${workdir}/escaped.yaml
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.key", equals: "ab\u0000cd" }

  # --type converts the columns it names with the rules a definition's
  # field of that type follows. The rest stay the strings they were, so
  # 007 stays "007"; an empty value is null.
  - name: --type converts the columns it names and leaves the rest as text
    steps:
      - fixture:
          file: sales.csv
          content: |
            sku,units,price,in_stock
            007,12,1.50,yes
            008,,,false
      - run:
          command: jz --file ${workdir}/sales.csv --type units=int --type price=float --type in_stock=bool
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            equals: |
              [{"sku":"007","units":12,"price":1.5,"in_stock":true},{"sku":"008","units":null,"price":null,"in_stock":false}]
      - run:
          command: jz --file ${workdir}/sales.csv
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"sku":"007","units":"12","price":"1.50","in_stock":"yes"},{"sku":"008","units":"","price":"","in_stock":"false"}]
      - run:
          command: jz --format tsv --type n=int --stream
          stdin: "id\tn\na\t1\nb\t2\n"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"id":"a","n":1}
              {"id":"b","n":2}
      - run:
          command: jz --format csv --columns id,n --type n=int
          stdin: "a,1\n"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"id":"a","n":1}]
      - run:
          command: jz run --parser csv --variant comma --type n=int -- ${suitedir}/bin/standin
          stdin: "id,n\na,5\n"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"id":"a","n":5}]

  # A value that is not the type names the line and the column. Read whole,
  # nothing is written; streamed, the rows before and after it are written
  # and the status is still 3. A column the input does not have was named
  # by the caller, so it is exit 2, before any row is written.
  - name: --type refuses a value that is not the type, a column the input lacks and a type it does not know
    steps:
      - run:
          command: jz --format csv --type units=int
          stdin: "sku,units\n1,4\n2,four\n3,5\n"
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr:
            contains: 'jz: csv/comma: line 3: field "units": cannot convert "four" to int'
      - run:
          command: jz --format csv --type units=int --stream
          stdin: "sku,units\n1,4\n2,four\n3,5\n"
      - assert:
          exit_code: 3
          stdout:
            equals: |
              {"sku":"1","units":4}
              {"sku":"3","units":5}
          stderr:
            contains: 'line 3: field "units": cannot convert "four" to int'
      - run:
          command: jz --format csv --type price=float
          stdin: "sku,units\n1,4\n"
      - assert:
          exit_code: 2
          stdout: {empty: true}
          stderr:
            contains: 'jz: csv/comma: line 1: no column "price"; the columns are "sku", "units"'
      - run:
          command: jz --format csv --type price=float --stream
          stdin: "sku,units\n1,4\n"
      - assert:
          exit_code: 2
          stdout: {empty: true}
      - run:
          command: jz --format csv --type units=integer --file ${workdir}/missing.csv
      - assert:
          exit_code: 2
          stdout: {empty: true}
          stderr:
            contains: '--type units=integer: unknown type "integer"; the types are int, float, bool'
      - run:
          command: jz --format csv --type units=int --type units=float
          stdin: "units\n1\n"
      - assert:
          exit_code: 2
          stderr:
            contains: '--type gives the column "units" twice'
      - run:
          command: jz --format csv --type units=int --raw
          stdin: "units\n1\n"
      - assert:
          exit_code: 2
          stdout: {empty: true}
          stderr:
            contains: "--type and --raw cannot be used together"
      # A definition's own field for a column the file lacks does nothing;
      # only a column named on the command line is checked.
      - run:
          command: "jz --define 'parse: {type: csv}\nfields: {units: {type: int}}'"
          stdin: "sku\n1\n"
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"sku":"1"}]
      - run:
          command: jz --format lines --type units=int
          stdin: "1\n"
      - assert:
          exit_code: 2
          stderr:
            contains: "--type converts the columns of a csv or a tsv, and standard input is read as lines"
