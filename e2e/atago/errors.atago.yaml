version: "1"

suite:
  name: jz - refusing to guess

# Wrong JSON returned with a zero exit status would be the worst failure
# this tool could have, so every uncertain case ends non-zero with an
# empty stdout and an explanation on stderr.
scenarios:
  - name: text that matches no parser is refused, not approximated
    steps:
      - run:
          command: jz
          stdin: "this is not the output of any known command\n"
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: unable to identify the input format
            # Naming a parser that has a signature is checked the same
            # way, so the way forward offered is a shape or --define.
            matches: "(?s)name it:.*jz --parser csv.*--define"

  - name: empty and blank input are refused the same way
    steps:
      # An empty file rather than an empty inline string: the point is
      # that jz reads zero bytes and refuses, whatever the shell does.
      - fixture:
          file: empty.txt
          content: ""
      - run:
          command: jz --file empty.txt
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: unable to identify
      - run:
          command: jz
          stdin: "   \n\t\n"
      - assert:
          exit_code: 4
          stderr:
            contains: unable to identify

  # /dev/null is a character device, as a terminal is, but reading it is
  # reading nothing, which is what cron, a CI step or `ssh -n` leave on
  # standard input. jz used to take it for a terminal and print its help
  # on standard output with status 0.
  - name: standard input from /dev/null is empty input, not a terminal
    skip: {os: windows}
    steps:
      - run:
          shell: true
          command: jz < /dev/null
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: unable to identify

  # `git ls-files -s -z`: the records end with NUL, so read line by line
  # it is one line whose last field would hold every record after the
  # first. Neither detection nor naming the definition reads it.
  - name: records separated by NUL are refused by every line-based format
    steps:
      - fixture:
          file: zero.txt
          base64: "MTAwNjQ0IDI5ODdmOTZmM2YwNzZlNGJlOTQxMTcyODgyNDFmMWE2ODAwZTM5OGEgMAlMSUNFTlNFADEwMDY0NCAyZjVmNDg1YWY3MGUxNmZkMDIwOGVlNjViNzE4ZjUzYTM4MjljZDgyIDAJZ28ubW9kAA=="
      - run:
          command: jz --file zero.txt
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: "-z or --zero"
      - run:
          command: jz --parser git --variant ls-files-stage --file zero.txt
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: "holds a NUL byte"

  - name: input that is not valid UTF-8 is refused before parsing
    steps:
      - fixture:
          file: binary.bin
          base64: "/////gABAgP//w=="
      - run:
          command: jz
          stdin: {file: binary.bin}
      - assert:
          exit_code: 4
          stdout:
            empty: true

  # A reading that succeeds has read all of its input. Two dig replies
  # in one capture used to come back as the first reply at exit 0; the
  # second one is now named where it starts, and nothing is written.
  - name: text the definition does not read is refused, not dropped
    steps:
      - fixture:
          file: dig-reply.txt
          from: "${specdir}/testdata/dig-reply.txt"
      - fixture:
          file: dig-nxdomain.txt
          from: "${specdir}/testdata/dig-nxdomain.txt"
      - run:
          command: jz --file dig-reply.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.header.status", equals: NOERROR }
      - run:
          command: sh -c 'cat dig-reply.txt dig-nxdomain.txt | jz'
      - assert:
          exit_code: 3
          stdout:
            empty: true
          stderr:
            contains: "dig/bind: line 21: 11 lines no part of the definition read: line 21"
      # A line nothing prints, added at the end, is the same failure.
      - run:
          command: sh -c '{ cat dig-reply.txt; echo "unexpected trailer"; } | jz'
      - assert:
          exit_code: 3
          stdout:
            empty: true
          stderr:
            contains: "unexpected trailer"

  - name: input matching several parsers names them instead of choosing
    steps:
      - fixture:
          file: reg/parsers/alpha/default/parser.yaml
          content: |
            format: 1
            command: alpha
            variant: default
            detect: {signature: {all: ['^SHARED']}}
            parse: {type: kv}
      - fixture:
          file: reg/parsers/beta/default/parser.yaml
          content: |
            format: 1
            command: beta
            variant: default
            detect: {signature: {all: ['SHARED']}}
            parse: {type: kv}
      - run:
          command: jz
          stdin: "SHARED=1\n"
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: input matches multiple parsers
            matches: "alpha/default"
      - assert:
          stderr:
            contains: "--parser alpha"
      # Naming the parser resolves it.
      - run:
          command: jz --parser beta
          stdin: "SHARED=1\n"
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].name", equals: SHARED }

  - name: several variants of one command are reported as variants
    steps:
      - fixture:
          file: reg/parsers/twin/one/parser.yaml
          content: |
            format: 1
            command: twin
            variant: one
            detect: {signature: {all: ['^SHARED']}}
            parse: {type: kv}
      - fixture:
          file: reg/parsers/twin/two/parser.yaml
          content: |
            format: 1
            command: twin
            variant: two
            detect: {signature: {all: ['SHARED']}}
            parse: {type: kv}
      - run:
          command: jz --parser twin
          stdin: "SHARED=1\n"
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 4
          stderr:
            contains: input matches multiple twin variants
            matches: "--variant one"
      - run:
          command: jz --parser twin --variant two
          stdin: "SHARED=1\n"
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 0

  - name: a variant that contradicts the input is refused, with no way around it
    steps:
      - fixture:
          file: df-gnu.txt
          from: "${specdir}/testdata/df-gnu.txt"
      - run:
          command: jz --parser df --variant bsd
          stdin: {file: df-gnu.txt}
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: df/bsd does not describe this input
      # Naming a variant is a claim about the text, not permission to
      # ignore it; a definition that rejects output it should accept is a
      # definition to fix.
      - assert:
          stderr:
            not_contains: "--force"

  - name: naming lscpu does not push its comma separated format through
    steps:
      - fixture:
          file: lscpu-parsable.txt
          from: "${specdir}/testdata/lscpu-parsable.txt"
      - run:
          command: jz --parser lscpu
          stdin: {file: lscpu-parsable.txt}
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: no lscpu variant matches this input

  - name: a parse failure names the line and the field, and prints no JSON
    steps:
      - run:
          command: jz
          stdin: "Filesystem     1K-blocks    Used Available Use% Mounted on\ntmpfs  abc 0 0 0% /run\n"
      - assert:
          exit_code: 3
          stdout:
            empty: true
          stderr:
            contains: 'df/gnu: line 2: field "1k_blocks": cannot convert "abc" to int'

  - name: a row with too few columns is rejected, not silently padded
    steps:
      - run:
          command: jz
          stdin: "Filesystem     1K-blocks    Used Available Use% Mounted on\ntmpfs 1 2\n"
      - assert:
          exit_code: 3
          stderr:
            contains: expected at least 6 fields but found 3

  - name: an unknown parser or variant name fails with what does exist
    steps:
      - run:
          command: jz --parser nosuchtool
          stdin: "x\n"
      - assert:
          exit_code: 4
          stderr:
            contains: no parser for "nosuchtool"
            matches: "jz list"
      - run:
          command: jz --parser dg
          stdin: "x\n"
      - assert:
          exit_code: 4
          stderr:
            contains: did you mean df
      - run:
          command: jz --parser df --variant solaris
          stdin: "x\n"
      - assert:
          exit_code: 4
          stderr:
            contains: "available: bsd, bsd-human, busybox-human, gnu, gnu-human"

  - name: a variant without a parser is a usage error
    steps:
      - run:
          command: jz --variant gnu
          stdin: "x\n"
      - assert:
          exit_code: 2
          stderr:
            contains: "--variant gnu needs --parser"

  - name: oversized input is refused before parsing
    skip: {os: windows}
    steps:
      - run:
          shell: true
          command: head -c 67108865 /dev/zero | tr "\\0" "x" | jz
      - assert:
          exit_code: 3
          stdout:
            empty: true
          stderr:
            contains: input exceeds the 67108864 byte limit

  - name: a format too generic to recognise is refused and names its parser
    steps:
      # A count and a path is du output, and nothing in the text says so,
      # which is why jz refuses rather than picking du because it was the
      # only candidate left. The message names it and how to confirm it.
      - run:
          command: jz
          stdin: "12\t/usr/bin\n"
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: could be `du` output
            matches: "jz --parser du"
      # Three cells, two of them counts, is `git diff --numstat` and not
      # du, and the message names the one it could be.
      - run:
          command: jz
          stdin: "10\t2\tmain.go\n"
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: could be `git` output
      # Naming the parser is the user asserting what the text is; the
      # signature still checks that it has the right shape.
      - run:
          command: jz --parser du
          stdin: "134164\t/usr/bin\n"
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].size", equals: 134164 }
              - { path: "$[0].name", equals: /usr/bin }
      - run:
          command: jz --parser du
          stdin: "this is not du output\n"
      - assert:
          exit_code: 4
          stdout:
            empty: true

  - name: a row cut short is an error, not a device with null columns
    steps:
      - run:
          command: jz
          stdin: "NAME        MAJ:MIN RM   SIZE RO TYPE MOUNTPOINTS\nsda\n"
      - assert:
          exit_code: 3
          stdout:
            empty: true
          stderr:
            contains: 'field "maj_min": required value is missing'
      # A column that is genuinely empty is still fine.
      - run:
          command: jz
          stdin: "NAME        MAJ:MIN RM   SIZE RO TYPE MOUNTPOINTS\nsda           8:0    0    20G  0 disk \n"
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].size", equals: "20G" }
              - { path: "$[0].mountpoint", equals: null }

  # docker ps names its first column with two words. Cut at the header's
  # words, the id runs past where "ID" starts and leaves that column
  # empty, which is also what a genuinely empty column after a long value
  # would look like. The row does not say which, so it is refused; it used
  # to be a row with "id": null at exit 0.
  - name: an aligned row the header does not place is refused, not read into the wrong columns
    steps:
      - fixture:
          file: docker-ps.txt
          from: "${specdir}/../../registry/parsers/docker/ps/testdata/docker-29-running.txt"
      - run:
          command: jz --parser table --variant aligned --file docker-ps.txt
      - assert:
          exit_code: 3
          stdout:
            empty: true
          stderr:
            contains: 'field "id": the value before it'
      - assert:
          stderr:
            contains: "runs past where this column starts and leaves it empty"
      # LEFT is right-aligned and its value has a space in it, so the cut
      # at the header falls inside it and leaves the gap between two
      # columns in the cell before. That was "... JST  4min" at exit 0.
      - run:
          command: jz --parser table --variant aligned
          stdin: "NEXT                             LEFT LAST\nFri 2026-09-11 06:55:28 JST  4min 27s Fri 2026-09-11 06:50:28 JST\n"
      - assert:
          exit_code: 3
          stdout:
            empty: true
          stderr:
            contains: 'field "next": "Fri 2026-09-11 06:55:28 JST  4min" holds the gap that stands between two columns'

  - name: an empty input ends differently depending on what was named
    steps:
      - fixture:
          file: empty2.txt
          content: ""
      - run:
          command: jz --file empty2.txt
      - assert:
          exit_code: 4
          stderr:
            contains: unable to identify
      - run:
          command: jz --file empty2.txt --parser df
      - assert:
          exit_code: 4
          stderr:
            contains: no df variant matches this input
      - run:
          command: jz --file empty2.txt --parser df --variant gnu
      - assert:
          exit_code: 4
          stderr:
            contains: does not describe this input

  - name: an unknown subcommand or flag is a usage error
    steps:
      - run:
          command: jz frobnicate
      - assert:
          exit_code: 2
          stdout:
            empty: true
          stderr:
            contains: unknown command "frobnicate"
      - run:
          command: jz --bogus
          stdin: "x\n"
      - assert:
          exit_code: 2
          stderr:
            contains: "Usage: COMMAND | jz"
      - run:
          command: jz list df gnu extra
      - assert:
          exit_code: 2
          stderr:
            contains: expected at most COMMAND and VARIANT
      # Two files for an option that reads one: the first used to be
      # dropped without a word and the second converted at status 0.
      - fixture:
          file: one.txt
          content: "a=1\n"
      - run:
          command: jz --parser kv --variant equals -f one.txt --file one.txt
      - assert:
          exit_code: 2
          stdout:
            empty: true
          stderr:
            contains: "--file was given twice, and it takes one value"

  - name: the options removed before release are usage errors
    steps:
      - run:
          command: jz --meta
          stdin: "x=1\n"
      - assert:
          exit_code: 2
          stdout:
            empty: true
          stderr:
            contains: "not defined: -meta"
      - run:
          command: jz --os linux
          stdin: "x=1\n"
      - assert:
          exit_code: 2
      - run:
          command: jz --force
          stdin: "x=1\n"
      - assert:
          exit_code: 2
      - run:
          command: jz --max-input 1
          stdin: "x=1\n"
      - assert:
          exit_code: 2
      - run:
          command: jz --embedded-only
          stdin: "x=1\n"
      - assert:
          exit_code: 2
      - run:
          command: jz --registry ./registry
          stdin: "x=1\n"
      - assert:
          exit_code: 2

  - name: the subcommands removed before release are gone
    steps:
      - run:
          command: jz parse df
          stdin: "x\n"
      - assert:
          exit_code: 2
          stderr:
            contains: unknown command "parse"
      - run:
          command: jz show df
      - assert:
          exit_code: 2
      - run:
          command: jz validate
      - assert:
          exit_code: 2
      - run:
          command: jz registry update
      - assert:
          exit_code: 2
          stderr:
            contains: unknown command "registry"

  # The output of a command jz has no parser for must not be read as the
  # output of one it does. Each input below was converted into confident
  # JSON by some definition until its signature was tightened, so they
  # stay here as the record of what "too generic" looked like.
  - name: another command's output is not read as a mount table
    steps:
      - run:
          command: jz
          stdin: "Building foo on linux (amd64)\nBuilding bar on darwin (arm64)\n"
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: unable to identify the input format

  - name: a kernel banner quoted in a file is not read as uname
    steps:
      - run:
          command: jz
          stdin: "Linux version 7.0.0-30-generic (buildd@lcy02) #30-Ubuntu SMP\n"
      - assert:
          exit_code: 4
          stdout:
            empty: true
      - run:
          command: jz
          stdin: "Darwin Kernel Version 23.5.0: Wed May  1 20:09:52 PDT 2024\n"
      - assert:
          exit_code: 4
          stdout:
            empty: true

  - name: a service status table is not read as ip -brief address
    steps:
      - run:
          command: jz
          stdin: "web01 UP 3 days\ndb01 DOWN 2 hours\n"
      - assert:
          exit_code: 4
          stdout:
            empty: true

  - name: a properties file is not read as sysctl
    steps:
      - run:
          command: jz
          stdin: "user.name = nao\nnet.core.x = 1\n"
      - assert:
          exit_code: 4
          stdout:
            empty: true

  - name: prose containing one DNS answer is not read as host
    steps:
      # host skips lines it cannot parse, so a loose signature here would
      # have turned a page of text into a single answer record.
      - run:
          command: jz
          stdin: "Notes from today.\nwww.example.com has address 93.184.216.34\nrandom trailing text\n"
      - assert:
          exit_code: 4
          stdout:
            empty: true

  - name: naming a parser does not get another command's output past its signature
    steps:
      - run:
          command: jz --parser etc --variant group
          stdin: "root:x:0:0:root:/root:/bin/bash\ndaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\n"
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: "etc/group does not describe this input"
      - run:
          command: jz --parser etc --variant hosts
          stdin: "10:14  up 3 days, 22:45, 2 users, load averages: 1.0 1.1 1.2\n"
      - assert:
          exit_code: 4
          stdout:
            empty: true
      - run:
          command: jz --parser file
          stdin: "/dev/nvme0n1p1: UUID=\"1234-ABCD\" TYPE=\"vfat\"\n"
      - assert:
          exit_code: 4
          stdout:
            empty: true
