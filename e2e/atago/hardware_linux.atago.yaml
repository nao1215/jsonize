version: "1"

suite:
  name: real hardware on Linux (optional)

# Commands whose output depends on a device the machine may not have: a
# sound card, a wireless interface, a PCI bus the kernel lists, a boot
# systemd has finished, a block device blkid may read. These run only
# where the device is there, and each probe asks for the output rather
# than for the binary, so "aplay is installed but there is no card" is
# a skip and not a failure to read nothing.
#
# The suite is optional by name: a skip here is expected, and the run
# script lists every skip with its reason so the log says what was not
# verified on this machine. Nothing else is skipped for a reason other
# than the operating system. The definitions themselves are required
# reading: exec_linux.atago.yaml runs each of these commands on captured
# output through the same path, so a parser bug is never hidden by a
# skip here.
scenarios:
  # The host's own pciutils. What is pinned is the shape of the answer,
  # never a slot number or a device name.
  - name: jz run lspci -vv lands on the tree definition
    only: {os: linux, command: "LC_ALL=C lspci -vv | grep -q '^[0-9a-f]'"}
    steps:
      - run:
          command: jz run --explain lspci -vv
      - assert:
          exit_code: 0
          stderr:
            contains: "lspci/verbose from embedded"
          stdout:
            json:
              - { path: "$[0].slot", matches: "^([0-9a-f]{4}:)?[0-9a-f]{2}:[0-9a-f]{2}\\.[0-9a-f]$" }
              - { path: "$[0].children[0].children", length: 0 }
      # One device per line, each a complete document.
      - run:
          command: jz run --stream lspci -vv
      - assert:
          exit_code: 0
          stdout:
            contains: '"children":'
            min_count: 2

  # One -v prints a Flags line where -vv prints the register dumps, and
  # lspci -k prints neither, so the two verbosities land on one definition.
  - name: jz run lspci -v lands on the tree definition
    only: {os: linux, command: "LC_ALL=C lspci -v | grep -q '^[0-9a-f]'"}
    steps:
      - run:
          command: jz run --explain lspci -v
      - assert:
          exit_code: 0
          stderr:
            contains: "lspci/verbose from embedded"
          stdout:
            json:
              - { path: "$[0].slot", matches: "^([0-9a-f]{4}:)?[0-9a-f]{2}:[0-9a-f]{2}\\.[0-9a-f]$" }

  - name: jz run iw dev lands on the tree definition
    only: {os: linux, command: "[ -n \"$(LC_ALL=C iw dev)\" ]"}
    steps:
      - run:
          command: jz run --explain iw dev
      - assert:
          exit_code: 0
          stderr:
            contains: "iw/dev from embedded"
          stdout:
            json:
              - { path: "$[0].phy", gte: 0 }

  # systemd-analyze refuses to answer until the boot has finished, which
  # on a cloud runner it may never do.
  - name: systemd-analyze critical-chain is read as a tree of durations
    only: {os: linux, command: "systemd-analyze critical-chain > /dev/null"}
    steps:
      - run:
          command: jz run --explain systemd-analyze critical-chain
      - assert:
          exit_code: 0
          stderr:
            contains: "systemd-analyze/critical-chain from embedded"
          stdout:
            json:
              - { path: "$[0].activated", gt: 0 }
              - { path: "$[0].children[0].unit", matches: "\\." }

  - name: systemd-analyze security scores each service
    only: {os: linux, command: "systemd-analyze security --no-pager > /dev/null"}
    steps:
      - run:
          command: jz run --explain systemd-analyze security --no-pager
      - assert:
          exit_code: 0
          stderr:
            contains: "systemd-analyze/security from embedded"
          stdout:
            json:
              - { path: "$[0].exposure", gte: 0 }

  # blkid prints nothing at all without the right to read the devices.
  - name: blkid -o export is one block of attributes per device
    only: {os: linux, command: "[ -n \"$(blkid -o export)\" ]"}
    steps:
      - run:
          command: jz run --explain blkid -o export
      - assert:
          exit_code: 0
          stderr:
            contains: "blkid/export from embedded"
          stdout:
            json:
              - { path: "$[0].attributes.DEVNAME", matches: "^/dev/" }

  - name: jz run aplay -l lands on the ALSA device listing
    only: {os: linux, command: "LC_ALL=C aplay -l | grep -q '^card '"}
    steps:
      - run:
          command: jz run --explain aplay -l
      - assert:
          exit_code: 0
          stderr:
            contains: "aplay/devices from embedded"
          stdout:
            json:
              - { path: "$[0].device.card", gte: 0 }
              - { path: "$[0].subdevice_count.total", gte: 1 }

  # An application registers the name and reason of its lock, in any
  # script, and systemd lines the table up by display width.
  - name: jz run systemd-inhibit --list lands on the table of locks
    only: {os: linux, command: "LC_ALL=C systemd-inhibit --list | grep -q '^WHO '"}
    steps:
      - run:
          command: jz run --explain systemd-inhibit --list
      - assert:
          exit_code: 0
          stderr:
            contains: "systemd-inhibit/list from embedded"
          stdout:
            json:
              - { path: "$[0].uid", gte: 0 }
              - { path: "$[0].pid", gte: 1 }

  # power-profiles-daemon has to be running for the list to be printed.
  - name: jz run powerprofilesctl lands on the list of profiles
    only: {os: linux, command: "LC_ALL=C powerprofilesctl list | grep -q '^[* ] [a-z]'"}
    steps:
      - run:
          command: jz run --explain powerprofilesctl
      - assert:
          exit_code: 0
          stderr:
            contains: "powerprofilesctl/list from embedded"
          stdout:
            json:
              - { path: "$[0].profile.name", matches: "^[a-z-]+$" }

  # Sending ICMP takes a capability or a ping_group_range that admits the
  # user, which a container may not grant. -D prefixes each reply with the
  # time it arrived, and the reply used to be refused for it.
  - name: jz run ping -D reads the timestamp of each reply
    only: {os: linux, command: "ping -c 1 -W 2 127.0.0.1 > /dev/null"}
    steps:
      - run:
          command: jz run --explain ping -c 2 -D 127.0.0.1
      - assert:
          exit_code: 0
          stderr:
            contains: "ping/linux from embedded"
          stdout:
            json:
              - { path: "$.replies", length: 2 }
              - { path: "$.replies[0].timestamp", gt: 1000000000 }
              - { path: "$.replies[1].icmp_seq", equals: 2 }
              - { path: "$.statistics.packets_received", equals: 2 }

  # The journal has to be readable by the user running the suite. A query
  # that matched nothing says so on a line of its own, which is the empty
  # list, and recent entries may hold messages over several lines.
  - name: the journal reads a query that matched nothing, and recent entries
    only: {os: linux, command: "journalctl -n 1 --no-pager | grep -q ."}
    steps:
      - run:
          command: jz run journalctl -n 0 --no-pager
      - assert:
          exit_code: 0
          stdout:
            equals: "[]"
      - run:
          command: jz run journalctl -n 200 --no-pager
      - assert:
          exit_code: 0
