version: "1"

suite:
  name: registries, list and version

# Users extend jz with YAML only: a definition in a registry directory is
# detected automatically, exactly like an official one.
scenarios:
  - name: list shows commands, then variants, then one definition in full
    steps:
      - run:
          command: jz list
      - assert:
          exit_code: 0
          stdout:
            contains: "COMMAND"
            matches: "df +bsd, bsd-human, busybox-human, gnu, gnu-human"
      - run:
          command: jz list df
      - assert:
          exit_code: 0
          stdout:
            contains: "VARIANT"
            matches: "gnu-human +linux +embedded"
      - run:
          command: jz list df gnu
      - assert:
          exit_code: 0
          stdout:
            contains: "df/gnu"
            matches: "detection: +signature"
      - assert:
          stdout:
            contains: "format:       1"
      - assert:
          stdout:
            contains: "1k_blocks            int"

  - name: list has a JSON form at every level
    steps:
      - run:
          command: jz list --json
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].command", matches: "^[a-z]" }
              - { path: "$[0].variants[0]", matches: "^[a-z]" }
      - run:
          command: jz list --json df
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].variant", equals: bsd }
      - run:
          command: jz list --json df gnu
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.variant", equals: gnu }
              - { path: "$.format", equals: 1 }
              - { path: "$.source", equals: embedded }
              - { path: "$.detect.auto_detectable", equals: true }
              - { path: "$.detect.os[0]", equals: linux }
              - { path: "$.fields.1k_blocks", equals: "int required" }

  - name: list --sources shows where definitions come from
    steps:
      - run:
          command: jz list --sources
      - assert:
          exit_code: 0
          stdout:
            contains: embedded
            matches: "built into jz"
      - run:
          command: jz list --sources --json
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[-1].name", equals: embedded }
              - { path: "$[-1].present", equals: true }

  - name: help points at the documentation, the issue tracker and sponsors
    steps:
      - run:
          command: jz --help
      - assert:
          exit_code: 0
          stdout:
            contains: "Documentation:   https://nao1215.github.io/jsonize/"
      - assert:
          stdout:
            contains: "GitHub Sponsors: https://github.com/sponsors/nao1215"
      - run:
          command: jz run --help
      - assert:
          exit_code: 0
          stdout:
            contains: "Report an issue: https://github.com/nao1215/jsonize/issues"

  - name: version reports the binary and the definition format it reads
    steps:
      - run:
          command: jz version
      - assert:
          exit_code: 0
          stdout:
            contains: definition format 1
      - run:
          command: jz --version
      - assert:
          exit_code: 0
          stdout:
            contains: "jz "

  - name: a parser added as YAML is detected without rebuilding jz
    steps:
      - fixture:
          file: reg/registry.yaml
          content: |
            format: 1
            name: local
      - fixture:
          file: reg/parsers/greet/default/parser.yaml
          content: |
            format: 1
            command: greet
            variant: default
            description: greeting lines
            detect:
              signature:
                all: ['^hello \S+ x\d+$']
            parse:
              type: regex
              pattern: '^hello (?P<name>\S+) x(?P<times>\d+)$'
            fields:
              times: {type: int}
      - run:
          command: jz
          stdin: "hello atago x7\n"
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].name", equals: atago }
              - { path: "$[0].times", equals: 7 }
      # Subcommands come first; an option before one is a usage error
      # rather than being silently treated as piped input.
      - run:
          command: jz --pretty list greet
      - assert:
          exit_code: 2
          stderr:
            contains: "\"list\" must come before the options"
      - run:
          command: jz list greet
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 0
          stdout:
            contains: default

  - name: JSONIZE_REGISTRY_PATH adds registries too
    steps:
      - fixture:
          file: extra/parsers/bye/default/parser.yaml
          content: |
            format: 1
            command: bye
            variant: default
            detect: {signature: {all: ['^bye ']}}
            parse:
              type: regex
              pattern: '^bye (?P<name>\S+)$'
      - run:
          command: jz
          stdin: "bye now\n"
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/extra"
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].name", equals: now }
      - run:
          command: jz list --sources
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/extra"
      - assert:
          exit_code: 0
          stdout:
            matches: "extra +present +1"

  - name: a user definition shadows the official one of the same name
    # The user registry lives under os.UserConfigDir, which XDG_CONFIG_HOME
    # controls on Linux.
    only: {os: linux}
    env:
      XDG_CONFIG_HOME: "${workdir}/xdg"
    steps:
      - fixture:
          file: xdg/jsonize/registry/parsers/df/gnu/parser.yaml
          content: |
            format: 1
            command: df
            variant: gnu
            description: user override keeping strings
            detect: {signature: {all: ['^Filesystem\s+1K-blocks']}}
            parse:
              type: table
              header:
                columns: [filesystem, blocks, used, available, use_percent, mounted_on]
      - run:
          command: jz
          stdin: "Filesystem 1K-blocks Used Available Use% Mounted on\nfs 1 2 3 4% /\n"
      - assert:
          exit_code: 0
          stdout:
            # The user definition keeps every value a string, which is how
            # the output shows that it shadowed the embedded one.
            json: { path: "$[0].blocks", equals: "1" }
      - run:
          command: jz list df gnu
      - assert:
          exit_code: 0
          stdout:
            matches: "shadows: +the same definition in embedded"
      # Without the user registry the embedded definition applies again.
      - run:
          command: jz
          stdin: "Filesystem 1K-blocks Used Available Use% Mounted on\nfs 1 2 3 4% /\n"
          env:
            XDG_CONFIG_HOME: "${workdir}/empty-config"
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].1k_blocks", equals: 1 }

  - name: a broken definition is skipped with a warning, not fatally
    steps:
      - fixture:
          file: reg/parsers/bad/one/parser.yaml
          content: |
            format: 1
            command: bad
            variant: one
            parse:
              type: regex
              pattern: '(unclosed'
      - fixture:
          file: reg/parsers/good/one/parser.yaml
          content: |
            format: 1
            command: good
            variant: one
            detect: {signature: {all: ['^good']}}
            parse:
              type: regex
              pattern: '^good (?P<v>\S+)$'
      - run:
          command: jz
          stdin: "good news\n"
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].v", equals: news }
          stderr:
            contains: "warning: skipping definition"
      - assert:
          stderr:
            contains: "parse.pattern: invalid regular expression"

  - name: a definition in the wrong directory or a newer format is rejected
    steps:
      - fixture:
          file: reg/parsers/df/gnu/parser.yaml
          content: |
            format: 1
            command: df
            variant: bsd
            parse: {type: kv}
      - fixture:
          file: reg/parsers/x/y/parser.yaml
          content: |
            format: 2
            command: x
            variant: y
            parse: {type: kv}
      - run:
          command: jz
          stdin: "x\n"
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          stderr:
            contains: must live at parsers/df/bsd/parser.yaml
      - assert:
          stderr:
            contains: format 2 is not supported by this jsonize

  - name: jz never reaches the network, so a registry cannot change under it
    steps:
      - run:
          command: jz list --sources
      - assert:
          exit_code: 0
          stdout:
            not_contains: "http"

  # `jz test` is what a third party runs on a registry of their own. The
  # official fixtures travel inside the binary, so a definition is checked
  # against them without a copy of this repository.
  - name: jz test passes a correct definition
    steps:
      - fixture:
          file: ok/registry.yaml
          content: |
            format: 1
            name: local
      - fixture:
          file: ok/parsers/greet/default/parser.yaml
          content: |
            format: 1
            command: greet
            variant: default
            description: greeting lines
            detect:
              signature:
                all: ['^hello \S+ x\d+$']
            parse:
              type: regex
              pattern: '^hello (?P<name>\S+) x(?P<times>\d+)$'
            fields:
              times: {type: int}
      - fixture:
          file: ok/parsers/greet/default/testdata/basic.txt
          content: |
            hello atago x7
      - fixture:
          file: ok/parsers/greet/default/testdata/basic.json
          content: |
            [{"name": "atago", "times": 7}]
      - run:
          command: jz test ${workdir}/ok
      - assert:
          exit_code: 0
          stdout:
            equals: ""
          stderr:
            contains: "1 passed, 0 failed"

  - name: jz test --update writes the golden file the fixture had none of
    steps:
      - fixture:
          file: new/parsers/greet/default/parser.yaml
          content: |
            format: 1
            command: greet
            variant: default
            detect: {signature: {all: ['^hello \S+ x\d+$']}}
            parse:
              type: regex
              pattern: '^hello (?P<name>\S+) x(?P<times>\d+)$'
            fields:
              times: {type: int}
      - fixture:
          file: new/parsers/greet/default/testdata/basic.txt
          content: |
            hello atago x7
      - run:
          command: jz test --update ${workdir}/new
      - assert:
          exit_code: 0
          stderr:
            contains: "golden files written under"
      - assert:
          file:
            path: "${workdir}/new/parsers/greet/default/testdata/basic.json"
            contains: '"times": 7'
      - run:
          command: jz test ${workdir}/new
      - assert:
          exit_code: 0
          stderr:
            contains: "1 passed, 0 failed"

  - name: jz test fails when the golden file disagrees with the output
    steps:
      - fixture:
          file: stale/parsers/greet/default/parser.yaml
          content: |
            format: 1
            command: greet
            variant: default
            detect: {signature: {all: ['^hello \S+$']}}
            parse:
              type: regex
              pattern: '^hello (?P<name>\S+)$'
      - fixture:
          file: stale/parsers/greet/default/testdata/basic.txt
          content: |
            hello atago
      - fixture:
          file: stale/parsers/greet/default/testdata/basic.json
          content: |
            [{"name": "somebody else"}]
      - run:
          command: jz test ${workdir}/stale
      - assert:
          exit_code: 1
          stdout:
            equals: ""
          stderr:
            contains: "output differs from basic.json"
      - assert:
          stderr:
            contains: "0 passed, 1 failed"

  - name: jz test fails a definition that reads an official fixture
    steps:
      - fixture:
          file: wide/parsers/greet/default/parser.yaml
          content: |
            format: 1
            command: greet
            variant: default
            detect: {signature: {all: ['^Filesystem']}}
            parse:
              type: regex
              pattern: '^(?P<line>.+)$'
      - fixture:
          file: wide/parsers/greet/default/testdata/basic.txt
          content: |
            Filesystem here
      - run:
          command: jz test ${workdir}/wide
      - assert:
          exit_code: 1
          stderr:
            contains: "a fixture of df/gnu"

  # A definition added locally cannot turn an official parser into an
  # ambiguity: the layering already says whose definitions apply.
  - name: a definition in a preferred registry wins over the built-in one
    steps:
      - fixture:
          file: wins/parsers/greet/x/parser.yaml
          content: |
            format: 1
            command: greet
            variant: x
            description: anything opening with Filesystem
            detect:
              signature:
                all: ['^Filesystem']
            parse:
              type: regex
              pattern: '^(?P<line>.+)$'
      - run:
          command: jz --parser greet --variant x
          stdin: "Filesystem      Size  Used Avail Use% Mounted on\n/dev/sda1  1.8T  1.6T  145G  92% /\n"
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/wins"
      - assert:
          exit_code: 0
      # Automatic detection lands on the local definition rather than
      # reporting that df and greet both match.
      - run:
          command: jz
          stdin: "Filesystem      Size  Used Avail Use% Mounted on\n/dev/sda1  1.8T  1.6T  145G  92% /\n"
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/wins"
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].line", matches: "^Filesystem" }
      # The built-in definition is still there under its own name.
      - run:
          command: jz --parser df
          stdin: "Filesystem      Size  Used Avail Use% Mounted on\n/dev/sda1  1.8T  1.6T  145G  92% /\n"
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/wins"
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].mounted_on", equals: "/" }

  # A registry's manifest can switch off definitions of the registries
  # below it, which is what a user does with an official parser that
  # misreads their output.
  - name: a manifest disables a definition of a lower registry
    steps:
      - fixture:
          file: off/registry.yaml
          content: |
            format: 1
            name: local
            disable:
              - file/posix
              - nothing-here
      - fixture:
          file: text.txt
          content: |
            /etc/hosts: ASCII text
      - run:
          command: jz --parser file --file ${workdir}/text.txt
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].type", equals: "ASCII text" }
      - run:
          command: jz --parser file --file ${workdir}/text.txt
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/off"
      - assert:
          exit_code: 4
          stderr:
            contains: no parser for "file"
      - assert:
          stderr:
            contains: 'disable "nothing-here" matches no definition'
      - run:
          command: jz list --sources
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/off"
      - assert:
          exit_code: 0
          stdout:
            contains: DISABLED
            matches: "embedded +present +\\d+ +1"

  # Keys are added within format 1, so a definition written for a later
  # release reaches an older jz as an unknown key rather than as a format
  # number it cannot read.
  - name: an unknown key says a newer jz may be needed, and jz list counts the skips
    steps:
      - fixture:
          file: newer/parsers/greet/x/parser.yaml
          content: |
            format: 1
            command: greet
            variant: x
            detect: {signature: {all: ['^hello ']}}
            input:
              collate: yes
            parse:
              type: regex
              pattern: '^hello (?P<name>\S+)$'
      - run:
          command: jz list
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/newer"
      - assert:
          exit_code: 0
          stderr:
            contains: 'unknown key "collate"; this definition may need a newer jz'
      - assert:
          stderr:
            contains: "1 definition failed to load and is not listed"
