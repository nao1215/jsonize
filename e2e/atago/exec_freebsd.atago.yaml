version: "1"

suite:
  name: real commands on FreeBSD

# Several definitions say they read what a command prints on FreeBSD. This
# suite is what holds that claim to the machine: every command here is
# part of the base system, and what is pinned is which definition the
# real output lands on, never a value of the machine's.
#
# The refusals are pinned as firmly as the readings. FreeBSD writes
# several of these formats differently from macOS, and a definition
# written from macOS output has to refuse them rather than cut them in
# the wrong places.
scenarios:
  - name: ps aux and mount land on the bsd definitions
    only: {os: freebsd}
    steps:
      - run:
          command: jz run --explain ps aux
      - assert:
          exit_code: 0
          stderr:
            contains: "ps/bsd from embedded"
          stdout:
            json:
              # FreeBSD writes TT and STARTED where procps writes TTY and
              # START, and the header alone tells the format apart.
              - { path: "$[0].pid", gte: 0 }
              - { path: "$[0].command", matches: ".+" }
              - { path: "$[0].cpu_percent", gte: 0 }
      - run:
          command: jz run --explain mount
      - assert:
          exit_code: 0
          stderr:
            contains: "mount/bsd from embedded"
          stdout:
            json:
              # A FreeBSD root is a ZFS dataset, so what stands where a
              # device does on macOS is a name with no leading slash.
              - { path: "$[0].mount_point", equals: / }
              - { path: "$[0].type", matches: "^[a-z0-9]+$" }

  - name: the POSIX definitions read what FreeBSD prints
    only: {os: freebsd}
    steps:
      - run:
          command: jz run id
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.uid.name", matches: ".+" }
              - { path: "$.gid.id", gte: 0 }
      - run:
          command: jz run du -s .
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].name", equals: "." }
      - fixture:
          file: words.txt
          content: "one two\nthree\n"
      - run:
          command: jz run wc words.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].lines", equals: 2 }
              - { path: "$[0].words", equals: 3 }
              - { path: "$[0].filename", equals: words.txt }

  # FreeBSD prints this summary from w(1), which writes the time as
  # %l:%M%p and separates the load averages with commas ("10:07AM  up 7
  # secs, 1 user, load averages: 0.23, 0.05, 0.02"). macOS writes a 24-hour
  # time and spaces, which uptime/bsd and w/bsd read; the FreeBSD line
  # lands on the freebsd variants and not on those.
  - name: the summary line of uptime and w lands on the freebsd variants
    only: {os: freebsd}
    steps:
      - run:
          command: jz run --explain uptime
      - assert:
          exit_code: 0
          stderr:
            contains: "uptime/freebsd from embedded"
          stdout:
            json:
              - { path: "$.time", matches: "^[0-9]{1,2}:[0-9]{2}[AP]M$" }
              - { path: "$.uptime", gte: 0 }
              - { path: "$.load_15m", gte: 0 }
      - run:
          command: jz run --explain w
      - assert:
          exit_code: 0
          stderr:
            contains: "w/freebsd from embedded"
          stdout:
            json:
              - { path: "$.uptime.users", gte: 0 }

  # Commands FreeBSD has and Linux does not, and the FreeBSD forms of
  # ones both have. The machine the suite runs on has a swap partition
  # and an sshd listening, and it booted, so each listing has rows.
  - name: swapinfo, kldstat, sockstat, netstat -i and last land on the freebsd variants
    only: {os: freebsd}
    steps:
      - run:
          command: jz run --explain swapinfo
      - assert:
          exit_code: 0
          stderr:
            contains: "swapinfo/freebsd from embedded"
          stdout:
            json:
              - { path: "$.header.block_size", equals: 1K }
              - { path: "$.devices[0].blocks", gt: 0 }
      - run:
          command: jz run --explain swapinfo -h
      - assert:
          exit_code: 0
          stderr:
            contains: "swapinfo/freebsd-human from embedded"
      - run:
          command: jz run --explain kldstat
      - assert:
          exit_code: 0
          stderr:
            contains: "kldstat/freebsd from embedded"
          stdout:
            json:
              - { path: "$[0].name", equals: kernel }
              - { path: "$[0].id", equals: 1 }
      # kldstat -v lists the modules inside each file, which is not read.
      - run:
          command: jz run kldstat -v
      - assert:
          exit_code: 4
          stdout:
            empty: true
      # The suite starts right after pkg install, whose connections are
      # left in TIME_WAIT with no process: rows of "??" owners.
      - run:
          command: jz run --explain sockstat -4
      - assert:
          exit_code: 0
          stderr:
            contains: "sockstat/freebsd from embedded"
      - run:
          command: jz run --explain netstat -in
      - assert:
          exit_code: 0
          stderr:
            contains: "netstat/freebsd-interface from embedded"
          stdout:
            json:
              - { path: "$[0].network", matches: "^<Link#[0-9]+>$" }
              - { path: "$[0].mtu", gt: 0 }
      - run:
          command: jz run --explain last
      - assert:
          exit_code: 0
          stderr:
            contains: "last/freebsd from embedded"

  # Options that change or add a column of those listings (kldstat -h,
  # netstat -ib, sockstat -s, last -y), and three listings with definitions
  # of their own: netstat -r, iostat -x and ldd, which on FreeBSD names the
  # program even when there is one.
  - name: kldstat -h, netstat -ib and -rn, sockstat -s, last -y, iostat -x and ldd land on their FreeBSD definitions
    only: {os: freebsd}
    steps:
      - run:
          command: jz run --explain kldstat -h
      - assert:
          exit_code: 0
          stderr:
            contains: "kldstat/freebsd-human from embedded"
          stdout:
            json:
              - { path: "$[0].name", equals: kernel }
              - { path: "$[0].size", matches: "^[0-9.]+[KMGTPE]$" }
      - run:
          command: jz run --explain netstat -ibn
      - assert:
          exit_code: 0
          stderr:
            contains: "netstat/freebsd-interface-bytes from embedded"
          stdout:
            json:
              - { path: "$[0].network", matches: "^<Link#[0-9]+>$" }
              - { path: "$[0].ibytes", gte: 0 }
      - run:
          command: jz run --explain netstat -rn
      - assert:
          exit_code: 0
          stderr:
            contains: "netstat/freebsd-routing from embedded"
          stdout:
            json:
              - { path: "$[0].family.name", equals: Internet }
              - { path: "$[0].routes[0].netif", matches: ".+" }
      - run:
          command: jz run --explain sockstat -4ls
      - assert:
          exit_code: 0
          stderr:
            contains: "sockstat/freebsd-state from embedded"
      - run:
          command: jz run --explain last -y
      - assert:
          exit_code: 0
          stderr:
            contains: "last/freebsd-year from embedded"
      - run:
          command: jz run --explain iostat -x
      - assert:
          exit_code: 0
          stderr:
            contains: "iostat/freebsd-extended from embedded"
          stdout:
            json:
              - { path: "$[0].devices[0].device", matches: ".+" }
      - run:
          command: jz run --explain ldd /bin/sh
      - assert:
          exit_code: 0
          stderr:
            contains: "ldd/files from embedded"
          stdout:
            json:
              - { path: "$[0].program.path", equals: /bin/sh }

  - name: df with a block size or a type column lands on the freebsd variants
    only: {os: freebsd}
    steps:
      - run:
          command: jz run --explain df -m
      - assert:
          exit_code: 0
          stderr:
            contains: "df/freebsd-blocks from embedded"
          stdout:
            json:
              - { path: "$.header.block_size", equals: 1M }
              - { path: "$.filesystems[0].mounted_on", equals: / }
      - run:
          command: jz run --explain df -T
      - assert:
          exit_code: 0
          stderr:
            contains: "df/freebsd-type from embedded"
          stdout:
            json:
              - { path: "$[0].type", matches: "^[a-z0-9]+$" }
      - run:
          command: jz run --explain df -gT
      - assert:
          exit_code: 0
          stderr:
            contains: "df/freebsd-blocks-type from embedded"
          stdout:
            json:
              - { path: "$.header.block_size", equals: 1G }

  # FreeBSD ps has no SysV full format, so the columns it prints are its
  # own: PID TT STAT TIME COMMAND for a listing and a longer set for -l,
  # each read by a definition of its own. -A asks for every process,
  # which is what makes these listings rather than the processes of a
  # terminal the machine does not have.
  - name: the columns ps prints on FreeBSD land on the freebsd variants
    only: {os: freebsd}
    steps:
      - run:
          command: jz run --explain ps -A
      - assert:
          exit_code: 0
          stderr:
            contains: "ps/freebsd from embedded"
          stdout:
            json:
              # A kernel thread has no controlling terminal and writes
              # its name in brackets.
              - { path: "$[0].pid", equals: 0 }
              - { path: "$[0].tty", equals: null }
              - { path: "$[0].command", matches: "^\\[" }
      - run:
          command: jz run --explain ps -lA
      - assert:
          exit_code: 0
          stderr:
            contains: "ps/freebsd-long from embedded"
          stdout:
            json:
              - { path: "$[0].ppid", gte: 0 }
              - { path: "$[0].pri", matches: "^-?[0-9]+$" }

  # The digest programs, sysctl's "name: value", the interrupt counts, the
  # ZFS listings of the root pool the machine boots from, df -hT and the
  # ARP cache of its one network interface.
  - name: md5, sysctl, vmstat -i, zfs, zpool, df -hT and arp land on their FreeBSD definitions
    only: {os: freebsd}
    steps:
      - run:
          command: jz run --explain md5 /etc/passwd
      - assert:
          exit_code: 0
          stderr:
            contains: "md5/bsd from embedded"
          stdout:
            json:
              - { path: "$[0].algorithm", equals: MD5 }
              - { path: "$[0].file", equals: /etc/passwd }
              - { path: "$[0].checksum", matches: "^[0-9a-f]{32}$" }
      - run:
          command: jz run --explain sha256 /etc/passwd /etc/group
      - assert:
          exit_code: 0
          stderr:
            contains: "md5/bsd from embedded"
          stdout:
            json:
              - { path: "$", length: 2 }
              - { path: "$[1].algorithm", equals: SHA256 }
      # -r writes the digest first, which this definition does not read.
      - run:
          command: jz run md5 -r /etc/passwd
      - assert:
          exit_code: 4
          stdout:
            empty: true
      - run:
          command: jz run --explain sysctl kern.ostype hw.ncpu
      - assert:
          exit_code: 0
          stderr:
            contains: "sysctl/freebsd from embedded"
          stdout:
            json:
              - { path: "$[0].name", equals: kern.ostype }
              - { path: "$[0].value", equals: FreeBSD }
              - { path: "$[1].value", matches: "^[0-9]+$" }
      # hw.intrs prints its value over many lines that hold ": " too, and
      # a line that is not a variable is refused, never read as one.
      - run:
          command: jz run sysctl hw.intrs
      - assert:
          exit_code: 4
          stdout:
            empty: true
      - run:
          command: jz run sysctl -d kern.ostype
      - assert:
          exit_code: 4
          stdout:
            empty: true
      - run:
          command: jz run --explain vmstat -i
      - assert:
          exit_code: 0
          stderr:
            contains: "vmstat/freebsd-interrupts from embedded"
          stdout:
            json:
              - { path: "$[0].total", gte: 0 }
      - run:
          command: jz run --explain zfs list
      - assert:
          exit_code: 0
          stderr:
            contains: "zfs/list from embedded"
          stdout:
            json:
              - { path: "$[0].name", matches: "^[^/ ]+$" }
      - run:
          command: jz run --explain zpool list
      - assert:
          exit_code: 0
          stderr:
            contains: "zpool/list from embedded"
          stdout:
            json:
              - { path: "$[0].cap", gte: 0 }
              - { path: "$[0].health", matches: "^[A-Z]+$" }
      - run:
          command: jz run --explain df -hT
      - assert:
          exit_code: 0
          stderr:
            contains: "df/freebsd-type-human from embedded"
          stdout:
            json:
              - { path: "$[0].mounted_on", equals: / }
              - { path: "$[0].size", matches: "^[0-9.]+[KMGTPBE]" }
      - run:
          command: jz run --explain arp -an
      - assert:
          exit_code: 0
          stderr:
            contains: "arp/freebsd from embedded"
          stdout:
            json:
              - { path: "$[0].hwaddress", matches: "^[0-9a-f]{2}(:[0-9a-f]{2}){5}$" }

  - name: df and uname land on the freebsd variants
    only: {os: freebsd}
    steps:
      - run:
          command: jz run --explain df
      - assert:
          exit_code: 0
          stderr:
            contains: "df/freebsd from embedded"
          stdout:
            json:
              - { path: "$[0].mounted_on", equals: / }
              - { path: "$[0].1k_blocks", gt: 0 }
      - run:
          command: jz run --explain df -h
      - assert:
          exit_code: 0
          stderr:
            contains: "df/freebsd-human from embedded"
          stdout:
            json:
              # -h rounds, so the size stays the text that was printed.
              - { path: "$[0].size", matches: "^[0-9.]+[KMGTPBE]" }
      - run:
          command: jz run --explain df -i
      - assert:
          exit_code: 0
          stderr:
            contains: "df/freebsd-inodes from embedded"
          stdout:
            json:
              - { path: "$[0].iused", gte: 0 }
      - run:
          command: jz run --explain uname -a
      - assert:
          exit_code: 0
          stderr:
            contains: "uname/freebsd from embedded"
          stdout:
            json:
              - { path: "$.kernel_name", equals: FreeBSD }
              - { path: "$.machine", matches: "^(amd64|arm64|i386)$" }

  - name: ifconfig lands on ifconfig/bsd
    only: {os: freebsd}
    steps:
      - run:
          command: jz run --explain ifconfig lo0
      - assert:
          exit_code: 0
          stderr:
            contains: "chose ifconfig/bsd from embedded"
          stdout:
            json:
              - { path: "$", length: 1 }
              - { path: "$[0].interface.name", equals: lo0 }
              - { path: "$[0].inet[0].address", equals: 127.0.0.1 }
              - { path: "$[0].status.metric", equals: 0 }
