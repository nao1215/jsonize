version: "1"

suite:
  name: real commands on Linux

# Runs the host's own binaries: coreutils, procps, util-linux, iproute2,
# sysstat and BusyBox. CI runs this on ubuntu-latest and installs what
# the image lacks (see .github/workflows/e2e.yml), and nothing here is
# gated on a command being present: a missing one fails the scenario,
# which is what a required dependency should do. What is asserted is
# the structure that differs between implementations, never a value of
# the machine's. Commands that need a device the runner does not have
# are run in hardware_linux.atago.yaml when the device is there, and
# are verified here on captured output through the same path.
scenarios:
  - name: df, df -h and the variant they select
    only: {os: linux}
    steps:
      - run:
          command: jz run df
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].mounted_on", matches: "^/" }
              - { path: "$[0].1k_blocks", gte: 0 }
      - run:
          command: jz run df -h
      - assert:
          exit_code: 0
          stdout:
            json:
              # A rounded human-readable size stays as printed.
              - { path: "$[0].size", matches: "^[0-9.]+[KMGTP]?$" }
      # -P prints the POSIX header, 1024-blocks and Capacity, which was
      # exit 4 before it had a definition of its own.
      - run:
          command: jz run --explain df -P /
      - assert:
          exit_code: 0
          stderr:
            contains: "chose df/portable from embedded"
          stdout:
            json:
              - { path: "$[0].mounted_on", equals: "/" }
              - { path: "$[0].1024_blocks", gt: 0 }
              - { path: "$[0].capacity_percent", gte: 0 }
      - run:
          command: jz run --explain df -P -T /
      - assert:
          exit_code: 0
          stderr:
            contains: "chose df/portable-type from embedded"

  - name: procps free, uptime and ps
    only: {os: linux}
    steps:
      - run:
          command: jz run free
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].type", equals: Mem }
              - { path: "$[0].total", gt: 0 }
      - run:
          command: jz run free -w
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].buffers", gte: 0 }
      # wc is too generic for jz to claim on its own, so a run names it.
      - run:
          shell: true
          command: printf 'hello world\n' | jz run wc
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].lines", equals: 1 }
              - { path: "$[0].words", equals: 2 }
              - { path: "$[0].bytes", equals: 12 }
      - run:
          command: jz run uptime
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.users", gte: 0 }
              - { path: "$.load_1m", gte: 0 }
      # -p says the same in words, and -s says when the system booted.
      - run:
          command: jz run uptime -p
      - assert:
          exit_code: 0
          stdout:
            contains: '"minutes":'
      - run:
          command: jz run uptime -s
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.since", matches: "^[0-9]{4}-[0-9]{2}-[0-9]{2} " }
      - run:
          command: jz run ps -ef
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].pid", equals: 1 }
      - run:
          command: jz run ps aux
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].pid", equals: 1 }

  # One command, three output formats, and the arguments alone do not say
  # which: the shape of the text has to decide. Each of these asserts a
  # column that only its own variant produces.
  - name: ps lands on a different variant for each of its formats
    only: {os: linux}
    steps:
      - run:
          command: jz run ps
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            json:
              # posix: four columns, so no user and no parent pid
              - { path: "$[0].command", matches: "\\S" }
              - { path: "$[0].tty", matches: "\\S" }
      - run:
          command: jz run ps -ef
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].ppid", gte: 0 }
      - run:
          command: jz run ps aux
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].cpu_percent", gte: 0 }
      # Other BSD letters print the same columns: ww stops cutting the
      # command line, f draws the process tree into it.
      - run:
          command: jz run ps auxww
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].pid", gte: 1 }
      - run:
          command: jz run ps auxf
      - assert:
          exit_code: 0
      # Without u the BSD format has five columns, and -l is the long
      # format of the other option syntax.
      - run:
          command: jz run ps ax
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].pid", equals: 1 }
      - run:
          command: jz run ps -el
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].pid", equals: 1 }
      # -L prints a line per thread, and j the job format; with f the tree
      # is drawn into the command, which keeps it.
      - run:
          command: jz run --explain ps -eLf
      - assert:
          exit_code: 0
          stderr:
            contains: "chose ps/threads from embedded"
          stdout:
            json:
              - { path: "$[0].nlwp", gte: 1 }
      - run:
          command: jz run --explain ps axjf
      - assert:
          exit_code: 0
          stderr:
            contains: "chose ps/jobs from embedded"
          stdout:
            json:
              - { path: "$[0].tpgid", gte: -1 }

  - name: uname, id, env, mount and du
    only: {os: linux}
    steps:
      - run:
          command: jz run uname -a
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.kernel_name", equals: Linux }
              - { path: "$.operating_system", equals: GNU/Linux }
      - run:
          command: jz run id
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.uid.id", gte: 0 }
              - { path: "$.groups[0].name", matches: ".+" }
      - run:
          command: jz run env
          env:
            JZ_E2E_MARKER: present
      - assert:
          exit_code: 0
          stdout:
            contains: '{"name":"JZ_E2E_MARKER","value":"present"}'
      - run:
          command: jz run mount
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].options[0]", matches: "^r[wo]$" }
      - run:
          command: jz run du -s .
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].name", equals: "." }
              - { path: "$[0].size", gte: 0 }

  # glibc ldd names each program above its libraries only when it was
  # given more than one, and the two listings are read by two definitions.
  - name: ldd of one program is a list of libraries, of two a record per program
    only: {os: linux}
    steps:
      - run:
          command: jz run --explain ldd /bin/sh
      - assert:
          exit_code: 0
          stderr:
            contains: "ldd/posix from embedded"
          stdout:
            json:
              - { path: "$[0].name", matches: ".+" }
      - run:
          command: jz run --explain ldd /bin/sh /bin/ls
      - assert:
          exit_code: 0
          stderr:
            contains: "ldd/files from embedded"
          stdout:
            json:
              - { path: "$", length: 2 }
              - { path: "$[0].program.path", equals: /bin/sh }
              - { path: "$[1].program.path", equals: /bin/ls }
              - { path: "$[1].libraries[0].name", matches: ".+" }

  - name: piping a real command into jz identifies it without any hint
    only: {os: linux}
    steps:
      - run:
          shell: true
          command: LC_ALL=C df | jz
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].mounted_on", matches: "^/" }
      - run:
          shell: true
          command: LC_ALL=C uname -a | jz
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$.kernel_name", equals: Linux }
      - run:
          shell: true
          command: LC_ALL=C id | jz
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$.uid.id", gte: 0 }
      - run:
          shell: true
          command: LC_ALL=C free | jz
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].type", equals: Mem }

  - name: lscpu lands on the label format, and its other output formats do not
    only: {os: linux}
    steps:
      - run:
          command: jz run lscpu
      - assert:
          exit_code: 0
          stdout:
            json:
              # Which labels lscpu prints depends on the CPU; the first
              # one is the architecture everywhere.
              - { path: "$[0].name", equals: Architecture }
              - { path: "$[0].value", matches: "^\\S+$" }
      # -p prints comma separated records, which lscpu/parsable reads; the
      # label one must not be stretched over them.
      - run:
          command: jz run --explain lscpu -p
      - assert:
          exit_code: 0
          stderr:
            contains: "chose lscpu/parsable from embedded"

  # A report whose blocks repeat: each interface carries its own counter
  # tables, so the answer is one object per interface rather than a flat
  # list of rows that no longer says which interface they belong to.
  - name: ip -s link groups each interface with its own counters
    only: {os: linux}
    steps:
      - run:
          command: jz run ip -s link
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            json:
              # The loopback interface is index 1 on every Linux machine.
              - { path: "$[0].interface.index", equals: 1 }
              - { path: "$[0].interface.name", equals: lo }
              - { path: "$[0].link.type", equals: loopback }
              # The counters belong to that interface, not to the report.
              - { path: "$[0].rx.bytes", gte: 0 }
              - { path: "$[0].tx.packets", gte: 0 }
              # An interface with no alternative names still has the key.
              - { path: "$[0].altnames", length: 0 }
      # iproute2 takes any prefix of an object's name, and people type
      # the shortest.
      - run:
          command: jz run ip -s l
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].interface.name", equals: lo }
      - run:
          command: jz run ip ro
      - assert:
          exit_code: 0
      # Without -s the same command prints no counter tables. It has a
      # definition of its own, and what this pins is that the two are not
      # confused: the plain form carries no counters at all.
      # Without -s the alias, the alternative names and, with -d, the
      # settings of the kind of device are one list, since which of them
      # appear and in what order is a property of the interface.
      - run:
          command: jz run ip link
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            json:
              - { path: "$[0].interface.name", equals: lo }
              - { path: "$[0].link.type", equals: loopback }
              - { path: "$[0].details", length: 0 }
      - run:
          command: jz run ip -d link
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            json:
              - { path: "$[0].interface.name", equals: lo }
              - { path: "$[0].link.settings", matches: "promiscuity" }
      - run:
          command: jz run ip link
      - assert:
          exit_code: 0
          stdout:
            not_contains: '"rx"'

  # -o prints one line per address, joined by a backslash where the block
  # form breaks the line; it lands on a definition of its own.
  - name: ip -o address is one record per address
    only: {os: linux}
    steps:
      - run:
          command: jz run --explain ip -o -4 address show dev lo
      - assert:
          exit_code: 0
          stderr:
            contains: "ip/oneline-address from embedded"
          stdout:
            json:
              - { path: "$[0].interface", equals: lo }
              - { path: "$[0].address", equals: 127.0.0.1/8 }
              - { path: "$[0].valid_lft", equals: forever }

  # Several operands mean several records. A definition that read only the
  # first block would drop the rest without saying so.
  - name: stat -f reports every filesystem it was asked about
    only: {os: linux}
    steps:
      - run:
          command: jz run stat -f / /tmp
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            json:
              - { path: "$", length: 2 }
              - { path: "$[0].file.name", equals: "/" }
              - { path: "$[1].file.name", equals: /tmp }
              - { path: "$[0].blocks.total", gt: 0 }

  # A device file adds its major and minor numbers to the Device line. GNU,
  # uutils and BusyBox stat all print them there.
  # stat prints one block per operand, so the result is a list whether it
  # was given one file or several.
  - name: stat of a device file carries its device numbers
    only: {os: linux}
    steps:
      - run:
          command: jz run stat /dev/null
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            json:
              - { path: "$", length: 1 }
              - { path: "$[0].type", equals: "character special file" }
              - { path: "$[0].device_type", equals: "1,3" }
      - run:
          command: jz run stat /dev/null /dev/zero
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            json:
              - { path: "$", length: 2 }
              - { path: "$[0].device_type", equals: "1,3" }
              - { path: "$[1].device_type", equals: "1,5" }

  # BusyBox and kmod print the same three columns under the same header;
  # what separates them is that BusyBox continues the header with the
  # taint state. Getting this wrong reads one implementation's output
  # with the other's definition, which is the failure the whole registry
  # is arranged to avoid.
  - name: BusyBox lsmod and kmod lsmod land on their own definitions
    only: {os: linux}
    steps:
      - run:
          shell: true
          command: LC_ALL=C busybox lsmod | jz --parser lsmod --variant busybox
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            json:
              - { path: "$[0].size", gt: 0 }
      # Each refuses the other's output rather than reading it.
      - run:
          shell: true
          command: LC_ALL=C busybox lsmod | jz --parser lsmod --variant linux
      - assert:
          exit_code: 4
          stdout: {empty: true}
      - run:
          shell: true
          command: LC_ALL=C lsmod | jz --parser lsmod --variant busybox
      - assert:
          exit_code: 4
          stdout: {empty: true}

  # A command jz started can print a line jz has no reading for. In a
  # stream that line is reported and left out; everything else the
  # command printed still reaches standard output, and the status says
  # something was skipped.
  - name: jz run --stream ends at a line the command printed that it cannot read
    only: {os: linux}
    steps:
      - run:
          command: jz run --stream --parser du -- sh -c 'printf "4\t/a\ngarbage\n8\t/b\n"'
      - assert:
          exit_code: 3
          stdout:
            equals: |
              {"size":4,"name":"/a"}
          stderr:
            contains: "line 2"
      # The command's own status wins over the record jz could not read:
      # jz mirrors what the command said about itself, and it can only
      # return one number. The failure is on standard error either way.
      - run:
          command: jz run --stream --parser du -- sh -c 'printf "4\t/a\ngarbage\n8\t/b\n"; exit 7'
      - assert:
          exit_code: 7
          stdout:
            equals: |
              {"size":4,"name":"/a"}
          stderr:
            contains: "line 2"

  # The rule holds no list of names: /proc is a parser because a parser
  # named proc exists, the same way /etc is.
  - name: the path of a real /proc file names its definition
    only: {os: linux}
    steps:
      - run:
          command: jz --explain --file /proc/meminfo
      - assert:
          exit_code: 0
          stderr:
            contains: "proc/meminfo from embedded"
          stdout:
            json:
              - { path: "$[0].name", equals: MemTotal }
              - { path: "$[0].value", gt: 0 }
      - run:
          command: jz --explain --file /proc/uptime
      - assert:
          exit_code: 0
          stderr:
            contains: "proc/uptime from embedded"
          stdout:
            json:
              - { path: "$.uptime_seconds", gt: 0 }
      # A blank line after the text is not part of it. meminfo's signature
      # says every line is a counter, and it used to count the blank one.
      - run:
          shell: true
          command: "{ cat /proc/meminfo; echo; } | jz --extract name"
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].name", equals: MemTotal }

  # util-linux prlimit, aligned and --raw. The raw form writes the spaces
  # inside a description as \x20 and lines nothing up, and both are read
  # the same way.
  - name: prlimit lands on its definition, aligned or raw
    only: {os: linux}
    steps:
      - run:
          command: jz run --explain prlimit --nofile --nice
      - assert:
          exit_code: 0
          stderr:
            contains: "prlimit/linux from embedded"
          stdout:
            json:
              - { path: "$", length: 2 }
              - { path: "$[0].resource", equals: NOFILE }
              - { path: "$[0].description", equals: max number of open files }
              - { path: "$[0].soft", matches: "^(unlimited|[0-9]+)$" }
              - { path: "$[1].units", equals: null }
      - run:
          command: jz run prlimit --raw --nofile
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].resource", equals: NOFILE }
              - { path: "$[0].hard", matches: "^(unlimited|[0-9]+)$" }
              - { path: "$[0].units", equals: files }

  # util-linux -r prints the columns lsblk lines up, one space apart and
  # not lined up. Cutting that where the header words start moved the
  # filesystem version under FSTYPE's neighbour and the use percentage
  # under UUID, so each column set is read by a raw variant of its own
  # instead. A set whose raw form has no variant is refused rather than
  # cut in the wrong places: -b prints SIZE as a byte count, which no
  # definition claims. Captured output, since a runner may have no block
  # devices to list.
  - name: each raw column set is read by its own variant, and one with none is refused
    only: {os: linux}
    env:
      PATH: "${workdir}/bin:${env:PATH}"
    steps:
      - fixture:
          file: bin/lsblk
          mode: "0755"
          content: |
            #!/bin/sh
            case " $* " in
            *" -b "*) cat "$(dirname "$0")/../captured/lsblk-b-r.txt" ;;
            *" -r "*) cat "$(dirname "$0")/../captured/lsblk-f-r.txt" ;;
            *) cat "$(dirname "$0")/../captured/lsblk-f.txt" ;;
            esac
      - fixture:
          file: captured/lsblk-f-r.txt
          from: "${specdir}/../../registry/parsers/lsblk/filesystems-raw/testdata/devices.txt"
      - fixture:
          file: captured/lsblk-f.txt
          from: "${specdir}/../../registry/parsers/lsblk/filesystems/testdata/util-linux-2.41.txt"
      - fixture:
          file: captured/lsblk-b-r.txt
          from: "${specdir}/../../registry/testdata/decoys/lsblk-bytes-raw.txt"
      - run:
          command: jz run --explain lsblk -f -r
      - assert:
          exit_code: 0
          stderr:
            contains: "lsblk/filesystems-raw from embedded"
          stdout:
            json:
              # A disk that carries no filesystem of its own prints the
              # separators of the empty cells and nothing else.
              - { path: "$[3].name", equals: nvme0n1 }
              - { path: "$[3].fstype", equals: null }
              # The columns the aligned reading used to shift.
              - { path: "$[4].fsver", equals: FAT32 }
              - { path: "$[4].uuid", equals: 1234-ABCD }
              - { path: "$[4].fsuse_percent", equals: 1 }
              - { path: "$[4].mountpoint", equals: /boot/efi }
      - run:
          command: jz run lsblk -b -r
      - assert:
          exit_code: 4
          stdout: {empty: true}
          stderr:
            contains: "No variant's signature fits this text"
      - run:
          command: jz run --explain lsblk -f
      - assert:
          exit_code: 0
          stderr:
            contains: "lsblk/filesystems from embedded"

  # The host's own procps, so what is pinned is the shape of the answer
  # rather than any particular machine's numbers.
  # A runner can be less than a minute old, and uptime then prints
  # "up 0 min", which is 0 seconds; the duration is a number either way.
  - name: real uptime and ps report their durations in seconds
    only: {os: linux}
    steps:
      - run:
          command: jz run uptime
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.uptime", gte: 0 }
      - run:
          command: jz run ps
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].time", gte: 0 }

  - name: real who leaves its timestamps alone until a year is assumed
    only: {os: linux}
    steps:
      # who prints nothing at all on a machine with no logins, and an
      # empty listing is [] rather than a row to look at, so the shape is
      # asserted through a fixture and only the exit status through the
      # real command.
      - run:
          command: jz run who
      - assert:
          exit_code: 0
      - run:
          command: jz run --assume-year now who
      - assert:
          exit_code: 0

  # procps is on every ubuntu runner; sysstat is installed by CI.
  - name: jz run --stream vmstat writes the samples of an interval run
    only: {os: linux}
    steps:
      - run:
          command: jz run --stream vmstat 1 3
      - assert:
          exit_code: 0
          stdout:
            contains: '"swpd":'
            count: 3
      # -w widens the columns and puts dashes on both sides of each group
      # name ("--procs--"), which the signature used to turn away.
      - run:
          command: jz run vmstat -w
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].swpd", gte: 0 }

  - name: jz run --stream iostat writes one sample per interval
    only: {os: linux}
    steps:
      - run:
          command: jz run --stream iostat 1 3
      - assert:
          exit_code: 0
          stdout:
            contains: '{"cpu":['
            count: 3
      - run:
          command: jz run iostat 1 3
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$", length: 3 }
              - { path: "$[0].cpu[0].user_percent", gte: 0 }

  - name: jz run mpstat with an interval closes with its summary sample
    only: {os: linux}
    steps:
      - run:
          command: jz run mpstat -P ALL 1 2
      - assert:
          exit_code: 0
          stdout:
            json:
              # Two samples and the closing summary.
              - { path: "$", length: 3 }
              - { path: "$[2].cpu[0].time", equals: Average }
      # -A prints every report in a row, which no definition reads whole.
      # It used to reach mpstat/linux and fail on the second header.
      - run:
          command: jz run mpstat -A
      - assert:
          exit_code: 4
          stdout: {empty: true}
          stderr:
            contains: "excluded by the argument -A"

  # Each pidstat report has its own columns under the same banner; the
  # header names the report, so each lands on its own definition.
  - name: pidstat -d and -w land on their own definitions
    only: {os: linux}
    steps:
      - run:
          command: jz run --explain pidstat -d 1 1
      - assert:
          exit_code: 0
          stderr:
            contains: "pidstat/io from embedded"
          stdout:
            json:
              - { path: "$", length: 2 }
      - run:
          command: jz run --explain pidstat -w 1 1
      - assert:
          exit_code: 0
          stderr:
            contains: "pidstat/switches from embedded"
          stdout:
            json:
              - { path: "$[1].tasks[0].time", equals: Average }

  # The reports of the same run that name threads, priorities, stacks and
  # per-thread CPU. -t prints a row for a task and a row for each of its
  # threads, and whichever of TGID and TID is a dash says which kind of
  # row it is.
  #
  # The task is one the scenario starts, a sleep of the user running the
  # suite, rather than pid 1: what pid 1 is called depends on the machine
  # (systemd, init, a container's shell), and a /proc mounted with hidepid
  # hides it. A single-threaded sleep has one task row and one thread row,
  # both with its own pid, and the service ends with the scenario.
  - name: pidstat -v, -R, -s and -t land on their own definitions
    only: {os: linux}
    services:
      - name: sleeper
        shell: true
        command: echo $$ > pid.tmp && mv pid.tmp pid.txt && exec sleep 300
        ready: {file: pid.txt, store: pid, timeout: 20s}
    steps:
      # The pid is written before the shell becomes sleep; pidstat names
      # the task by what it is when it samples, so wait for the exec.
      - run:
          command: sh -c 'i=0; while [ "$(cat /proc/$1/comm)" != sleep ]; do [ $i -ge 100 ] && exit 1; sleep 0.1; i=$((i+1)); done' sh ${pid}
      - assert:
          exit_code: 0
      - run:
          command: jz run --explain pidstat -v -p ${pid} 1 1
      - assert:
          exit_code: 0
          stderr:
            contains: "pidstat/kernel from embedded"
          stdout:
            json:
              - { path: "$[0].tasks[0].pid", gt: 0 }
              - { path: "$[0].tasks[0].pid", equals: "${pid}" }
              - { path: "$[0].tasks[0].command", equals: sleep }
      - run:
          command: jz run --explain pidstat -R -p ${pid} 1 1
      - assert:
          exit_code: 0
          stderr:
            contains: "pidstat/priority from embedded"
          stdout:
            json:
              - { path: "$[0].tasks[0].pid", equals: "${pid}" }
              - { path: "$[0].tasks[0].command", equals: sleep }
      # The task is the user's own, so its stack can be read and the
      # report has a row for it.
      - run:
          command: jz run --explain pidstat -s -p ${pid} 1 1
      - assert:
          exit_code: 0
          stderr:
            contains: "pidstat/stack from embedded"
          stdout:
            json:
              - { path: "$", length: 1 }
              - { path: "$[0].tasks[0].pid", equals: "${pid}" }
              - { path: "$[0].tasks[0].command", equals: sleep }
      - run:
          command: jz run --explain pidstat -t -p ${pid} 1 1
      - assert:
          exit_code: 0
          stderr:
            contains: "pidstat/threads from embedded"
          stdout:
            json:
              - { path: "$[0].tasks[0].tgid", gt: 0 }
              - { path: "$[0].tasks[0].tgid", equals: "${pid}" }
              - { path: "$[0].tasks[0].tid", equals: null }
              - { path: "$[0].tasks[0].command", equals: sleep }
              - { path: "$[0].tasks[1].tgid", equals: null }
              - { path: "$[0].tasks[1].tid", equals: "${pid}" }
              # The drawing that puts a thread under its task ("|__sleep")
              # is not part of its name.
              - { path: "$[0].tasks[1].command", equals: sleep }

  - name: the network and package listings land on their own definitions
    only: {os: linux}
    steps:
      - run:
          command: jz run --explain ip -s -s link
      - assert:
          exit_code: 0
          stderr:
            contains: "ip/stats-link-detail from embedded"
          stdout:
            json:
              - { path: "$[0].rx_errors.crc", gte: 0 }
      # The definition for one -s refuses the doubled report, which is
      # the pair being exclusive rather than one of them being chosen.
      - run:
          shell: true
          command: LC_ALL=C ip -s -s link | jz --parser ip --variant stats-link
      - assert:
          exit_code: 4
          stdout: {empty: true}
      - run:
          command: jz run --explain dpkg --get-selections
      - assert:
          exit_code: 0
          stderr:
            contains: "dpkg/selections from embedded"
      - run:
          command: jz run --explain apt-cache depends bash
      - assert:
          exit_code: 0
          stderr:
            contains: "apt-cache/depends from embedded"
          stdout:
            json:
              - { path: "$[0].package", equals: bash }
              - { path: "$[0].children[0].relation", matches: "Depends" }

  # The definitions for listings that need a device jz run cannot be
  # given on a cloud runner: no sound card, no wireless interface, no
  # block device it may look at. Each is verified here through the same
  # path a real run takes, with a command of that name on PATH that
  # prints output captured from the real one. What this proves is that
  # the name, the arguments and the operating system land on the
  # definition and that the definition reads what the command printed;
  # the live run, when the device is there, is hardware_linux.atago.yaml.
  - name: listings that need a device land on their definitions from captured output
    only: {os: linux}
    env:
      PATH: "${workdir}/bin:${env:PATH}"
    steps:
      - fixture:
          file: bin/aplay
          mode: "0755"
          content: |
            #!/bin/sh
            cat "$(dirname "$0")/../captured/aplay-l.txt"
      - fixture:
          file: captured/aplay-l.txt
          from: "${specdir}/../../registry/parsers/aplay/devices/testdata/hdmi.txt"
      - run:
          command: jz run --explain aplay -l
      - assert:
          exit_code: 0
          stderr:
            contains: "aplay/devices from embedded"
          stdout:
            json:
              - { path: "$[0].device.card", equals: 0 }
              - { path: "$[0].subdevices[0].index", equals: 0 }
      - fixture:
          file: bin/iw
          mode: "0755"
          content: |
            #!/bin/sh
            cat "$(dirname "$0")/../captured/iw-dev.txt"
      - fixture:
          file: captured/iw-dev.txt
          from: "${specdir}/../../registry/parsers/iw/dev/testdata/one-phy.txt"
      - run:
          command: jz run --explain iw dev
      - assert:
          exit_code: 0
          stderr:
            contains: "iw/dev from embedded"
          stdout:
            json:
              - { path: "$[0].phy", equals: 0 }
              - { path: "$[0].children[0].children[0].name", equals: wdev }
      - fixture:
          file: bin/lspci
          mode: "0755"
          content: |
            #!/bin/sh
            cat "$(dirname "$0")/../captured/lspci-vv.txt"
      - fixture:
          file: captured/lspci-vv.txt
          from: "${specdir}/../../registry/parsers/lspci/verbose/testdata/two-devices.txt"
      - run:
          command: jz run --explain lspci -vv
      - assert:
          exit_code: 0
          stderr:
            contains: "lspci/verbose from embedded"
          stdout:
            json:
              - { path: "$", length: 2 }
              - { path: "$[0].slot", equals: "00:00.0" }
              - { path: "$[0].children[0].key", equals: Subsystem }
      - fixture:
          file: bin/systemd-analyze
          mode: "0755"
          content: |
            #!/bin/sh
            cat "$(dirname "$0")/../captured/systemd-analyze-$1.txt"
      - fixture:
          file: captured/systemd-analyze-critical-chain.txt
          from: "${specdir}/../../registry/parsers/systemd-analyze/critical-chain/testdata/boot.txt"
      - fixture:
          file: captured/systemd-analyze-security.txt
          from: "${specdir}/../../registry/parsers/systemd-analyze/security/testdata/services.txt"
      - run:
          command: jz run --explain systemd-analyze critical-chain
      - assert:
          exit_code: 0
          stderr:
            contains: "systemd-analyze/critical-chain from embedded"
          stdout:
            json:
              - { path: "$[0].unit", equals: graphical.target }
              - { path: "$[0].activated", equals: 8.581 }
              - { path: "$[0].children[0].startup", equals: 0.034 }
      - run:
          command: jz run --explain systemd-analyze security --no-pager
      - assert:
          exit_code: 0
          stderr:
            contains: "systemd-analyze/security from embedded"
          stdout:
            json:
              - { path: "$[0].unit", equals: ModemManager.service }
              - { path: "$[0].exposure", equals: 6.3 }
              - { path: "$[1].predicate", equals: EXPOSED }
      # With no subcommand powerprofilesctl lists the profiles too.
      - fixture:
          file: bin/powerprofilesctl
          mode: "0755"
          content: |
            #!/bin/sh
            cat "$(dirname "$0")/../captured/powerprofilesctl-list.txt"
      - fixture:
          file: captured/powerprofilesctl-list.txt
          from: "${specdir}/../../registry/parsers/powerprofilesctl/list/testdata/ppd-0.30.txt"
      - run:
          command: jz run --explain powerprofilesctl
      - assert:
          exit_code: 0
          stderr:
            contains: "powerprofilesctl/list from embedded"
          stdout:
            json:
              - { path: "$[1].profile.active", equals: true }
              - { path: "$[1].profile.name", equals: balanced }
      # The first heading of both lshw tables is two words, and the
      # blank path or bus address of a node stays null rather than moving
      # the device name into that column. -short wins when both are given.
      - fixture:
          file: bin/lshw
          mode: "0755"
          content: |
            #!/bin/sh
            case " $* " in
            *" -short "*) cat "$(dirname "$0")/../captured/lshw-short.txt" ;;
            *) cat "$(dirname "$0")/../captured/lshw-businfo.txt" ;;
            esac
      - fixture:
          file: captured/lshw-short.txt
          from: "${specdir}/../../registry/parsers/lshw/short/testdata/lshw-b.02.19.txt"
      - fixture:
          file: captured/lshw-businfo.txt
          from: "${specdir}/../../registry/parsers/lshw/businfo/testdata/lshw-b.02.19.txt"
      - run:
          command: jz run --explain lshw -businfo -short
      - assert:
          exit_code: 0
          stderr:
            contains: "lshw/short from embedded"
          stdout:
            json:
              - { path: "$[0].h_w_path", equals: null }
              - { path: "$[0].device", equals: null }
              - { path: "$[0].class", equals: system }
              - { path: "$[9].h_w_path", equals: "/0/100/2.1/0" }
              - { path: "$[9].device", equals: eno1 }
      - run:
          command: jz run --explain lshw -businfo
      - assert:
          exit_code: 0
          stderr:
            contains: "lshw/businfo from embedded"
          stdout:
            json:
              - { path: "$[3].bus_info", equals: "cpu@0" }
              - { path: "$[16].bus_info", equals: null }
              - { path: "$[16].device", equals: hwmon1 }
      # A lock named in kana takes two columns a character, and the
      # values after it stay under their own headers.
      - fixture:
          file: bin/systemd-inhibit
          mode: "0755"
          content: |
            #!/bin/sh
            cat "$(dirname "$0")/../captured/systemd-inhibit-list.txt"
      - fixture:
          file: captured/systemd-inhibit-list.txt
          from: "${specdir}/../../registry/parsers/systemd-inhibit/list/testdata/systemd-259.txt"
      - run:
          command: jz run --explain systemd-inhibit --list
      - assert:
          exit_code: 0
          stderr:
            contains: "systemd-inhibit/list from embedded"
          stdout:
            json:
              - { path: "$[8].who", equals: スクリーンロッカー }
              - { path: "$[8].uid", equals: 1000 }
              - { path: "$[8].mode", equals: delay }
      - fixture:
          file: bin/blkid
          mode: "0755"
          content: |
            #!/bin/sh
            cat "$(dirname "$0")/../captured/blkid-export.txt"
      - fixture:
          file: captured/blkid-export.txt
          from: "${specdir}/../../registry/parsers/blkid/export/testdata/two-devices.txt"
      - run:
          command: jz run --explain blkid -o export
      - assert:
          exit_code: 0
          stderr:
            contains: "blkid/export from embedded"
          stdout:
            json:
              - { path: "$", length: 2 }
              - { path: "$[0].attributes.DEVNAME", equals: /dev/nvme1n1p2 }
              - { path: "$[1].attributes.TYPE", equals: vfat }

  # A host that does not answer is what ping is run to find out, and its
  # summary then has no round trip times. That run used to be a parse
  # error with no JSON. It keeps ping's status and is read, the ICMP
  # errors that came back in place of replies included. The real ping
  # runs in hardware_linux.atago.yaml, since a machine may not let an
  # unprivileged user send ICMP.
  - name: ping that got no reply keeps its status and is still read
    only: {os: linux}
    env:
      PATH: "${workdir}/bin:${env:PATH}"
    steps:
      - fixture:
          file: bin/ping
          mode: "0755"
          content: |
            #!/bin/sh
            cat "$(dirname "$0")/../captured/ping-unreachable.txt"
            exit 1
      - fixture:
          file: captured/ping-unreachable.txt
          from: "${specdir}/../../registry/parsers/ping/linux/testdata/unreachable.txt"
      - run:
          command: jz run --explain ping -c 3 192.0.2.10
      - assert:
          exit_code: 1
          stderr:
            contains: "ping/linux from embedded"
          stdout:
            json:
              - { path: "$.replies[0].error", equals: Destination Host Unreachable }
              - { path: "$.statistics.packets_received", equals: 0 }
              - { path: "$.statistics.errors", equals: 3 }
              - { path: "$.statistics.round_trip_avg_ms", equals: null }

  # BusyBox prints its own shape for several commands, and each has a
  # definition of its own. The host's busybox runs here, so what is
  # pinned is that the shape selects the BusyBox variant and not the GNU
  # one, and that the GNU shape is refused by the BusyBox variant: the
  # two are exclusive, not one preferred over the other.
  - name: BusyBox df, ps and ifconfig land on their own variants
    only: {os: linux}
    steps:
      # One operand: a mount the caller may not read is a warning and a
      # non-zero status from df, which jz mirrors, and which is not what
      # is being pinned here.
      - run:
          command: jz run --explain --parser df -- busybox df -h /
      - assert:
          exit_code: 0
          stderr:
            contains: "df/busybox-human from embedded"
          stdout:
            json:
              - { path: "$[0].mounted_on", matches: "^/" }
              # A rounded size stays as printed.
              - { path: "$[0].size", matches: "^[0-9.]+[KMGTP]?$" }
      - run:
          shell: true
          command: LC_ALL=C busybox df -h / | jz --parser df --variant gnu-human
      - assert:
          exit_code: 4
          stdout: {empty: true}
      - run:
          shell: true
          command: LC_ALL=C df -h / | jz --parser df --variant busybox-human
      - assert:
          exit_code: 4
          stdout: {empty: true}
      # Process 1 is whoever the host runs it as: root on a machine, the
      # user of a container or a namespace.
      - run:
          command: jz run --explain --parser ps -- busybox ps
      - assert:
          exit_code: 0
          stderr:
            contains: "ps/busybox from embedded"
          stdout:
            json:
              - { path: "$[0].pid", equals: 1 }
              - { path: "$[0].user", matches: "^\\S+$" }
      - run:
          shell: true
          command: LC_ALL=C ps | jz --parser ps --variant busybox
      - assert:
          exit_code: 4
          stdout: {empty: true}
      - run:
          command: jz run --explain --parser ifconfig -- busybox ifconfig lo
      - assert:
          exit_code: 0
          stderr:
            contains: "ifconfig/busybox from embedded"
          stdout:
            json:
              - { path: "$[0].interface.name", equals: lo }
              - { path: "$[0].inet.address", equals: 127.0.0.1 }
              - { path: "$[0].inet.mask", equals: 255.0.0.0 }

  # The short listings of clients and of cards are both three tab
  # separated cells; the arguments choose the definition, and each one's
  # signature refuses the other's text. The fake pactl prints what a
  # PipeWire server prints for each.
  - name: pactl list short clients and cards land on their own definitions
    only: {os: linux}
    env:
      PATH: "${workdir}/bin:${env:PATH}"
    steps:
      - fixture:
          file: bin/pactl
          mode: "0755"
          content: |
            #!/bin/sh
            case "$3" in
            clients) printf '33\tPipeWire\twireplumber\n37\tPipeWire\tpipewire\n' ;;
            cards) printf '55\talsa_card.pci-0000_c6_00.1\talsa\n' ;;
            esac
      - run:
          command: jz run --explain pactl list short clients
      - assert:
          exit_code: 0
          stderr:
            contains: "pactl/short-clients from embedded"
          stdout:
            json:
              - { path: "$[1].binary", equals: pipewire }
      - run:
          command: jz run --explain pactl list short cards
      - assert:
          exit_code: 0
          stderr:
            contains: "pactl/short-cards from embedded"
          stdout:
            json:
              - { path: "$[0].name", equals: alsa_card.pci-0000_c6_00.1 }

  # A machine with no sound card has no sinks, and pactl lists them by
  # printing nothing. That is the empty list; pactl/info, one object, used
  # to be judged with the listings and turned the answer into exit 4.
  - name: pactl list of no sinks is the empty list
    only: {os: linux}
    env:
      PATH: "${workdir}/bin:${env:PATH}"
    steps:
      - fixture:
          file: bin/pactl
          mode: "0755"
          content: |
            #!/bin/sh
            exit 0
      - run:
          command: jz run pactl list short sinks
      - assert:
          exit_code: 0
          stdout:
            equals: "[]"
      - run:
          command: jz run pactl list sinks
      - assert:
          exit_code: 0
          stdout:
            equals: "[]"

  # A diff with nothing in it prints nothing. --numstat is a list, so that
  # is the empty list; git/diff-stat, an object, used to be judged with it
  # and turned the answer into exit 4.
  - name: git diff --numstat of no change is the empty list
    only: {os: linux}
    steps:
      - run:
          shell: true
          command: git init -q repo && cd repo && jz run git diff --numstat
      - assert:
          exit_code: 0
          stdout:
            equals: "[]"

  # A device file has no size; ls prints its major and minor numbers in
  # that column. /dev/null is 1, 3 on every Linux system, and a listing of
  # /dev used to be exit 4 for the first device in it.
  # Asking for a few kernel parameters, or a few properties of a unit,
  # prints the lines the full report prints for them.
  - name: sysctl KEY and systemctl show -p land on their definitions
    only: {os: linux}
    steps:
      - run:
          command: jz run sysctl kernel.ostype
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].value", equals: Linux }
      # systemctl answers only on a machine systemd booted, which the CI
      # runners are and a container usually is not. This is the check
      # systemd itself makes (sd_booted), so a host without it fails here,
      # on the requirement, rather than on what jz did with a refusal.
      - run:
          command: test -d /run/systemd/system
      - assert:
          exit_code: 0
      - run:
          command: jz run --explain systemctl show -p ActiveState,SubState systemd-journald
      - assert:
          exit_code: 0
          stderr:
            contains: "systemctl/show-properties from embedded"

  # The time styles scripts ask for print the year and the clock, and
  # --full-time the offset too, which makes the time an instant.
  - name: ls -l with an ISO time style lands on its own definition
    only: {os: linux}
    steps:
      - run:
          command: jz run ls -l --time-style=long-iso /dev/null
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].date", matches: "^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}$" }
      - run:
          command: jz run ls -l --full-time /dev/null
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].date", matches: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+(Z|[+-][0-9]{2}:[0-9]{2})$" }

  - name: ls -l reads the device numbers of a device file
    only: {os: linux}
    steps:
      - run:
          command: jz run ls -l /dev/null
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].major", equals: 1 }
              - { path: "$[0].minor", equals: 3 }
      - run:
          command: jz run ls -l /dev
      - assert:
          exit_code: 0

  # A name may begin or end with a space. The listings put a fixed
  # separator in front of the name, and what follows it is the name: a
  # leading space used to be taken for more of the separator and dropped.
  # A key is judged by the format, not by the rows one run printed: the
  # listing of a process that is gone has no rows, and pid is still one
  # of its keys.
  - name: --extract of a key the format has works on an empty listing
    only: {os: linux}
    steps:
      - run:
          command: jz run --extract pid ps -p 2147483647
      - assert:
          exit_code: 1
          stdout:
            equals: "[]\n"

  # du -h prints an empty file as a plain 0, which is also what du/posix
  # reads; the rounded size on the next line decides.
  - name: du -h naming an empty file first lands on the rounded definition
    only: {os: linux}
    steps:
      - fixture:
          file: "duh/empty"
          content: ""
      - fixture:
          file: "duh/full"
          content: "x\n"
      - run:
          command: jz run du -h duh/empty duh/full
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].size", equals: "0" }
              - { path: "$[1].size", matches: "^[0-9.]+K$" }

  - name: a name that begins or ends with a space keeps it
    only: {os: linux}
    steps:
      - fixture:
          file: "sp/ lead"
          content: "x\n"
      - fixture:
          file: "sp/trail "
          content: "y\n"
      - run:
          command: jz run ls -l sp
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].filename", equals: " lead" }
              - { path: "$[1].filename", equals: "trail " }
      - run:
          command: jz run du -a sp
      - assert:
          exit_code: 0
          stdout:
            contains: '"name":"sp/trail "'
      - run:
          shell: true
          command: cd sp && jz run wc ' lead' 'trail '
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].filename", equals: " lead" }
              - { path: "$[1].filename", equals: "trail " }

  # A listing of several directories opens each with its path and a
  # colon. A file whose name ends with a colon prints a line that ends the
  # same way, and it has to stay an entry of the directory it is in.
  - name: ls -lR is one record per directory, and one directory is ls -l
    only: {os: linux}
    steps:
      - fixture:
          file: tree/a.txt
          content: "hi\n"
      - fixture:
          file: "tree/sub/b:"
          content: "x\n"
      - run:
          command: jz run --explain ls -lR tree
      - assert:
          exit_code: 0
          stderr:
            contains: "ls/long-recursive from embedded"
          stdout:
            json:
              - { path: "$", length: 2 }
              - { path: "$[0].directory.path", equals: tree }
              - { path: "$[1].directory.path", equals: tree/sub }
              - { path: "$[1].entries[0].filename", equals: "b:" }
      - run:
          command: jz run --explain ls -l tree/sub
      - assert:
          exit_code: 0
          stderr:
            contains: "ls/long from embedded"
          stdout:
            json:
              - { path: "$[0].filename", equals: "b:" }
      # -F marks each name with its kind ("sub/"), which is not the name.
      - run:
          command: jz run ls -lF tree
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: "excluded by the argument -F"

  # An archive made here, listed by both implementations: BusyBox prints
  # the seconds of the timestamp and GNU tar does not, which is what
  # keeps the two definitions apart.
  - name: BusyBox tar and GNU tar list the same archive on different definitions
    only: {os: linux}
    steps:
      - fixture:
          file: src/a.txt
          content: "hi\n"
      - run:
          command: busybox tar -cf a.tar src
      - assert:
          exit_code: 0
      - run:
          command: jz run --explain --parser tar -- busybox tar -tvf a.tar
      - assert:
          exit_code: 0
          stderr:
            contains: "tar/busybox from embedded"
          stdout:
            json:
              - { path: "$", length: 2 }
              - { path: "$[1].name", equals: src/a.txt }
              - { path: "$[1].size", equals: 3 }
              - { path: "$[1].time", matches: "^[0-9]{2}:[0-9]{2}:[0-9]{2}$" }
      - run:
          command: jz run --explain tar -tvf a.tar
      - assert:
          exit_code: 0
          stderr:
            contains: "tar/gnu from embedded"
          stdout:
            json:
              - { path: "$[1].name", equals: src/a.txt }
              - { path: "$[1].size", equals: 3 }
      # Each refuses the other's listing.
      - run:
          shell: true
          command: LC_ALL=C tar -tvf a.tar | jz --parser tar --variant busybox
      - assert:
          exit_code: 4
          stdout: {empty: true}
      - run:
          shell: true
          command: LC_ALL=C busybox tar -tvf a.tar | jz --parser tar --variant gnu
      - assert:
          exit_code: 4
          stdout: {empty: true}

  # "link -> odd -> plain" is a link named "link -> odd" that points at
  # plain, or a link named link that points at "odd -> plain", and the
  # text does not say which. A link with one " -> " reads one way.
  - name: a link line that reads two ways is refused, one that reads one way is read
    only: {os: linux}
    steps:
      - fixture:
          file: one/target
          content: "x\n"
      - fixture:
          file: "one/a -> b"
          content: "y\n"
      - fixture:
          file: two/plain
          content: "z\n"
      - run:
          shell: true
          command: ln -s target one/link && ln -s plain 'two/link -> odd'
      - assert:
          exit_code: 0
      - run:
          command: jz run ls -l one
      - assert:
          exit_code: 0
          stdout:
            contains: '"filename":"link","link_to":"target"'
      - run:
          command: jz run ls -l two
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr:
            contains: "does not have the shape"
      - run:
          command: tar -cf two.tar two
      - assert:
          exit_code: 0
      - run:
          command: jz run tar -tvf two.tar
      - assert:
          exit_code: 3
          stdout: {empty: true}

  # git quotes a name with a space, so the " -> " outside the quotes is
  # the one that separates the two paths of a rename, and the names are
  # the ones the quotes hold.
  - name: git status splits a rename at the arrow outside the quotes
    only: {os: linux}
    steps:
      - fixture:
          file: "repo/a -> b"
          content: "x\n"
      - run:
          shell: true
          command: cd repo && git init -q && git add . && git -c user.name=alice -c user.email=alice@example.com commit -qm init && git mv 'a -> b' 'c -> d'
      - assert:
          exit_code: 0
      - run:
          shell: true
          command: cd repo && jz run git status --porcelain
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].index", equals: R }
              - { path: "$[0].path", equals: "a -> b" }
              - { path: "$[0].renamed_to", equals: "c -> d" }

  # GNU md5sum marks a line whose name it escaped with a backslash in
  # front of the digest; such a name is decoded. wc quotes a name with a
  # newline the way a shell reads it, which a name printed as it is can
  # also be, and tar escapes by a style the text does not name; both are
  # refused.
  - name: md5sum names are decoded, and names wc and tar quoted are refused
    only: {os: linux}
    steps:
      - run:
          shell: true
          command: mkdir esc && printf 'x\n' > 'esc/back\slash' && printf 'x\n' > "$(printf 'esc/nl\nname')"
      - assert:
          exit_code: 0
      - run:
          shell: true
          command: jz run md5sum esc/*
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].escaped", equals: true }
              - { path: "$[0].file", equals: "esc/back\\slash" }
              - { path: "$[1].file", equals: "esc/nl\nname" }
      - run:
          shell: true
          command: jz run sha256sum esc/*
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[1].file", equals: "esc/nl\nname" }
      - run:
          shell: true
          command: jz run --parser md5sum -- busybox md5sum 'esc/back\slash'
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].file", equals: "esc/back\\slash" }
      - run:
          shell: true
          command: jz run wc esc/*
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr:
            contains: "does not have the shape"
      - run:
          shell: true
          command: tar -cf esc.tar esc && jz run tar -tvf esc.tar
      - assert:
          exit_code: 3
          stdout: {empty: true}

  # lsblk draws the tree of devices in front of a child's name, in ASCII
  # in the C locale and in box-drawing characters in a UTF-8 one.
  # Captured output, since a runner may have no partitions to list.
  - name: lsblk reports a child device by its name, without the tree
    only: {os: linux}
    env:
      PATH: "${workdir}/bin:${env:PATH}"
    steps:
      - fixture:
          file: bin/lsblk
          mode: "0755"
          content: |
            #!/bin/sh
            cat "$(dirname "$0")/../captured/lsblk.txt"
      - fixture:
          file: captured/lsblk.txt
          from: "${specdir}/../../registry/parsers/lsblk/linux/testdata/c-locale-tree.txt"
      - fixture:
          file: utf-8.txt
          from: "${specdir}/../../registry/parsers/lsblk/linux/testdata/utf-8.txt"
      - run:
          command: jz run lsblk
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].name", equals: nvme0n1 }
              - { path: "$[1].name", equals: nvme0n1p1 }
              - { path: "$[2].name", equals: nvme0n1p2 }
      - run:
          command: jz --parser lsblk --variant linux --file utf-8.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[1].name", equals: nvme0n1p1 }
              - { path: "$[4].name", equals: nvme1n1p1 }

  # lsblk -m takes the owner, group and mode from the device node, and a
  # container that was given no node prints the three blank for every
  # device while lsblk exits 0. That run is read with the three null
  # together; a row blank in only some of them is not lsblk output and is
  # refused. Captured output, since what a runner has under /dev is not
  # the scenario's to choose.
  - name: lsblk -m in a container reads blank owner, group and mode as null, and a partial row is refused
    only: {os: linux}
    env:
      PATH: "${workdir}/bin:${env:PATH}"
    steps:
      - fixture:
          file: bin/lsblk
          mode: "0755"
          content: |
            #!/bin/sh
            case " $* " in
            *" -r "*) cat "$(dirname "$0")/../captured/lsblk-m-r.txt" ;;
            *) cat "$(dirname "$0")/../captured/lsblk-m.txt" ;;
            esac
      - fixture:
          file: captured/lsblk-m.txt
          from: "${specdir}/../../registry/parsers/lsblk/permissions/testdata/no-device-nodes.txt"
      - fixture:
          file: captured/lsblk-m-r.txt
          from: "${specdir}/../../registry/parsers/lsblk/permissions-raw/testdata/container.txt"
      - fixture:
          file: owner-missing.txt
          from: "${specdir}/../../registry/parsers/lsblk/permissions/testdata/owner-missing.txt"
      - run:
          command: jz run --explain lsblk -m
      - assert:
          exit_code: 0
          stderr:
            contains: "chose lsblk/permissions from embedded"
          stdout:
            json:
              - { path: "$", length: 8 }
              - { path: "$[0].name", equals: loop0 }
              - { path: "$[0].size", equals: 4K }
              - { path: "$[0].owner", equals: null }
              - { path: "$[0].group", equals: null }
              - { path: "$[0].mode", equals: null }
              - { path: "$[5].name", equals: nvme1n1p2 }
      - run:
          command: jz run --explain lsblk -m -r
      - assert:
          exit_code: 0
          stderr:
            contains: "chose lsblk/permissions-raw from embedded"
          stdout:
            json:
              - { path: "$[0].owner", equals: null }
              - { path: "$[1].owner", equals: root }
              - { path: "$[1].group", equals: disk }
              - { path: "$[1].mode", equals: brw-rw---- }
      - run:
          command: jz --file owner-missing.txt
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr:
            contains: 'line 3: line does not match pattern'

  # A ping that keeps running is answered reply by reply with --stream:
  # the header, each reply and the summary, as a document of their own.
  # The stand-in prints what iputils printed; the real ping streams in
  # hardware_linux.atago.yaml, where the machine has to allow ICMP.
  - name: jz run --stream ping writes the header, each reply and the summary as they come
    only: {os: linux}
    env:
      PATH: "${workdir}/bin:${env:PATH}"
    steps:
      - fixture:
          file: bin/ping
          mode: "0755"
          content: |
            #!/bin/sh
            cat "$(dirname "$0")/../captured/ping.txt"
      - fixture:
          file: captured/ping.txt
          from: "${specdir}/../../registry/parsers/ping/linux/testdata/iputils-2.txt"
      - run:
          command: jz run --stream ping -c 2 127.0.0.1
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            matches: '\A\{"part":"destination","value":\{"name":"127\.0\.0\.1",[^\n]*\}\n\{"part":"replies","value":\{[^\n]*"icmp_seq":1,[^\n]*\n\{"part":"replies","value":\{[^\n]*"icmp_seq":2,[^\n]*\n\{"part":"statistics","value":\{"packets_transmitted":2,[^\n]*\n\z'

  # ls writes one name per line to a pipe, which is what jz run gets:
  # names with spaces, a leading space and UTF-8 come back whole, an empty
  # directory is the empty list, and -l still lands on the long listing.
  # A name with a line break is two lines to ls -1 and one name to
  # ls --zero, which is the constraint the text format cannot get past.
  - name: jz run ls reads the names ls writes to a pipe, and ls --zero keeps a line break
    only: {os: linux}
    steps:
      - fixture:
          file: dir/a b.txt
          content: ""
      - fixture:
          file: dir/ lead
          content: ""
      - fixture:
          file: dir/日本語.txt
          content: ""
      - fixture:
          file: empty/.keep
          content: ""
      - run:
          command: jz run ls ${workdir}/dir
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            equals: '[{"name":" lead"},{"name":"a b.txt"},{"name":"日本語.txt"}]'
      - run:
          command: jz run ls -1 ${workdir}/empty
      - assert:
          exit_code: 0
          stdout:
            equals: "[]"
      - run:
          command: jz run --stream ls -1 ${workdir}/dir
      - assert:
          exit_code: 0
          stdout:
            equals: |
              {"name":" lead"}
              {"name":"a b.txt"}
              {"name":"日本語.txt"}
      - run:
          command: jz run ls -l ${workdir}/dir
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].flags", matches: "^-rw" }
      - run:
          shell: true
          command: touch "${workdir}/dir/$(printf 'new\nline')"
      - run:
          command: jz run ls --zero ${workdir}/dir
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$", length: 4 }
              - { path: "$[2].name", equals: "new\nline" }
      - run:
          command: jz run ls ${workdir}/dir
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$", length: 5 }
              - { path: "$[2].name", equals: new }
              - { path: "$[3].name", equals: line }
      # An option that puts more than the name on the line is refused.
      - run:
          command: jz run ls -s ${workdir}/dir
      - assert:
          exit_code: 4
          stdout: {empty: true}

  # A "--" ends the options: what follows it is an operand, whatever it
  # looks like. `ls -- -l` lists a file named -l, and the names variant
  # is the one that reads it, since no option was given.
  - name: ls -- -l lists a file named -l rather than the long listing
    only: {os: linux}
    steps:
      - fixture:
          file: "-l"
          content: ""
      - run:
          command: jz run --explain ls -- -l
      - assert:
          exit_code: 0
          stderr:
            contains: "chose ls/names from embedded"
          stdout:
            equals: |
              [{"name":"-l"}]
      - run:
          command: jz run --explain ls -l -- -l
      - assert:
          exit_code: 0
          stderr:
            contains: "chose ls/long from embedded"
          stdout:
            json:
              - { path: "$", length: 1 }
              - { path: "$[0].filename", equals: "-l" }

  # An option that changes the columns changes the format, and the
  # arguments are what says which. Each of these was refused before the
  # variant for it existed, so what this pins is that `jz run` lands on
  # the one written for the option rather than on a neighbour.
  - name: the option forms of df, free, ps, lsblk, iostat and locale land on the variants written for them
    only: {os: linux}
    steps:
      # A unit given without a number is printed after every figure.
      - run:
          command: jz run --explain df -BM
      - assert:
          exit_code: 0
          stderr:
            contains: "chose df/gnu-blocks from embedded"
          stdout:
            json:
              - { path: "$.header.block_size", equals: "1M" }
              - { path: "$.filesystems[0].blocks", gte: 0 }
      # --human rounds the figures in the default layout; -h also moves
      # the device name to the end.
      - run:
          command: jz run --explain iostat --human
      - assert:
          exit_code: 0
          stderr:
            contains: "chose iostat/human-sizes from embedded"
          stdout:
            json:
              - { path: "$[0].cpu[0].idle_percent", gte: 0 }
      - run:
          command: jz run --explain locale -a
      - assert:
          exit_code: 0
          stderr:
            contains: "chose locale/locales from embedded"
          stdout:
            contains: '{"locale":"POSIX"}'
      - run:
          command: jz run --explain df -m
      - assert:
          exit_code: 0
          stderr:
            contains: "chose df/gnu-blocks from embedded"
          stdout:
            json:
              - { path: "$.header.block_size", equals: "1M" }
              - { path: "$.filesystems[0].blocks", gte: 0 }
      # With -P the heading names the unit in bytes.
      - run:
          command: jz run --explain df -P -BM
      - assert:
          exit_code: 0
          stderr:
            contains: "chose df/portable-blocks from embedded"
          stdout:
            json:
              - { path: "$.header.block_size", equals: 1048576 }
              - { path: "$.filesystems[0].blocks", gte: 0 }
      - run:
          command: jz run --explain df -k
      - assert:
          exit_code: 0
          stderr:
            contains: "chose df/gnu from embedded"
      # -BK keeps the default heading and still puts a K after every
      # figure, with and without -T and -P.
      - run:
          command: jz run --explain df -BK
      - assert:
          exit_code: 0
          stderr:
            contains: "chose df/gnu from embedded"
          stdout:
            json:
              - { path: "$[0].1k_blocks", gte: 0 }
      - run:
          command: jz run --explain df -P -BK
      - assert:
          exit_code: 0
          stderr:
            contains: "chose df/portable from embedded"
          stdout:
            json:
              - { path: "$[0].1024_blocks", gte: 0 }
      - run:
          command: jz run --explain df -BM -T
      - assert:
          exit_code: 0
          stderr:
            contains: "chose df/gnu-blocks-type from embedded"
          stdout:
            json:
              - { path: "$.header.block_size", equals: "1M" }
              - { path: "$.filesystems[0].blocks", gte: 0 }
      - run:
          command: jz run --explain free -h -w
      - assert:
          exit_code: 0
          stderr:
            contains: "chose free/gnu-wide-human from embedded"
          stdout:
            json:
              - { path: "$[0].type", equals: "Mem" }
      # The long spelling of one option beside the short spelling of the
      # other lands where the two short ones do.
      - run:
          command: jz run --explain free --wide -h
      - assert:
          exit_code: 0
          stderr:
            contains: "chose free/gnu-wide-human from embedded"
      - run:
          command: jz run --explain df --inodes -h
      - assert:
          exit_code: 0
          stderr:
            contains: "chose df/gnu-inodes-human from embedded"
      - run:
          command: jz run --explain free -w
      - assert:
          exit_code: 0
          stderr:
            contains: "chose free/gnu-wide from embedded"
          stdout:
            json:
              - { path: "$[0].total", gt: 0 }
      - run:
          command: jz run --explain ps -eF
      - assert:
          exit_code: 0
          stderr:
            contains: "chose ps/full-format from embedded"
          stdout:
            json:
              - { path: "$[0].pid", gt: 0 }
      - run:
          command: jz run --explain ps -ely
      - assert:
          exit_code: 0
          stderr:
            contains: "chose ps/long-y from embedded"
      - run:
          command: jz run --explain lsblk -m
      - assert:
          exit_code: 0
          stderr:
            contains: "chose lsblk/permissions from embedded"

  # -lG and -lg print the same text and differ in whether the one name
  # column is the owner or the group. Nothing in the output says which,
  # so the arguments are the whole of it: `jz run` reaches the right one,
  # and a pipe that names only the command reports both rather than
  # choosing.
  #
  # The file is one the scenario writes, and the names it is checked
  # against are what stat reports for it, so the scenario holds wherever
  # the suite runs and whoever runs it.
  - name: ls -lG and ls -lg land on different variants for the same text
    only: {os: linux}
    steps:
      - fixture:
          file: owned.txt
          content: "x\n"
      - run:
          command: stat -c %U owned.txt
      - store:
          name: owner
          from:
            stdout: {trim: true}
      - run:
          command: stat -c %G owned.txt
      - store:
          name: group
          from:
            stdout: {trim: true}
      - run:
          command: jz run --explain ls -lG owned.txt
      - assert:
          exit_code: 0
          stderr:
            contains: "chose ls/long-no-group from embedded"
          stdout:
            json:
              - { path: "$[0].owner", matches: "^${owner}$" }
              - { path: "$[0].size", equals: "2" }
              - { path: "$[0].filename", equals: owned.txt }
      - run:
          command: jz run --explain ls -lg owned.txt
      - assert:
          exit_code: 0
          stderr:
            contains: "chose ls/long-no-owner from embedded"
          stdout:
            json:
              - { path: "$[0].group", matches: "^${group}$" }
              - { path: "$[0].size", equals: "2" }
              - { path: "$[0].filename", equals: owned.txt }
      - run:
          shell: true
          command: LC_ALL=C ls -lG owned.txt | jz --parser ls
      - assert:
          exit_code: 4
          stdout: {empty: true}
          stderr:
            contains: "ls/long-no-group"
      # Taking one name away and adding a column after the group leaves
      # two names again, under other meanings: -Z prints the security
      # context there, which no group name looks like, and --author a user
      # name, which only the argument tells from a group.
      - run:
          shell: true
          command: LC_ALL=C ls -lgZ owned.txt | jz
      - assert:
          exit_code: 4
          stdout: {empty: true}
      - run:
          command: jz run ls -lo --author owned.txt
      - assert:
          exit_code: 4
          stdout: {empty: true}
          stderr:
            contains: "excluded by the argument --author"
      # A device file with one name left prints that name and "1, 3",
      # which is not a group and a size.
      - run:
          shell: true
          command: LC_ALL=C ls -lg /dev/null | jz
      - assert:
          exit_code: 4
          stdout: {empty: true}

  # -t opens each sample with the time it was taken, which is a different
  # place for a sample to start, so it is a different format.
  - name: iostat -t opens each sample with its time
    only: {os: linux}
    steps:
      - run:
          command: jz run --explain iostat -t
      - assert:
          exit_code: 0
          stderr:
            contains: "chose iostat/linux-timestamped from embedded"
          stdout:
            json:
              - { path: "$", length: 1 }
              - { path: "$[0].timestamp.value", matches: "[0-9]" }
              - { path: "$[0].cpu", length: 1 }
      - run:
          command: jz run --explain iostat
      - assert:
          exit_code: 0
          stderr:
            contains: "chose iostat/linux from embedded"

  # ss keeps what -e, -o, -m and -i append after the address columns, and
  # folds the indented lines -i and -m add back onto their row. A tail it
  # refused used to be exit 3 on the most ordinary invocations.
  #
  # The sockets are ones the scenario opens, so the rows do not depend on
  # what the machine happens to be listening on: the suite's own HTTP
  # server on a free port of 127.0.0.1, and a UDP socket bash connects to
  # 127.0.0.1:9, which needs nothing listening there. Each ss is filtered
  # to that one socket. Both services end with the scenario.
  - name: ss keeps what its options append, and ss -u drops two columns
    only: {os: linux}
    services:
      - name: server
        command: e2ehelper serve -addr ${workdir}/addr.txt
        ready: {file: addr.txt, store: addr, timeout: 20s}
      - name: udp
        command: bash -c 'exec 3>/dev/udp/127.0.0.1/9 && echo connected > udp.tmp && mv udp.tmp udp.txt && exec sleep 300'
        ready: {file: udp.txt, timeout: 20s}
    steps:
      - run:
          command: cat addr.txt
      - store:
          name: port
          from:
            stdout: {matches: ':([0-9]+)'}
      - run:
          shell: true
          command: LC_ALL=C ss -tln -e src ${addr} | jz --explain
      - assert:
          exit_code: 0
          stderr:
            contains: "chose ss/single-protocol from embedded"
          stdout:
            json:
              - { path: "$", length: 1 }
              - { path: "$[0].state", equals: LISTEN }
              - { path: "$[0].local_address", equals: 127.0.0.1 }
              - { path: "$[0].local_port", matches: "^${port}$" }
              - { path: "$[0].info", matches: "ino:" }
      - run:
          shell: true
          command: LC_ALL=C ss -un dst 127.0.0.1:9 | jz --explain
      - assert:
          exit_code: 0
          stderr:
            contains: "chose ss/connected from embedded"
          stdout:
            json:
              - { path: "$", length: 1 }
              - { path: "$[0].local_address", equals: 127.0.0.1 }
              - { path: "$[0].peer_address", equals: 127.0.0.1 }
              - { path: "$[0].peer_port", equals: "9" }

  # systemctl printed three tables no definition read, and its own
  # properties are the same Key=value block a unit's selected properties
  # are, so naming the parser is what reaches them.
  - name: the systemctl tables and the manager's own properties are read
    only: {os: linux}
    steps:
      # A machine systemd booted, as above.
      - run:
          command: test -d /run/systemd/system
      - assert:
          exit_code: 0
      - run:
          command: jz run --explain systemctl list-machines
      - assert:
          exit_code: 0
          stderr:
            contains: "chose systemctl/machines from embedded"
          stdout:
            json:
              - { path: "$[0].state", matches: "[a-z]" }
      - run:
          command: jz run --explain systemctl list-paths
      - assert:
          exit_code: 0
          stderr:
            contains: "chose systemctl/paths from embedded"
      - run:
          command: jz run --explain systemctl list-automounts
      - assert:
          exit_code: 0
          stderr:
            contains: "chose systemctl/automounts from embedded"
      # --all adds automounts not loaded from a unit file, which print
      # nothing under WHERE.
      - run:
          command: jz run --explain systemctl list-automounts --all
      - assert:
          exit_code: 0
          stderr:
            contains: "chose systemctl/automounts from embedded"
      - run:
          command: jz run --explain systemctl show
      - assert:
          exit_code: 0
          stderr:
            contains: "chose systemctl/show-properties from embedded"
          stdout:
            json:
              - { path: "$[0].name", equals: "Version" }
      # systemd adds a JOB column to this table only while a job is
      # queued, and which definition reads the text depends on whether
      # anything was starting at that second. With --plain the table has
      # no marker column, so a pending job is units-jobs-plain rather than
      # units-jobs. Each is the right answer, so the assertion names them
      # rather than the state the machine happened to be in.
      - run:
          command: jz run --explain systemctl list-units --plain --no-pager
      - assert:
          exit_code: 0
          stderr:
            matches: "chose systemctl/units(-jobs-plain)? from embedded"

  # gzip is on every Linux runner. The listing of an archive made here
  # lands on gzip/list, and -v on gzip/list-verbose, whose extra columns
  # are what tells the two apart.
  - name: jz run gzip -l lands on gzip/list and -lv on gzip/list-verbose
    steps:
      - fixture:
          file: plain.txt
          content: "hello world\nhello world\nhello world\n"
      - run:
          command: gzip -k plain.txt
      - assert:
          exit_code: 0
      - run:
          command: jz run --explain gzip -l plain.txt.gz
      - assert:
          exit_code: 0
          stderr:
            contains: "chose gzip/list from embedded"
          stdout:
            json:
              - { path: "$", length: 1 }
              - { path: "$[0].uncompressed", equals: 36 }
              - { path: "$[0].compressed", gte: 1 }
              - { path: "$[0].uncompressed_name", equals: plain.txt }
      - run:
          command: jz run --explain gzip -lv plain.txt.gz
      - assert:
          exit_code: 0
          stderr:
            contains: "chose gzip/list-verbose from embedded"
          stdout:
            json:
              - { path: "$[0].method", equals: defla }
              - { path: "$[0].crc", matches: "^[0-9a-f]{8}$" }
              - { path: "$[0].uncompressed", equals: 36 }

  # GNU ls quotes names in the style QUOTING_STYLE names, which a shell
  # profile may export. jz runs ls with the literal style, which is what
  # ls prints to a pipe without the variable, and refuses an option that
  # quotes or escapes names in a long listing.
  - name: jz run ls -l reads names unquoted whatever QUOTING_STYLE says, and refuses -Q
    only: {os: linux}
    steps:
      - fixture:
          file: listing/a b
          content: "x\n"
      - run:
          command: jz run ls -l ${workdir}/listing
          env:
            QUOTING_STYLE: c
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$", length: 1 }
              - { path: "$[0].filename", equals: "a b" }
      - run:
          command: jz run ls -l -Q ${workdir}/listing
      - assert:
          exit_code: 4
          stdout: {empty: true}
          stderr:
            contains: "does not read the output of -Q"


  - name: cksum -a, shasum and b2sum -l land on the definition of the line they print
    only: {os: linux}
    steps:
      - fixture:
          file: sums/notes.txt
          content: "hello\n"
      - run:
          command: jz run cksum -a sha256 ${workdir}/sums/notes.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].algorithm", equals: SHA256 }
              - { path: "$[0].checksum", equals: 5891b5b522d5df086d0ff0b110fbd9d21bb4fc7163af34d08286a2e846f6be03 }
      - run:
          command: jz run --explain cksum -a sha256 --untagged ${workdir}/sums/notes.txt
      - assert:
          exit_code: 0
          stderr:
            contains: "chose sha256sum/posix"
      - run:
          command: jz run --explain shasum ${workdir}/sums/notes.txt
      - assert:
          exit_code: 0
          stderr:
            contains: "chose sha1sum/posix"
          stdout:
            json:
              - { path: "$[0].checksum", equals: f572d396fae9206628714fb2ce00f72e94f2258f }
      - run:
          command: jz run --explain b2sum -l 256 ${workdir}/sums/notes.txt
      - assert:
          exit_code: 0
          stderr:
            contains: "chose sha256sum/posix"
      - run:
          command: jz run --explain cksum -a bsd ${workdir}/sums/notes.txt
      - assert:
          exit_code: 0
          stderr:
            contains: "chose sum/bsd"

  - name: readelf -s -W lands on its symbol tables, and readelf -a is refused
    only: {os: linux}
    steps:
      - run:
          command: jz run readelf -s -W /bin/ls
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].table.name", equals: .dynsym }
              - { path: "$[0].symbols[0].num", equals: 0 }
      # -a prints every report one after another. It used to reach
      # readelf/header and fail on the line after the header with exit 3.
      - run:
          command: jz run readelf -a /bin/ls
      - assert:
          exit_code: 4
          stdout: {empty: true}

  - name: taskset -p lands on the affinity mask
    only: {os: linux}
    steps:
      - run:
          command: jz run taskset -p 1
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.pid", equals: 1 }
              - { path: "$.affinity_mask", matches: "^[0-9a-f]+$" }

  # rsync --stats on the real binary: a source tree whose name holds a
  # space and shell metacharacters, so that a step which passed the
  # arguments through a shell would fail here rather than in production.
  - name: rsync --stats lands on the transfer counts
    only: {os: linux}
    steps:
      - fixture:
          file: "back up [1]/notes.txt"
          content: |
            one
            two
      - fixture:
          file: "back up [1]/sub/report.txt"
          content: |
            three
      - run:
          command: jz run --explain rsync -a --stats "${workdir}/back up [1]/" "${workdir}/copy/"
      - assert:
          exit_code: 0
          stderr:
            contains: "chose rsync/stats from embedded"
          stdout:
            json:
              - { path: "$.files", equals: 4 }
              - { path: "$.files_by_type.reg", equals: 2 }
              - { path: "$.files_by_type.dev", equals: null }
              - { path: "$.regular_files_transferred", equals: 2 }
              - { path: "$.total_file_size", equals: 14 }
              - { path: "$.dry_run", equals: false }
              - { path: "$.speedup", gt: 0 }
      # A second run copies nothing, and the dry run marks itself.
      - run:
          command: jz run rsync -a --stats --dry-run "${workdir}/back up [1]/" "${workdir}/copy/"
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.regular_files_transferred", equals: 0 }
              - { path: "$.dry_run", equals: true }
      # A source that is not there: rsync still prints its block, with
      # every count at zero, and says what went wrong on standard error.
      # jz hands the block over and comes back with rsync's own status, so
      # the caller learns of the failure from the status and not from the
      # JSON, which reads like a transfer that moved nothing.
      - run:
          command: jz run rsync -a --stats "${workdir}/missing/" "${workdir}/copy2/"
      - assert:
          exit_code: 23
          stderr:
            contains: "No such file or directory"
          stdout:
            json:
              - { path: "$.files", equals: 0 }
              - { path: "$.regular_files_transferred", equals: 0 }
      # An option rsync does not have: it prints its usage on standard
      # error and nothing on standard output, and jz passes the status on
      # rather than turning an empty standard output into one of its own
      # exit codes.
      - run:
          command: jz run rsync -a --stats --no-such-option "${workdir}/back up [1]/" "${workdir}/copy4/"
      - assert:
          exit_code: 1
          stderr:
            contains: "unknown option"
          stdout: {empty: true}
      # -v puts the file list in front of the counts, which no variant
      # reads, and that is a conversion failure rather than a failure of
      # rsync: it copied the tree.
      - run:
          command: jz run rsync -av --stats "${workdir}/back up [1]/" "${workdir}/copy3/"
      - assert:
          exit_code: 4
          stdout: {empty: true}

  - name: 7z l -slt lists an archive made here, with and without the banner
    only: {os: linux}
    steps:
      - fixture:
          file: "up loads/tree/notes.txt"
          content: |
            alpha
      - fixture:
          file: "up loads/tree/docs/report.txt"
          content: |
            beta beta beta
      - run:
          command: 7z a -bso0 -bsp0 "${workdir}/up loads/archive [1].7z" "${workdir}/up loads/tree"
      - assert:
          exit_code: 0
      - run:
          command: jz run --explain 7z l -slt "${workdir}/up loads/archive [1].7z"
      - assert:
          exit_code: 0
          stderr:
            contains: "chose 7z/list-technical from embedded"
          stdout:
            json:
              - { path: "$.properties.Type", equals: "7z" }
              - { path: "$.entries[0].Path", equals: "tree" }
              - { path: "$.entries[2].Path", equals: "tree/docs/report.txt" }
              - { path: "$.entries[2].Size", equals: 15 }
              - { path: "$.entries[2].Encrypted", equals: false }
      # -ba prints the same blocks without the banner or the archive's
      # own properties, which is the form a service that only wants the
      # members asks for.
      - run:
          command: jz run --explain 7z l -slt -ba "${workdir}/up loads/archive [1].7z"
      - assert:
          exit_code: 0
          stderr:
            contains: "chose 7z/list-technical-bare from embedded"
          stdout:
            json:
              - { path: "$[2].Path", equals: "tree/docs/report.txt" }
              - { path: "$[2].Size", equals: 15 }
              - { path: "$[2].Encrypted", equals: false }
      # An archive holds as many members as it holds, so --stream writes
      # each entry as soon as its block has been read rather than
      # holding the listing to build one array.
      - run:
          command: jz run --stream 7z l -slt -ba "${workdir}/up loads/archive [1].7z"
      - assert:
          exit_code: 0
          stdout:
            contains: '"Path":"tree/docs/report.txt"'
      # An archive that is not there: 7-Zip exits 2 and writes its error
      # where the listing would have been, so no variant reads it and
      # 7-Zip's own status is what comes back.
      - run:
          command: jz run 7z l -slt "${workdir}/up loads/missing.7z"
      - assert:
          exit_code: 2
          stdout: {empty: true}

  # The commands a server runs over what a client sent it: poppler,
  # 7-Zip, OpenSSL and file(1), each on a path holding a space and
  # shell metacharacters, and each with the failure that matters more
  # than the success.
  - name: pdfinfo reads a PDF written here, and its failures keep their own status
    only: {os: linux}
    steps:
      - fixture:
          file: "up loads/report [final].pdf"
          content: |
            %PDF-1.5
            1 0 obj
            << /Type /Catalog /Pages 2 0 R >>
            endobj
            2 0 obj
            << /Type /Pages /Kids [3 0 R 4 0 R] /Count 2 >>
            endobj
            3 0 obj
            << /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] >>
            endobj
            4 0 obj
            << /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] >>
            endobj
            5 0 obj
            << /Title (Quarterly report) /Producer (jsonize end-to-end suite) >>
            endobj
            trailer
            << /Size 6 /Root 1 0 R /Info 5 0 R >>
            %%EOF
      - run:
          command: jz run --explain pdfinfo "${workdir}/up loads/report [final].pdf"
      - assert:
          exit_code: 0
          stderr:
            contains: "chose pdfinfo/poppler from embedded"
          stdout:
            json:
              - { path: "$.Pages", equals: 2 }
              - { path: "$.Title", equals: "Quarterly report" }
              - { path: "$.Producer", equals: "jsonize end-to-end suite" }
              - { path: "$.Encrypted", equals: "no" }
              - { path: "$.Tagged", equals: false }
      # A file that is not there and a file that is not a PDF are both
      # poppler's own failure: its status comes back, its message stays
      # on standard error, and nothing is written that a caller could
      # read as a report.
      - run:
          command: jz run pdfinfo "${workdir}/up loads/missing.pdf"
      - assert:
          exit_code: 1
          stderr:
            contains: "Couldn't open file"
          stdout: {empty: true}
      - fixture:
          file: "up loads/not-a.pdf"
          content: |
            this is not a PDF
      - run:
          command: jz run pdfinfo "${workdir}/up loads/not-a.pdf"
      - assert:
          exit_code: 1
          stdout: {empty: true}
      # An option pdfinfo does not have: it prints its usage and exits
      # 99, and that status is what comes back.
      - run:
          command: jz run pdfinfo --no-such-option "${workdir}/up loads/report [final].pdf"
      - assert:
          exit_code: 99
          stdout: {empty: true}

  - name: openssl x509 reads the fields of a certificate made here
    only: {os: linux}
    steps:
      - run:
          command: openssl req -x509 -newkey rsa:2048 -keyout "${workdir}/key [1].pem" -out "${workdir}/cert [1].pem" -days 30 -nodes -subj /CN=example.test/O=Example
      - assert:
          exit_code: 0
      - run:
          command: jz run --explain openssl x509 -noout -subject -dates -fingerprint -in "${workdir}/cert [1].pem"
      - assert:
          exit_code: 0
          stderr:
            contains: "chose openssl/x509-fields from embedded"
          stdout:
            json:
              # OpenSSL 3.5 prints "CN=example.test", 3.0 "CN = example.test".
              - { path: "$.subject", matches: "^CN ?= ?example\\.test, ?O ?= ?Example$" }
              - { path: "$.notBefore", matches: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]+Z$" }
              - { path: "$.notAfter", matches: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]+Z$" }
      # -text is the whole report rather than the five label=value lines,
      # and has a definition of its own. The assertions are written
      # against what does not move between OpenSSL releases: 3.0 prints
      # the names with spaces around the equals signs and puts no
      # heading over the signature.
      - run:
          command: jz run --explain openssl x509 -noout -text -in "${workdir}/cert [1].pem"
      - assert:
          exit_code: 0
          stderr:
            contains: "chose openssl/x509-text from embedded"
          stdout:
            json:
              - { path: "$.certificate.version", equals: 3 }
              - { path: "$.certificate.subject", matches: "example\\.test" }
              - { path: "$.certificate.not_after", matches: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T" }
              - { path: "$.public_key.bits", equals: 2048 }
              - { path: "$.extensions[0].name", matches: "^X509v3 " }
      # Without -noout the PEM block follows the report and is not part
      # of it. openssl succeeded, so this is a conversion failure and
      # the status is jz's own rather than the command's.
      - run:
          command: jz run openssl x509 -text -in "${workdir}/cert [1].pem"
      - assert:
          exit_code: 3
          stdout: {empty: true}
      # The key is not a certificate: openssl fails, and its status is
      # what comes back.
      - run:
          command: jz run openssl x509 -noout -dates -in "${workdir}/key [1].pem"
      - assert:
          exit_code: 1
          stdout: {empty: true}

  - name: file -i and file name the type of a path holding a space
    only: {os: linux}
    steps:
      - fixture:
          file: "up loads/note [1].txt"
          content: |
            plain text
      - run:
          command: jz run --explain file -i "${workdir}/up loads/note [1].txt"
      - assert:
          exit_code: 0
          stderr:
            contains: "chose file/mime from embedded"
          stdout:
            json:
              - { path: "$[0].file", matches: "note \\[1\\]\\.txt$" }
              - { path: "$[0].mime_type", equals: "text/plain" }
      # The sentence form over the same name: the path of a listing may
      # hold spaces, which is what an upload named by a person looks
      # like.
      - run:
          command: jz run --explain file "${workdir}/up loads/note [1].txt"
      - assert:
          exit_code: 0
          stderr:
            contains: "chose file/posix from embedded"
          stdout:
            json:
              - { path: "$[0].file", matches: "note \\[1\\]\\.txt$" }
              - { path: "$[0].type", matches: "text" }
      # file(1) reports a file it cannot open in the description and
      # still exits 0. With -i there is no MIME type to read, and the
      # sentence form is not reached either, so the answer is exit 4
      # rather than a record whose mime_type is missing.
      - run:
          command: jz run file -i ${workdir}/missing.bin
      - assert:
          exit_code: 4
          stderr:
            contains: "which does not read the output of -i"
          stdout: {empty: true}

  # OCR over an image a client sent: unbounded work on untrusted input,
  # which is why the cookbook entry beside it is about limits. The PNG
  # is committed rather than drawn here, so the page geometry the
  # assertions name is the one this file has.
  - name: tesseract reads a page into one row per word
    only: {os: linux}
    steps:
      - fixture:
          file: "up loads/receipt [1].png"
          from: "${specdir}/testdata/ocr-invoice.png"
      - run:
          command: jz run --explain tesseract "${workdir}/up loads/receipt [1].png" stdout tsv
      - assert:
          exit_code: 0
          stderr:
            contains: "chose tesseract/tsv from embedded"
          stdout:
            json:
              # The first row is the page, whose box is the image and
              # which carries no text and tesseract's own -1 for "this
              # is not a word". What the recogniser made of the words is
              # not asserted here: that moves between models.
              - { path: "$[0].level", equals: 1 }
              - { path: "$[0].page_num", equals: 1 }
              - { path: "$[0].width", equals: 700 }
              - { path: "$[0].height", equals: 200 }
              - { path: "$[0].conf", equals: -1 }
              - { path: "$[0].text", equals: "" }
      # A page has as many rows as it has words, so --stream writes each
      # as it is read.
      - run:
          command: jz run --stream tesseract "${workdir}/up loads/receipt [1].png" stdout tsv
      - assert:
          exit_code: 0
          stdout:
            contains: '"level":5'
      # With no output configuration named tesseract writes the plain
      # text, which is not the table: the command was happy and the
      # conversion was not.
      - run:
          command: jz run tesseract "${workdir}/up loads/receipt [1].png" stdout
      - assert:
          exit_code: 4
          stdout: {empty: true}
      # An image that is not there is tesseract's own failure, and its
      # status is what comes back.
      - run:
          command: jz run tesseract "${workdir}/up loads/missing.png" stdout tsv
      - assert:
          exit_code: 1
          stderr:
            contains: "cannot read input file"
          stdout: {empty: true}

  - name: zdump and zdump -v land on their own definitions
    only: {os: linux}
    steps:
      - run:
          command: jz run zdump UTC Asia/Tokyo
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$", length: 2 }
              - { path: "$[0].zone", equals: UTC }
              - { path: "$[1].abbreviation", equals: JST }
      # -v prints the transitions of the years -c names, with isdst and
      # gmtoff as numbers, and the lines where gmtime or localtime failed
      # with the seconds they failed on.
      - run:
          command: jz run --explain zdump -v -c 2025,2026 America/New_York
      - assert:
          exit_code: 0
          stderr:
            contains: "chose zdump/verbose from embedded"
          stdout:
            contains: '"abbreviation":"EDT","isdst":1,"gmtoff":-14400'

  - name: ssh -G lands on the client configuration, one entry per line
    only: {os: linux}
    steps:
      # -F /dev/null leaves out the user's configuration, and -G resolves
      # it without connecting.
      - run:
          command: jz run ssh -G -F /dev/null -p 2222 example.com
      - assert:
          exit_code: 0
          stdout:
            contains: '{"name":"port","value":"2222"}'
      # A keyword given twice keeps both values.
      - run:
          command: jz run ssh -G -F /dev/null -L 8080:localhost:80 -L 9090:localhost:90 example.com
      - assert:
          exit_code: 0
          stdout:
            contains:
              - '{"name":"localforward","value":"8080 [localhost]:80"}'
              - '{"name":"localforward","value":"9090 [localhost]:90"}'

  - name: lscpu -p names its columns from the header comment, whatever list -p was given
    only: {os: linux}
    steps:
      - run:
          command: jz run --explain lscpu -p=cpu,core,online
      - assert:
          exit_code: 0
          stderr:
            contains: "chose lscpu/parsable from embedded"
          stdout:
            json:
              - { path: "$[0].cpu", equals: 0 }
              - { path: "$[0].online", matches: "^[YN]$" }
      - run:
          command: jz run lscpu -p
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].cpu", equals: 0 }
              - { path: "$[0].socket", gte: 0 }

  - name: gcc -print-search-dirs gives its search paths as arrays
    only: {os: linux}
    steps:
      - run:
          command: jz run gcc -print-search-dirs
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.install", matches: "^/" }
              - { path: "$.programs[0]", matches: "^/" }
              - { path: "$.libraries[0]", matches: "^/" }

  - name: apt-cache rdepends lands on its own definition, and depends on its own
    only: {os: linux}
    steps:
      - run:
          command: jz run --explain apt-cache rdepends libc6
      - assert:
          exit_code: 0
          stderr:
            contains: "chose apt-cache/rdepends from embedded"
          stdout:
            json:
              - { path: "$[0].package.name", equals: libc6 }
      - run:
          command: jz run --explain apt-cache depends coreutils
      - assert:
          exit_code: 0
          stderr:
            contains: "chose apt-cache/depends from embedded"
          stdout:
            json:
              - { path: "$[0].package", equals: coreutils }
