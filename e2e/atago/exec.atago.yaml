version: "1"

suite:
  name: jz run - executing the command

# Contracts that do not depend on which df/ps implementation the host
# has: a shell script stands in for the target command. Windows has no
# /bin/sh, so these are POSIX-only; detect.atago.yaml covers parsing
# everywhere and exec_linux/exec_darwin run the real binaries.
scenarios:
  - name: the command runs without a shell and its stdout becomes JSON
    skip: {os: windows}
    steps:
      - fixture:
          file: reg/parsers/sh/default/parser.yaml
          content: |
            format: 1
            command: sh
            variant: default
            detect: {signature: {all: ['^[A-Za-z_][A-Za-z0-9_]*=']}}
            parse: {type: kv}
            fields:
              n: {type: int}
      - run:
          command: jz run -- sh -c 'echo n=42; echo lc=$LC_ALL'
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 0
          stderr:
            empty: true
          stdout:
            json:
              - { path: "$[0].name", equals: n }
              - { path: "$[0].value", equals: 42 }
              - { path: "$[1].value", equals: C }

  - name: stderr passes through untouched and never enters the JSON
    skip: {os: windows}
    steps:
      - fixture:
          file: reg/parsers/sh/default/parser.yaml
          content: |
            format: 1
            command: sh
            variant: default
            detect: {signature: {all: ['^[A-Za-z_][A-Za-z0-9_]*=']}}
            parse: {type: kv}
      - run:
          command: jz run -- sh -c 'echo a=b; echo warning >&2'
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 0
          stderr:
            equals: warning
          stdout:
            json: { path: "$", length: 1 }

  - name: a failing command keeps its status while its output is still parsed
    skip: {os: windows}
    steps:
      - fixture:
          file: reg/parsers/sh/default/parser.yaml
          content: |
            format: 1
            command: sh
            variant: default
            detect: {signature: {all: ['^[A-Za-z_][A-Za-z0-9_]*=']}}
            parse: {type: kv}
      - run:
          command: jz run -- sh -c 'echo a=b; exit 7'
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 7
          stderr:
            contains: sh exited with status 7
          stdout:
            json: { path: "$[0].value", equals: b }
      - run:
          command: jz run -- sh -c 'exit 9'
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 9
          stdout:
            empty: true

  - name: a command killed by a signal yields 128+signal
    skip: {os: windows}
    steps:
      - fixture:
          file: reg/parsers/sh/default/parser.yaml
          content: |
            format: 1
            command: sh
            variant: default
            detect: {signature: {all: ['=']}}
            parse: {type: kv}
      - run:
          command: jz run -- sh -c 'kill -TERM $$'
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 143
          stderr:
            contains: terminated by SIGTERM

  - name: --timeout terminates a hanging command
    skip: {os: windows}
    steps:
      - fixture:
          file: reg/parsers/sh/default/parser.yaml
          content: |
            format: 1
            command: sh
            variant: default
            detect: {signature: {all: ['=']}}
            parse: {type: kv}
      - run:
          command: jz run --timeout 300ms -- sh -c 'exec sleep 30'
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
          timeout: 20s
      - assert:
          exit_code: 143
          stderr:
            contains: timeout of 300ms reached

  - name: output that does not match the signature fails instead of being mis-parsed
    skip: {os: windows}
    steps:
      - fixture:
          file: reg/parsers/sh/default/parser.yaml
          content: |
            format: 1
            command: sh
            variant: default
            detect: {signature: {all: ['^[A-Za-z_][A-Za-z0-9_]*=']}}
            parse: {type: kv}
      - run:
          command: jz run -- sh -c 'echo unexpected output'
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: no sh variant matches this input
      # Knowing the command name is not a licence to ignore the
      # signature, and neither is naming the variant.
      - run:
          command: jz run --parser sh --variant default -- sh -c 'echo unexpected output'
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 4
          stderr:
            contains: does not describe this input
      # There is no way to make jz parse output its definition rejects.
      - assert:
          stderr:
            not_contains: "--force"

  - name: an unknown command is refused before anything is executed
    skip: {os: windows}
    steps:
      - run:
          command: jz run -- sh -c 'echo executed > marker'
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 4
          stderr:
            contains: no parser for "sh"
      - assert:
          dir:
            path: "${workdir}"
            not_contains: [marker]
      # A wrapper is refused the same way, and when what it runs is a
      # command jz knows, the refusal names the parser to use.
      - run:
          command: jz run --pretty nice -n 5 df -h
      - assert:
          exit_code: 4
          stderr:
            contains: "If nice runs df, name that parser: jz run --pretty --parser df -- nice -n 5 df -h"
      - assert:
          stderr:
            not_contains: did you mean

  - name: an unknown variant is refused before anything is executed
    skip: {os: windows}
    steps:
      - fixture:
          file: reg/parsers/sh/default/parser.yaml
          content: |
            format: 1
            command: sh
            variant: default
            parse: {type: kv}
      - run:
          command: jz run --parser sh --variant nope -- sh -c 'echo executed > marker'
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 4
          stderr:
            contains: has no variant "nope"
      - assert:
          dir:
            path: "${workdir}"
            not_contains: [marker]

  - name: jz flags stop at the command name
    skip: {os: windows}
    steps:
      - fixture:
          file: reg/parsers/sh/default/parser.yaml
          content: |
            format: 1
            command: sh
            variant: default
            detect: {signature: {all: ['^args=']}}
            parse: {type: kv}
      # A flag before the command is jz's: the output is indented.
      - run:
          command: jz run --pretty sh -c 'echo "args=$*"' sh -h
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 0
          stdout:
            contains: "\n  {"
      - assert:
          stdout:
            json: { path: "$[0].value", equals: "-h" }
      # The same flag after the command belongs to the command.
      - run:
          command: jz run sh -c 'echo "args=$*"' sh --pretty --parser
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 0
          stdout:
            not_contains: "\n  {"
      - assert:
          stdout:
            json: { path: "$[0].value", equals: "--pretty --parser" }
      # -- states the boundary explicitly.
      - run:
          command: jz run -- sh -c 'echo "args=$*"' sh --pretty --variant
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].value", equals: "--pretty --variant" }
      # A -- after the command is the command's own argument.
      - run:
          command: jz run sh -c 'echo "args=$*"' sh -- --literal
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].value", equals: "-- --literal" }

  - name: --keep-locale inherits the caller's locale
    skip: {os: windows}
    steps:
      - fixture:
          file: reg/parsers/sh/default/parser.yaml
          content: |
            format: 1
            command: sh
            variant: default
            detect: {signature: {all: ['^[A-Za-z_][A-Za-z0-9_]*=']}}
            parse: {type: kv}
      - run:
          command: jz run --keep-locale -- sh -c 'echo lc=${LC_ALL:-inherited}'
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
            LC_ALL: ""
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].value", equals: inherited }

  - name: run with no command is a usage error
    skip: {os: windows}
    steps:
      - run:
          command: jz run
          env:
            JSONIZE_REGISTRY_PATH: "${workdir}/reg"
      - assert:
          exit_code: 2
          stdout:
            empty: true
          stderr:
            contains: no command given
