version: "1"

suite:
  name: jz - automatic detection from stdin

# The headline behaviour: pipe output in, get JSON out, without naming a
# parser. Nothing is executed here, so these scenarios run identically on
# Linux, macOS and Windows. The fixtures are copies of registry testdata.
scenarios:
  - name: GNU df output is identified and typed without any hint
    steps:
      - fixture:
          file: df-gnu.txt
          from: "${specdir}/testdata/df-gnu.txt"
      - run:
          command: jz
          stdin: {file: df-gnu.txt}
      - assert:
          exit_code: 0
          stderr:
            empty: true
          stdout:
            # The 1K-block keys are what say the gnu variant was chosen.
            json:
              - { path: "$", length: 7 }
              - { path: "$[0].filesystem", equals: tmpfs }
              - { path: "$[0].1k_blocks", equals: 12882672 }
              - { path: "$[0].use_percent", equals: 1 }
              - { path: "$[0].mounted_on", equals: /run }

  - name: a different variant of the same command is told apart by its header
    steps:
      - fixture:
          file: df-bsd.txt
          from: "${specdir}/testdata/df-bsd.txt"
      - run:
          command: jz --pretty
          stdin: {file: df-bsd.txt}
      - assert:
          exit_code: 0
          stdout:
            # 512-byte blocks and the inode columns are the BSD variant.
            json:
              - { path: "$[4].filesystem", equals: "map auto_home" }
              - { path: "$[0].512_blocks", equals: 965595304 }

  - name: a different command entirely is identified from the same stdin
    steps:
      - fixture:
          file: free-h.txt
          from: "${specdir}/testdata/free-h.txt"
      - run:
          command: jz
          stdin: {file: free-h.txt}
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].type", equals: Mem }
              # -h and -h --si differ only in the base of the suffixes and
              # the output does not say which was used, so the value is
              # reported as printed.
              - { path: "$[0].total", equals: "61Gi" }
              - { path: "$[1].type", equals: Swap }

  # Two listings in a row, as a loop over two hosts prints them, each
  # lined up to its own widths. The second header opens a second table;
  # it used to be read as a network named "ID" with the id "NETWORK".
  - name: a command run twice is read as two tables, not a row of column names
    steps:
      - fixture:
          file: networks.txt
          content: |
            NETWORK ID     NAME             DRIVER    SCOPE
            9d34582a8e2c   api_default      bridge    local
            4e99b1f53ebc   bridge           bridge    local
            NETWORK ID     NAME      DRIVER    SCOPE
            377bf3d7e28a   host      host      local
            758f21e616c1   none      null      local
      - run:
          command: jz --parser docker --file networks.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$", length: 4 }
              - { path: "$[2].name", equals: host }
      - assert:
          stdout:
            not_contains: '"NETWORK"'

  - name: a composite parser returns one key per part
    steps:
      - fixture:
          file: w-linux.txt
          from: "${specdir}/testdata/w-linux.txt"
      - run:
          command: jz
          stdin: {file: w-linux.txt}
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.uptime.users", equals: 5 }
              - { path: "$.uptime.load_1m", equals: 0.74 }
              - { path: "$.users[0].user", equals: alice }
              - { path: "$.users[0].tty", equals: null }
              - { path: "$.users[0].what", equals: "lightdm --session-child 13 20" }

  - name: nested objects and arrays from a single line
    steps:
      - fixture:
          file: id-selinux.txt
          from: "${specdir}/testdata/id-selinux.txt"
      - run:
          command: jz
          stdin: {file: id-selinux.txt}
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.uid.id", equals: 1000 }
              - { path: "$.uid.name", equals: alice }
              - { path: "$.groups", length: 2 }
              - { path: "$.groups[1].name", equals: wheel }
              - { path: "$.context.level", equals: "s0-s0:c0.c1023" }

  - name: input redirected from a file takes the same path as a pipe
    steps:
      - fixture:
          file: df-gnu.txt
          from: "${specdir}/testdata/df-gnu.txt"
      - run:
          shell: true
          command: jz < df-gnu.txt
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$", length: 7 }
      - run:
          command: jz --file df-gnu.txt
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$", length: 7 }

  - name: naming the parser narrows detection to one command
    steps:
      - fixture:
          file: df-gnu.txt
          from: "${specdir}/testdata/df-gnu.txt"
      - run:
          command: jz --parser df
          stdin: {file: df-gnu.txt}
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].1k_blocks", equals: 12882672 }

  - name: naming the variant pins the definition
    steps:
      - fixture:
          file: df-gnu.txt
          from: "${specdir}/testdata/df-gnu.txt"
      - run:
          command: jz --parser df --variant gnu
          stdin: {file: df-gnu.txt}
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].1k_blocks", equals: 12882672 }

  - name: CRLF line endings and a UTF-8 BOM do not hide the format
    steps:
      - run:
          command: jz
          stdin: "﻿Filesystem     1K-blocks    Used Available Use% Mounted on\r\ntmpfs 100 10 90 10% /run\r\n"
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].1k_blocks", equals: 100 }

  - name: the warnings df prints for unreadable mounts are ignored
    steps:
      - run:
          command: jz
          stdin: "df: /run/user/1000/gvfs: Permission denied\nFilesystem     1K-blocks    Used Available Use% Mounted on\ntmpfs 100 10 90 10% /run\n"
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$", length: 1 }

  - name: text the definition cannot skip is a parse failure, not a silent guess
    # The text opens with the df header, so a parser is chosen; the line
    # after it then fails to read. jz reports which definition it chose
    # and why the text did not fit, rather than trying another one behind
    # the user's back.
    steps:
      - run:
          command: jz
          stdin: "Filesystem     1K-blocks    Used Available Use% Mounted on\nWARNING: something else\ntmpfs 100 10 90 10% /run\n"
      - assert:
          exit_code: 3
          stdout:
            empty: true
          stderr:
            contains: 'df/gnu: line 2: line does not match pattern'
      # A line df does not print, above the header, means the text is not
      # df's output: every df definition says what the text opens with, and
      # none opens this way.
      - run:
          command: jz
          stdin: "WARNING: something else\nFilesystem     1K-blocks    Used Available Use% Mounted on\ntmpfs 100 10 90 10% /run\n"
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: 'unable to identify the input format'

  - name: a rounded size is reported as printed, not as invented bytes
    # `df -h` steps by 1024 and `df -H` by 1000, the output does not say
    # which, and both round; a byte count would be jz making one up.
    steps:
      - run:
          command: jz
          stdin: "Filesystem      Size  Used Avail Use% Mounted on\n/dev/sda1       1.1G  100M  1.0G  10% /\n"
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].size", equals: "1.1G" }
              - { path: "$[0].used", equals: "100M" }
              - { path: "$[0].use_percent", equals: 10 }
      # The exact form of the same command still yields numbers.
      - run:
          command: jz
          stdin: "Filesystem     1K-blocks    Used Available Use% Mounted on\n/dev/sda1        1000000  500000    500000  50% /\n"
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].1k_blocks", equals: 1000000 }

  - name: only a symbolic link has a target
    steps:
      - run:
          command: jz
          stdin: "total 8\n-rw-r--r-- 1 alice staff   42 Jan  5 10:11 a -> b\nlrwxrwxrwx 1 alice staff    7 Jan  5 10:12 bin -> usr/bin\n"
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].filename", equals: "a -> b" }
              - { path: "$[1].filename", equals: bin }
              - { path: "$[1].link_to", equals: usr/bin }

  - name: one ls parser reads -l and -lh, whatever the sizes look like
    steps:
      - run:
          command: jz
          stdin: "-rw-r--r-- 1 u g 3 Jan  5 10:11 small.txt\n"
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].filename", equals: small.txt }
              - { path: "$[0].size", equals: "3" }
      - run:
          command: jz
          stdin: "-rw-r--r-- 1 u g 3 Jan  5 10:11 small.txt\n-rw-r--r-- 1 u g 2.9K Jan  5 10:12 big.bin\n"
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].size", equals: "3" }
              - { path: "$[1].size", equals: "2.9K" }

  - name: environment values keep their spacing, and env -0 keeps newlines
    steps:
      # NAME=value is the shape of a .env file, a properties file and a
      # shell fragment too, so the plain form is named rather than
      # guessed. The NUL-separated form below is distinctive and is not.
      - run:
          command: jz
          stdin: "A=  padded  \nB=x\n"
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: "too generic for jz to claim on its own"
      - run:
          command: jz --parser env
          stdin: "A=  padded  \nB=x\n"
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].value", equals: "  padded  " }
              - { path: "$[1].value", equals: x }
      - fixture:
          file: env0.bin
          base64: "QT1vbmUKc3RpbGwgQQBCPXR3bwA="
      - run:
          command: jz
          stdin: {file: env0.bin}
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].value", equals: "one\nstill A" }
              - { path: "$", length: 2 }

  # Choosing keys is the one place a caller can ask for something the
  # format does not have, so the refusal matters as much as the success.
  - name: extract and exclude choose keys, and an unknown key is refused
    steps:
      - fixture:
          file: df-gnu.txt
          from: "${specdir}/testdata/df-gnu.txt"
      - run:
          command: jz --extract filesystem --extract mounted_on --file df-gnu.txt
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            json:
              - { path: "$[0].filesystem", matches: "\\S" }
              - { path: "$[0].mounted_on", matches: "^/" }
      # The keys that were not asked for are absent, not null.
      - run:
          command: jz --extract filesystem --extract mounted_on --file df-gnu.txt
      - assert:
          exit_code: 0
          stdout:
            not_contains: '"used"'
      - run:
          command: jz --exclude used --exclude available --file df-gnu.txt
      - assert:
          exit_code: 0
          stdout:
            not_contains: '"available"'
      - run:
          command: jz --exclude used --exclude available --file df-gnu.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].1k_blocks", gte: 0 }
      # A key the format does not produce is named back, with what it has.
      - run:
          command: jz --extract mountpoint --file df-gnu.txt
      - assert:
          exit_code: 2
          stdout: {empty: true}
          stderr:
            contains: 'no key "mountpoint" in the output'
      # Keeping and dropping at once states two answers for one key.
      - run:
          command: jz --extract filesystem --exclude used --file df-gnu.txt
      - assert:
          exit_code: 2
          stdout: {empty: true}
          stderr:
            contains: cannot be used together

  # A report that opens with a header block and then repeats a block is
  # one object with a list inside it, not a list of blocks. What the
  # header block carries is the answer to which candidate is in place.
  - name: a header block and repeated blocks are read as one object
    steps:
      - fixture:
          file: ua-query.txt
          from: "${specdir}/testdata/update-alternatives-query.txt"
      - run:
          command: jz --parser update-alternatives --file ua-query.txt
      - assert:
          exit_code: 0
          stderr:
            empty: true
          stdout:
            json:
              - { path: "$.link.Name", equals: pager }
              - { path: "$.link.Value", equals: /usr/bin/less }
              - { path: "$.slaves[0].name", equals: pager.1.gz }
              - { path: "$.alternatives[0].candidate.Priority", equals: 50 }

  # A value that continues on an indented line belongs to the field above
  # it. Reading the continuation as a field of its own would invent keys,
  # and dropping it would truncate the value without saying so.
  - name: a value continued on the next line is joined to it
    steps:
      - fixture:
          file: dpkg-status.txt
          from: "${specdir}/testdata/dpkg-status.txt"
      - run:
          command: jz --parser dpkg --file dpkg-status.txt
      - assert:
          exit_code: 0
          stderr:
            empty: true
          stdout:
            json:
              - { path: "$[0].package.name", equals: dpkg }
              # The second line of the description is in the same value
              # as the first.
              - { path: "$[0].fields.Description", matches: 'infrastructure for handling the installation' }

  # A command that prints what another command prints is read by the same
  # definition, under either name. Nothing in the text says which of them
  # wrote it, which is why there is one definition and not two.
  - name: a parser can be named by the other name of its format
    steps:
      - fixture:
          file: df-gnu.txt
          from: "${specdir}/testdata/df-gnu.txt"
      - run:
          command: jz --parser gdf --file df-gnu.txt
      - assert:
          exit_code: 0
          stderr:
            empty: true
          stdout:
            json:
              - { path: "$[0].filesystem", equals: tmpfs }
              - { path: "$[0].1k_blocks", equals: 12882672 }
      # The definition is still the one it always was, and naming it that
      # way says so.
      - run:
          command: jz --parser gdf --variant gnu --file df-gnu.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].mounted_on", equals: /run }
      # A name no definition answers to is refused, the same as any other
      # unknown parser.
      - run:
          command: jz --parser gnodf --file df-gnu.txt
      - assert:
          exit_code: 4
          stdout: {empty: true}
          stderr:
            contains: 'no parser for "gnodf"'

  # The choice is the one thing a converter has to get right, and until
  # --explain a successful run said nothing about it. Everything it adds
  # is on standard error, so what a consumer reads is untouched.
  - name: --explain reports the definition and leaves the answer alone
    steps:
      - fixture:
          file: df-gnu.txt
          from: "${specdir}/testdata/df-gnu.txt"
      - run:
          command: jz --file ${workdir}/df-gnu.txt
      - assert:
          exit_code: 0
          stderr: {empty: true}
      - run:
          command: jz --explain --file ${workdir}/df-gnu.txt
      - assert:
          exit_code: 0
          stderr:
            contains: "jz: explain: chose df/gnu from embedded"
      - assert:
          stderr:
            contains: "jz: explain: matched: signature.all[0] /"
      - assert:
          stderr:
            contains: "jz: explain: read: 8 lines: 7 read, 1 left out by input.ignore[1]"
      # Naming the parser reports the variants that were left out, which
      # is what makes a wrong variant traceable.
      - run:
          command: jz --explain --parser df --file ${workdir}/df-gnu.txt
      - assert:
          exit_code: 0
          stderr:
            contains: "jz: explain: scope: the variants of df, named by --parser"
      - assert:
          stderr:
            contains: "jz: explain: rejected: df/gnu-human: signature.all[1]"
      # The same facts as one JSON document, on the one line that opens
      # with "jz: explain: ", for a script to read.
      - run:
          command: >-
            sh -c 'jz --explain=json --file "$1" 2>&1 >/dev/null | sed -n "s/^jz: explain: //p"' sh ${workdir}/df-gnu.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.outcome", equals: chosen }
              - { path: "$.chosen.definition", equals: df/gnu }
              - { path: "$.chosen.registry", equals: embedded }
              - { path: "$.read.lines", equals: 8 }
              - { path: "$.read.read", equals: 7 }
              - { path: "$.error", equals: null }

  # Detection that cannot decide says which kind of undecided it is:
  # nothing fits, or several do.
  - name: --explain=json tells no match from an ambiguous one
    steps:
      - run:
          command: >-
            sh -c 'printf "this is not the output of any known command\n" | jz --explain=json 2>&1 >/dev/null | sed -n "s/^jz: explain: //p"'
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.outcome", equals: unidentified }
              - { path: "$.chosen", equals: null }
              - { path: "$.error.exit", equals: 4 }

  # A file has no argv, so its path is the only evidence besides the text
  # itself. The directory names the parser and the file names the
  # variant, which is what the formats too unremarkable to claim on sight
  # need: six whitespace-separated fields is not a signature.
  - name: the path of a file names the definition to read it with
    steps:
      - fixture:
          file: etc/fstab
          content: |
            /dev/sda1  /      ext4  defaults          0 1
            UUID=abcd  /boot  vfat  umask=0077        0 2
      - run:
          command: jz --explain --file ${workdir}/etc/fstab
      - assert:
          exit_code: 0
          stderr:
            contains: "etc/fstab from embedded"
          stdout:
            json:
              - { path: "$", length: 2 }
              - { path: "$[0].mount_point", equals: "/" }
      # The same text with no such path says it cannot tell, which is
      # what the path added.
      - run:
          shell: true
          command: cat ${workdir}/etc/fstab | jz
      - assert:
          exit_code: 4
          stdout: {empty: true}
      # A path naming a definition the text does not fit is dropped and
      # the text decides on its own terms, so the path can only ever add
      # an answer.
      - fixture:
          file: etc/passwd
          from: "${specdir}/testdata/df-gnu.txt"
      - run:
          command: jz --file ${workdir}/etc/passwd
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].filesystem", matches: "." }

  # --raw reports what the definition extracted rather than what it made
  # of it. It is the way to see whether a value converted wrongly or was
  # cut from the wrong place, which look alike once they are typed.
  - name: --raw reports every value as the text it was extracted from
    steps:
      - fixture:
          file: df-gnu.txt
          from: "${specdir}/testdata/df-gnu.txt"
      - run:
          command: jz --file ${workdir}/df-gnu.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[1].use_percent", equals: 92 }
      - run:
          command: jz --raw --file ${workdir}/df-gnu.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[1].use_percent", equals: "92%" }
              - { path: "$[1].1k_blocks", equals: "1920641288" }
      - run:
          command: jz --raw --pretty --file ${workdir}/df-gnu.txt
      - assert:
          exit_code: 0
          stdout:
            contains: '"use_percent": "92%"'
      - run:
          command: jz --raw --stream --file ${workdir}/df-gnu.txt
      - assert:
          exit_code: 0
          stdout:
            contains: '"use_percent":"92%"'
      # jz test compares a fixture with the typed JSON beside it, so raw
      # mode has nothing to say there and is not offered.
      - run:
          command: jz test --raw
      - assert:
          exit_code: 2
          stderr:
            contains: "not defined"

  # A printed length of time becomes seconds. What the text cannot settle
  # is whether a bare "4:50" is minutes and seconds or hours and minutes,
  # so the definition says which, and being wrong about it is a factor of
  # sixty that nothing downstream would notice.
  - name: a duration is reported in seconds
    steps:
      - fixture:
          file: ps.txt
          from: "${specdir}/testdata/ps-posix.txt"
      - run:
          command: jz --file ${workdir}/ps.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].time", equals: 254 }
              - { path: "$[1].time", equals: 0 }
      # --raw shows the text each value was made from.
      - run:
          command: jz --raw --file ${workdir}/ps.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].time", equals: "00:04:14" }
      - fixture:
          file: uptime.txt
          content: |
             13:42:13 up 13 days,  4:22,  0 users,  load average: 0.59, 0.70, 0.84
      - run:
          command: jz --file ${workdir}/uptime.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.uptime", equals: 1138920 }

  # A format that prints no year cannot be dated without being told which
  # year it meant, and one that names its zone by an abbreviation cannot
  # be placed without being told what that abbreviation stands for.
  # Either way the value stays the text it was printed as until the
  # command line says what to assume.
  - name: --assume-year and --assume-zone date what a format leaves out
    steps:
      - fixture:
          file: who.txt
          content: |
            alice    seat0        Nov  4 13:17 (login screen)
            alice    tty2         Nov  4 13:17 (tty2)
      - run:
          command: jz --parser who --file ${workdir}/who.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].time", equals: "Nov  4 13:17" }
      - run:
          command: jz --parser who --assume-year 2025 --file ${workdir}/who.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].time", equals: "2025-11-04T13:17:00Z" }
      - fixture:
          file: date.txt
          content: |
            Mon Sep  7 10:02:02 JST 2026
      - run:
          command: jz --parser date --file ${workdir}/date.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.timestamp", equals: "Mon Sep  7 10:02:02 JST 2026" }
      - run:
          command: jz --parser date --assume-zone JST=+0900 --file ${workdir}/date.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.timestamp", equals: "2026-09-07T10:02:02+09:00" }
      # An abbreviation that says its own offset needs nothing.
      - fixture:
          file: date-utc.txt
          content: |
            Mon Sep  7 01:02:02 UTC 2026
      - run:
          command: jz --parser date --file ${workdir}/date-utc.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.timestamp", equals: "2026-09-07T01:02:02Z" }
      # An assumption no field asks for makes no difference and is not an
      # error; one that cannot be read is.
      - fixture:
          file: ps.txt
          from: "${specdir}/testdata/ps-posix.txt"
      - run:
          command: jz --assume-year 2025 --assume-zone JST=+0900 --file ${workdir}/ps.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].time", equals: 254 }
      - run:
          command: jz --assume-year 20x5 --file ${workdir}/who.txt
      - assert:
          exit_code: 2
          stdout: {empty: true}
          stderr:
            contains: "four digit year"
      - run:
          command: jz --assume-zone JST=0900 --file ${workdir}/who.txt
      - assert:
          exit_code: 2
          stdout: {empty: true}

  # A tree is the one shape whose depth the input decides. What the
  # definition says is what a node is: the fields read from its line plus
  # a children array; how deep the nodes go is a property of the machine
  # being described.
  - name: lspci -vv is read as a tree of devices and their attributes
    steps:
      - fixture:
          file: lspci.txt
          from: "${specdir}/testdata/lspci-verbose.txt"
      - run:
          command: jz --file ${workdir}/lspci.txt
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            json:
              - { path: "$", length: 2 }
              - { path: "$[0].slot", equals: "00:00.0" }
              - { path: "$[0].class", equals: "Host bridge" }
              - { path: "$[0].children[0].key", equals: Subsystem }
              # A flag list that lspci wraps onto its own line is a child
              # of the line it belongs to, two levels down.
              - { path: "$[1].children[11].key", equals: BridgeCtl }
              - { path: "$[1].children[11].children[0].text", matches: "^PriDiscTmr" }
              # A node with nothing under it still carries the key.
              - { path: "$[0].children[0].children", length: 0 }
      # One top-level node per line: a node is complete when nothing
      # deeper follows it.
      - run:
          command: jz --stream --file ${workdir}/lspci.txt
      - assert:
          exit_code: 0
          stdout:
            contains: '"children":'
            min_count: 2
      - run:
          command: jz --explain --file ${workdir}/lspci.txt
      - assert:
          exit_code: 0
          stderr:
            contains: "lspci/verbose from embedded"

  - name: a line that skips a level has no parent
    steps:
      - fixture:
          file: gap.txt
          content: |
            a: 1
                b: 2
            c: 3
      - run:
          command: "jz --define 'parse: {type: tree, indent: \"  \", node: {parse: {type: kv, separator: \": \"}}}' --file ${workdir}/gap.txt"
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr:
            contains: "line 2"
      - assert:
          stderr:
            contains: "no parent"

  # A definition given for a file rather than a command is reached by its
  # path the same way /etc/fstab is.
  - name: /etc/services and /etc/protocols are read from their paths
    steps:
      - fixture:
          file: etc/services
          content: |
            tcpmux                1/tcp
            discard               9/tcp sink null
            ssh                  22/tcp
      - run:
          command: jz --explain --file ${workdir}/etc/services
      - assert:
          exit_code: 0
          stderr:
            contains: "etc/services from embedded"
          stdout:
            json:
              - { path: "$", length: 3 }
              - { path: "$[1].port", equals: 9 }
              - { path: "$[1].aliases", length: 2 }
              - { path: "$[2].aliases", length: 0 }
      - fixture:
          file: etc/protocols
          content: |
            ip     0  IP
            icmp   1  ICMP
            manet  138
      - run:
          command: jz --file ${workdir}/etc/protocols
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[2].name", equals: manet }
              - { path: "$[2].number", equals: 138 }
              - { path: "$[2].aliases", length: 0 }

  # Output saved on macOS or FreeBSD is read on any system: the operating
  # system that printed it is not known on a pipe, and only the text
  # decides. These captures are not the registry's fixtures.
  - name: ping saved on macOS and FreeBSD is read as ping/bsd, timeouts and loss included
    steps:
      - fixture:
          file: ping-macos.txt
          from: "${specdir}/testdata/ping-macos-26-timeout.txt"
      - run:
          command: jz --explain --file ping-macos.txt
      - assert:
          exit_code: 0
          stderr:
            contains: "ping/bsd from embedded"
          stdout:
            json:
              - { path: "$.destination.address", equals: 192.0.2.1 }
              - { path: "$.destination.data_bytes", equals: 56 }
              - { path: "$.replies", length: 1 }
              - { path: "$.replies[0].kind", equals: no_answer }
              - { path: "$.replies[0].icmp_seq", equals: 0 }
              - { path: "$.statistics.packets_transmitted", equals: 2 }
              - { path: "$.statistics.packets_received", equals: 0 }
              - { path: "$.statistics.packet_loss_percent", equals: 100 }
              - { path: "$.statistics.round_trip_avg_ms", equals: null }
      # ping6 names no host in its header, only in the summary.
      - fixture:
          file: ping6.txt
          from: "${specdir}/testdata/ping6-macos-14-quiet.txt"
      - run:
          command: jz --file ping6.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.destination.name", equals: null }
              - { path: "$.destination.source", equals: "::1" }
              - { path: "$.destination.packet_bytes", equals: 56 }
              - { path: "$.replies", length: 0 }
              - { path: "$.statistics.name", equals: "::1" }
              - { path: "$.statistics.round_trip_min_ms", gt: 0 }
      # FreeBSD, with a payload too small for the send time: no times.
      - fixture:
          file: ping-freebsd.txt
          from: "${specdir}/testdata/ping-freebsd-small.txt"
      - run:
          command: jz --file ping-freebsd.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.destination.data_bytes", equals: 0 }
              - { path: "$.replies[1].time_ms", equals: null }
              - { path: "$.replies[1].bytes", equals: 8 }
      # Naming the Linux variant does not get past its signature.
      - run:
          command: jz --parser ping --variant linux --file ping-macos.txt
      - assert:
          exit_code: 4
          stdout: {empty: true}

  - name: stat saved on macOS and FreeBSD is read in both of its formats
    steps:
      - fixture:
          file: stat-dir.txt
          from: "${specdir}/testdata/stat-macos-26-dir.txt"
      - run:
          command: jz --file stat-dir.txt
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            json:
              - { path: "$[0].file", equals: dir }
              - { path: "$[0].access_flags", equals: drwxr-xr-x }
              - { path: "$[0].size", equals: 64 }
              - { path: "$[0].links", equals: 2 }
              # the local time stat printed, with no zone to read it in
              - { path: "$[0].modify_time", equals: "Sep 11 12:30:45 2026" }
              - { path: "$[0].device", matches: "^[0-9]+$" }
      - fixture:
          file: stat-link-space.txt
          from: "${specdir}/testdata/stat-macos-26-link-space.txt"
      - run:
          command: jz --file stat-link-space.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$", length: 2 }
              - { path: "$[0].access_flags", equals: lrwxr-xr-x }
              - { path: "$[0].file", equals: link }
              - { path: "$[1].file", equals: with space.txt }
              - { path: "$[1].file_flags", equals: "0" }
      - fixture:
          file: stat-x.txt
          from: "${specdir}/testdata/stat-x-freebsd-link.txt"
      - run:
          command: jz --file stat-x.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$", length: 1 }
              - { path: "$[0].type", equals: Symbolic Link }
              - { path: "$[0].access_mode", equals: "0755" }
              - { path: "$[0].group", equals: "(1001)" }
              - { path: "$[0].birth_time", matches: "^[A-Z][a-z]{2} [A-Z][a-z]{2} [ 0-9][0-9] " }

  - name: swapinfo, sockstat, last and w saved on FreeBSD are read on any system
    steps:
      - fixture:
          file: swapinfo.txt
          from: "${specdir}/testdata/swapinfo-freebsd.txt"
      - run:
          command: jz --file swapinfo.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.header.block_size", equals: 1K }
              # Two devices make swapinfo add a Total row.
              - { path: "$.devices", length: 3 }
              - { path: "$.devices[2].device", equals: Total }
      - fixture:
          file: sockstat.txt
          from: "${specdir}/testdata/sockstat-freebsd.txt"
      - run:
          command: jz --file sockstat.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              # "??" is an address sockstat could not find.
              - { path: "$[0].local_address", equals: null }
              - { path: "$[0].foreign_address", equals: "-> [1497 8]" }
              - { path: "$[8].local_address", equals: "127.0.0.1:7777" }
      - fixture:
          file: last.txt
          from: "${specdir}/testdata/last-freebsd.txt"
      - run:
          command: jz --file last.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$", length: 3 }
              - { path: "$[0].still_logged_in", equals: true }
              - { path: "$[1].duration", equals: "00:06" }
              - { path: "$[2].user", equals: boot time }
              - { path: "$[2].still_logged_in", equals: null }
      - fixture:
          file: w.txt
          from: "${specdir}/testdata/w-freebsd.txt"
      - run:
          command: jz --file w.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.uptime.uptime", equals: 120 }
              - { path: "$.users[0].what", equals: "-sh (sh)" }
      # The macOS definition does not read the FreeBSD summary line.
      - run:
          command: jz --parser w --variant bsd --file w.txt
      - assert:
          exit_code: 4
          stdout: {empty: true}

  - name: HTTP/2 and HTTP/3 headers saved by curl are read on any system
    steps:
      - fixture:
          file: h2.txt
          from: "${specdir}/testdata/curl-http2-404.txt"
      - run:
          command: jz --file h2.txt
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            equals: |
              [{"status":{"version":"2","code":404,"reason":null},"headers":[{"name":"date","value":"Fri, 11 Sep 2026 12:00:00 GMT"}]}]
      - fixture:
          file: h3.txt
          from: "${specdir}/testdata/curl-http3-redirect.txt"
      - run:
          command: jz --file h3.txt
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$", length: 2 }
              - { path: "$[0].status.version", equals: "3" }
              - { path: "$[0].status.code", equals: 301 }
              - { path: "$[1].headers[1].value", equals: "a=1; Path=/; Secure" }
              - { path: "$[1].headers[2].value", equals: "b=2; Path=/; Secure" }

  # A list of names is any list of lines, so it is never guessed: naming
  # the command alone does not reach it either, since that would read the
  # output of an ls option the other variants refuse as a list of names.
  - name: ls -1 output is read only when ls/names is named
    steps:
      - fixture:
          file: names.txt
          from: "${specdir}/testdata/ls-names-macos-26.txt"
      - run:
          command: jz --file names.txt
      - assert:
          exit_code: 4
          stdout: {empty: true}
      - run:
          command: jz --parser ls --file names.txt
      - assert:
          exit_code: 4
          stdout: {empty: true}
          stderr:
            contains: "COMMAND | jz --parser ls --variant names"
      - run:
          command: jz --parser ls --variant names --file names.txt
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            json:
              - { path: "$[0].name", equals: "." }
              - { path: "$[8].name", equals: with space.txt }
              - { path: "$[9].name", equals: 日本語.txt }
              - { path: "$", length: 10 }
      # Spaces at either end and a line of spaces are names too.
      - fixture:
          file: odd.txt
          content: "  \n leading\ntrailing \n-dash\na -> b\n"
      - run:
          command: jz --parser ls --variant names --file odd.txt
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"name":"  "},{"name":" leading"},{"name":"trailing "},{"name":"-dash"},{"name":"a -> b"}]
      # Two directories' headings are refused rather than read as names.
      - fixture:
          file: two-dirs.txt
          content: "a:\nx\n\nb:\ny\n"
      - run:
          command: jz --parser ls --variant names --file two-dirs.txt
      - assert:
          exit_code: 3
          stdout: {empty: true}
      # ls of an empty directory prints nothing, and with the variant
      # named that is the empty list; guessed, it is no text at all.
      - fixture:
          file: empty.txt
          content: ""
      - run:
          command: jz --parser ls --variant names --file empty.txt
      - assert:
          exit_code: 0
          stdout:
            equals: |
              []
      - run:
          command: jz --file empty.txt
      - assert:
          exit_code: 4
          stdout: {empty: true}

  # A signature sees the first twenty lines. Interfaces without an
  # address can fill them, so no inet line is among them and every
  # line there has the shape ip link prints.
  - name: ip address whose first address is past the first twenty lines is not read as ip link
    steps:
      - fixture:
          file: ip-address.txt
          from: "${specdir}/testdata/ip-address-late-addresses.txt"
      - fixture:
          file: busybox-ip-address.txt
          from: "${specdir}/testdata/busybox-ip-address-late-addresses.txt"
      # iproute2 prints the mode in the header for ip link and never for
      # ip address.
      - run:
          command: jz --explain --file ip-address.txt
      - assert:
          exit_code: 0
          stderr:
            contains: "chose ip/address from embedded"
          stdout:
            json:
              - { path: "$[10].details[1].kind", equals: inet }
              - { path: "$[10].details[1].address", equals: 192.0.2.10/24 }
      # BusyBox prints one header for both, so nothing says which it is
      # until the address, and the address is refused as a detail of a link.
      - run:
          command: jz --file busybox-ip-address.txt
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr:
            contains: 'field "kind": value "inet"'

  - name: a csv without a header line keeps its first record, numbered or named
    steps:
      - fixture:
          file: rows.csv
          content: |
            name,value
            "a, b","say ""hi"""
            "first
            second",
      - run:
          command: jz --parser csv --variant comma-no-header --file rows.csv
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            equals: |
              [{"column_1":"name","column_2":"value"},{"column_1":"a, b","column_2":"say \"hi\""},{"column_1":"first\nsecond","column_2":""}]
      - run:
          command: jz --parser csv --variant comma-no-header --columns key,text --file rows.csv
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].key", equals: name }
              - { path: "$[2].text", equals: "" }
      # The same file with its first line as the header, as before.
      - run:
          command: jz --parser csv --variant comma --file rows.csv
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"name":"a, b","value":"say \"hi\""},{"name":"first\nsecond","value":""}]
      - fixture:
          file: rows.tsv
          content: "1\ta b\t\n2\tc\td\n"
      - run:
          command: jz --parser csv --variant tab-no-header --columns id,word,note --file rows.tsv
      - assert:
          exit_code: 0
          stdout:
            equals: |
              [{"id":"1","word":"a b","note":""},{"id":"2","word":"c","note":"d"}]
      # A row wider than the first record has a value with no column.
      - fixture:
          file: ragged.csv
          content: "1,2\n3,4,5\n"
      - run:
          command: jz --parser csv --variant comma-no-header --file ragged.csv
      - assert:
          exit_code: 3
          stdout: {empty: true}
          stderr:
            contains: "row has 3 fields but the first record, which numbers the columns, has 2"

  # Tables from cluster and build tooling: the shapes a developer pipes in
  # most, each identified from its header or its result lines alone.
  - name: kubectl get pods is read with its ready count and restarts split
    steps:
      - fixture:
          file: kubectl-pods.txt
          from: "${specdir}/testdata/kubectl-pods-kube-system.txt"
      - run:
          command: jz --explain --file kubectl-pods.txt
      - assert:
          exit_code: 0
          stderr:
            contains: "chose kubectl/pods from embedded"
          stdout:
            json:
              - { path: "$", length: 12 }
              - { path: "$[0].ready.ready", equals: 1 }
              - { path: "$[0].ready.total", equals: 1 }
              - { path: "$[0].status", equals: Running }
              - { path: "$[0].restarts", equals: 25 }
              - { path: "$[0].last_restart", matches: "^[0-9]+[dhms]" }
              - { path: "$[0].age", matches: "^[0-9]+d$" }

  - name: go test result lines are read with the elapsed time as a number
    steps:
      - fixture:
          file: go-test.txt
          from: "${specdir}/testdata/go-test-three-packages.txt"
      - run:
          command: jz --file go-test.txt
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            json:
              - { path: "$", length: 3 }
              - { path: "$[0].status", equals: ok }
              - { path: "$[0].package", equals: github.com/nao1215/jsonize/pkg/convert }
              - { path: "$[0].elapsed", equals: 0.003 }
              - { path: "$[0].cached", equals: false }
              - { path: "$[1].coverage", equals: null }

  - name: gzip -l is read with exact sizes as numbers and the ratio as printed
    steps:
      - fixture:
          file: gzip-l.txt
          from: "${specdir}/testdata/gzip-list-one.txt"
      - run:
          command: jz --file gzip-l.txt
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            equals: |
              [{"compressed":58,"uncompressed":2400,"ratio":"98.6%","uncompressed_name":"a.txt"}]

  # Modern replacements print long listings and trees of their own. eza
  # quotes a name with a space and keeps a rounded size as the string it
  # printed; cargo tree draws with box characters whatever the locale.
  - name: eza -l is read with its quoted names unquoted and its sizes as printed
    steps:
      - fixture:
          file: eza.txt
          from: "${specdir}/testdata/eza-long.txt"
      - run:
          command: jz --explain --file eza.txt
      - assert:
          exit_code: 0
          stderr:
            contains: "chose eza/long from embedded"
          stdout:
            json:
              - { path: "$", length: 4 }
              - { path: "$[0].size", equals: "2.0k" }
              - { path: "$[1].name", equals: latest }
              - { path: "$[1].link_to", equals: "read me.txt" }
              - { path: "$[1].size", equals: null }
              - { path: "$[2].name", equals: "read me.txt" }

  - name: cargo tree is a tree whose nodes carry the dependency's source
    steps:
      - fixture:
          file: cargo-tree.txt
          from: "${specdir}/testdata/cargo-tree-path-dependency.txt"
      - run:
          command: jz --file cargo-tree.txt
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            json:
              - { path: "$", length: 1 }
              - { path: "$[0].name", equals: app }
              - { path: "$[0].children[0].name", equals: util }
              - { path: "$[0].children[0].source", equals: /home/user/ws/util }
              - { path: "$[0].children[0].children", length: 0 }

  # systemd-cgls pads a process id to the width of its siblings after the
  # branch. The padding belongs to the node, not to another level.
  - name: systemd-cgls keeps processes padded after the branch under their group
    steps:
      - fixture:
          file: cgls.txt
          from: "${specdir}/testdata/systemd-cgls-padded-pids.txt"
      - run:
          command: jz --file cgls.txt
      - assert:
          exit_code: 0
          stderr: {empty: true}
          stdout:
            json:
              - { path: "$", length: 1 }
              - { path: "$[0].cgroup", matches: "/dbus\\.service$" }
              - { path: "$[0].children", length: 11 }
              - { path: "$[0].children[0].pid", equals: 6916 }
              - { path: "$[0].children[6].pid", equals: 693857 }
              - { path: "$[0].children[10].children", length: 0 }

  # Output captured on another system is read wherever jz runs: a
  # definition limited to Windows or macOS is chosen through a pipe by its
  # signature, since nothing there says which system printed the text.
  # The Windows text keeps the CRLF line endings the runner wrote.
  - name: whoami /groups from Windows and vm_stat from macOS are read on any system
    steps:
      - fixture:
          file: groups.txt
          from: "${specdir}/testdata/whoami-groups-windows-server-2025.txt"
      - run:
          command: jz --explain --file groups.txt
      - assert:
          exit_code: 0
          stderr:
            contains: "chose whoami/groups from embedded"
          stdout:
            json:
              - { path: "$[?(@.sid=='S-1-1-0')].group_name", equals: Everyone }
              - { path: "$[?(@.sid=='S-1-16-12288')].type", equals: Label }
              - { path: "$[?(@.sid=='S-1-16-12288')].attributes", equals: null }
      - run:
          command: jz --parser whoami --variant privileges --file groups.txt
      - assert:
          exit_code: 4
          stdout: {empty: true}
      - fixture:
          file: vm_stat.txt
          from: "${specdir}/testdata/vm-stat-macos-26.txt"
      - run:
          command: jz --explain --file vm_stat.txt
      - assert:
          exit_code: 0
          stderr:
            contains: "chose vm_stat/darwin from embedded"
          stdout:
            json:
              - { path: "$.page_size", equals: 16384 }
              - { path: "$.pages_free", equals: 7144 }

  # exiftool prints one tag per line and -G puts the group in front of
  # each of them. The two shapes are told apart without a hint, and the
  # one that is not named is refused rather than read by the other.
  - name: exiftool tells its plain and grouped forms apart
    steps:
      - fixture:
          file: exif.txt
          from: "${specdir}/../../registry/parsers/exiftool/default/testdata/png-13.txt"
      - run:
          command: jz --explain
          stdin: {file: exif.txt}
      - assert:
          exit_code: 0
          stderr:
            contains: "chose exiftool/default from embedded"
          stdout:
            json:
              - { path: "$['File Name']", equals: debian-logo.png }
              - { path: "$['MIME Type']", equals: image/png }
      - fixture:
          file: exif-g.txt
          from: "${specdir}/../../registry/parsers/exiftool/groups/testdata/png-13.txt"
      - run:
          command: jz --explain
          stdin: {file: exif-g.txt}
      - assert:
          exit_code: 0
          stderr:
            contains: "chose exiftool/groups from embedded"
          stdout:
            json:
              - { path: "$[0].group", equals: ExifTool }
              - { path: "$[1].group", equals: File }
              - { path: "$[1].tag", equals: File Name }
      # The grouped form named as the plain one is refused, not read.
      - run:
          command: jz --parser exiftool --variant default
          stdin: {file: exif-g.txt}
      - assert:
          exit_code: 4
          stdout: {empty: true}

  - name: ImageMagick identify is one record per image, with its numbers typed
    steps:
      - fixture:
          file: identify.txt
          from: "${specdir}/../../registry/parsers/identify/default/testdata/images-7.txt"
      - run:
          command: jz --explain
          stdin: {file: identify.txt}
      - assert:
          exit_code: 0
          stderr:
            contains: "chose identify/default from embedded"
          stdout:
            json:
              - { path: "$", length: 2 }
              - { path: "$[0].format", equals: PNG }
              - { path: "$[0].width", equals: 48 }
              - { path: "$[1].height", equals: 128 }
              # A size written for people stays the text it is.
              - { path: "$[1].size", equals: 2616B }

  # pkg-config --list-all is a name and a phrase, which a glossary looks
  # like too, so it is read only when it is named.
  - name: pkg-config --list-all is read when named and not by detection
    steps:
      - fixture:
          file: pkgconfig.txt
          from: "${specdir}/../../registry/parsers/pkg-config/list/testdata/list-all-1.txt"
      - run:
          command: jz
          stdin: {file: pkgconfig.txt}
      - assert:
          exit_code: 4
          stdout: {empty: true}
      - run:
          command: jz --parser pkg-config
          stdin: {file: pkgconfig.txt}
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].name", equals: adwaita-icon-theme }
              # A description holding " - " of its own is split at the
              # first one, which is where the title ends.
              - { path: "$[1].name", equals: alsa }
              - { path: "$[1].title", equals: alsa }
              - { path: "$[1].description", equals: "Advanced Linux Sound Architecture (ALSA) - Library" }

  - name: apt-config dump keeps every element of a list in the order printed
    steps:
      - fixture:
          file: aptconfig.txt
          from: "${specdir}/../../registry/parsers/apt-config/dump/testdata/dump.txt"
      - run:
          command: jz --explain
          stdin: {file: aptconfig.txt}
      - assert:
          exit_code: 0
          stderr:
            contains: "chose apt-config/dump from embedded"
          stdout:
            json:
              - { path: "$[1].name", equals: "APT::Architecture" }
              - { path: "$[1].value", equals: amd64 }
              - { path: "$[12].name", equals: "Unattended-Upgrade::Allowed-Origins::" }
              - { path: "$[14].name", equals: "Unattended-Upgrade::Allowed-Origins::" }

  - name: gpgconf lists its directories as one object and its components as records
    steps:
      - fixture:
          file: dirs.txt
          from: "${specdir}/../../registry/parsers/gpgconf/list-dirs/testdata/gnupg-2.4.txt"
      - run:
          command: jz
          stdin: {file: dirs.txt}
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.homedir", equals: /home/alice/.gnupg }
      - fixture:
          file: components.txt
          from: "${specdir}/../../registry/parsers/gpgconf/list-components/testdata/gnupg-2.4.txt"
      - run:
          command: jz
          stdin: {file: components.txt}
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[2].description", equals: Public Keys }
      # The directory list named as the component list is refused.
      - run:
          command: jz --parser gpgconf --variant list-components
          stdin: {file: dirs.txt}
      - assert:
          exit_code: 4
          stdout: {empty: true}

