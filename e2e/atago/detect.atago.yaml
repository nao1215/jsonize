version: "1"

suite:
  name: jz - automatic detection from stdin

# The headline behaviour: pipe output in, get JSON out, without naming a
# parser. Nothing is executed here, so these scenarios run identically on
# Linux, macOS and Windows. The fixtures are copies of registry testdata.
scenarios:
  - name: GNU df output is identified and typed without any hint
    steps:
      - fixture:
          file: df-gnu.txt
          from: "${specdir}/testdata/df-gnu.txt"
      - run:
          command: jz
          stdin: {file: df-gnu.txt}
      - assert:
          exit_code: 0
          stderr:
            empty: true
          stdout:
            # The 1K-block keys are what say the gnu variant was chosen.
            json:
              - { path: "$", length: 7 }
              - { path: "$[0].filesystem", equals: tmpfs }
              - { path: "$[0].1k_blocks", equals: 12882672 }
              - { path: "$[0].use_percent", equals: 1 }
              - { path: "$[0].mounted_on", equals: /run }

  - name: a different variant of the same command is told apart by its header
    steps:
      - fixture:
          file: df-bsd.txt
          from: "${specdir}/testdata/df-bsd.txt"
      - run:
          command: jz --pretty
          stdin: {file: df-bsd.txt}
      - assert:
          exit_code: 0
          stdout:
            # 512-byte blocks and the inode columns are the BSD variant.
            json:
              - { path: "$[4].filesystem", equals: "map auto_home" }
              - { path: "$[0].512_blocks", equals: 965595304 }

  - name: a different command entirely is identified from the same stdin
    steps:
      - fixture:
          file: free-h.txt
          from: "${specdir}/testdata/free-h.txt"
      - run:
          command: jz
          stdin: {file: free-h.txt}
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].type", equals: Mem }
              # -h and -h --si differ only in the base of the suffixes and
              # the output does not say which was used, so the value is
              # reported as printed.
              - { path: "$[0].total", equals: "61Gi" }
              - { path: "$[1].type", equals: Swap }

  - name: a composite parser returns one key per part
    steps:
      - fixture:
          file: w-linux.txt
          from: "${specdir}/testdata/w-linux.txt"
      - run:
          command: jz
          stdin: {file: w-linux.txt}
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.uptime.users", equals: 5 }
              - { path: "$.uptime.load_1m", equals: 0.74 }
              - { path: "$.users[0].user", equals: alice }
              - { path: "$.users[0].tty", equals: null }
              - { path: "$.users[0].what", equals: "lightdm --session-child 13 20" }

  - name: nested objects and arrays from a single line
    steps:
      - fixture:
          file: id-selinux.txt
          from: "${specdir}/testdata/id-selinux.txt"
      - run:
          command: jz
          stdin: {file: id-selinux.txt}
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$.uid.id", equals: 1000 }
              - { path: "$.uid.name", equals: alice }
              - { path: "$.groups", length: 2 }
              - { path: "$.groups[1].name", equals: wheel }
              - { path: "$.context.level", equals: "s0-s0:c0.c1023" }

  - name: input redirected from a file takes the same path as a pipe
    steps:
      - fixture:
          file: df-gnu.txt
          from: "${specdir}/testdata/df-gnu.txt"
      - run:
          shell: true
          command: jz < df-gnu.txt
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$", length: 7 }
      - run:
          command: jz --file df-gnu.txt
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$", length: 7 }

  - name: naming the parser narrows detection to one command
    steps:
      - fixture:
          file: df-gnu.txt
          from: "${specdir}/testdata/df-gnu.txt"
      - run:
          command: jz --parser df
          stdin: {file: df-gnu.txt}
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].1k_blocks", equals: 12882672 }

  - name: naming the variant pins the definition
    steps:
      - fixture:
          file: df-gnu.txt
          from: "${specdir}/testdata/df-gnu.txt"
      - run:
          command: jz --parser df --variant gnu
          stdin: {file: df-gnu.txt}
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].1k_blocks", equals: 12882672 }

  - name: CRLF line endings and a UTF-8 BOM do not hide the format
    steps:
      - run:
          command: jz
          stdin: "﻿Filesystem     1K-blocks    Used Available Use% Mounted on\r\ntmpfs 100 10 90 10% /run\r\n"
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].1k_blocks", equals: 100 }

  - name: the warnings df prints for unreadable mounts are ignored
    steps:
      - run:
          command: jz
          stdin: "df: /run/user/1000/gvfs: Permission denied\nFilesystem     1K-blocks    Used Available Use% Mounted on\ntmpfs 100 10 90 10% /run\n"
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$", length: 1 }

  - name: text the definition cannot skip is a parse failure, not a silent guess
    # Detection finds the header further down, so a parser is chosen; the
    # unexpected first line then fails conversion. jz reports which
    # definition it chose and why the text did not fit, rather than trying
    # another one behind the user's back.
    steps:
      - run:
          command: jz
          stdin: "WARNING: something else\nFilesystem     1K-blocks    Used Available Use% Mounted on\ntmpfs 100 10 90 10% /run\n"
      - assert:
          exit_code: 3
          stdout:
            empty: true
          stderr:
            contains: "df/gnu: line 2:"

  - name: a rounded size is reported as printed, not as invented bytes
    # `df -h` steps by 1024 and `df -H` by 1000, the output does not say
    # which, and both round; a byte count would be jz making one up.
    steps:
      - run:
          command: jz
          stdin: "Filesystem      Size  Used Avail Use% Mounted on\n/dev/sda1       1.1G  100M  1.0G  10% /\n"
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].size", equals: "1.1G" }
              - { path: "$[0].used", equals: "100M" }
              - { path: "$[0].use_percent", equals: 10 }
      # The exact form of the same command still yields numbers.
      - run:
          command: jz
          stdin: "Filesystem     1K-blocks    Used Available Use% Mounted on\n/dev/sda1        1000000  500000    500000  50% /\n"
      - assert:
          exit_code: 0
          stdout:
            json: { path: "$[0].1k_blocks", equals: 1000000 }

  - name: only a symbolic link has a target
    steps:
      - run:
          command: jz
          stdin: "total 8\n-rw-r--r-- 1 alice staff   42 Jan  5 10:11 a -> b\nlrwxrwxrwx 1 alice staff    7 Jan  5 10:12 bin -> usr/bin\n"
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].filename", equals: "a -> b" }
              - { path: "$[1].filename", equals: bin }
              - { path: "$[1].link_to", equals: usr/bin }

  - name: one ls parser reads -l and -lh, whatever the sizes look like
    steps:
      - run:
          command: jz
          stdin: "-rw-r--r-- 1 u g 3 Jan  5 10:11 small.txt\n"
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].filename", equals: small.txt }
              - { path: "$[0].size", equals: "3" }
      - run:
          command: jz
          stdin: "-rw-r--r-- 1 u g 3 Jan  5 10:11 small.txt\n-rw-r--r-- 1 u g 2.9K Jan  5 10:12 big.bin\n"
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].size", equals: "3" }
              - { path: "$[1].size", equals: "2.9K" }

  - name: environment values keep their spacing, and env -0 keeps newlines
    steps:
      # NAME=value is the shape of a .env file, a properties file and a
      # shell fragment too, so the plain form is named rather than
      # guessed. The NUL-separated form below is distinctive and is not.
      - run:
          command: jz
          stdin: "A=  padded  \nB=x\n"
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: "too generic for jz to claim on its own"
      - run:
          command: jz --parser env
          stdin: "A=  padded  \nB=x\n"
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].value", equals: "  padded  " }
              - { path: "$[1].value", equals: x }
      - fixture:
          file: env0.bin
          base64: "QT1vbmUKc3RpbGwgQQBCPXR3bwA="
      - run:
          command: jz
          stdin: {file: env0.bin}
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[0].value", equals: "one\nstill A" }
              - { path: "$", length: 2 }
