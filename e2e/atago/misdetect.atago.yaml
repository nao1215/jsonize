version: "1"

suite:
  name: jz - output of one command is not read by another parser

# Every fixture here is real output that another definition used to claim.
# Naming the parser does not get past the signature either: a signature is
# a necessary condition, not a hint.
scenarios:
  - name: /etc/passwd is not read as /etc/group
    steps:
      - fixture:
          file: passwd.txt
          from: "${specdir}/testdata/decoys/passwd.txt"
      # group has four colon separated fields, passwd has seven. Read as a
      # group the shell would end up in the member list.
      - run:
          command: jz --parser etc --variant group --file passwd.txt
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: "etc/group does not describe this input"
      - run:
          command: jz --file passwd.txt
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: "it could be `etc` output"
      # --explain adds the definitions that came close underneath the
      # message, and changes neither the status nor standard output. A
      # search of the whole registry rejects nearly all of it on the
      # first expression of a signature, so only near misses are listed.
      - run:
          command: jz --explain --file passwd.txt
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: "rejected: "
      - assert:
          stderr:
            contains: "jz: explain: held back: etc/passwd: its signature fits, but it is only used when named (--parser etc)"

  - name: the clock in BSD uptime output is not an IPv6 address
    steps:
      - fixture:
          file: uptime-bsd.txt
          from: "${specdir}/testdata/decoys/uptime-bsd.txt"
      # "12:34  up 3 days" has the shape of an address followed by names.
      - run:
          command: jz --parser etc --variant hosts --file uptime-bsd.txt
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: "etc/hosts does not describe this input"
      - run:
          command: jz --file uptime-bsd.txt
      - assert:
          exit_code: 0
          stderr:
            empty: true
          stdout:
            json:
              - {path: "$.time", equals: "12:34"}
              - {path: "$.users", equals: 2}

  - name: /etc/os-release is not read as environment variables
    steps:
      - fixture:
          file: os-release.txt
          from: "${specdir}/testdata/decoys/os-release.txt"
      # Read as env the shell quotes stay inside the values.
      - run:
          command: jz --parser env --file os-release.txt
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: no env variant matches this input
      # PRETTY_NAME together with NAME and ID is this file and close to
      # nothing else, so unlike the assignments env prints it is claimed
      # on sight, and the quotes come off.
      - run:
          command: jz --file os-release.txt
      - assert:
          exit_code: 0
          stderr:
            empty: true
          stdout:
            json:
              - {path: "$.NAME", equals: Ubuntu}
              - {path: "$.VERSION_ID", equals: "26.04"}

  - name: blkid output is not read as file(1) descriptions
    steps:
      - fixture:
          file: blkid.txt
          from: "${specdir}/testdata/decoys/blkid.txt"
      # Both are "NAME: rest of the line".
      - run:
          command: jz --parser file --file blkid.txt
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: no file variant matches this input
      - run:
          command: jz --file blkid.txt
      - assert:
          exit_code: 0
          stderr:
            empty: true
          stdout:
            json:
              - {path: "$", length: 2}
              - {path: "$[0].device", equals: /dev/nvme0n1p2}

  # dmesg times its lines the way journalctl -o short-monotonic does, and
  # "usb 1-1: message" has the shape of "host identifier: message".
  - name: dmesg lines are not read as a journal timed from the boot
    steps:
      - fixture:
          file: dmesg.txt
          from: "${specdir}/testdata/decoys/dmesg-grep-usb.txt"
      - run:
          command: jz --file dmesg.txt
      - assert:
          exit_code: 4
          stdout:
            empty: true
      - run:
          command: jz --parser journalctl --variant short-monotonic --file dmesg.txt
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: does not describe this input

  - name: ip -brief link is not read as ip -brief address
    steps:
      - fixture:
          file: ip-br-link.txt
          from: "${specdir}/testdata/decoys/ip-br-link.txt"
      # The first two columns are the same; the third is a MAC address,
      # which would land in the address list.
      - run:
          command: jz --parser ip --variant brief-address --file ip-br-link.txt
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: does not describe this input
      # Once ip/brief-link existed the text stopped being unidentifiable,
      # so what this pins is the stronger property: automatic detection
      # picks the definition that reads a MAC address and a flag list,
      # neither of which the address variant produces.
      - run:
          command: jz --file ip-br-link.txt
      - assert:
          exit_code: 0
          stderr:
            empty: true
          stdout:
            json:
              - { path: "$[0].lladdr", matches: "^[0-9a-f:]+$" }
              - { path: "$[0].flags", length: 3 }

  # A user crontab has no user field, so its command lands where the user
  # name belongs. Reading the first word of the command as the user would
  # be a wrong answer at exit 0, which is the one failure that matters.
  - name: a user crontab is not read as a system one
    steps:
      - fixture:
          file: user-crontab.txt
          from: "${specdir}/testdata/decoys/user-crontab.txt"
      - run:
          command: jz --parser etc --variant crontab --file user-crontab.txt
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: does not describe this input

  # Output piped into jz can carry a line that is not the command's: a
  # word a script echoes after it, a shell prompt. A tree definition
  # states what its top-level line looks like, and a table definition
  # states the shape of the cells that tell a row from prose, so such a
  # line is refused with the line named rather than read as one more
  # device or package.
  - name: a line printed after lspci -v is not read as a device
    steps:
      - fixture:
          file: lspci-v-then-prose.txt
          from: "${specdir}/testdata/decoys/lspci-v-then-prose.txt"
      - run:
          command: jz --file lspci-v-then-prose.txt
      - assert:
          exit_code: 3
          stdout:
            empty: true
          stderr:
            contains: "line 16: line at the top level does not match root"
      - run:
          command: jz --parser lspci --variant verbose --file lspci-v-then-prose.txt
      - assert:
          exit_code: 3
          stdout:
            empty: true

  - name: a shell prompt after pip list is not read as a package
    steps:
      - fixture:
          file: pip-list-then-prompt.txt
          from: "${specdir}/testdata/decoys/pip-list-then-prompt.txt"
      - run:
          command: jz --file pip-list-then-prompt.txt
      - assert:
          exit_code: 3
          stdout:
            empty: true
          stderr:
            contains: "line 5: field \"version\""

  # go list prints one import path per line, which is what go test's
  # result lines are built around; without the status and the time in
  # front it is not a result.
  - name: go list output is not read as go test results
    steps:
      - fixture:
          file: go-list.txt
          from: "${specdir}/testdata/decoys/go-list-packages.txt"
      - run:
          command: jz --file go-list.txt
      - assert:
          exit_code: 4
          stdout:
            empty: true
          stderr:
            contains: unable to identify
      - run:
          command: jz --parser go --variant test --file go-list.txt
      - assert:
          exit_code: 4
          stdout:
            empty: true

  # A file's path names the definition to read it with, and the danger of
  # that is a directory name deciding what a file holds. A definition
  # that describes a shape carries no signature, so nothing about the
  # text could rule it out: df output in a file called comma inside a
  # directory called csv was read as CSV, at exit 0.
  - name: a path never names a definition that describes only a shape
    steps:
      - fixture:
          file: csv/comma
          from: "${specdir}/testdata/df-gnu.txt"
      - run:
          command: jz --explain --file ${workdir}/csv/comma
      - assert:
          exit_code: 0
          stderr:
            contains: "df/gnu from embedded"
          stdout:
            json:
              - { path: "$[1].use_percent", equals: 92 }
      # The same for the other shapes, where the wrong reading was a
      # parse failure rather than wrong JSON.
      - fixture:
          file: table/whitespace
          from: "${specdir}/testdata/df-gnu.txt"
      - run:
          command: jz --file ${workdir}/table/whitespace
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[1].use_percent", equals: 92 }
      - fixture:
          file: ini/default
          from: "${specdir}/testdata/df-gnu.txt"
      - run:
          command: jz --file ${workdir}/ini/default
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[1].use_percent", equals: 92 }
      # A path that names a definition of a command still works, which is
      # what the rule is for.
      - fixture:
          file: etc/fstab
          content: |
            /dev/sda1  /      ext4  defaults    0 1
            UUID=abcd  /boot  vfat  umask=0077  0 2
      - run:
          command: jz --explain --file ${workdir}/etc/fstab
      - assert:
          exit_code: 0
          stderr:
            contains: "etc/fstab from embedded"
      # A dot in the file name is a dash in the variant name, and a file
      # one directory down joins that directory to its name.
      - fixture:
          file: etc/resolv.conf
          content: |
            nameserver 192.0.2.53
            search example.com
      - run:
          command: jz --explain --file ${workdir}/etc/resolv.conf
      - assert:
          exit_code: 0
          stderr:
            contains: "etc/resolv-conf from embedded"
      - fixture:
          file: proc/self/io
          from: "${specdir}/../../registry/parsers/proc/self-io/testdata/cat.txt"
      - run:
          command: jz --explain --file ${workdir}/proc/self/io
      - assert:
          exit_code: 0
          stderr:
            contains: "proc/self-io from embedded"
      # A capture saved with an extension still names nothing.
      - fixture:
          file: etc/fstab.txt
          content: |
            /dev/sda1  /      ext4  defaults    0 1
      - run:
          command: jz --file ${workdir}/etc/fstab.txt
      - assert:
          exit_code: 4

  # A file path is a guess about the text in it, and the guess is dropped
  # once the definition it named turns out not to describe the text. A
  # stream drops it as well: the choice is made before the first record,
  # so nothing has been written that taking it back would contradict.
  - name: a path a stream cannot read the text with is dropped the way the whole document drops it
    steps:
      - fixture:
          file: etc/fstab
          from: "${specdir}/testdata/df-gnu.txt"
      - run:
          command: jz --file ${workdir}/etc/fstab
      - assert:
          exit_code: 0
          stdout:
            json:
              - { path: "$[1].use_percent", equals: 92 }
      - run:
          command: jz --stream --explain --file ${workdir}/etc/fstab
      - assert:
          exit_code: 0
          stdout:
            matches: '\A\{"filesystem":"tmpfs",[^\n]*"mounted_on":"/run"\}\n'
          stderr:
            contains: "so the text was read on its own"
      # A parser named on the command line is not a guess, so it stands
      # and the text it does not describe is refused.
      - run:
          command: jz --stream --parser fstab --file ${workdir}/etc/fstab
      - assert:
          exit_code: 4
          stdout: {empty: true}
