name: Release

on:
  push:
    tags: ["v*"]

# contents: create the GitHub Release and upload its files.
# id-token: keyless cosign signing and build provenance through GitHub OIDC.
# attestations: publish the build provenance.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # The archives of the tag are built and checked, and the Windows ones
  # run on Windows, before anything is published: a release cannot be
  # taken back once it is out.
  smoke:
    permissions:
      contents: read
    uses: ./.github/workflows/release_smoke.yml

  goreleaser:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # No module or build cache in the job that holds the OIDC token
          # and the tap token: a cache written by a less privileged
          # workflow could change what is built here.
          cache: false
      # The notes are the CHANGELOG.md section of the tag; a tag without
      # one stops here, before anything is published.
      - name: extract the release notes
        run: bash scripts/release_notes.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"
      # The Homebrew cask is pushed to nao1215/homebrew-tap after the
      # GitHub Release is already public, so a missing token would fail
      # the release half published and without provenance.
      - name: check the tap token is set
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "${TAP_GITHUB_TOKEN}" ]; then
            echo "TAP_GITHUB_TOKEN is not set; the Homebrew cask cannot be published" >&2
            exit 1
          fi
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install Syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # A fixed GoReleaser, so a tag builds the same way whenever it is pushed.
          version: "v2.16.0"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/checksums.txt
            dist/*.sbom.json
            dist/checksums.txt.sigstore.json
