name: UnitTest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      # Windows runs without Green Tea, the collector Go 1.26 made the
      # default, and the release builds Windows the same way
      # (.goreleaser.yml; release_smoke.yml checks the three agree).
      #
      # Why, and how little is known: 4 of the 98 Windows legs run with
      # Green Tea (2026-09-06 to 2026-09-12) died inside the runtime (heap
      # bookkeeping it found impossible, `s.allocCount= 500 s.nelems=
      # 496`, or a fault on a pointer whose upper half was gone), on Go
      # 1.26.8 and 1.27.1 and never on Linux or macOS. Since this setting,
      # 1 of 120 legs has: an access violation in pkg/definition on
      # 2026-09-12. So the collector is not shown to be the cause. On
      # 2026-09-13 neither setting crashed on the same runner image in
      # about 260 repeats each of this command, nor under the race
      # detector on Windows. The setting stays because it is what the
      # Windows jobs have tested since; drop it here, in e2e.yml and in
      # .goreleaser.yml together.
      - run: go test -timeout 5m -cover ./...
        env:
          GOEXPERIMENT: ${{ matrix.os == 'windows-latest' && 'nogreenteagc' || '' }}
  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: make test-race
