name: UnitTest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      # Four times on 2026-09-11 and 2026-09-12 the Windows leg died
      # inside internal/cli with heap bookkeeping the runtime itself
      # found impossible (`s.allocCount= 500 s.nelems= 496`) or a pointer
      # whose upper half was gone. It happened on both toolchains, never
      # twice on the same commit, and never on Linux or macOS. No code
      # here can corrupt a heap: the only unsafe in the tree is two ioctl
      # wrappers Windows does not build, there is no cgo, and the race
      # leg is green. Green Tea, the garbage collector Go 1.26 turned on
      # by default, is what changed under those crashes, so Windows runs
      # with the collector before it until the reports upstream settle.
      # The release builds its Windows binaries the same way
      # (.goreleaser.yml), and release_smoke.yml checks the three agree.
      - run: go test -timeout 5m -cover ./...
        env:
          GOEXPERIMENT: ${{ matrix.os == 'windows-latest' && 'nogreenteagc' || '' }}
  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: make test-race
