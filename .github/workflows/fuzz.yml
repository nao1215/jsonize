name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fuzzing itself stays nightly: a five-minute job per target is too
  # much to run on every push. The check below it is not, and runs on
  # every event, so a target added without a line in the matrix is caught
  # where it was written rather than at four the next morning.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # Every fuzz target in the tree. `make fuzz` finds them by
        # grepping, and the job below checks this list against what it
        # finds, so a target added without a line here fails rather than
        # going unfuzzed.
        target:
          - { pkg: ./pkg/convert, name: FuzzDuration }
          - { pkg: ./pkg/convert, name: FuzzScalars }
          - { pkg: ./pkg/definition, name: FuzzLoad }
          - { pkg: ./pkg/definition, name: FuzzLoadInline }
          - { pkg: ./pkg/engine, name: FuzzFormats }
          - { pkg: ./pkg/engine, name: FuzzParse }
          - { pkg: ./internal/schema, name: FuzzOutputFitsSchema }
          - { pkg: ./internal/yaml, name: FuzzParseYAML }
          - { pkg: ./pkg/selector, name: FuzzSelect }
          - { pkg: ./internal/yamlout, name: FuzzEncodeString }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go test -run '^$' -fuzz '^${{ matrix.target.name }}$' -fuzztime 5m ${{ matrix.target.pkg }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-crashers-${{ matrix.target.name }}
          path: "**/testdata/fuzz/**"

  # The matrix above is written out so each target gets its own job and
  # its own five minutes. That only works while it lists them all.
  complete:
    name: every fuzz target is in the matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: compare the matrix with the targets in the tree
        run: |
          grep -rhoE 'func (Fuzz[A-Za-z0-9_]+)' --include='*_test.go' cmd internal pkg registry \
            | awk '{print $2}' | sort -u > /tmp/found
          grep -oE 'name: Fuzz[A-Za-z0-9_]+' .github/workflows/fuzz.yml \
            | awk '{print $2}' | sort -u > /tmp/listed
          diff -u /tmp/listed /tmp/found
