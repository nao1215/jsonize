name: govulncheck

# Whether a known advisory in the standard library or in a dependency is
# reachable from jz's own call graph. The database changes every day, so the
# schedule catches an advisory published against what go.sum already holds;
# the pull_request/push legs catch a newly added dependency.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A standard-library advisory is fixed in a specific patch, so the go.mod
    # minimum and the newest Go can differ. Keep the first entry equal to the
    # go directive in go.mod.
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.6", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      # Pinned so a scanner release cannot turn an unrelated pull request red.
      # The advisory database is intentionally not pinned.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      # ACCEPTED lists advisories jz is known to reach and defends against on
      # its own side, one ID each, with why, which test holds the defense, and
      # when to remove it. Empty today. JSON mode exits 0 even with findings,
      # so the verdict is made here: any other reachable advisory fails the job
      # and prints the text report.
      - name: Scan the module
        env:
          ACCEPTED: ""
        run: |
          govulncheck -format json ./... > "$RUNNER_TEMP/govulncheck.json"
          jq -r 'select(.finding != null and (.finding.trace[0].function // "") != "") | .finding.osv' \
            "$RUNNER_TEMP/govulncheck.json" | sort -u > "$RUNNER_TEMP/called.txt"
          tr ' ' '\n' <<< "$ACCEPTED" | sed '/^$/d' > "$RUNNER_TEMP/accepted.txt"
          if grep -vxF -f "$RUNNER_TEMP/accepted.txt" "$RUNNER_TEMP/called.txt"; then
            echo "::error::govulncheck found an advisory that is not in ACCEPTED"
            govulncheck ./...
            exit 1
          fi
