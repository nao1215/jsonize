name: E2E

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

jobs:
  atago:
    name: atago (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: nao1215/setup-atago@e4b6719aea547a68e6c15252222babab7f492a88 # v0.1.1
        with:
          version: v0.21.0
      - name: run E2E (POSIX)
        if: runner.os != 'Windows'
        run: make e2e
      - name: run E2E (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go build -o dist/jz.exe ./cmd/jz
          export PATH="$PWD/dist:$PATH"
          atago run --ci --retry-failed 0 e2e/atago/detect.atago.yaml e2e/atago/registry.atago.yaml e2e/atago/errors.atago.yaml e2e/atago/report.atago.yaml
