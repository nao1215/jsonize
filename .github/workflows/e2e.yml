name: E2E

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

jobs:
  atago:
    name: atago (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 beside windows-latest (2025): ipconfig and
        # systeminfo change their layout between releases, and
        # exec_windows.atago.yaml runs the real commands on both.
        os: [ubuntu-latest, macos-latest, windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: nao1215/setup-atago@e4b6719aea547a68e6c15252222babab7f492a88 # v0.1.1
        with:
          version: v0.22.0
      # The commands the required Linux scenarios run that the image
      # does not ship: sysstat for iostat and mpstat, BusyBox for its
      # variants, zsh for the completion script. A scenario that needs a
      # command fails when it is missing rather than skipping, so this
      # list is checked by the run.
      - name: install the commands the Linux scenarios run
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sysstat busybox zsh
      # One script on every operating system: it builds jz, sandboxes
      # HOME, runs every spec under e2e/atago and fails on a skip that
      # is not the operating system's or an optional suite's. Windows
      # runs it under the bash that ships with Git.
      #
      # The jz this builds is the one the scenarios run, so Windows
      # builds it with the collector setting the unit job and the release
      # use; see the comment in unit_test.yml.
      - name: run E2E
        shell: bash
        run: bash ./scripts/run_e2e.sh
        env:
          GOEXPERIMENT: ${{ runner.os == 'Windows' && 'nogreenteagc' || '' }}

  # FreeBSD, where eight definitions say they read what a command prints
  # and no machine in this project has ever run one. GitHub hosts no BSD
  # runner, so the suite runs in a virtual machine on the Linux one.
  # atago is cross-built outside the machine, since building it inside
  # takes longer than the whole suite.
  freebsd:
    name: atago (freebsd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: cross-build atago for the machine
        run: |
          mkdir -p "${RUNNER_TEMP}/atago" bin
          cd "${RUNNER_TEMP}/atago"
          go mod init e2e-atago-build
          go get github.com/nao1215/atago@v0.22.0
          GOOS=freebsd GOARCH=amd64 go build -o "${GITHUB_WORKSPACE}/bin/atago" github.com/nao1215/atago
      - uses: vmactions/freebsd-vm@8b0f1a8fc0ea0def307835c258940ca358fe6480 # v1.5.6
        with:
          copyback: false
          # bash for the runner script, go for the jz and the helper the
          # scenarios build, and the two commands the required scenarios
          # run that FreeBSD does not ship.
          prepare: pkg install -y bash go curl zsh
          # The machine logs in as root, and root reads a directory
          # whatever its mode says, so the scenarios for a registry that
          # cannot be read would pass for the wrong reason. The suite runs
          # as an ordinary user, which is what the other runners do and
          # what the people running jz are.
          run: |
            pw useradd -n tester -m
            chown -R tester "$(pwd)"
            su -l tester -c "cd $(pwd) && PATH=$(pwd)/bin:\$PATH bash ./scripts/run_e2e.sh"
