name: Benchmark

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Benchmarks are informational: the job posts a benchstat comparison in
# the log and never fails a PR on timing, because shared runners are noisy.
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: mkdir -p bench && go test -run '^$' -bench . -benchmem -count 3 ./internal/... ./pkg/... | tee bench/new.txt
      - run: go run golang.org/x/perf/cmd/benchstat@latest bench/baseline.txt bench/new.txt || true
