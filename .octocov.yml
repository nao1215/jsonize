# Coverage is measured on unit and golden tests (`make test`). The bar is
# set where the parser engine, selector and conversion paths are fully
# exercised; OS-specific process handling and the network update path
# keep it below 100%.
coverage:
  paths:
    - cover.out
  acceptable: 85%
  exclude:
    - "cmd/jz/main.go"
    - "cmd/jz/sigpipe_*.go"
    - "registry/embed.go"
    # The end-to-end suite's own helper: a producer and a reader for the
    # scenarios about a command that keeps printing, not part of jz.
    - "e2e/**"
codeToTestRatio:
  code:
    - "**/*.go"
    - "!**/*_test.go"
  test:
    - "**/*_test.go"
testExecutionTime:
  if: true
comment:
  if: is_pull_request
summary:
  if: true
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
