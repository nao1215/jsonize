# Configuration for the hosted documentation website (GitHub Pages).
# Content lives here rather than in a docs/ directory, so the site is the
# one place the prose is kept and the repository does not carry two.
baseURL = "https://nao1215.github.io/jsonize/"
locale = "en"
title = "jsonize"
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true
timeZone = "UTC"

[params]
tagline = "Turn command output, data files and arguments into JSON"
description = "jsonize (jz) turns command output, data files and command-line arguments into JSON or YAML, refusing what it cannot identify."

[markup.highlight]
noClasses = false

[markup.tableOfContents]
startLevel = 2
endLevel = 3

[[menus.main]]
name = "Install"
pageRef = "/install"
weight = 10

[[menus.main]]
name = "Cookbook"
pageRef = "/cookbook"
weight = 15

[[menus.main]]
name = "Usage"
pageRef = "/usage"
weight = 20

[[menus.main]]
name = "Parsers"
pageRef = "/parsers"
weight = 30

[[menus.main]]
name = "Write a parser"
pageRef = "/write-a-parser"
weight = 40

[[menus.main]]
name = "Definition format"
pageRef = "/definition-format"
weight = 50

[[menus.main]]
name = "Coverage"
pageRef = "/coverage"
weight = 35

[[menus.main]]
name = "Design"
pageRef = "/design"
weight = 60

[module]
[[module.mounts]]
source = "content"
target = "content"

[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "assets"
target = "assets"

# The demo recording lives beside the vhs script that produces it, so the
# README and the site serve the same file and neither can go stale on its
# own. Declaring any mount replaces Hugo's implicit static mount, which is
# why this is named explicitly.
[[module.mounts]]
source = "../demo"
target = "static/demo"

# The output schemas are generated into the registry beside the
# definitions they describe, and checked there; the site serves the same
# files at the $id each of them states.
[[module.mounts]]
source = "../registry/schemas"
target = "static/schemas"
