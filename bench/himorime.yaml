# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/himorime/main/schema/himorime.schema.json
#
# jz measured end to end with himorime (https://github.com/nao1215/himorime):
# the process a pipeline starts, from its first instruction to its exit.
#
#   make bench          measure the working tree
#   make bench-compare  compare main with the working tree
#
# On a pull request, .github/workflows/bench.yml runs `himorime ci bench`:
# the base of the pull request and its head are built and measured in
# interleaved rounds on the same runner. See bench/README.md.
#
# Inputs are generated by gen.sh before measuring. Both revisions run the
# working tree's gen.sh (${head_root}), so they read the same bytes.
version: "1"

suite:
  name: jz
  description: Start-up, detection, registry size, command output tables, data formats, key selection, --stream and jz new.

build:
  command: [go, build, -trimpath, -o, "${artifact}", ./cmd/jz]
  cwd: ..

defaults:
  warmup: 2
  runs: 20
  metrics:
    cpu: true
    memory: true
  regression:
    confidence: 0.95
    latency:
      max_percent: 10
      min_difference: 1ms
    cpu:
      max_percent: 15
      min_difference: 2ms
    memory:
      max_percent: 15
      min_difference: 2MiB

benchmarks:
  - name: version
    description: Starting jz and exiting, with no registry loaded.
    tags: [smoke]
    commands:
      jz:
        command: ["${artifact}", version]

  - name: detect df
    description: >-
      A df report of ten rows. detected reads every built-in definition, as
      `df | jz` does; parser reads only the definitions of df, as
      `jz --parser df` and `jz run df` do; variant names the one definition.
    tags: [smoke]
    setup:
      - command: [sh, "${head_root}/gen.sh", df, "10", "${workdir}/df.txt"]
    stdin: "${workdir}/df.txt"
    baseline: detected
    commands:
      detected:
        command: ["${artifact}"]
      parser:
        command: ["${artifact}", --parser, df]
      variant:
        command: ["${artifact}", --parser, df, --variant, gnu]

  - name: detect nothing
    description: Text no definition reads, the worst case of detection, which exits 4.
    setup:
      - command: [sh, -c, "printf 'nothing here resembles a known header\\nsecond line\\n' > \"$1\"", sh, "${workdir}/none.txt"]
    stdin: "${workdir}/none.txt"
    exit_codes: [4]
    commands:
      jz:
        command: ["${artifact}"]

  - name: registry size
    description: >-
      Detection with a registry of 26, 500 and 1000 more definitions given
      with JSONIZE_REGISTRY_PATH, on the input one of them reads; and one
      definition given inline with --define.
    setup:
      - command: [sh, "${head_root}/gen.sh", registry, "26", "${workdir}/registry-26"]
      - command: [sh, "${head_root}/gen.sh", registry, "500", "${workdir}/registry-500"]
      - command: [sh, "${head_root}/gen.sh", registry, "1000", "${workdir}/registry-1000"]
      - command: [sh, "${head_root}/gen.sh", registry-input, "26", "${workdir}/registry-input.txt"]
    stdin: "${workdir}/registry-input.txt"
    baseline: definitions-26
    commands:
      definitions-26:
        command: ["${artifact}"]
        env: {JSONIZE_REGISTRY_PATH: "${workdir}/registry-26"}
      definitions-500:
        command: ["${artifact}"]
        env: {JSONIZE_REGISTRY_PATH: "${workdir}/registry-500"}
      definitions-1000:
        command: ["${artifact}"]
        env: {JSONIZE_REGISTRY_PATH: "${workdir}/registry-1000"}
      define:
        command:
          - "${artifact}"
          - --define
          - "parse: {type: table, header: {columns: [a, b, c]}}\nfields: {b: {type: int}}\n"

  - name: ps 100k rows
    description: >-
      A whitespace table of eleven columns: detected, with the parser named,
      written indented with -p, and read record by record with --stream.
    setup:
      - command: [sh, "${head_root}/gen.sh", ps, "100000", "${workdir}/ps.txt"]
    stdin: "${workdir}/ps.txt"
    baseline: parser
    metrics:
      throughput:
        work: {value: 100000, unit: records}
    commands:
      detected:
        command: ["${artifact}"]
      parser:
        command: ["${artifact}", --parser, ps]
      pretty:
        command: ["${artifact}", --parser, ps, -p]
      stream:
        command: ["${artifact}", --parser, ps, --stream]

  - name: df 100k rows
    description: A table whose columns are aligned under its header.
    setup:
      - command: [sh, "${head_root}/gen.sh", df, "100000", "${workdir}/df.txt"]
    stdin: "${workdir}/df.txt"
    metrics:
      throughput:
        work: {value: 100000, unit: records}
    commands:
      jz:
        command: ["${artifact}", --parser, df]

  - name: mount 100k lines
    description: Lines read with a regular expression and a field split into an array.
    setup:
      - command: [sh, "${head_root}/gen.sh", mount, "100000", "${workdir}/mount.txt"]
    stdin: "${workdir}/mount.txt"
    metrics:
      throughput:
        work: {value: 100000, unit: records}
    commands:
      jz:
        command: ["${artifact}", --parser, mount]

  - name: env 100k lines
    description: KEY=VALUE lines.
    setup:
      - command: [sh, "${head_root}/gen.sh", env, "100000", "${workdir}/env.txt"]
    stdin: "${workdir}/env.txt"
    metrics:
      throughput:
        work: {value: 100000, unit: records}
    commands:
      jz:
        command: ["${artifact}", --parser, env]

  - name: data formats 100k records
    description: Each data format --format names, read from a file of 100 000 records.
    setup:
      - command: [sh, "${head_root}/gen.sh", csv, "100000", "${workdir}/data.csv"]
      - command: [sh, "${head_root}/gen.sh", tsv, "100000", "${workdir}/data.tsv"]
      - command: [sh, "${head_root}/gen.sh", ltsv, "100000", "${workdir}/data.ltsv"]
      - command: [sh, "${head_root}/gen.sh", json, "100000", "${workdir}/data.json"]
      - command: [sh, "${head_root}/gen.sh", jsonl, "100000", "${workdir}/data.jsonl"]
      - command: [sh, "${head_root}/gen.sh", yaml, "100000", "${workdir}/data.yaml"]
      - command: [sh, "${head_root}/gen.sh", lines, "100000", "${workdir}/data.lines"]
      - command: [sh, "${head_root}/gen.sh", nul, "100000", "${workdir}/data.nul"]
    metrics:
      throughput:
        work: {value: 100000, unit: records}
    commands:
      csv:
        command: ["${artifact}", --format, csv, --file, "${workdir}/data.csv"]
      tsv:
        command: ["${artifact}", --format, tsv, --file, "${workdir}/data.tsv"]
      ltsv:
        command: ["${artifact}", --format, ltsv, --file, "${workdir}/data.ltsv"]
      json:
        command: ["${artifact}", --format, json, --file, "${workdir}/data.json"]
      jsonl:
        command: ["${artifact}", --format, jsonl, --file, "${workdir}/data.jsonl"]
      yaml:
        command: ["${artifact}", --format, yaml, --file, "${workdir}/data.yaml"]
      lines:
        command: ["${artifact}", --format, lines, --file, "${workdir}/data.lines"]
      nul:
        command: ["${artifact}", --format, nul, --file, "${workdir}/data.nul"]

  - name: csv 100k rows
    description: >-
      One CSV file read with a typed column, narrowed with --extract and
      --exclude, and streamed.
    setup:
      - command: [sh, "${head_root}/gen.sh", csv, "100000", "${workdir}/users.csv"]
    baseline: read
    metrics:
      throughput:
        work: {file_size: "${workdir}/users.csv", unit: bytes}
    commands:
      read:
        command: ["${artifact}", --file, "${workdir}/users.csv", --type, age=int]
      extract:
        command: ["${artifact}", --file, "${workdir}/users.csv", --extract, id, --extract, email]
      exclude:
        command: ["${artifact}", --file, "${workdir}/users.csv", --exclude, city]
      stream:
        command: ["${artifact}", --file, "${workdir}/users.csv", --stream]

  - name: jsonl 100k records
    description: JSON Lines from standard input, read as one document and passed through with --stream.
    setup:
      - command: [sh, "${head_root}/gen.sh", jsonl, "100000", "${workdir}/events.jsonl"]
    stdin: "${workdir}/events.jsonl"
    baseline: read
    metrics:
      throughput:
        work: {value: 100000, unit: records}
    commands:
      read:
        command: ["${artifact}", --format, jsonl]
      stream:
        command: ["${artifact}", --format, jsonl, --stream]

  - name: jz new
    description: >-
      An object built from arguments, a deeply nested object built with
      --path, and fixed values attached to each of 100 000 records with --each.
    setup:
      - command: [sh, "${head_root}/gen.sh", ids, "100000", "${workdir}/ids.jsonl"]
    stdin: "${workdir}/ids.jsonl"
    commands:
      arguments:
        command: ["${artifact}", new, name=api, "replicas:=3", "debug:=false", "tags:=[\"web\",\"prod\"]"]
      path:
        command:
          - "${artifact}"
          - new
          - --path
          - /spec/template/metadata/labels/app=api
          - --path
          - /spec/template/spec/securityContext/runAsNonRoot:=true
          - --path
          - /metadata/labels/app=api
          - --path
          - /spec/replicas:=3
      each:
        command: ["${artifact}", new, --each, host=web, "sample:=@-"]
